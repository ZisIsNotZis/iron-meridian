display_name: Statuses
description: Reusable status effects, thresholds, resistance, decay, stacking, and transitions.
status: designed
kind: collection_contract
collection_name: statuses
source_documents: [design/status-effects.md, design/statuses/README.md]
source_documents_status: deleted_after_migration
schema_id: profile
object_schema:
  required_fields: [id, kind, status, references, display_name, family, source, application, track_or_duration, thresholds, resistance, decay, stacking, interruption, platform_consequences, transitions, counterplay, feedback]
  field_types:
    object_id: dotted_id
    kind: {type: enum, values: [status]}
    status: status
    references: list_of_dotted_ids
    display_name: string
    family: status_family
    source: source_record
    application: application_record
    track_or_duration: track_or_duration_record
    thresholds: threshold_list
    resistance: resistance_record
    decay: decay_record
    stacking: stacking_record
    interruption: interruption_record
    platform_consequences: platform_consequence_record
    transitions: transition_list
    counterplay: counterplay_record
    feedback: string
families: [root, disable, reveal, emp, freeze, transition]
rules:
  resistance_applied_before: [amount, duration]
  integer_conversion: shared_integer_conversion_rule
  invisible_permanent_disable_loops: false
  health_is_not_implicit_source: true
