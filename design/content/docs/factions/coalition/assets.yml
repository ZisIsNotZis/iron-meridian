animation_rules: "Orders are specific and conversational. Use clipped radio, filtered pulse,\nlight percussion, tuned metal, electric servo whine, and restrained harmonic\nsynth. Confirmed and uncertain contacts use different cadence. Effects\nemphasize information and movement: sensor sweeps, clean tracers, lock\nindicators, dust trails, antenna motion, and quick pivots. Reusable clips must\ncommunicate acceleration, scanning, and modular transformation.\n\nAll choices follow the global [asset contract](../../presentation/assets.md)\nand [presentation rules](../../presentation/README.md)."
near_term_rules: "Use offset silhouettes, visible antennae, and one bright signal accent so\nCoalition units read as modular and mobile. Their command feedback uses a\nshort cyan route pulse and a yellow confirmation tick; neither replaces the\nshared shape/label ownership cues. Movement emphasizes acceleration and\nturning, while attacks use clean tracers and a short lock cue. Use the shared\nplaceholder family `slate-frame` until bespoke art exists."
