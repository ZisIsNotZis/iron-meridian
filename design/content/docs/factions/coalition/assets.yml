display_name: "Coalition Assets"
description: "Faction-wide presentation language for the Coalition."
source_document: "design/factions/coalition/assets.md"
visual_language: "Use slate blue, pale field gray, signal cyan, and small safety-yellow accents.\nHardware is modular: bolt-on armor, antenna clusters, external cables, mixed\npaint batches, and repair plates. Bases are distributed and connected, with\nmodular barriers, low service buildings, portable masts, landing pads, and\nmultiple useful approaches. Vehicles show sensors and articulated mounts;\ninfantry use layered field clothing, lighter carriers, regional patches, and\nshared signal tabs."
audio_language: "Orders are specific and conversational. Use clipped radio, filtered pulse,\nlight percussion, tuned metal, electric servo whine, and restrained harmonic\nsynth. Confirmed and uncertain contacts use different cadence. Effects\nemphasize information and movement: sensor sweeps, clean tracers, lock\nindicators, dust trails, antenna motion, and quick pivots. Reusable clips must\ncommunicate acceleration, scanning, and modular transformation.\n\nAll choices follow the global [asset contract](../../presentation/assets.md)\nand [presentation rules](../../presentation/README.md)."
