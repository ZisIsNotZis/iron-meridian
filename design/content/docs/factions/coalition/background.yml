display_name: "Coalition Background"
description: "Narrative background for the Coalition."
source_document: "design/factions/coalition/background.md"
origin: "The Coalition began as an emergency treaty among regional defense commands, elected governments, port authorities, reformist officers, and technical consortiums. They retained local command because those commanders controlled the roads, shipyards, factories, and communities that the central government could no longer reliably supply.\n\nThe treaty is practical rather than romantic. Members agree to prevent the Directorate from taking the treasury and strategic arsenals, share warnings, and preserve the possibility of a renewed federation. They disagree about how much authority the postwar center should receive and who will repay wartime requisitions."
public_claim: "The Coalition claims legitimacy through consent and transparency. Its broadcasts describe the Directorate as an emergency committee that converted temporary security powers into a permanent state. The Coalition promises a negotiated federation, but its promise is difficult to keep while every region is arming itself."
internal_conflict: "The central political question is **consent or speed**. Regional vetoes protect autonomy and slow unified action. Port authorities may share a radar picture but refuse to surrender their fleet; a reform officer may demand an attack before the next council meeting. Campaign missions should make coordination feel earned rather than effortless."
story_posture: ["V1 does not require asymmetric Coalition mechanics. Near-term campaign missions can reveal its identity through distributed briefings, local objectives, and choices about which infrastructure to protect. The faction becomes playable when its information-and-mobility doctrine can be expressed without a mandatory network dependency."]
scope_use: ["The treaty’s politics are authored context, not a diplomacy simulator. More regional factions, elections, and coalition votes remain possible campaign material only after the core solo game proves its value."]
