display_name: "Coalition Buildings"
description: "Distributed information-and-response network roster."
source_document: "design/factions/coalition/buildings/README.md"
roster_target: "14 buildings: 12 core and 2 optional."
entries:
  - object: "factions.coalition.buildings.coalition_hq"
    platform: "building"
    status: "core"
    decision: "Preserve the political command center; its destruction is the normal loss condition."
    intent: "Base anchor; medium footprint with exposed service side."
  - object: "factions.coalition.buildings.resource_exchange"
    platform: "building"
    status: "core"
    decision: "Place the processor where information and mobility can protect unloading rather than relying on armor."
    intent: "Economy/processor; medium footprint with multiple approach lanes."
  - object: "factions.coalition.buildings.infantry_center"
    platform: "building"
    status: "core"
    decision: "Produce adaptable infantry and one queue of field specialists."
    intent: "Infantry production; small footprint."
  - object: "factions.coalition.buildings.vehicle_assembly"
    platform: "building"
    status: "core"
    decision: "Field mobile armor and support at the cost of fragile throughput."
    intent: "Ground production; medium footprint with rapid exits."
  - object: "factions.coalition.buildings.air_operations"
    platform: "building"
    status: "core"
    decision: "Launch fast response aircraft and reveal the commitment through a visible runway/apron."
    intent: "Aircraft production; medium apron footprint."
  - object: "factions.coalition.buildings.littoral_dock"
    platform: "building"
    status: "core"
    decision: "Turn coast access into sea denial and transport; it is irrelevant on land-only maps."
    intent: "Naval production; shoreline footprint."
  - object: "factions.coalition.buildings.signals_laboratory"
    platform: "building"
    status: "core"
    decision: "Unlock designation and precision options, without making disconnected units unusable."
    intent: "Advanced doctrine; medium footprint."
  - object: "factions.coalition.buildings.mobility_workshop"
    platform: "building"
    status: "core"
    decision: "Unlock one rapid-response or amphibious line and a bounded redeployment tool."
    intent: "Advanced logistics; medium footprint."
  - object: "factions.coalition.buildings.field_hospital"
    platform: "building"
    status: "core"
    decision: "Heal living infantry locally, trading a vulnerable support site for staying power; does not revive."
    intent: "Infantry sustainment; compact footprint."
  - object: "factions.coalition.buildings.sensor_mast"
    platform: "building"
    status: "core"
    decision: "Provide local vision and a bounded designation action; it deals no automatic damage."
    intent: "Detection/designation; tall compact footprint."
  - object: "factions.coalition.buildings.guardian_turret"
    platform: "building"
    status: "core"
    decision: "Cover a chosen route with precision missiles; flanking and infantry pressure remain answers."
    intent: "Static anti-vehicle defense; compact directional footprint."
  - object: "factions.coalition.buildings.skyguard_node"
    platform: "building"
    status: "core"
    decision: "Protect a local airspace sector; its missiles do not become a global umbrella."
    intent: "Static anti-air defense; compact footprint."
  - object: "factions.coalition.buildings.relay_station"
    platform: "building"
    status: "optional"
    decision: "Improve warning, lock quality, and designation nearby while exposing a valuable, non-mandatory target."
    intent: "Temporary forward information site; medium footprint."
  - object: "factions.coalition.buildings.precision_battery"
    platform: "building"
    status: "optional"
    decision: "Trade setup and a visible firing position for long-range area denial on maps with enough open space."
    intent: "Static indirect support; large footprint."
production_relationships: ["Coalition HQ, Resource Exchange, Infantry Center, Vehicle Assembly, Air Operations, and Littoral Dock form the normal production spine.", "Signals Laboratory and Mobility Workshop are narrow advanced gates, not a general tier ladder.", "Field Hospital services infantry; Sensor Mast provides information only; Relay Station improves nearby coordination but baseline weapons, movement, and commands work when it is destroyed or out of range.", "Precision Battery is one artillery decision, not a second artillery tree."]
defense_rules: ["Guardian Turret threatens vehicles in a declared sector but is vulnerable to infantry, flanking, and indirect fire.", "Skyguard Node threatens aircraft in a declared local zone but is poor against ground assault and can be outranged or disabled through normal counterplay.", "Sensor Mast and Relay Station are structure-domain targets; information is valuable because the sites are visible and destructible.", "The Coalition has no hidden global targeting and no requirement that every unit remain connected."]
construction_identity: ["Blueprints use white/blue holographic survey lines and temporary scaffold frames.", "Operational sites favor modular panels, solar cloth, antenna arrays, and painted evacuation routes.", "Sensor and relay effects are narrow cones, pulses, and line links that terminate at the site boundary.", "Defense warnings use clean directional chevrons, lock tones, and restrained projectile trails.", "Damage presentation is exposed cabling, fractured panels, and blinking status lights."]
scope_decisions: ["Core: the 12 core entries form the complete normal Coalition base.", "Optional: Relay Station and Precision Battery need map and matchup evidence before shipping by default.", "Deferred: mobile construction, full network simulation, power, walls, carrier production, permanent drone clouds, and global precision bonuses.", "Rejected: separate command tank/relay web, duplicate repair structures, and passive percentage auras."]
