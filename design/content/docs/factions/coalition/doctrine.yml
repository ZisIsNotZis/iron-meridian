display_name: "Coalition Doctrine"
description: "Strategic doctrine for the Coalition."
source_document: "design/factions/coalition/doctrine.md"
strategic_idea: "The Coalition wins by seeing first, selecting the engagement, and changing the problem before the opponent’s prepared formation arrives. It uses mobility and communication to create local superiority, then disengages before a slow attritional exchange becomes unavoidable."
battlefield_habits: ["Scout routes, production, and support before committing expensive assets.", "Use multiple small threats to pull a heavy formation apart.", "Designate a priority target and coordinate a short focus-fire window.", "Keep a retreat route and preserve high-value support.", "Convert information into position; information that never changes an order has no strategic value."]
production_philosophy: "Coalition equipment is interoperable across regional suppliers. Chassis are lighter and easier to move, while radios, optics, modular racks, and field software vary by workshop. Production favors flexible packages and rapid response, but replacement and maintenance are costly when a specialist asset is lost.\n\nInformation support improves warning, coordination, and precision; it never becomes a prerequisite for ordinary movement or fire. A disconnected Coalition force is less effective in its preferred doctrine, not disabled."
economy_identity: "Information support improves warning, coordination, and precision; it never becomes a prerequisite for ordinary movement or fire. A disconnected force is less effective in its preferred doctrine, not disabled."
matchup_expression: "Against the Directorate, the Coalition wants to split the formation, raid harvest and repair routes, and force the heavy player to turn. The Directorate wants to stabilize the map and make every approach expensive. Against the Irregular Network in far vision, Coalition reconnaissance and local trust should help verify threats, but false signatures and temporary sites still create attention costs."
exclusions: ["The Coalition is not a faction of universally fast glass cannons, passive scouting, or free precision damage. Mobility creates exposure and coordination creates a valuable support target. A Coalition player must decide which information is worth the time and risk used to obtain it."]
