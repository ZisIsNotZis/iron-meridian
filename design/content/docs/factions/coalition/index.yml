future_direction: ["Buildings should be distributed and informative.", "Infantry should be adaptable.", "Vehicles should be mobile and missile-oriented.", "Aircraft should be varied and information-dependent.", "Naval forces should be fast with strong sea denial.", "High technology should be information and mobility solutions with meaningful setup and positioning demands."]
