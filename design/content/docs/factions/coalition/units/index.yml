display_name: "Coalition Units"
description: "Coalition canonical candidate roster and doctrine index."
source_document: "design/factions/coalition/units/README.md"
opening_rule: "Core units form the normal faction grammar; optional units add map or matchup choices; deferred candidates remain outside the current roster until playtests prove a gap."
roster_policy: ["The roster is a complete design target, not a promise that every unit ships in the first vertical slice.", "Shared roles are expressed through distinct equipment and bounded adaptation."]
entries:
  - object: "factions.coalition.infantry.pathfinder"
    status: "core"
    decision: "Spend stealth and speed to obtain vision or preserve the scout."
    platform: "infantry"
  - object: "factions.coalition.infantry.line_rifle"
    status: "core"
    decision: "Hold ground cheaply or reposition before the line collapses."
    platform: "infantry"
  - object: "factions.coalition.infantry.breach_team"
    status: "core"
    decision: "Risk a close approach for structure and garrison disruption."
    platform: "infantry"
  - object: "factions.coalition.infantry.javelin_team"
    status: "core"
    decision: "Reveal the ambush and fire immediately, or hold lock for a stronger volley."
    platform: "infantry"
  - object: "factions.coalition.infantry.combat_medic"
    status: "core"
    decision: "Keep a damaged screen in the fight or retreat before the medic is exposed."
    platform: "infantry"
  - object: "factions.coalition.infantry.signal_officer"
    status: "core"
    decision: "Commit a fragile force multiplier to a forward position or preserve it."
    platform: "infantry"
  - object: "factions.coalition.infantry.saboteur"
    status: "optional"
    decision: "Trade combat presence for a timed base disruption."
    platform: "infantry"
  - object: "factions.coalition.vehicles.mcv"
    status: "core"
    decision: "Relocate construction origin while risking the production backbone."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.harvester"
    status: "core"
    decision: "Choose a rich route and escort or return early under pressure."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.lynx_scout_car"
    status: "core"
    decision: "Use speed and vision to find a route, then disengage before contact."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.kodiak_ifv"
    status: "core"
    decision: "Carry line infantry while choosing when to expose the transport."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.valiant_mbt"
    status: "core"
    decision: "Hold a lane for a precision push or preserve movement to avoid being surrounded."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.halberd_tank_destroyer"
    status: "core"
    decision: "Commit a missile angle against armor without accepting a frontal brawl."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.peregrine_missile_carrier"
    status: "core"
    decision: "Reposition long-range precision fire before counterattack."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.atlas_relay_truck"
    status: "core"
    decision: "Place a relay where it improves a response without making the force dependent."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.mender_repair_vehicle"
    status: "core"
    decision: "Keep damaged assets in the fight or withdraw the exposed repair platform."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.roadrunner_skirmisher"
    status: "core"
    decision: "Harass a flank and escape before heavier answers arrive."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.mastiff_amphibious_carrier"
    status: "optional"
    decision: "Turn shoreline access into an infantry angle at the cost of direct naval power."
    platform: "vehicle"
  - object: "factions.coalition.vehicles.longbow_siege_tank"
    status: "optional"
    decision: "Trade setup and a visible firing position for mobile area denial."
    platform: "vehicle"
  - object: "factions.coalition.aircraft.kestrel_interceptor"
    status: "core"
    decision: "Guard the force or spend fuel and time chasing enemy aircraft."
    platform: "aircraft"
  - object: "factions.coalition.aircraft.osprey_gunship"
    status: "core"
    decision: "Loiter for sustained support while accepting anti-air exposure."
    platform: "aircraft"
  - object: "factions.coalition.aircraft.swiftwing_strike_jet"
    status: "core"
    decision: "Commit a precise attack run or preserve the sortie for a better opening."
    platform: "aircraft"
  - object: "factions.coalition.aircraft.heron_vtol_transport"
    status: "core"
    decision: "Create a sudden infantry angle while risking a valuable transport."
    platform: "aircraft"
  - object: "factions.coalition.aircraft.watcher_uav"
    status: "optional"
    decision: "Buy persistent information with a fragile, low-damage asset."
    platform: "aircraft"
  - object: "factions.coalition.aircraft.stormlance_precision_bomber"
    status: "optional"
    decision: "Telegraph a decisive strike and force movement, or hold it for a key target."
    platform: "aircraft"
  - object: "factions.coalition.naval.swift_torpedo_boat"
    status: "core"
    decision: "Use speed to threaten a capital target or retreat before screening fire catches it."
    platform: "naval"
  - object: "factions.coalition.naval.guardian_missile_corvette"
    status: "core"
    decision: "Hold a protected denial zone or advance and expose the corvette."
    platform: "naval"
  - object: "factions.coalition.naval.seawatch_submersible"
    status: "core"
    decision: "Stay hidden for a surprise strike or surface/retreat when detected."
    platform: "naval"
  - object: "factions.coalition.naval.tideway_landing_craft"
    status: "optional"
    decision: "Turn water access into an infantry flank, or spend the slot on direct naval power."
    platform: "naval"
roster_coverage: ["Recon: Pathfinder, Lynx, Watcher.", "Line and assault: Line Rifle, Kodiak, Valiant, Osprey.", "Anti-armor: Javelin, Halberd, Peregrine, Swift Torpedo Boat.", "Support and force multiplication: Combat Medic, Signal Officer, Atlas, Mender, Heron.", "Infiltration and disruption: Breach Team, Saboteur, Roadrunner, Seawatch.", "Precision and siege: Swiftwing, Stormlance, Longbow.", "Air and naval denial: Kestrel, Guardian, Swift Torpedo Boat."]
shared_constraints: ["Information is an advantage, not a prerequisite. Relay bonuses improve range, lock quality, warning, or coordination; disconnected units retain baseline weapons and orders.", "Mobility has a bill. Fast units pay in armor, range, ammunition, setup, or replacement cost.", "Precision creates focus-fire decisions. Attacks reward designation and timing but lose efficiency when line of sight, lock, or communication is broken.", "Adaptation is bounded. A unit changes stance or task through one readable skill; it does not become every counter at once."]
production_relationships: ["The Coalition is not gated by a communications network; relays improve ordinary units but a force remains functional when disconnected.", "Production references shared objects in the production design."]
rejected_candidates: ["Permanent stealth assassin; drone-swarm infantry.", "Separate command tank; second repair platform; universal captured-unit chassis.", "Permanent loiter drone cloud; aircraft with no clear counter.", "Full carrier line; naval-only support network."]
