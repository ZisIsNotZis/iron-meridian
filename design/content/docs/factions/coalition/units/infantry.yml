display_name: "Coalition Infantry"
description: "Cheap enough to occupy, scout, screen, capture, and create vision."
source_document: "design/factions/coalition/units/infantry/README.md"
platform_constraints: ["Skills are short and readable.", "Ordinary commands do not require a relay.", "Core roles cover reconnaissance, line presence, breach, anti-armor, sustainment, and command support."]
entries:
  - object: "factions.coalition.infantry.pathfinder"
    status: "core"
    decision: "Spend stealth and speed to obtain vision or preserve the scout."
  - object: "factions.coalition.infantry.line_rifle"
    status: "core"
    decision: "Hold ground cheaply or reposition before the line collapses."
  - object: "factions.coalition.infantry.breach_team"
    status: "core"
    decision: "Risk a close approach for structure and garrison disruption."
  - object: "factions.coalition.infantry.javelin_team"
    status: "core"
    decision: "Reveal the ambush and fire immediately, or hold lock for a stronger volley."
  - object: "factions.coalition.infantry.combat_medic"
    status: "core"
    decision: "Keep a damaged screen in the fight or retreat before the medic is exposed."
  - object: "factions.coalition.infantry.signal_officer"
    status: "core"
    decision: "Commit a fragile force multiplier to a forward position or preserve it."
  - object: "factions.coalition.infantry.saboteur"
    status: "optional"
    decision: "Trade combat presence for a timed base disruption."
