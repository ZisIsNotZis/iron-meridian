display_name: "Directorate Assets"
description: "Faction-wide presentation language for the Directorate."
source_document: "design/factions/directorate/assets.md"
visual_language: "Use charcoal iron, deep desaturated red, warm bone, and small amber status\nlights. Hardware is thick plate, cast housing, standardized bolts, guarded\noptics, and numbered maintenance panels. Red is authority/warning, never the\nonly ownership cue. Bases are compact, axial, and defended: reinforced\nconcrete, straight service roads, floodlights, pipe racks, and deliberate\nsightlines. Vehicles use broad masses and recognizable modules; infantry use\nhelmets, hard webbing, heavy coats, and unit tabs."
audio_language: "Orders are concise and procedural. Use low brass, snare, industrial percussion,\ndiesel compression, hydraulic locks, relay clacks, and short acknowledgements.\nEffects emphasize pressure and preparation: smoke-backed muzzle flashes, heavy\ndust, hydraulic bracing, warning lamps, and synchronized salvos. Animation\nsells weight and deliberate transitions through reusable clips.\n\nAll choices follow the global [asset contract](../../presentation/assets.md)\nand [presentation rules](../../presentation/README.md)."
fx_language: "Orders are concise and procedural. Use low brass, snare, industrial percussion,\ndiesel compression, hydraulic locks, relay clacks, and short acknowledgements.\nEffects emphasize pressure and preparation: smoke-backed muzzle flashes, heavy\ndust, hydraulic bracing, warning lamps, and synchronized salvos. Animation\nsells weight and deliberate transitions through reusable clips.\n\nAll choices follow the global [asset contract](../../presentation/assets.md)\nand [presentation rules](../../presentation/README.md)."
animation_rules: "Orders are concise and procedural. Use low brass, snare, industrial percussion,\ndiesel compression, hydraulic locks, relay clacks, and short acknowledgements.\nEffects emphasize pressure and preparation: smoke-backed muzzle flashes, heavy\ndust, hydraulic bracing, warning lamps, and synchronized salvos. Animation\nsells weight and deliberate transitions through reusable clips.\n\nAll choices follow the global [asset contract](../../presentation/assets.md)\nand [presentation rules](../../presentation/README.md)."
near_term_rules: "Use a square silhouette, low center of mass, and visible mechanical joins for\nDirectorate units. Infantry share a restrained red tab; vehicles use one\namber service light. Construction and repair read as synchronized hydraulic\nmotion, not magical energy. A Directorate attack should look prepared before\nit looks spectacular: braced chassis, smoke-backed muzzle flash, then a clear\nimpact cue. Use the shared placeholder family `iron-block` until bespoke art\nexists."
