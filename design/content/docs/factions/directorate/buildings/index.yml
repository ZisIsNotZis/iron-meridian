display_name: "Directorate Buildings"
description: "Compact industrial-fortress infrastructure roster."
source_document: "design/factions/directorate/buildings/README.md"
roster_target: "13 buildings: 11 core and 2 optional."
entries:
  - object: "factions.directorate.buildings.construction_yard"
    platform: "building"
    status: "core"
    decision: "Keep the command origin safe or extend construction toward danger; its destruction is the normal HQ loss condition."
    intent: "Base anchor; large, central footprint."
  - object: "factions.directorate.buildings.ore_refinery"
    platform: "building"
    status: "core"
    decision: "Choose a safe unloading site and protect the harvester loop; it repairs docked harvesters but does not create passive income."
    intent: "Economy/processor; medium footprint beside processor route."
  - object: "factions.directorate.buildings.barracks"
    platform: "building"
    status: "core"
    decision: "Maintain replaceable infantry and engineers through one queue."
    intent: "Infantry production; small footprint."
  - object: "factions.directorate.buildings.vehicle_plant"
    platform: "building"
    status: "core"
    decision: "Commit the base to armored pressure and replace the construction vehicle when enabled."
    intent: "Ground production; large footprint with marked exits."
  - object: "factions.directorate.buildings.air_command"
    platform: "building"
    status: "core"
    decision: "Invest in durable, deliberate air support; its apron is a raidable access point."
    intent: "Aircraft production; medium footprint with landing apron."
  - object: "factions.directorate.buildings.naval_yard"
    platform: "building"
    status: "core"
    decision: "Convert shoreline access into heavy patrol and landing pressure; unavailable on land-only maps."
    intent: "Naval production; shoreline footprint."
  - object: "factions.directorate.buildings.heavy_works"
    platform: "building"
    status: "core"
    decision: "Unlock one preparation-heavy advanced vehicle or aircraft line; expensive and exposed, never a generic stat buff."
    intent: "Advanced production/doctrine; large footprint."
  - object: "factions.directorate.buildings.munitions_foundry"
    platform: "building"
    status: "core"
    decision: "Unlock Siege Grenadiers and high-commitment strike families; losing it removes new orders, not existing units."
    intent: "Advanced weapons support; medium footprint."
  - object: "factions.directorate.buildings.recovery_depot"
    platform: "building"
    status: "core"
    decision: "Repair and recover vehicles at a forward location, trading a valuable fixed target for endurance."
    intent: "Repair/logistics; medium footprint with service apron."
  - object: "factions.directorate.buildings.garrison_blockhouse"
    platform: "building"
    status: "core"
    decision: "Hold a narrow infantry approach; weak against armor, indirect fire, and flanking."
    intent: "Static anti-personnel defense; compact footprint."
  - object: "factions.directorate.buildings.aegis_emplacement"
    platform: "building"
    status: "core"
    decision: "Protect a local zone from aircraft; it cannot protect the whole map or fight ground armor well."
    intent: "Static anti-air defense; compact footprint."
  - object: "factions.directorate.buildings.ballistic_bastion"
    platform: "building"
    status: "optional"
    decision: "Anchor a route with a slow-turning heavy cannon; its firing arc and blind side invite flanking."
    intent: "Static anti-vehicle defense; large, directional footprint."
  - object: "factions.directorate.buildings.forward_command_post"
    platform: "building"
    status: "optional"
    decision: "Extend planned pressure and construction reach, but make a slow, valuable outpost that can be isolated."
    intent: "Forward construction/command site; medium footprint."
production_relationships: ["Construction Yard, Ore Refinery, Barracks, Vehicle Plant, Air Command, and Naval Yard form the normal production spine.", "Heavy Works and Munitions Foundry are explicit advanced gates, not a general tier ladder.", "Recovery Depot repairs living vehicles and services Recovery Carrier; it does not revive units or stack with another repair source.", "Production buildings are non-combat structures unless their cards explicitly declare a defense weapon."]
defense_rules: ["Garrison Blockhouse threatens personnel and light targets at close range; armor or indirect fire breaks it.", "Aegis Emplacement threatens aircraft in its declared local zone; ground assault and artillery remain counters.", "Ballistic Bastion threatens heavy/light ground targets from a narrow arc; scouts, smoke/line-of-sight play, flanking, and indirect fire expose its weakness.", "The Directorate does not hide defenses underground or connect them to a power network."]
construction_identity: ["Construction is a visible gantry, steel slab, and crane sequence.", "Production buildings show thick armored doors, painted route markings, and amber queue lights.", "Defenses expose barrel travel, traverse limits, and muzzle flash.", "Blueprint overlays use rectilinear red alignment marks; operational structures emit low mechanical hum and disciplined warning klaxons.", "Damage adds smoke, sparks, and intermittent industrial light; the HQ destruction event is the only base-wide dramatic effect."]
scope_decisions: ["Core: the 11 core entries are the coherent conventional roster.", "Optional: Ballistic Bastion and Forward Command Post require map or matchup evidence.", "Deferred: airship mooring with the deferred Skyhammer airship concept; full wall systems, power, multiple construction queues, naval repair ships, a second detection network, and superweapons.", "Rejected: passive adjacency bonuses, global command auras, and duplicate repair/artillery structures."]
