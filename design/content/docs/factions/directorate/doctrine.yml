display_name: "Directorate Doctrine"
description: "Strategic doctrine for the Directorate."
source_document: "design/factions/directorate/doctrine.md"
strategic_idea: "The Directorate wins by making the opponent answer a prepared formation. It secures logistics, establishes a durable line, concentrates fire, and advances when the enemy’s available responses have been narrowed. It prefers a plan that survives imperfect information over a brilliant plan that depends on constant improvisation."
battlefield_habits: ["Protect the repair and command core before extending the front.", "Use armor and prepared positions to convert time into pressure.", "Advance in phases: screen, fix, break, then occupy.", "Treat exposed flanks and disconnected support as the price of mass.", "Force the opponent to spend mobility answering a slow but credible threat."]
production_philosophy: "Directorate equipment is standardized and maintainable. The faction prefers a smaller number of dependable chassis, shared ammunition families, hardened repair procedures, and buildings that remain useful under pressure. Its advanced options should be visibly expensive, slow to reposition, and powerful when protected.\n\nIts economy is not intrinsically more efficient. The trade is **reliability for tempo**: a Directorate player spends time establishing a strong package and risks losing that investment to raids or a forced redeployment."
economy_identity: "The economy is not intrinsically more efficient. The trade is reliability for tempo: a Directorate player spends time establishing a strong package and risks losing that investment to raids or a forced redeployment."
matchup_expression: "Against the Coalition, the Directorate wants to deny scouting angles, punish overextension, and force a direct contest where armor and preparation matter. The Coalition wants to split the formation, expose the support core, and choose when to disengage. Neither side should need faction-specific rules to understand the exchange.\n\nAgainst the Irregular Network in far vision, the Directorate must protect routes and verify apparent victories; a cleared position is not necessarily a safe position. The Network should challenge attention and logistics, not invalidate a prepared army with universal stealth."
exclusions: ["The Directorate is not immobile, passively defensive, or automatically stronger in a head-on fight. It has fast and flexible tools where the roster needs them. Its identity is the choice to commit to a visible plan and make that plan difficult to dislodge."]
