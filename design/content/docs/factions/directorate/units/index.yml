display_name: "Directorate Units"
description: "Directorate canonical candidate roster and doctrine index."
source_document: "design/factions/directorate/units/README.md"
opening_rule: "Core units are expected to form the playable army; optional units are later-map or matchup choices; deferred/rejected candidates are deliberately excluded."
roster_policy: ["Core is expected playable content.", "Optional is valid later content and should not all be added by default.", "Deferred/rejected means another unit owns the decision or maintenance burden is too high."]
entries:
  - object: "factions.directorate.infantry.rifle_squad"
    status: "core"
    decision: "Occupy ground cheaply or preserve a screen."
    platform: "infantry"
  - object: "factions.directorate.infantry.breach_team"
    status: "core"
    decision: "Risk short-range assault against armor and structures."
    platform: "infantry"
  - object: "factions.directorate.infantry.shock_troopers"
    status: "core"
    decision: "Trade mobility for a durable anti-armor line."
    platform: "infantry"
  - object: "factions.directorate.infantry.rocket_section"
    status: "core"
    decision: "Expose a slow team for long-range anti-vehicle/air fire."
    platform: "infantry"
  - object: "factions.directorate.infantry.combat_engineer"
    status: "core"
    decision: "Spend a scarce body on capture, repair, or fortification."
    platform: "infantry"
  - object: "factions.directorate.infantry.field_marshal"
    status: "core"
    decision: "Commit a fragile command aura to a planned push."
    platform: "infantry"
  - object: "factions.directorate.infantry.riot_section"
    status: "optional"
    decision: "Lock down infantry approaches at the cost of reach."
    platform: "infantry"
  - object: "factions.directorate.infantry.siege_grenadiers"
    status: "optional"
    decision: "Set up area denial instead of carrying rifle DPS."
    platform: "infantry"
  - object: "factions.directorate.vehicles.mcv"
    status: "core"
    decision: "Relocate the construction origin while risking the production backbone."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.harvester"
    status: "core"
    decision: "Choose a rich route and escort or return early under pressure."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.sentinel"
    status: "core"
    decision: "Scout ahead with a fragile fast vehicle or keep it safe."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.bastion"
    status: "core"
    decision: "Anchor a line and accept slow redeployment."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.lancer"
    status: "core"
    decision: "Use a precise anti-armor shot from a vulnerable platform."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.hammerhead"
    status: "core"
    decision: "Close distance for crushing assault damage."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.bulwark"
    status: "core"
    decision: "Brace the formation and lose mobility for protection."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.ballista"
    status: "core"
    decision: "Prepare indirect fire while opponents hunt the setup."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.warden"
    status: "core"
    decision: "Spend attention on mobile anti-air coverage."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.recovery_carrier"
    status: "core"
    decision: "Pull damaged assets out or keep fighting without repair."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.aegis_carrier"
    status: "core"
    decision: "Protect a formation from air at the cost of ground pressure."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.mastodon"
    status: "optional"
    decision: "Make a slow strategic breakthrough target."
    platform: "vehicle"
  - object: "factions.directorate.vehicles.mobile_command_post"
    status: "optional"
    decision: "Extend construction and command forward while exposing logistics."
    platform: "vehicle"
  - object: "factions.directorate.aircraft.vulture"
    status: "core"
    decision: "Reveal targets with a lightly armed reconnaissance pass."
    platform: "aircraft"
  - object: "factions.directorate.aircraft.interceptor"
    status: "core"
    decision: "Spend loiter time and ammunition-equivalent cooldown on air control."
    platform: "aircraft"
  - object: "factions.directorate.aircraft.atlas_gunship"
    status: "core"
    decision: "Commit to a slow orbit over a threatened formation."
    platform: "aircraft"
  - object: "factions.directorate.aircraft.firestorm_bomber"
    status: "core"
    decision: "Telegraph a destructive run and risk the return path."
    platform: "aircraft"
  - object: "factions.directorate.aircraft.skyhammer"
    status: "core"
    decision: "Use a heavy standoff strike against armored or structural targets."
    platform: "aircraft"
  - object: "factions.directorate.naval.monitor"
    status: "core"
    decision: "Trade speed for shore bombardment and armor."
    platform: "naval"
  - object: "factions.directorate.naval.missile_corvette"
    status: "core"
    decision: "Keep distance for flexible pressure or enter danger."
    platform: "naval"
  - object: "factions.directorate.naval.hunter_submarine"
    status: "core"
    decision: "Remain hidden and accept sonar/counter-detection risk."
    platform: "naval"
  - object: "factions.directorate.naval.landing_barge"
    status: "core"
    decision: "Move a ground force safely but create a valuable escort target."
    platform: "naval"
roster_coverage: ["The core infantry line covers cheap presence, breach, durable anti-armor, long-range fire, engineering, and command.", "The core vehicle line covers utility, scouting, line armor, assault, anti-armor, bracing, siege, anti-air, repair, and air defense.", "The aircraft line covers reconnaissance, air control, close support, area denial, and heavy strike.", "The naval line covers shore bombardment, flexible missile pressure, submerged attack, and landing transport."]
shared_constraints: ["Every unit owns one clear player decision.", "Directorate skills are usually preparation, bracing, deployment, coordinated fire, or recovery.", "Support is concentrated enough to raid, but never split across several nearly identical support vehicles."]
production_relationships: ["The Construction Yard deploys the MCV; the Ore Refinery supports the Harvester; Barracks, Vehicle Plant, Air Command, and Naval Yard own their normal queues.", "Advanced units require only operational tech structures named on their cards.", "No unit requires a support network merely to use ordinary weapons."]
rejected_candidates: ["Dedicated medic: Recovery Carrier owns sustainment.", "Separate command relay infantry: Field Marshal owns command coordination.", "Second repair vehicle or naval repair ship: Recovery Carrier is the single repair/recovery role.", "Second artillery vehicle: Ballista owns mobile indirect fire.", "Drone swarm carrier: deferred until a separate economy and targeting burden is justified.", "Dedicated airship: deferred until a slow airborne siege gap is proven."]
