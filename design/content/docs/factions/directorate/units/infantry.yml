display_name: "Directorate Infantry"
description: "Replaceable ground presence that holds prepared lines and secures support for heavier formations."
source_document: "design/factions/directorate/units/infantry/README.md"
platform_constraints: ["Infantry use personnel protection unless a card says otherwise.", "Eligible vehicles can crush them in ordinary states.", "They can enter transports and selected structures and use foot locomotion.", "Squad member counts are presentation and balance details, not separate simulation entities."]
entries:
  - object: "factions.directorate.infantry.rifle_squad"
    status: "core"
    decision: "Occupy ground cheaply or preserve a screen."
  - object: "factions.directorate.infantry.breach_team"
    status: "core"
    decision: "Risk short-range assault against armor and structures."
  - object: "factions.directorate.infantry.shock_troopers"
    status: "core"
    decision: "Trade mobility for a durable anti-armor line."
  - object: "factions.directorate.infantry.rocket_section"
    status: "core"
    decision: "Expose a slow team for long-range anti-vehicle/air fire."
  - object: "factions.directorate.infantry.combat_engineer"
    status: "core"
    decision: "Spend a scarce body on capture, repair, or fortification."
  - object: "factions.directorate.infantry.field_marshal"
    status: "core"
    decision: "Commit a fragile command aura to a planned push."
  - object: "factions.directorate.infantry.riot_section"
    status: "optional"
    decision: "Lock down infantry approaches at the cost of reach."
  - object: "factions.directorate.infantry.siege_grenadiers"
    status: "optional"
    decision: "Set up area denial instead of carrying rifle DPS."
