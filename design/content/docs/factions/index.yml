display_name: "Faction Design Index"
description: "Shared faction ownership, balance hypotheses, and roster targets for Iron Meridian."
source_document: "design/factions/README.md"
canonical_factions:
  - faction: "factions.directorate"
    description: "The centralized successor government."
  - faction: "factions.coalition"
    description: "The regional treaty seeking a renewed federation."
  - faction: "factions.irregular_network"
    description: "The hidden minor network of cells and defectors."
shared_role_matrix:
  - directorate_answer: "Rifle Squad"
    coalition_pressure: "Line Rifle; scout and screen"
    intended_exchange: "Both occupy ground; Coalition repositions better, Directorate replaces more comfortably."
  - directorate_answer: "Bastion"
    coalition_pressure: "Valiant MBT; mobility and flank"
    intended_exchange: "Directorate wins a prepared frontal hold; Coalition wins time and angle."
  - directorate_answer: "Lancer"
    coalition_pressure: "Halberd Tank Destroyer; armor commitment"
    intended_exchange: "Both punish exposed armor; each specialist is vulnerable when screened or flanked."
  - directorate_answer: "Sentinel"
    coalition_pressure: "Lynx Scout Car; information"
    intended_exchange: "Directorate scout is durable enough to survive contact; Coalition scout is better at disengaging. Neither reveals hidden space for free."
  - directorate_answer: "Ballista"
    coalition_pressure: "Longbow or Peregrine; static pressure"
    intended_exchange: "Siege creates a warning and setup opportunity; mobile pressure can force it to relocate."
  - directorate_answer: "Warden"
    coalition_pressure: "Kodiak or Skyguard; air defense"
    intended_exchange: "Future air counters remain role-readable; neither is a V1 requirement."
roster_targets:
  infantry: "6–8"
  combat_support_ground_vehicles: "8–10 excluding MCV and Harvester"
  aircraft: "4–6"
  naval: "3–5"
  high_tech: "2–4 defining high-tech units"
balance_rules: ["Factions share battlefield grammar—roles and readable counter relationships—not default units.", "Both factions can open with line presence, scouting, a durable body, and an anti-armor answer.", "No single opening unit defeats all four shared battlefield roles.", "Coalition mobility creates exposure and replacement cost, while Directorate durability creates redeployment and logistics cost.", "Objective income is a timing advantage, not a replacement for home economy.", "A losing player has at least one visible recovery path through defense, retreat, production, or a raid.", "Playtest records time-to-first-contact, first objective arrival, first production loss, and comeback frequency before changing unit values."]
ownership:
  faction_records: "Faction identity, doctrine, background, and faction-wide presentation live in each faction runtime record and its typed documentation records."
  entity_records: "Concrete unit and building records live under design/content/factions/<faction>/<platform>/ and own individual values and entity presentation."
  shared_rules: "Political context, shared counter vocabulary, combat, and reusable type documents remain in their canonical world and system documents."
