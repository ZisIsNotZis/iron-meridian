title: Irregular Network Production Matrix
source_document: design/factions/irregular-network/production.md
document_type: production_matrix
ownership:
  matrix: authoritative relationship between Network products, producers, and availability classes
  excluded: unit/building statistics and queue mechanics remain on linked entity cards and the production contract
  missing_row: product is not producible
availability_classes:
  - class: standard
    resolution: requires an operational Safehouse and the listed producer
    allowed_modes: Network skirmish, campaign, and compatible multiplayer rulesets
  - class: optional
    resolution: supported extension that the scenario must explicitly enable
    allowed_modes: explicitly enabled Network skirmish, campaign, and compatible multiplayer rulesets
  - class: coastal
    resolution: also requires an operational Boat Shed and a navigable shallow-water map layer
    allowed_modes: Coastal campaign, skirmish, and compatible multiplayer rulesets
  - class: authored
    resolution: scenario setup may spawn the product, but no queue or replacement exists
    allowed_modes: explicit campaign/scenario content only
  - class: rejected
    resolution: retained as a design boundary; no recipe and cannot be selected
    allowed_modes: none
global_rules:
  scenario: must allow the class and product; faction ownership alone never makes a recipe available
  queues: FIFO; reserve card-owned cost on acceptance; lose queued work when producer is destroyed unless selected mode explicitly supplies a different rule
