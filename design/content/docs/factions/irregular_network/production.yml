    reason: scenario-provided reconnaissance asset until a shared air facility exists
    class: authored
  - product: factions.irregular_network.aircraft.razorwing
    reason: scenario-provided strike asset until a shared air facility exists
    class: authored
  - product: factions.irregular_network.aircraft.dustwing
