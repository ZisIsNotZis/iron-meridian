rejected_content:
  - product: Full-disguise operative
    reason: Identification and scouting failure risk.
    class: rejected
  - product: Tunnel network
    reason: Multiplies pathing, fog, construction, and attack-state rules.
    class: rejected
  - product: Open-ended captured-unit factory
    reason: Erases the bounded-salvage identity.
    class: rejected
  - product: Giant drone swarm
    reason: Adds a second economy and selection burden.
    class: rejected
authored_aircraft_rule: visible in scenario content, consume authored asset slots, can be lost permanently, cannot be queued or rebuilt, and cannot be a prerequisite for another Network product
salvage:
  owners: [Field Mechanic, Wrecker, Scrap Truck]
  category: action, not production
  results: health, a resource payout, or a temporary charge declared by the owning card
  boundaries: never creates a recipe, changes faction ownership, or bypasses the matrix
