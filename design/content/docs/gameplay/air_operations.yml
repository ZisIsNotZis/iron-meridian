commands: 
  - command: "produce"
    required_payload: "recipe and facility"
    accepted_when: "recipe is available and FIFO/cap are valid"
  - command: "launch"
    required_payload: "aircraft ID"
    accepted_when: "aircraft is parked and lane/stand are clear"
  - command: "move"
    required_payload: "aircraft ID and air point/path"
    accepted_when: "path is legal in the air layer"
  - command: "attack"
    required_payload: "aircraft ID and target/point"
    accepted_when: "acquisition and movement are legal"
  - command: "attack-run"
    required_payload: "aircraft ID and lane/target"
    accepted_when: "card owns attack-run delivery"
  - command: "hold"
    required_payload: "aircraft ID"
    accepted_when: "aircraft has a stable hold state"
  - command: "return"
    required_payload: "aircraft ID"
    accepted_when: "aircraft is not destroyed or already parked"
  - command: "land"
    required_payload: "aircraft ID and facility"
    accepted_when: "facility and approach are valid"
  - command: "service"
    required_payload: "aircraft ID"
    accepted_when: "aircraft is in a legal service state"
  - command: "skill"
    required_payload: "aircraft ID and skill payload"
    accepted_when: "card skill is legal in current state"
sensing_targeting_combat: 
  - "not_applicable"
interruptions: 
  - "not_applicable"
presentation_events: 
  - "not_applicable"
