title: "Air Operations"
source_document: "design/air-operations.md"
ownership: 
  - "kind: \"air_operations_contract\" document_id: \"gameplay.air_operations\" title: \"Air Operations\" source_document: \"design/air-operations.md\" ownership:    - \"# Air Operations\"   - \"This document owns the shared operation of aircraft and air facilities. It\"   - \"defines the airspace layer, facility lifecycle, takeoff, landing, service,\"   - \"attack-run movement, and aircraft command legality. Aircraft cards own their\"   - \"statistics, weapons, locomotor and targetability profiles, caps, and skills.\"   - \"Building cards own facility footprints, prerequisites, rosters, and deliberate\"   - \"exceptions. Shared combat, sensing, targetability, locomotor, and production\"   - \"documents retain ownership of their meanings.\"   - \"V1 has no aircraft or air layer. This contract is complete for the full game;\"   - \"implementation may enable one facility and one aircraft profile at a time.\"   - \"Existing land-only maps remain valid because they omit air facilities and\"   - \"air-specific layers, not because aircraft silently use ground rules.\" airspace_boundary:    - \"A future air map supplies a navigable airspace layer over the logical map. It\"   - \"may declare no-fly cells, altitude bands, launch and return corridors,\"   - \"attack-run lanes, and legal landing or hover zones. Ground terrain, cover, and\"   - \"buildings do not block stable high-air movement unless the map marks a no-fly\"   - \"cell. Airspace uses the same cell coordinates as ground movement; art never\"   - \"changes legality.\"   - \"The two operation bands are high-air for ordinary flight and low-air for\"   - \"deliberate low flight, takeoff, landing, hover, and other declared vulnerable\"   - \"states. Air units use their declared footprint for separation. Air-to-air\"   - \"collision damage is not implicit. An aircraft cannot occupy a reserved lane,\"   - \"service apron, stand, no-fly cell, or another solid footprint. A failed route\"   - \"stops at its last legal point and emits air-route-blocked; it never teleports\"   - \"or changes to ground state.\"   - \"Fixed-wing attack runs reserve their committed path until completion or\"   - \"cancellation. Helicopter orbit paths reserve only the next movement segment.\"   - \"Reservation conflicts use the existing command order: apply tick, player ID,\"   - \"client sequence, entity ID. A map may add explicit air collision or turbulence\"   - \"as a card or map object, never as a rendering side effect.\" facility_schema:    - \"An air facility card must declare: kind air-facility; owner building ID; one FIFO\"   - \"queue; recipe roster; active cap; apron cells; launch lanes; service apron;\"   - \"parking stands; airspace entry and exit corridors; and map no-fly references.\"   - \"The building card owns concrete cells, footprint, cost, prerequisites, health,\"   - \"and faction presentation. This document owns the meaning of those facility\"   - \"fields. Air Command and Air Operations are faction labels, not alternate\"   - \"systems.\"   - \"An aircraft card must declare a fixed-wing, helicopter, or other locomotor;\"   - \"state targetability profiles; facility building ID; positive air-cap cost;\"   - \"allowed stable flight states; and attack movement policy. It must also own\"   - \"speed, footprint, endurance if any, weapons, payload state, skills, and\"   - \"transport capacity if applicable. Missing data is invalid, never an implicit\"   - \"aircraft default.\" aircraft_schema:    - \"An air facility card must declare: kind air-facility; owner building ID; one FIFO\"   - \"queue; recipe roster; active cap; apron cells; launch lanes; service apron;\"   - \"parking stands; airspace entry and exit corridors; and map no-fly references.\"   - \"The building card owns concrete cells, footprint, cost, prerequisites, health,\"   - \"and faction presentation. This document owns the meaning of those facility\"   - \"fields. Air Command and Air Operations are faction labels, not alternate\"   - \"systems.\"   - \"An aircraft card must declare a fixed-wing, helicopter, or other locomotor;\"   - \"state targetability profiles; facility building ID; positive air-cap cost;\"   - \"allowed stable flight states; and attack movement policy. It must also own\"   - \"speed, footprint, endurance if any, weapons, payload state, skills, and\"   - \"transport capacity if applicable. Missing data is invalid, never an implicit\"   - \"aircraft default.\" airspace_collision:    - \"A future air map supplies a navigable airspace layer over the logical map. It\"   - \"may declare no-fly cells, altitude bands, launch and return corridors,\"   - \"attack-run lanes, and legal landing or hover zones. Ground terrain, cover, and\"   - \"buildings do not block stable high-air movement unless the map marks a no-fly\"   - \"cell. Airspace uses the same cell coordinates as ground movement; art never\"   - \"changes legality.\"   - \"The two operation bands are high-air for ordinary flight and low-air for\"   - \"deliberate low flight, takeoff, landing, hover, and other declared vulnerable\"   - \"states. Air units use their declared footprint for separation. Air-to-air\"   - \"collision damage is not implicit. An aircraft cannot occupy a reserved lane,\"   - \"service apron, stand, no-fly cell, or another solid footprint. A failed route\"   - \"stops at its last legal point and emits air-route-blocked; it never teleports\"   - \"or changes to ground state.\"   - \"Fixed-wing attack runs reserve their committed path until completion or\"   - \"cancellation. Helicopter orbit paths reserve only the next movement segment.\"   - \"Reservation conflicts use the existing command order: apply tick, player ID,\"   - \"client sequence, entity ID. A map may add explicit air collision or turbulence\"   - \"as a card or map object, never as a rendering side effect.\" facility_lifecycle:    - \"Each facility has one production and service FIFO, one service apron, and its\"   - \"declared visible stands. Production and service jobs share the FIFO. Production\"   - \"reserves resources on acceptance; service does not. Active-cap accounting\"   - \"includes every non-destroyed aircraft assigned to the facility: accepted queue\"   - \"entries, waiting, parked, airborne, returning, servicing, and transitions.\"   - \"The lifecycle is:\"   - \"queued -> built-waiting -> parked -> taking-off -> airborne\"   - \"airborne -> attack-run, loiter, holding, or returning\"   - \"returning -> landing -> servicing -> service-wait -> parked\"   - \"landing may abort to airborne; every state may end in destroyed.\"   - \"Authoritative states are queued, built-waiting, parked, taking-off, airborne,\"   - \"attack-run, loiter, holding, returning, landing, servicing, service-wait,\"   - \"disabled, and destroyed. Disabled is a capability state from shared status\"   - \"rules and does not replace the locomotor state.\"   - \"When production completes, the facility reserves a stand and exit route. If\"   - \"either is unavailable, the aircraft remains built-waiting and is never spawned\"   - \"overlapping another entity. Once a stand is reserved it becomes parked; it\"   - \"does not launch automatically.\" takeoff_flight_return:    - \"Launch is accepted only for a parked aircraft with an operational facility,\"   - \"clear stand, clear launch lane, and valid cap. Requests are ordered\"   - \"deterministically; only the winning request for a lane starts on the next tick.\"   - \"The shared takeoff default is 30 ticks: 15 ticks occupying the apron and 15\"   - \"ticks following the authored exit vector. During takeoff the aircraft cannot\"   - \"fire, accept a movement order, transfer passengers, or begin another skill. It\"   - \"exposes exactly the transition domains named by its targetability profiles.\"   - \"Stable aircraft accept only card-legal move, hold, attack, attack-run, skill,\"   - \"and return commands. Fixed-wing aircraft cannot stop inside a committed run.\"   - \"Helicopters hover or orbit only when their locomotor and weapon or skill permit\"   - \"it. A sortie is an operation state, not an unowned fuel or ammunition system.\"   - \"Endurance exists only on a card declaring a warning, forced-return threshold,\"   - \"and recovery behavior.\"   - \"Return cancels only a cancellable pending skill and enters returning; it never\"   - \"teleports. The aircraft follows its assigned return lane. A blocked lane causes\"   - \"holding at the nearest legal air point, with ties by return tick and entity ID.\"   - \"An aircraft without a valid facility remains airborne and receives\"   - \"no-service-site. It may continue valid orders but cannot land into a missing or\"   - \"destroyed facility.\" landing_service:    - \"Landing requires an operational facility, clear approach, and free service\"   - \"apron. The shared landing default is 30 ticks: 15 approach ticks and 15\"   - \"apron-entry ticks. During landing the aircraft is low-air, cannot fire or\"   - \"transfer passengers, and is targetable by the transition domains named on its\"   - \"card. If approach or apron becomes invalid, it aborts over 15 ticks to airborne\"   - \"and emits landing-aborted.\"   - \"On apron entry, the facility appends one service job to its FIFO. The aircraft\"   - \"does not jump production or earlier service. A front job reserves the service\"   - \"apron. The shared rearm default is 60 ticks; it resets card-declared cooldown,\"   - \"payload, and ordnance state, but never repairs HP, refunds a fired shot, or\"   - \"clears status without an explicit facility or card rule. After service, the\"   - \"aircraft moves to a free stand over 15 ticks. Service-wait blocks the apron\"   - \"until a stand exists.\"   - \"If a facility is damaged or EMP-disabled, the building card decides which\"   - \"capabilities pause; no new capability is inferred. If destroyed, its queue and\"   - \"uncompleted jobs stop under building rules, parked aircraft remain exposed at\"   - \"their stands, and airborne aircraft are not destroyed or repaired by facility\"   - \"loss.\" commands:    - command: \"produce\"     required_payload: \"recipe and facility\"     accepted_when: \"recipe is available and FIFO/cap are valid\"   - command: \"launch\"     required_payload: \"aircraft ID\"     accepted_when: \"aircraft is parked and lane/stand are clear\"   - command: \"move\"     required_payload: \"aircraft ID and air point/path\"     accepted_when: \"path is legal in the air layer\"   - command: \"attack\"     required_payload: \"aircraft ID and target/point\"     accepted_when: \"acquisition and movement are legal\"   - command: \"attack-run\"     required_payload: \"aircraft ID and lane/target\"     accepted_when: \"card owns attack-run delivery\"   - command: \"hold\"     required_payload: \"aircraft ID\"     accepted_when: \"aircraft has a stable hold state\"   - command: \"return\"     required_payload: \"aircraft ID\"     accepted_when: \"aircraft is not destroyed or already parked\"   - command: \"land\"     required_payload: \"aircraft ID and facility\"     accepted_when: \"facility and approach are valid\"   - command: \"service\"     required_payload: \"aircraft ID\"     accepted_when: \"aircraft is in a legal service state\"   - command: \"skill\"     required_payload: \"aircraft ID and skill payload\"     accepted_when: \"card skill is legal in current state\" sensing_targeting_combat:    - \"Aircraft targetability is evaluated from current state, not model height.\"   - \"High-air, low-air, and any ground or structure exposure must be explicit.\"   - \"Ordinary vision, radar, designation, and jamming use the shared sensing\"   - \"information levels. A facility grants no global vision. Parked aircraft are\"   - \"special assets or ground-visible only when their targetability card says so;\"   - \"an aircraft icon is never an invisible hangar.\"   - \"Fire-time and impact-time resolution follows combat. Air operations do not\"   - \"extend weapon range, retarget released payloads, or make anti-air weapons\"   - \"omnidirectional. Air-to-air, air-to-ground, shore-to-air, and air-to-submerged\"   - \"attacks require explicit weapon domains and required detection. A submarine is\"   - \"not revealed merely because an aircraft exists. An aircraft transport must be\"   - \"stable in its declared hover or landing state before transport boarding or\"   - \"unloading begins.\" interruptions:    - \"- EMP disables only capabilities named by shared status or card rules.\"   - \"- Destruction resolves once in the shared combat destruction phase; embarked\"   - \"  cargo follows transport destruction rules.\"   - \"- A dead, captured, or invalid facility cannot receive a returning aircraft.\"   - \"- A closed corridor stops the aircraft and emits a block; it does not crash.\"   - \"- An interrupted transition creates neither duplicate aircraft nor completed\"   - \"  service.\"   - \"- Last-known targeting follows the weapon acquisition policy; fog memory never\"   - \"  guarantees a hit.\"   - \"- Simultaneous lane, stand, and service claims use shared command order; losers\"   - \"  remain in their previous stable state.\" presentation_events:    - \"The UI shows facility queue position, stand/apron/lane occupancy, takeoff and\"   - \"landing progress, targetability, attack-run lane, return status, service\"   - \"progress, and rejection reasons. Events include aircraft-queued, aircraft-built,\"   - \"takeoff-start, airborne, attack-run-start, air-route-blocked, return-start,\"   - \"landing-start, landing-aborted, service-start, rearmed, no-service-site, and\"   - \"aircraft-destroyed, each with relevant IDs and tick. Presentation may\"   - \"interpolate flight but never advances state.\"   - \"Directorate Air Command, Coalition Air Operations, and any future carrier\"   - \"equivalent implement this contract; their names, footprints, queues, and\"   - \"rosters remain card-owned. Existing maps have no air facility or airspace\"   - \"route. Future maps must declare the air layer before aircraft recipes become\"   - \"available. V1 excludes aircraft. Carriers, low-flight infantry, aircraft\"   - \"repair,\"   - \"weather, and special crash rules are explicit future card or map objects, not\"   - \"hidden defaults.\" scope:    - \"# Air Operations\"   - \"This document owns the shared operation of aircraft and air facilities. It\"   - \"defines the airspace layer, facility lifecycle, takeoff, landing, service,\"   - \"attack-run movement, and aircraft command legality. Aircraft cards own their\"   - \"statistics, weapons, locomotor and targetability profiles, caps, and skills.\"   - \"Building cards own facility footprints, prerequisites, rosters, and deliberate\"   - \"exceptions. Shared combat, sensing, targetability, locomotor, and production\"   - \"documents retain ownership of their meanings.\"   - \"V1 has no aircraft or air layer. This contract is complete for the full game;\"   - \"implementation may enable one facility and one aircraft profile at a time.\"   - \"Existing land-only maps remain valid because they omit air facilities and\"   - \"air-specific layers, not because aircraft silently use ground rules.\""
