  table: 
    - model: "Point"
      meaning: "One impact point applies damage to one legal target."
      counterplay: "Dodge, cover, break lock, or force a cheaper target."
    - model: "Projectile"
      meaning: "A moving point with speed and collision radius."
      counterplay: "Move, intercept, use terrain, or leave the target domain."
    - model: "Beam"
      meaning: "A ray checked from source to endpoint during active ticks."
      counterplay: "Break line of sight, outrange, or interrupt windup."
    - model: "Area"
      meaning: "A pulse or impact around a center, with distance falloff."
      counterplay: "Spread out, leave the warning, or attack the delivery unit."
    - model: "Arc"
      meaning: "A sector from source orientation with maximum angle and radius."
      counterplay: "Attack from the rear/side, flank, or leave the sector."
    - model: "Line"
      meaning: "A corridor from source to endpoint with width and ordered hits."
      counterplay: "Cross the corridor, use cover, or force a bad facing."
    - model: "Attack run"
      meaning: "A fixed-wing or similar pass firing along a declared path."
      counterplay: "Anti-air, dispersal, and moving away from the run."
