ownership: 
  - "kind: \"combat_contract\" document_id: \"gameplay.combat\" title: \"Combat Design\" source_document: \"design/combat/README.md\" ownership:    - \"# Combat Design\"   - \"This document defines shared combat resolution rules. Reusable definitions are\"   - \"owned by [weapons](../weapons.md), [armors](../armors.md),\"   - \"[damages](../damages.md), [status effects](../status-effects.md),\"   - \"[locomotors](../locomotors.md), [sensing](../sensing.md), and\"   - \"[targetabilities](../targetabilities.md). Concrete values belong to their\"   - \"owning entity or reusable definition, not this overview.\"   - \"The complete cross-axis contract is in [combat interactions](interactions.md).\"   - \"It defines resolution precedence between domain, targetability, armor, damage,\"   - \"and status; this overview owns the attack lifecycle and ordering.\" combat_promise:    - \"Combat is moderately lethal. A bad engagement should usually be recognizable\"   - \"and punishable, but a player who notices early can retreat, reinforce, repair,\"   - \"or change composition. Ordinary attacks do not randomly miss, critical-hit, or\"   - \"roll hidden penetration events. Deterministic outcomes make losses explainable\"   - \"and make replays, AI, and future lockstep multiplayer practical.\"   - \"The simulation uses the authoritative clock in\"   - \"[architecture](../architecture/README.md). It resolves commands, movement,\"   - \"attacks, projectiles, effects, and destruction in a stable order. Presentation\"   - \"may interpolate between ticks but never changes an outcome.\" attack_resolution:    definition: \"\\\"An attack is an intent from a weapon on a source entity toward a target entity,or point. The simulation validates it on the tick it fires and again when a,projectile arrives.,### Fire-time validation,The weapon fires only when all of these are true:,1. The source is alive, not EMP-disabled, and its weapon is ready.,2. The source is allowed to attack in its current state (deployed, frozen,,   transporting, landing, and similar states may restrict weapons).,3. The target is alive, inside maximum range and firing arc, and belongs to an,   allowed target domain and protection profile.,4. The source has the required detection/lock. A remembered target may be used,   only for the weapon's declared grace period; it cannot bypass fog of war.,5. The line of fire is valid. Direct weapons need a clear ray unless their,   definition says they ignore blockers; indirect weapons need a valid impact,   point and a known or designated target position.,If validation fails, no damage occurs and the weapon remains ready unless its,definition explicitly spends a shot on a miss. A source may turn or move to,satisfy the test; turning is not free damage.,### Impact-time validation,Projectiles store their source, weapon, launch tick, origin, intended target ID,when applicable, and deterministic aim point. On arrival:,- Point and area attacks resolve at their stored impact point. They do not,  retarget merely because the original target moved.,- Homing projectiles may update their aim only within their declared tracking,  cone and turn rate. Losing detection makes them continue toward the last,  known point or fail according to the weapon definition.,- A projectile that hits terrain, a blocker, or an invalid domain is consumed.,- A target that left the legal domain is not damaged unless the projectile's,  definition allows a transition hit.,The hit test is deterministic: compare integer squared distances and fixed,radii; do not use frame-rate-dependent continuous collision callbacks.,For V1, a mobile target is hit when the impact point is within its collision,radius. A structure is hit when the point is within the nearest point of its,declared rectangular footprint; its center is used only when a weapon declares,center targeting. A projectile tests terrain/blockers first, then eligible,entities in ascending distance from its traveled point and entity ID. It is,consumed by the first solid blocker or first legal target unless its weapon,declares piercing or area delivery. A projectile leaving the playable map is,consumed without an impact event. V1 has no projectile interception or friendly,fire unless a concrete V1 weapon explicitly declares either.\\\"\"   fire_time_validation:      - \"N/A\"   fire_failure: \"\\\"If fire-time validation fails, no damage occurs and the weapon remains ready unless its definition spends a shot on a miss.\\\"\"   impact_time_validation:      - \"N/A\"   deterministic_hit_test: \"\\\"Compare integer squared distances and fixed radii; do not use frame-rate-dependent continuous collision callbacks.\\\"\"   v1_hit_test:      - \"N/A\" hit_models:    ownership_rule: \"\\\"Every weapon chooses one primary hit model. Its card may add a delivery policy,,but must not invent a new meaning for an existing model.,| Model | Meaning | Typical counterplay |,| --- | --- | --- |,| Point | One impact point applies damage to one legal target. | Dodge, cover, break lock, or force a cheaper target. |,| Projectile | A moving point with speed and collision radius. | Move, intercept, use terrain, or leave the target domain. |,| Beam | A ray checked from source to endpoint during active ticks. | Break line of sight, outrange, or interrupt windup. |,| Area | A pulse or impact around a center, with distance falloff. | Spread out, leave the warning, or attack the delivery unit. |,| Arc | A sector from source orientation with maximum angle and radius. | Attack from the rear/side, flank, or leave the sector. |,| Line | A corridor from source to endpoint with width and ordered hits. | Cross the corridor, use cover, or force a bad facing. |,| Attack run | A fixed-wing or similar pass firing along a declared path. | Anti-air, dispersal, and moving away from the run. |,### Area, arc, and line semantics,- Area includes every eligible entity whose collision center is within the,  radius. Full damage applies inside the inner radius; damage linearly falls,  to the declared edge factor at the outer radius. One entity is damaged once,  per impact, even if its footprint overlaps the area several times.,- Arc includes entities inside radius and within half-angle of source facing at,  the firing tick. It is evaluated once per shot, not continuously while a,  projectile travels.,- Line is a capsule of declared width between origin and endpoint. Eligible,  entities are ordered by distance from origin and hit once, subject to a,  weapon hit-count limit. A solid blocker can stop the line if the weapon says,  it is blocked.,- Point, area, arc, and line impacts use the launcher's stored aim/facing;,  presentation must not make them appear to track after firing.,The area edge factor is owned by the weapon definition. This document defines,how that declared factor is applied.,For an area impact, the inner radius receives the declared base amount. Between,inner and outer radius, the multiplier is linearly interpolated to the declared,edge factor and rounded down once after armor conversion. A target is included,once by collision-center distance; footprint overlap does not multiply hits.,V1 area damage is enemy-only by default, and a concrete weapon must explicitly,opt into allied or source damage.\\\"\"   table:      - model: \"Point\"       meaning: \"One impact point applies damage to one legal target.\"       counterplay: \"Dodge, cover, break lock, or force a cheaper target.\"     - model: \"Projectile\"       meaning: \"A moving point with speed and collision radius.\"       counterplay: \"Move, intercept, use terrain, or leave the target domain.\"     - model: \"Beam\"       meaning: \"A ray checked from source to endpoint during active ticks.\"       counterplay: \"Break line of sight, outrange, or interrupt windup.\"     - model: \"Area\"       meaning: \"A pulse or impact around a center, with distance falloff.\"       counterplay: \"Spread out, leave the warning, or attack the delivery unit.\"     - model: \"Arc\"       meaning: \"A sector from source orientation with maximum angle and radius.\"       counterplay: \"Attack from the rear/side, flank, or leave the sector.\"     - model: \"Line\"       meaning: \"A corridor from source to endpoint with width and ordered hits.\"       counterplay: \"Cross the corridor, use cover, or force a bad facing.\"     - model: \"Attack run\"       meaning: \"A fixed-wing or similar pass firing along a declared path.\"       counterplay: \"Anti-air, dispersal, and moving away from the run.\"   area_arc_line_semantics:      - \"N/A\"   area_falloff: \"\\\"N/A\\\"\"   v1_friendly_fire: \"\\\"N/A\\\"\" range_vision_acquisition:    distance: \"\\\"Distance is measured from collision-center distance in simulation cells. A,weapon's listed range is its maximum fire distance, not its preferred distance.,Vision is the ordinary sight radius used to create a detailed target. Radar,,sonar, designation, and shared vision add explicit information; they do not,silently increase weapon range.,Each weapon has an acquisition policy:,- **Direct:** fire at a currently visible and legal target.,- **Lock:** acquire for a windup; movement, stealth, EMP, or broken line of,  sight can break the lock.,- **Point/designated:** fire at a visible point or ally-designated position;,  the shot can miss if the target leaves it.,- **Indirect:** fire at a known point without direct line of sight, but requires,  a valid observation, designation, or remembered position.,Auto-attack uses a separate alert radius. A unit may notice and choose a target,inside alert radius, but it cannot fire beyond weapon range. It chooses the,highest-priority legal target in the current attack group, then nearest target,as deterministic tie-breaker, then stable entity ID. Player-issued attack,orders override auto-acquisition until cancelled or invalid.,V1 auto-attack does not chase remembered contacts. It may continue an already,accepted attack toward a declared point or last-known point only when that,weapon's acquisition policy permits it. If a direct target becomes hidden,,invalid, or leaves the weapon's domain before firing, the attack waits for a,new legal target and emits no damage. A player attack order is cancelled after,`90 ticks` without a legal target or when the source receives a new order.,Targetability is evaluated from the target's current locomotor state. Ground,,low-air, high-air, surface-naval, submerged, and structure domains are not,interchangeable. A weapon must match both domain and required detection. A,low-flight unit may match selected ground and air weapons; this is an explicit,unit definition, not a global exception.\\\"\"   information: \"\\\"Distance is measured from collision-center distance in simulation cells. A,weapon's listed range is its maximum fire distance, not its preferred distance.,Vision is the ordinary sight radius used to create a detailed target. Radar,,sonar, designation, and shared vision add explicit information; they do not,silently increase weapon range.,Each weapon has an acquisition policy:,- **Direct:** fire at a currently visible and legal target.,- **Lock:** acquire for a windup; movement, stealth, EMP, or broken line of,  sight can break the lock.,- **Point/designated:** fire at a visible point or ally-designated position;,  the shot can miss if the target leaves it.,- **Indirect:** fire at a known point without direct line of sight, but requires,  a valid observation, designation, or remembered position.,Auto-attack uses a separate alert radius. A unit may notice and choose a target,inside alert radius, but it cannot fire beyond weapon range. It chooses the,highest-priority legal target in the current attack group, then nearest target,as deterministic tie-breaker, then stable entity ID. Player-issued attack,orders override auto-acquisition until cancelled or invalid.,V1 auto-attack does not chase remembered contacts. It may continue an already,accepted attack toward a declared point or last-known point only when that,weapon's acquisition policy permits it. If a direct target becomes hidden,,invalid, or leaves the weapon's domain before firing, the attack waits for a,new legal target and emits no damage. A player attack order is cancelled after,`90 ticks` without a legal target or when the source receives a new order.,Targetability is evaluated from the target's current locomotor state. Ground,,low-air, high-air, surface-naval, submerged, and structure domains are not,interchangeable. A weapon must match both domain and required detection. A,low-flight unit may match selected ground and air weapons; this is an explicit,unit definition, not a global exception.\\\"\"   policies:      - name: \"Direct\"       rule: \"fire at a currently visible and legal target.\"     - name: \"Lock\"       rule: \"acquire for a windup; movement, stealth, EMP, or broken line of sight can break the lock.\"     - name: \"Point/designated\"       rule: \"fire at a visible point or ally-designated position; the shot can miss if the target leaves it.\"     - name: \"Indirect\"       rule: \"fire at a known point without direct line of sight, but requires a valid observation, designation, or remembered position.\"   auto_attack: \"\\\"Distance is measured from collision-center distance in simulation cells. A,weapon's listed range is its maximum fire distance, not its preferred distance.,Vision is the ordinary sight radius used to create a detailed target. Radar,,sonar, designation, and shared vision add explicit information; they do not,silently increase weapon range.,Each weapon has an acquisition policy:,- **Direct:** fire at a currently visible and legal target.,- **Lock:** acquire for a windup; movement, stealth, EMP, or broken line of,  sight can break the lock.,- **Point/designated:** fire at a visible point or ally-designated position;,  the shot can miss if the target leaves it.,- **Indirect:** fire at a known point without direct line of sight, but requires,  a valid observation, designation, or remembered position.,Auto-attack uses a separate alert radius. A unit may notice and choose a target,inside alert radius, but it cannot fire beyond weapon range. It chooses the,highest-priority legal target in the current attack group, then nearest target,as deterministic tie-breaker, then stable entity ID. Player-issued attack,orders override auto-acquisition until cancelled or invalid.,V1 auto-attack does not chase remembered contacts. It may continue an already,accepted attack toward a declared point or last-known point only when that,weapon's acquisition policy permits it. If a direct target becomes hidden,,invalid, or leaves the weapon's domain before firing, the attack waits for a,new legal target and emits no damage. A player attack order is cancelled after,`90 ticks` without a legal target or when the source receives a new order.,Targetability is evaluated from the target's current locomotor state. Ground,,low-air, high-air, surface-naval, submerged, and structure domains are not,interchangeable. A weapon must match both domain and required detection. A,low-flight unit may match selected ground and air weapons; this is an explicit,unit definition, not a global exception.\\\"\"   v1_auto_attack:      - \"Distance is measured from collision-center distance in simulation cells. A\"     - \"weapon's listed range is its maximum fire distance, not its preferred distance.\"     - \"Vision is the ordinary sight radius used to create a detailed target. Radar,\"     - \"sonar, designation, and shared vision add explicit information; they do not\"     - \"silently increase weapon range.\"     - \"Each weapon has an acquisition policy:\"     - \"- **Direct:** fire at a currently visible and legal target.\"     - \"- **Lock:** acquire for a windup; movement, stealth, EMP, or broken line of\"     - \"  sight can break the lock.\"     - \"- **Point/designated:** fire at a visible point or ally-designated position;\"     - \"  the shot can miss if the target leaves it.\"     - \"- **Indirect:** fire at a known point without direct line of sight, but requires\"     - \"  a valid observation, designation, or remembered position.\"     - \"Auto-attack uses a separate alert radius. A unit may notice and choose a target\"     - \"inside alert radius, but it cannot fire beyond weapon range. It chooses the\"     - \"highest-priority legal target in the current attack group, then nearest target\"     - \"as deterministic tie-breaker, then stable entity ID. Player-issued attack\"     - \"orders override auto-acquisition until cancelled or invalid.\"     - \"V1 auto-attack does not chase remembered contacts. It may continue an already\"     - \"accepted attack toward a declared point or last-known point only when that\"     - \"weapon's acquisition policy permits it. If a direct target becomes hidden,\"     - \"invalid, or leaves the weapon's domain before firing, the attack waits for a\"     - \"new legal target and emits no damage. A player attack order is cancelled after\"     - \"`90 ticks` without a legal target or when the source receives a new order.\"     - \"Targetability is evaluated from the target's current locomotor state. Ground,\"     - \"low-air, high-air, surface-naval, submerged, and structure domains are not\"     - \"interchangeable. A weapon must match both domain and required detection. A\"     - \"low-flight unit may match selected ground and air weapons; this is an explicit\"     - \"unit definition, not a global exception.\"   targetability: \"\\\"Distance is measured from collision-center distance in simulation cells. A,weapon's listed range is its maximum fire distance, not its preferred distance.,Vision is the ordinary sight radius used to create a detailed target. Radar,,sonar, designation, and shared vision add explicit information; they do not,silently increase weapon range.,Each weapon has an acquisition policy:,- **Direct:** fire at a currently visible and legal target.,- **Lock:** acquire for a windup; movement, stealth, EMP, or broken line of,  sight can break the lock.,- **Point/designated:** fire at a visible point or ally-designated position;,  the shot can miss if the target leaves it.,- **Indirect:** fire at a known point without direct line of sight, but requires,  a valid observation, designation, or remembered position.,Auto-attack uses a separate alert radius. A unit may notice and choose a target,inside alert radius, but it cannot fire beyond weapon range. It chooses the,highest-priority legal target in the current attack group, then nearest target,as deterministic tie-breaker, then stable entity ID. Player-issued attack,orders override auto-acquisition until cancelled or invalid.,V1 auto-attack does not chase remembered contacts. It may continue an already,accepted attack toward a declared point or last-known point only when that,weapon's acquisition policy permits it. If a direct target becomes hidden,,invalid, or leaves the weapon's domain before firing, the attack waits for a,new legal target and emits no damage. A player attack order is cancelled after,`90 ticks` without a legal target or when the source receives a new order.,Targetability is evaluated from the target's current locomotor state. Ground,,low-air, high-air, surface-naval, submerged, and structure domains are not,interchangeable. A weapon must match both domain and required detection. A,low-flight unit may match selected ground and air weapons; this is an explicit,unit definition, not a global exception.\\\"\" cooldown_rate_of_fire:    states: \"\\\"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and,`cooldownTicks`:,```text,ready → windup → fire/impact → recovery → cooldown → ready,```,`cooldownTicks` is the interval from one fire event to the next after recovery,has completed. Thus the minimum repeat period is:,```text,windupTicks + recoveryTicks + cooldownTicks,```,The weapon cannot fire during windup or recovery. Movement may be allowed,,reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,,death, or invalid transition interrupts windup; it does not refund a completed,fire event. A projectile already launched continues unless its definition says,it is command-linked. Cooldown is not shortened by animation speed.,Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`,between shots. The burst is interrupted by disable or death; remaining shots,are lost. Do not model ammunition unless a unit card deliberately makes,reload timing its central decision.,V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,,directional armor, or projectile interception. A weapon's mount facing is the,source's simulation facing; turret rotation and chassis turning present that,state, not a second hit rule. A direct weapon with no declared arc uses the,shared `360°` default.\\\"\"   timing_definition: \"\\\"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and,`cooldownTicks`:,```text,ready → windup → fire/impact → recovery → cooldown → ready,```,`cooldownTicks` is the interval from one fire event to the next after recovery,has completed. Thus the minimum repeat period is:,```text,windupTicks + recoveryTicks + cooldownTicks,```,The weapon cannot fire during windup or recovery. Movement may be allowed,,reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,,death, or invalid transition interrupts windup; it does not refund a completed,fire event. A projectile already launched continues unless its definition says,it is command-linked. Cooldown is not shortened by animation speed.,Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`,between shots. The burst is interrupted by disable or death; remaining shots,are lost. Do not model ammunition unless a unit card deliberately makes,reload timing its central decision.,V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,,directional armor, or projectile interception. A weapon's mount facing is the,source's simulation facing; turret rotation and chassis turning present that,state, not a second hit rule. A direct weapon with no declared arc uses the,shared `360°` default.\\\"\"   minimum_repeat_period: \"windupTicks + recoveryTicks + cooldownTicks\"   interruption: \"\\\"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and,`cooldownTicks`:,```text,ready → windup → fire/impact → recovery → cooldown → ready,```,`cooldownTicks` is the interval from one fire event to the next after recovery,has completed. Thus the minimum repeat period is:,```text,windupTicks + recoveryTicks + cooldownTicks,```,The weapon cannot fire during windup or recovery. Movement may be allowed,,reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,,death, or invalid transition interrupts windup; it does not refund a completed,fire event. A projectile already launched continues unless its definition says,it is command-linked. Cooldown is not shortened by animation speed.,Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`,between shots. The burst is interrupted by disable or death; remaining shots,are lost. Do not model ammunition unless a unit card deliberately makes,reload timing its central decision.,V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,,directional armor, or projectile interception. A weapon's mount facing is the,source's simulation facing; turret rotation and chassis turning present that,state, not a second hit rule. A direct weapon with no declared arc uses the,shared `360°` default.\\\"\"   burst: \"\\\"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and,`cooldownTicks`:,```text,ready → windup → fire/impact → recovery → cooldown → ready,```,`cooldownTicks` is the interval from one fire event to the next after recovery,has completed. Thus the minimum repeat period is:,```text,windupTicks + recoveryTicks + cooldownTicks,```,The weapon cannot fire during windup or recovery. Movement may be allowed,,reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,,death, or invalid transition interrupts windup; it does not refund a completed,fire event. A projectile already launched continues unless its definition says,it is command-linked. Cooldown is not shortened by animation speed.,Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`,between shots. The burst is interrupted by disable or death; remaining shots,are lost. Do not model ammunition unless a unit card deliberately makes,reload timing its central decision.,V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,,directional armor, or projectile interception. A weapon's mount facing is the,source's simulation facing; turret rotation and chassis turning present that,state, not a second hit rule. A direct weapon with no declared arc uses the,shared `360°` default.\\\"\"   v1_exclusions:      - \"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and\"     - \"`cooldownTicks`:\"     - \"```text\"     - \"ready → windup → fire/impact → recovery → cooldown → ready\"     - \"```\"     - \"`cooldownTicks` is the interval from one fire event to the next after recovery\"     - \"has completed. Thus the minimum repeat period is:\"     - \"```text\"     - \"windupTicks + recoveryTicks + cooldownTicks\"     - \"```\"     - \"The weapon cannot fire during windup or recovery. Movement may be allowed,\"     - \"reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,\"     - \"death, or invalid transition interrupts windup; it does not refund a completed\"     - \"fire event. A projectile already launched continues unless its definition says\"     - \"it is command-linked. Cooldown is not shortened by animation speed.\"     - \"Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`\"     - \"between shots. The burst is interrupted by disable or death; remaining shots\"     - \"are lost. Do not model ammunition unless a unit card deliberately makes\"     - \"reload timing its central decision.\"     - \"V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,\"     - \"directional armor, or projectile interception. A weapon's mount facing is the\"     - \"source's simulation facing; turret rotation and chassis turning present that\"     - \"state, not a second hit rule. A direct weapon with no declared arc uses the\"     - \"shared `360°` default.\"   facing: \"\\\"All timing is integer ticks. A weapon has `windupTicks`, `recoveryTicks`, and,`cooldownTicks`:,```text,ready → windup → fire/impact → recovery → cooldown → ready,```,`cooldownTicks` is the interval from one fire event to the next after recovery,has completed. Thus the minimum repeat period is:,```text,windupTicks + recoveryTicks + cooldownTicks,```,The weapon cannot fire during windup or recovery. Movement may be allowed,,reduced, or forbidden by its attack-movement policy. A forced move, stun, EMP,,death, or invalid transition interrupts windup; it does not refund a completed,fire event. A projectile already launched continues unless its definition says,it is command-linked. Cooldown is not shortened by animation speed.,Burst weapons use one cooldown per burst and a fixed `burstIntervalTicks`,between shots. The burst is interrupted by disable or death; remaining shots,are lost. Do not model ammunition unless a unit card deliberately makes,reload timing its central decision.,V1 has no ammunition, magazine, random accuracy, critical hit, penetration roll,,directional armor, or projectile interception. A weapon's mount facing is the,source's simulation facing; turret rotation and chassis turning present that,state, not a second hit rule. A direct weapon with no declared arc uses the,shared `360°` default.\\\"\" damage_and_armor:    formula:      - \"For ordinary health damage, resolve each eligible damage component separately:\"     - \"```text\"     - \"effective = floor(baseDamage × armorRatio / 100)\"     - \"effective = max(effective, 1) when the ratio is non-zero\"     - \"```\"     - \"The ratio comes from the referenced damage and armor definitions. It is a\"     - \"balance value owned by those definitions, not by this resolution overview. A\"     - \"zero ratio means the channel cannot damage that protection class; a listed\"     - \"dedicated counter must exist before using zero.\"     - \"Damage is applied in stable order: protection-condition damage, health damage,\"     - \"then status accumulation and transitions. If several sources hit on one tick,\"     - \"sort them by source ID and weapon ID. Clamp health at zero and emit one\"     - \"destruction event; later same-tick hits do not create duplicate deaths.\"     - \"V1 resolves a same-tick impact in this order: source/weapon legality, delivery\"     - \"geometry, domain, protection condition, health, then statuses. Within one\"     - \"impact, status families apply in this order: incendiary, suppression, EMP,\"     - \"freeze. Each family sees the state produced by the preceding family but never\"     - \"re-runs an earlier health calculation. A status applied to a target that dies\"     - \"in the same impact is recorded in the combat event but has no later effect.\"     - \"Damage channels have distinct meanings:\"     - \"- **Health** removes hit points after armor conversion.\"     - \"- **Protection condition** fills a bounded condition track. At its threshold,\"     - \"  the target uses the declared exposed ratio until the condition decays or is\"     - \"  repaired. It never means “negative infinite armor.”\"     - \"- **Structural** uses the structure column and is normally absent or weak on\"     - \"  mobile units.\"     - \"- **Incendiary** creates a bounded hazard or damage-over-time effect; it does\"     - \"  not stack indefinitely.\"     - \"- **Suppression** fills a bounded track that reduces weapon performance and\"     - \"  clears while the unit is not under qualifying fire.\"     - \"- **EMP** applies electronic disable/degradation and never directly removes\"     - \"  health.\"     - \"- **Freeze** fills a threshold track and changes state as described below.\"   ownership: \"\\\"For ordinary health damage, resolve each eligible damage component separately:,```text,effective = floor(baseDamage × armorRatio / 100),effective = max(effective, 1) when the ratio is non-zero,```,The ratio comes from the referenced damage and armor definitions. It is a,balance value owned by those definitions, not by this resolution overview. A,zero ratio means the channel cannot damage that protection class; a listed,dedicated counter must exist before using zero.,Damage is applied in stable order: protection-condition damage, health damage,,then status accumulation and transitions. If several sources hit on one tick,,sort them by source ID and weapon ID. Clamp health at zero and emit one,destruction event; later same-tick hits do not create duplicate deaths.,V1 resolves a same-tick impact in this order: source/weapon legality, delivery,geometry, domain, protection condition, health, then statuses. Within one,impact, status families apply in this order: incendiary, suppression, EMP,,freeze. Each family sees the state produced by the preceding family but never,re-runs an earlier health calculation. A status applied to a target that dies,in the same impact is recorded in the combat event but has no later effect.,Damage channels have distinct meanings:,- **Health** removes hit points after armor conversion.,- **Protection condition** fills a bounded condition track. At its threshold,,  the target uses the declared exposed ratio until the condition decays or is,  repaired. It never means “negative infinite armor.”,- **Structural** uses the structure column and is normally absent or weak on,  mobile units.,- **Incendiary** creates a bounded hazard or damage-over-time effect; it does,  not stack indefinitely.,- **Suppression** fills a bounded track that reduces weapon performance and,  clears while the unit is not under qualifying fire.,- **EMP** applies electronic disable/degradation and never directly removes,  health.,- **Freeze** fills a threshold track and changes state as described below.\\\"\"   application_order: \"\\\"For ordinary health damage, resolve each eligible damage component separately:,```text,effective = floor(baseDamage × armorRatio / 100),effective = max(effective, 1) when the ratio is non-zero,```,The ratio comes from the referenced damage and armor definitions. It is a,balance value owned by those definitions, not by this resolution overview. A,zero ratio means the channel cannot damage that protection class; a listed,dedicated counter must exist before using zero.,Damage is applied in stable order: protection-condition damage, health damage,,then status accumulation and transitions. If several sources hit on one tick,,sort them by source ID and weapon ID. Clamp health at zero and emit one,destruction event; later same-tick hits do not create duplicate deaths.,V1 resolves a same-tick impact in this order: source/weapon legality, delivery,geometry, domain, protection condition, health, then statuses. Within one,impact, status families apply in this order: incendiary, suppression, EMP,,freeze. Each family sees the state produced by the preceding family but never,re-runs an earlier health calculation. A status applied to a target that dies,in the same impact is recorded in the combat event but has no later effect.,Damage channels have distinct meanings:,- **Health** removes hit points after armor conversion.,- **Protection condition** fills a bounded condition track. At its threshold,,  the target uses the declared exposed ratio until the condition decays or is,  repaired. It never means “negative infinite armor.”,- **Struct