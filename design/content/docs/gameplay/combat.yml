red. It never means “negative infinite armor.”,- **Structural** uses the structure column and is normally absent or weak on,  mobile units.,- **Incendiary** creates a bounded hazard or damage-over-time effect; it does,  not stack indefinitely.,- **Suppression** fills a bounded track that reduces weapon performance and,  clears while the unit is not under qualifying fire.,- **EMP** applies electronic disable/degradation and never directly removes,  health.,- **Freeze** fills a threshold track and changes state as described below.\\\"\"   channels:      - name: \"Health\"       meaning: \"removes hit points after armor conversion.\"     - name: \"Protection condition\"       meaning: \"fills a bounded condition track and exposes the declared ratio at threshold.\"     - name: \"Structural\"       meaning: \"uses the structure column and is normally absent or weak on mobile units.\"     - name: \"Incendiary\"       meaning: \"creates a bounded hazard or damage-over-time effect.\"     - name: \"Suppression\"       meaning: \"fills a bounded track that reduces weapon performance.\"     - name: \"EMP\"       meaning: \"applies electronic disable/degradation and never directly removes health.\"     - name: \"Freeze\"       meaning: \"fills a threshold track and changes state as described.\" health_repair_destruction:    health: \"\\\"Health is an integer resource. A unit is operational while health is above zero;,there is no hidden wounded state unless its card explicitly declares one.,Destroyed units leave the simulation at the end of the damage phase, after,their destruction event, wreck/score hooks, and any objective consequences are,recorded.,Repair restores health, not a destroyed unit. A repair source must have a legal,target, range, line of sight where declared, and uninterrupted channel. Repair,is capped at maximum health, cannot exceed one active repair source per target,in V1, and is interrupted by movement, EMP, death, or a new hostile hit after,the target's repair grace period. Repair does not clear freeze or EMP unless,the repair definition explicitly says it services that track.,V1 exposes no general player repair command or field-repair aura. The only V1,repair is the processor's docked-harvester service owned by the economy and,entity interactions that explicitly declare repair. A hostile hit interrupts a,repair channel on the next tick; a hit on the same tick resolves damage first,,then repair only if the target remains legal and the channel was not interrupted.\\\"\"   destruction: \"\\\"Health is an integer resource. A unit is operational while health is above zero;,there is no hidden wounded state unless its card explicitly declares one.,Destroyed units leave the simulation at the end of the damage phase, after,their destruction event, wreck/score hooks, and any objective consequences are,recorded.,Repair restores health, not a destroyed unit. A repair source must have a legal,target, range, line of sight where declared, and uninterrupted channel. Repair,is capped at maximum health, cannot exceed one active repair source per target,in V1, and is interrupted by movement, EMP, death, or a new hostile hit after,the target's repair grace period. Repair does not clear freeze or EMP unless,the repair definition explicitly says it services that track.,V1 exposes no general player repair command or field-repair aura. The only V1,repair is the processor's docked-harvester service owned by the economy and,entity interactions that explicitly declare repair. A hostile hit interrupts a,repair channel on the next tick; a hit on the same tick resolves damage first,,then repair only if the target remains legal and the channel was not interrupted.\\\"\"   repair: \"\\\"Health is an integer resource. A unit is operational while health is above zero;,there is no hidden wounded state unless its card explicitly declares one.,Destroyed units leave the simulation at the end of the damage phase, after,their destruction event, wreck/score hooks, and any objective consequences are,recorded.,Repair restores health, not a destroyed unit. A repair source must have a legal,target, range, line of sight where declared, and uninterrupted channel. Repair,is capped at maximum health, cannot exceed one active repair source per target,in V1, and is interrupted by movement, EMP, death, or a new hostile hit after,the target's repair grace period. Repair does not clear freeze or EMP unless,the repair definition explicitly says it services that track.,V1 exposes no general player repair command or field-repair aura. The only V1,repair is the processor's docked-harvester service owned by the economy and,entity interactions that explicitly declare repair. A hostile hit interrupts a,repair channel on the next tick; a hit on the same tick resolves damage first,,then repair only if the target remains legal and the channel was not interrupted.\\\"\"   v1_repair: \"\\\"Health is an integer resource. A unit is operational while health is above zero;,there is no hidden wounded state unless its card explicitly declares one.,Destroyed units leave the simulation at the end of the damage phase, after,their destruction event, wreck/score hooks, and any objective consequences are,recorded.,Repair restores health, not a destroyed unit. A repair source must have a legal,target, range, line of sight where declared, and uninterrupted channel. Repair,is capped at maximum health, cannot exceed one active repair source per target,in V1, and is interrupted by movement, EMP, death, or a new hostile hit after,the target's repair grace period. Repair does not clear freeze or EMP unless,the repair definition explicitly says it services that track.,V1 exposes no general player repair command or field-repair aura. The only V1,repair is the processor's docked-harvester service owned by the economy and,entity interactions that explicitly declare repair. A hostile hit interrupts a,repair channel on the next tick; a hit on the same tick resolves damage first,,then repair only if the target remains legal and the channel was not interrupted.\\\"\" status_rules:    general: \"\\\"Statuses are bounded tracks with explicit duration and stacking behavior. A,second source either adds intensity up to the cap or refreshes duration as,declared; it never creates an unbounded loop.,### Suppression,Qualifying suppression adds integer points up to the target's cap. While at or,above the first threshold, the target has reduced attack performance; at the,upper threshold it cannot use skills that require a stable firing state. The,track decays after a short no-fire grace period. Suppression does not stop,movement, remove health, or change armor.,### EMP,EMP applies an electronic disable duration, clamped by target resistance and,the shared maximum. During disable, the target cannot fire electronic weapons,or use skills, and its radar/relay functions are unavailable. A unit may still,move and use explicitly non-electronic weapons.,### Freeze,Freeze is an accumulated track, not damage. It has visible partial and full,thresholds:,- partial freeze slows movement and attack recovery;,- full freeze disables movement, weapons, and skills for the freeze duration;,- a fully frozen ground unit may become conditionally crushable;,- a fully frozen aircraft enters its declared crash/destruction transition;,- freeze decays while not receiving freeze application and can be accelerated,  by the unit's explicit thaw rule.,Freeze cannot be used to assign an arbitrary armor value. The transition is,platform-specific, telegraphed, and counterable through range, interruption,,anti-freeze abilities, or destroying the source.,For V1 ground content, freeze has no global crush or destruction result: a,ground unit becomes immobilized at full track and returns to ordinary state,when its declared duration ends or its explicit thaw effect clears it. Aircraft,crash, low-air exposure, submerged exposure, and freeze-enabled crush remain,future platform-specific transitions and are not implied by the shared status.\\\"\"   suppression: \"\\\"N/A\\\"\"   emp: \"\\\"N/A\\\"\"   freeze:      - \"N/A\"   freeze_platform_rule: \"\\\"N/A\\\"\" movement_attack_interaction:    - \"Movement and attack movement are separate policies. A direct unit can move and\"   - \"fire if its weapon permits it; a standoff unit tries to maintain preferred\"   - \"range; an orbit unit follows a circle around its point or target; a strafe or\"   - \"attack-run unit commits to a path; a deploy-and-fire unit trades movement for\"   - \"range or accuracy; a charge/ram unit commits to contact and enters recovery.\"   - \"The weapon's current attack policy determines whether turning, acceleration,\"   - \"or displacement interrupts windup. A unit never slides while presenting a\"   - \"stationary firing state unless its locomotor explicitly supports it. Collision,\"   - \"crush, and state-transition rules remain those of the shared locomotor and\"   - \"collision designs.\" deterministic_combat_order:    steps:      - \"At each tick, the simulation performs:\"     - \"1. accept and validate commands;\"     - \"2. advance transitions, statuses, and cooldowns;\"     - \"3. update movement and collision reservations;\"     - \"4. acquire/reacquire targets and validate weapon windups;\"     - \"5. launch attacks and advance existing projectiles;\"     - \"6. resolve impacts in `(impactTick, projectileId)` order;\"     - \"7. apply damage, repair, statuses, and threshold transitions;\"     - \"8. destroy defeated entities and publish combat events;\"     - \"9. produce the fog-filtered game view.\"     - \"No system reads presentation state to make a combat decision. Randomness is\"     - \"not required for V1; if later added, it must be seeded, integer-based, and\"     - \"consumed in stable entity order.\"     - \"When a target reaches zero health, it becomes `destroyed-pending` immediately,\"     - \"cannot receive new commands or acquire targets, and is removed in step 8. Its\"     - \"already-launched projectiles continue through impact resolution; its unresolved\"     - \"windups, statuses, sensing, reservations, and repair channels stop. The\"     - \"destruction event is emitted once, with the credited source and weapon chosen\"     - \"by the last health-changing impact in stable order. V1 has no wreck entities or\"     - \"death explosions unless a concrete entity declares a visual-only effect.\"   presentation: \"\\\"At each tick, the simulation performs:,1. accept and validate commands;,2. advance transitions, statuses, and cooldowns;,3. update movement and collision reservations;,4. acquire/reacquire targets and validate weapon windups;,5. launch attacks and advance existing projectiles;,6. resolve impacts in `(impactTick, projectileId)` order;,7. apply damage, repair, statuses, and threshold transitions;,8. destroy defeated entities and publish combat events;,9. produce the fog-filtered game view.,No system reads presentation state to make a combat decision. Randomness is,not required for V1; if later added, it must be seeded, integer-based, and,consumed in stable entity order.,When a target reaches zero health, it becomes `destroyed-pending` immediately,,cannot receive new commands or acquire targets, and is removed in step 8. Its,already-launched projectiles continue through impact resolution; its unresolved,windups, statuses, sensing, reservations, and repair channels stop. The,destruction event is emitted once, with the credited source and weapon chosen,by the last health-changing impact in stable order. V1 has no wreck entities or,death explosions unless a concrete entity declares a visual-only effect.\\\"\"   zero_health: \"\\\"At each tick, the simulation performs:,1. accept and validate commands;,2. advance transitions, statuses, and cooldowns;,3. update movement and collision reservations;,4. acquire/reacquire targets and validate weapon windups;,5. launch attacks and advance existing projectiles;,6. resolve impacts in `(impactTick, projectileId)` order;,7. apply damage, repair, statuses, and threshold transitions;,8. destroy defeated entities and publish combat events;,9. produce the fog-filtered game view.,No system reads presentation state to make a combat decision. Randomness is,not required for V1; if later added, it must be seeded, integer-based, and,consumed in stable entity order.,When a target reaches zero health, it becomes `destroyed-pending` immediately,,cannot receive new commands or acquire targets, and is removed in step 8. Its,already-launched projectiles continue through impact resolution; its unresolved,windups, statuses, sensing, reservations, and repair channels stop. The,destruction event is emitted once, with the credited source and weapon chosen,by the last health-changing impact in stable order. V1 has no wreck entities or,death explosions unless a concrete entity declares a visual-only effect.\\\"\" acceptance_cases:    - \"The minimum combat fixture set is: direct hit, blocked ray, projectile leaving\"   - \"the map, target moving after point-attack launch, area inner/edge/outside\"   - \"falloff, same-tick multi-source damage, zero-ratio armor interaction, EMP\"   - \"weapon disable, suppression threshold/decay, freeze threshold/thaw, repair\"   - \"interruption, hidden-target rejection, and simultaneous HQ destruction versus\"   - \"objective victory. Each fixture records source/target IDs, tick, event order,\"   - \"health/status result, and player-visible feedback.\" role_spine:    - \"The initial vertical slice uses four roles: scout, infantry, tank, and\"   - \"anti-tank. Their concrete values belong to the selected V1 unit cards under\"   - \"[factions](../factions/README.md); this section records only composition\"   - \"rationale.\"   - \"They are deliberately asymmetric: scouts provide information and harassment,\"   - \"infantry hold space, tanks anchor and push, and anti-tank units punish armor\"   - \"while paying in durability or mobility. Exact unit cards should reference a\"   - \"role profile and only override a value when the override is the unit's stated\"   - \"player decision. The shared role vocabulary is described in\"   - \"[units](../units/README.md).\""
