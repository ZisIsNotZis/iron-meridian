ownership: 
  - "kind: \"combat_interaction_contract\" document_id: \"gameplay.combat_interactions\" title: \"Combat Interaction Matrix\" source_document: \"design/combat/interactions.md\" ownership:    - \"# Combat Interaction Matrix\"   - \"This document owns the order and meaning of interactions between a source's\"   - \"delivery domain, a target's current targetability domain, armor, damage\"   - \"channels, and statuses. Concrete ratios, thresholds, resistances, and platform\"   - \"exceptions belong to the referenced armor, damage, status, weapon, or entity\"   - \"objects. This file must not become a balance table.\" resolution_pipeline:    flow: \"\\\"```text,source state → target state → sensing/legality → delivery geometry,→ domain permission → armor interaction → health/status channels,→ status resistance/transition → destruction/capability change → events,```,The pipeline is ordered. A later stage cannot repair an earlier failure:,1. The source must be alive, operational enough to use the weapon, and in a,   state that permits its delivery model.,2. The target must be alive and currently targetable in the weapon's declared,   domain. Detection and lock requirements are checked here.,3. Delivery geometry resolves against the stored impact point or declared,   tracking policy. A miss applies no health or status effect unless the weapon,   explicitly declares an area or environment effect.,4. Domain permission filters the weapon's allowed target domains. Armor never,   makes an illegal domain legal. A surface weapon cannot hit submerged targets,   merely because both use heavy armor.,5. Each declared health channel resolves through the target's armor profile.,   Each secondary channel resolves through its own status/condition profile;,   secondary channels do not inherit health damage unless explicitly linked.,6. Resistance, immunity, stacking, decay, and threshold transitions are owned,   by the receiving status or target object. A status transition may change,   targetability, locomotion, or crushability only when it declares that result.,7. Health reaching zero resolves destruction in the architecture destruction,   phase. A status transition that destroys an aircraft or platform is a,   declared transition outcome, not ordinary zero-health damage.\\\"\"   stages:      - \"```text\"     - \"source state → target state → sensing/legality → delivery geometry\"     - \"→ domain permission → armor interaction → health/status channels\"     - \"→ status resistance/transition → destruction/capability change → events\"     - \"```\"     - \"The pipeline is ordered. A later stage cannot repair an earlier failure:\"     - \"1. The source must be alive, operational enough to use the weapon, and in a\"     - \"   state that permits its delivery model.\"     - \"2. The target must be alive and currently targetable in the weapon's declared\"     - \"   domain. Detection and lock requirements are checked here.\"     - \"3. Delivery geometry resolves against the stored impact point or declared\"     - \"   tracking policy. A miss applies no health or status effect unless the weapon\"     - \"   explicitly declares an area or environment effect.\"     - \"4. Domain permission filters the weapon's allowed target domains. Armor never\"     - \"   makes an illegal domain legal. A surface weapon cannot hit submerged targets\"     - \"   merely because both use heavy armor.\"     - \"5. Each declared health channel resolves through the target's armor profile.\"     - \"   Each secondary channel resolves through its own status/condition profile;\"     - \"   secondary channels do not inherit health damage unless explicitly linked.\"     - \"6. Resistance, immunity, stacking, decay, and threshold transitions are owned\"     - \"   by the receiving status or target object. A status transition may change\"     - \"   targetability, locomotion, or crushability only when it declares that result.\"     - \"7. Health reaching zero resolves destruction in the architecture destruction\"     - \"   phase. A status transition that destroys an aircraft or platform is a\"     - \"   declared transition outcome, not ordinary zero-health damage.\" hit_result_closure:    - \"For V1, a legal hit has exactly one health resolution and zero or more declared\"   - \"secondary channels. Invalid domain, detection, range, arc, or blocker checks\"   - \"are no-op results with a reason; they never fall through to a weaker damage\"   - \"calculation. Health is clamped to `[0, maxHealth]`, condition/status tracks are\"   - \"clamped to their owning caps, and integer rounding occurs at the channel's\"   - \"documented conversion step.\" domain_matrix:    - target_state: \"Ground\"     ground: \"legal if weapon permits\"     low_air: \"illegal unless weapon permits low-air\"     high_air: \"illegal by default\"     naval_surface: \"illegal\"     submerged: \"illegal\"     structure: \"illegal\"   - target_state: \"Low-air\"     ground: \"legal only for weapons declaring low-air/ground interception\"     low_air: \"legal\"     high_air: \"legal only if declared\"     naval_surface: \"illegal by default\"     submerged: \"illegal\"     structure: \"illegal\"   - target_state: \"High-air\"     ground: \"illegal by default\"     low_air: \"illegal by default\"     high_air: \"legal if weapon permits high-air\"     naval_surface: \"illegal\"     submerged: \"illegal\"     structure: \"illegal\"   - target_state: \"Naval-surface\"     ground: \"illegal by default\"     low_air: \"illegal by default\"     high_air: \"legal only for declared air-to-naval weapons\"     naval_surface: \"legal\"     submerged: \"legal only for declared depth/transition weapons\"     structure: \"illegal\"   - target_state: \"Submerged\"     ground: \"illegal\"     low_air: \"illegal\"     high_air: \"illegal by default\"     naval_surface: \"illegal by default\"     submerged: \"legal only for declared submerged weapons\"     structure: \"illegal\"   - target_state: \"Structure\"     ground: \"legal only for anti-structure declarations\"     low_air: \"legal only for declared strike weapons\"     high_air: \"legal only for declared strike weapons\"     naval_surface: \"legal only for declared naval/shore weapons\"     submerged: \"illegal by default\"     structure: \"legal\" armor_and_damage:    - \"Armor is selected from the target's current protection profile. Damage selects\"   - \"its declared channel/profile, then asks that profile for the interaction with\"   - \"the armor. The result is a health amount, condition amount, or both only when\"   - \"the damage object explicitly declares both. No universal penetration roll,\"   - \"critical hit, facing bonus, or minimum-damage rule is implied here.\"   - \"Damage profiles may declare:\"   - \"- permitted target domains;\"   - \"- armor interaction references;\"   - \"- health conversion;\"   - \"- secondary status or condition application;\"   - \"- delivery and blocker requirements;\"   - \"- friendly-fire and area behavior;\"   - \"- attribution and experience behavior.\"   - \"The same damage family may be used by several weapons, but a weapon-specific\"   - \"modifier belongs to that weapon object. A target-specific vulnerability belongs\"   - \"to the target or status object. Neither is copied into this matrix.\" status_and_domain_transitions:    - \"Statuses are applied only after a legal hit and are processed in deterministic\"   - \"status-family order declared by the status collection. A status can:\"   - \"- modify movement, firing, sensing, or skill availability;\"   - \"- add or remove a targetability domain;\"   - \"- make a target conditionally crushable;\"   - \"- begin a platform transition;\"   - \"- destroy a platform as an explicit terminal outcome.\"   - \"Status effects never silently replace armor, grant a new weapon domain, or\"   - \"stack indefinitely. If two effects alter the same capability, the receiving\"   - \"capability declares precedence; otherwise the strongest restriction wins for\"   - \"that capability and the event records both sources. Health damage and status\"   - \"application from one impact are separate results, so immunity to a status does\"   - \"not imply immunity to its health channel.\" interaction_examples:    - \"- A rifle against heavy armor is a legal domain attack whose damage profile\"   - \"  supplies the poor armor result; it is not rejected as an invalid target.\"   - \"- A freeze weapon against an aircraft is legal only if its damage/status object\"   - \"  permits that air domain. Full freeze may then invoke the aircraft's declared\"   - \"  crash transition; it does not globally apply negative armor.\"   - \"- A ground weapon against low-air is legal only when the weapon explicitly\"   - \"  declares low-air interception. The target's light armor alone is insufficient.\"   - \"- A torpedo against a submerged vessel requires submerged targetability,\"   - \"  detection, and a declared depth delivery model; naval armor alone is not\"   - \"  enough.\"   - \"- EMP can disable electronic weapons after a hit, but cannot remove physical\"   - \"  armor or invalidate an already-resolved health result.\" status_precedence:    - \"Status families are processed in the fixed order `incendiary → suppression →\"   - \"EMP → freeze`, followed by declared platform transitions. Same-family sources\"   - \"are processed by source ID, then weapon ID. A later status can observe a\"   - \"capability disabled by an earlier status, but cannot retroactively cancel its\"   - \"health or condition result. A status whose target is already\"   - \"`destroyed-pending` records no transition.\" authoring_validation:    - \"Every weapon reference must resolve to a damage profile and declare allowed\"   - \"domains. Every entity must declare its current armor and targetability profile\"   - \"for each platform state. Every status transition must name its destination\"   - \"state, interruption, counter, and destruction/recovery behavior. The loader\"   - \"rejects missing domains, contradictory transition outcomes, cycles that can\"   - \"reapply a status without a new source event, and armor/damage references that\"   - \"do not exist.\"   - \"V1 platform cards must explicitly declare the current state used for domain,\"   - \"armor, collision, and sensing. Ground infantry, vehicles, and structures may\"   - \"use only ground/structure domains in the slice; air, naval, submerged,\"   - \"transport, and transition outcomes are future-content declarations and do not\"   - \"activate those systems in V1. A card with no weapon declares\"   - \"`weapons: embedded-in-entity-card` plus a body-level `None` weapon entry, so\"   - \"absence is readable rather than inferred from a missing table row.\" v1_restrictions:    - \"Every weapon reference must resolve to a damage profile and declare allowed\"   - \"domains. Every entity must declare its current armor and targetability profile\"   - \"for each platform state. Every status transition must name its destination\"   - \"state, interruption, counter, and destruction/recovery behavior. The loader\"   - \"rejects missing domains, contradictory transition outcomes, cycles that can\"   - \"reapply a status without a new source event, and armor/damage references that\"   - \"do not exist.\"   - \"V1 platform cards must explicitly declare the current state used for domain,\"   - \"armor, collision, and sensing. Ground infantry, vehicles, and structures may\"   - \"use only ground/structure domains in the slice; air, naval, submerged,\"   - \"transport, and transition outcomes are future-content declarations and do not\"   - \"activate those systems in V1. A card with no weapon declares\"   - \"`weapons: embedded-in-entity-card` plus a body-level `None` weapon entry, so\"   - \"absence is readable rather than inferred from a missing table row.\""
