ownership: 
  - "kind: \"construction_contract\" document_id: \"gameplay.construction\" title: \"Construction Design\" source_document: \"design/construction/README.md\" ownership:    - \"# Construction Design\"   - \"Construction is a deliberate exposure: the player spends banked resource, commits a vulnerable builder, and gains a stronger position if the placement and timing survive. V1 provides constrained free placement on a logical build grid. It is not a wall-building sandbox.\" v1_building_set:    - \"The first slice uses HQ, Processor, Assembly, and the constructible Infantry\"   - \"Center from the selected V1 roster in [buildings](../buildings/README.md).\"   - \"Repair bays and point defenses are excluded from V1; their future cards do not\"   - \"change these placement rules.\"   - \"Costs, times, footprints, hit points, weapons, and queue limits are owned by\"   - \"individual building definitions. This document defines construction rules, not\"   - \"building data.\"   - \"The HQ, processor, Assembly, and Infantry Center are the complete V1 base\"   - \"building set. The HQ is the only loss-condition anchor, the Processor is the\"   - \"only economy service, and each operational producer owns one FIFO queue: the\"   - \"Assembly produces vehicles and the Infantry Center produces infantry. No V1\"   - \"building has a defensive weapon or general repair aura.\" build_lifecycle:    builder: \"\\\"The construction vehicle is the only V1 builder. It is separate from the harvester and cannot harvest, produce, or attack.,```,builder available → placement preview → blueprint → building → completed,                                             ↓,                                      cancel / destroy,```,1. The player selects the construction vehicle and moves a preview under the cursor.,2. The preview snaps to the logical map grid. Rotation is in `90°` increments; a rotated rectangular footprint is revalidated rather than visually assumed valid.,3. A valid placement command reserves the full cost, creates a blueprint, and,   assigns the builder. The builder travels to the blueprint and constructs it,   at the progress rate declared by the referenced production profile. Build,   time remains building-owned data, not an accidental render-time delay.,4. One builder constructs one blueprint at a time. If it moves, is stunned, or is destroyed, construction pauses. A completed building is independent of its builder.,5. The player may cancel an unfinished blueprint. It disappears and refunds `75%` of its reserved cost, rounded down. Enemy fire destroying it gives no refund. A completed building must be destroyed or sold by a future explicit rule; V1 has no sell command.,Construction begins when the assigned builder reaches the blueprint's declared,interaction cell. The builder must remain in that cell and operational for,progress to advance. Leaving, being stunned/EMP-disabled, or losing the builder,pauses progress without resetting it. A second builder cannot take over in V1;,the blueprint records its assigned builder and becomes buildable again only if,that builder returns. The player may cancel a paused blueprint normally.,Blueprints are valid targets and may be damaged before completion. They do not,repair themselves, block the builder's interaction cell, grant production,,fire weapons, or provide sensing beyond their visible footprint. Enemy sight of,a blueprint follows ordinary sensing; placement does not reveal the builder,or the completed design through fog. Construction under fire is allowed, but,the builder's own movement, disable, and destruction rules still pause it.,The HQ starts completed and does not require a construction vehicle. If the HQ is destroyed, the player loses immediately; rebuilding an HQ is not a V1 recovery mechanic.\\\"\"   flow: \"\\\"The construction vehicle is the only V1 builder. It is separate from the harvester and cannot harvest, produce, or attack.,```,builder available → placement preview → blueprint → building → completed,                                             ↓,                                      cancel / destroy,```,1. The player selects the construction vehicle and moves a preview under the cursor.,2. The preview snaps to the logical map grid. Rotation is in `90°` increments; a rotated rectangular footprint is revalidated rather than visually assumed valid.,3. A valid placement command reserves the full cost, creates a blueprint, and,   assigns the builder. The builder travels to the blueprint and constructs it,   at the progress rate declared by the referenced production profile. Build,   time remains building-owned data, not an accidental render-time delay.,4. One builder constructs one blueprint at a time. If it moves, is stunned, or is destroyed, construction pauses. A completed building is independent of its builder.,5. The player may cancel an unfinished blueprint. It disappears and refunds `75%` of its reserved cost, rounded down. Enemy fire destroying it gives no refund. A completed building must be destroyed or sold by a future explicit rule; V1 has no sell command.,Construction begins when the assigned builder reaches the blueprint's declared,interaction cell. The builder must remain in that cell and operational for,progress to advance. Leaving, being stunned/EMP-disabled, or losing the builder,pauses progress without resetting it. A second builder cannot take over in V1;,the blueprint records its assigned builder and becomes buildable again only if,that builder returns. The player may cancel a paused blueprint normally.,Blueprints are valid targets and may be damaged before completion. They do not,repair themselves, block the builder's interaction cell, grant production,,fire weapons, or provide sensing beyond their visible footprint. Enemy sight of,a blueprint follows ordinary sensing; placement does not reveal the builder,or the completed design through fog. Construction under fire is allowed, but,the builder's own movement, disable, and destruction rules still pause it.,The HQ starts completed and does not require a construction vehicle. If the HQ is destroyed, the player loses immediately; rebuilding an HQ is not a V1 recovery mechanic.\\\"\"   steps:      - \"The construction vehicle is the only V1 builder. It is separate from the harvester and cannot harvest, produce, or attack.\"     - \"```\"     - \"builder available → placement preview → blueprint → building → completed\"     - \"                                             ↓\"     - \"                                      cancel / destroy\"     - \"```\"     - \"1. The player selects the construction vehicle and moves a preview under the cursor.\"     - \"2. The preview snaps to the logical map grid. Rotation is in `90°` increments; a rotated rectangular footprint is revalidated rather than visually assumed valid.\"     - \"3. A valid placement command reserves the full cost, creates a blueprint, and\"     - \"   assigns the builder. The builder travels to the blueprint and constructs it\"     - \"   at the progress rate declared by the referenced production profile. Build\"     - \"   time remains building-owned data, not an accidental render-time delay.\"     - \"4. One builder constructs one blueprint at a time. If it moves, is stunned, or is destroyed, construction pauses. A completed building is independent of its builder.\"     - \"5. The player may cancel an unfinished blueprint. It disappears and refunds `75%` of its reserved cost, rounded down. Enemy fire destroying it gives no refund. A completed building must be destroyed or sold by a future explicit rule; V1 has no sell command.\"     - \"Construction begins when the assigned builder reaches the blueprint's declared\"     - \"interaction cell. The builder must remain in that cell and operational for\"     - \"progress to advance. Leaving, being stunned/EMP-disabled, or losing the builder\"     - \"pauses progress without resetting it. A second builder cannot take over in V1;\"     - \"the blueprint records its assigned builder and becomes buildable again only if\"     - \"that builder returns. The player may cancel a paused blueprint normally.\"     - \"Blueprints are valid targets and may be damaged before completion. They do not\"     - \"repair themselves, block the builder's interaction cell, grant production,\"     - \"fire weapons, or provide sensing beyond their visible footprint. Enemy sight of\"     - \"a blueprint follows ordinary sensing; placement does not reveal the builder\"     - \"or the completed design through fog. Construction under fire is allowed, but\"     - \"the builder's own movement, disable, and destruction rules still pause it.\"     - \"The HQ starts completed and does not require a construction vehicle. If the HQ is destroyed, the player loses immediately; rebuilding an HQ is not a V1 recovery mechanic.\"   channel_rules:      - \"The construction vehicle is the only V1 builder. It is separate from the harvester and cannot harvest, produce, or attack.\"     - \"```\"     - \"builder available → placement preview → blueprint → building → completed\"     - \"                                             ↓\"     - \"                                      cancel / destroy\"     - \"```\"     - \"1. The player selects the construction vehicle and moves a preview under the cursor.\"     - \"2. The preview snaps to the logical map grid. Rotation is in `90°` increments; a rotated rectangular footprint is revalidated rather than visually assumed valid.\"     - \"3. A valid placement command reserves the full cost, creates a blueprint, and\"     - \"   assigns the builder. The builder travels to the blueprint and constructs it\"     - \"   at the progress rate declared by the referenced production profile. Build\"     - \"   time remains building-owned data, not an accidental render-time delay.\"     - \"4. One builder constructs one blueprint at a time. If it moves, is stunned, or is destroyed, construction pauses. A completed building is independent of its builder.\"     - \"5. The player may cancel an unfinished blueprint. It disappears and refunds `75%` of its reserved cost, rounded down. Enemy fire destroying it gives no refund. A completed building must be destroyed or sold by a future explicit rule; V1 has no sell command.\"     - \"Construction begins when the assigned builder reaches the blueprint's declared\"     - \"interaction cell. The builder must remain in that cell and operational for\"     - \"progress to advance. Leaving, being stunned/EMP-disabled, or losing the builder\"     - \"pauses progress without resetting it. A second builder cannot take over in V1;\"     - \"the blueprint records its assigned builder and becomes buildable again only if\"     - \"that builder returns. The player may cancel a paused blueprint normally.\"     - \"Blueprints are valid targets and may be damaged before completion. They do not\"     - \"repair themselves, block the builder's interaction cell, grant production,\"     - \"fire weapons, or provide sensing beyond their visible footprint. Enemy sight of\"     - \"a blueprint follows ordinary sensing; placement does not reveal the builder\"     - \"or the completed design through fog. Construction under fire is allowed, but\"     - \"the builder's own movement, disable, and destruction rules still pause it.\"     - \"The HQ starts completed and does not require a construction vehicle. If the HQ is destroyed, the player loses immediately; rebuilding an HQ is not a V1 recovery mechanic.\"   blueprint_rules:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\"   hq_rule: \"\\\"The construction vehicle is the only V1 builder. It is separate from the harvester and cannot harvest, produce, or attack.,```,builder available → placement preview → blueprint → building → completed,                                             ↓,                                      cancel / destroy,```,1. The player selects the construction vehicle and moves a preview under the cursor.,2. The preview snaps to the logical map grid. Rotation is in `90°` increments; a rotated rectangular footprint is revalidated rather than visually assumed valid.,3. A valid placement command reserves the full cost, creates a blueprint, and,   assigns the builder. The builder travels to the blueprint and constructs it,   at the progress rate declared by the referenced production profile. Build,   time remains building-owned data, not an accidental render-time delay.,4. One builder constructs one blueprint at a time. If it moves, is stunned, or is destroyed, construction pauses. A completed building is independent of its builder.,5. The player may cancel an unfinished blueprint. It disappears and refunds `75%` of its reserved cost, rounded down. Enemy fire destroying it gives no refund. A completed building must be destroyed or sold by a future explicit rule; V1 has no sell command.,Construction begins when the assigned builder reaches the blueprint's declared,interaction cell. The builder must remain in that cell and operational for,progress to advance. Leaving, being stunned/EMP-disabled, or losing the builder,pauses progress without resetting it. A second builder cannot take over in V1;,the blueprint records its assigned builder and becomes buildable again only if,that builder returns. The player may cancel a paused blueprint normally.,Blueprints are valid targets and may be damaged before completion. They do not,repair themselves, block the builder's interaction cell, grant production,,fire weapons, or provide sensing beyond their visible footprint. Enemy sight of,a blueprint follows ordinary sensing; placement does not reveal the builder,or the completed design through fog. Construction under fire is allowed, but,the builder's own movement, disable, and destruction rules still pause it.,The HQ starts completed and does not require a construction vehicle. If the HQ is destroyed, the player loses immediately; rebuilding an HQ is not a V1 recovery mechanic.\\\"\" placement_validation:    predicates:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\"   anchors:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\"   radius_measurement:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\"   conflict_order:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\"   geometry:      - \"The authoritative validator evaluates the whole snapped footprint at command execution time. A client preview is advisory only. Placement succeeds only when all conditions hold:\"     - \"- every footprint cell is inside the playable map and on the map's `buildable` layer;\"     - \"- no footprint cell overlaps a unit, existing building, blueprint, resource node, objective exclusion zone, or map `no-build` marker;\"     - \"- the footprint is within the declared radius of an eligible HQ/anchor or the\"     - \"  active construction vehicle. These are additive anchors: a builder may\"     - \"  extend a base only while it is physically present at the new site;\"     - \"- the building's required facing is legal. V1 accepts all four cardinal rotations unless a building definition explicitly restricts one;\"     - \"- the footprint does not occupy a primary route or disconnect the map's authored base-to-objective lanes. V1 maps mark these lanes as non-buildable, so validation remains a simple deterministic layer check;\"     - \"- the player's bank contains the full unreserved cost and the builder is available.\"     - \"The builder radius is measured from the builder's collision center to the\"     - \"nearest point of the blueprint footprint. The HQ/anchor radius is measured from\"     - \"the anchor footprint edge to the nearest point of the blueprint footprint. A\"     - \"placement needs one valid anchor, not both: an HQ/anchor authorizes its radius,\"     - \"while an active builder authorizes its own radius. The builder must be able to\"     - \"reach the blueprint's interaction cell under ordinary movement rules; otherwise\"     - \"the command is rejected as `builder path blocked`.\"     - \"Placement conflicts at one tick are resolved by accepted command order, then\"     - \"player ID, then command sequence. Only the winner reserves its footprint and\"     - \"cost. The losing command is a deterministic no-op with `space occupied`; it\"     - \"does not consume resources or create a phantom blueprint. A footprint is\"     - \"blocked from the instant its placement command is accepted. Completion uses\"     - \"the blueprint's original footprint and facing.\"     - \"Buildings may touch each other. There is no hidden one-cell gap rule, adjacency bonus, power radius, or automatic wall connection. The footprint itself is the occupied collision area; construction clearance and unit pathing use the same authoritative geometry.\" production_interaction:    - \"Each V1 production building has one FIFO queue. The Assembly accepts vehicle\"   - \"production and the Infantry Center accepts infantry production only if it is\"   - \"complete, affordable, and operational. Resource is reserved at queue time;\"   - \"the resulting unit appears at the producer's valid exit point when its build\"   - \"timer completes. If all exits are blocked, production pauses at completion\"   - \"rather than spawning inside another entity.\"   - \"The construction vehicle does not share the Assembly queue. It is a strategic builder asset and its replacement, if enabled by the V1 roster, is an explicit production item with its own cost and time.\"   - \"When a building is completed, the builder is released on the next tick and the\"   - \"building becomes operational in the same completion event. If a construction\"   - \"vehicle is destroyed, its blueprint remains paused and may be cancelled by its\"   - \"owner; it is not automatically reassigned. If a blueprint is destroyed, its\"   - \"reserved cost is lost and its footprint is released at the destruction phase.\" recovery_counterplay:    - \"Construction creates visible counterplay:\"   - \"- scouting reveals the builder and blueprint; attacking either delays or removes the investment;\"   - \"- the player can cancel and recover most, but not all, of a threatened blueprint;\"   - \"- a forward building trades safety for shorter travel and stronger local control;\"   - \"- destroying the processor, Assembly, or builder removes a capability without deleting banked resource;\"   - \"- a player with no builder can still fight and harvest, but cannot expand until a replacement is produced or the mode supplies one.\"   - \"No placement command teleports a building, repairs a destroyed structure, or bypasses blocked terrain. Invalid commands are deterministic no-ops with a UI reason.\"   - \"V1 construction acceptance cases are: legal placement at the edge of HQ\"   - \"radius, legal placement at the edge of builder radius, blocked builder path,\"   - \"blueprint under fire, builder interruption and return, builder destruction,\"   - \"simultaneous placement, cancellation refund rounding, blocked footprint,\"   - \"completed exit obstruction, and HQ destruction during construction. Each case\"   - \"must verify footprint occupancy, bank reservation, builder assignment, progress,\"   - \"and the resulting player-facing event.\" acceptance_cases:    - \"Construction creates visible counterplay:\"   - \"- scouting reveals the builder and blueprint; attacking either delays or removes the investment;\"   - \"- the player can cancel and recover most, but not all, of a threatened blueprint;\"   - \"- a forward building trades safety for shorter travel and stronger local control;\"   - \"- destroying the processor, Assembly, or builder removes a capability without deleting banked resource;\"   - \"- a player with no builder can still fight and harvest, but cannot expand until a replacement is produced or the mode supplies one.\"   - \"No placement command teleports a building, repairs a destroyed structure, or bypasses blocked terrain. Invalid commands are deterministic no-ops with a UI reason.\"   - \"V1 construction acceptance cases are: legal placement at the edge of HQ\"   - \"radius, legal placement at the edge of builder radius, blocked builder path,\"   - \"blueprint under fire, builder interruption and return, builder destruction,\"   - \"simultaneous placement, cancellation refund rounding, blocked footprint,\"   - \"completed exit obstruction, and HQ destruction during construction. Each case\"   - \"must verify footprint occupancy, bank reservation, builder assignment, progress,\"   - \"and the resulting player-facing event.\" deferred:    - \"V1 defers walls, fences, gates, automatic base footprints, unrestricted placement, building adjacency bonuses, tech prerequisites, power grids, construction crews, parallel builders, multiple queues, build acceleration, selling, refunds for destroyed buildings, mobile deployment states, terrain deformation, bridges, and faction-specific construction exceptions. These belong in a later construction extension only if they improve decisions enough to justify their maintenance cost.\""
