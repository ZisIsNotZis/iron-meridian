ownership: 
  - "kind: \"interaction_contract\" document_id: \"gameplay.interactions\" title: \"World Interactions\" source_document: \"design/interactions/README.md\" ownership:    - \"# World Interactions\"   - \"This document owns the shared lifecycle for entities interacting with buildings,\"   - \"objectives, wrecks, resource infrastructure, and neutral map objects. Concrete\"   - \"capture rates, repair rates, capacities, costs, and eligibility belong to the\"   - \"object performing or receiving the interaction.\" common_contract:    - \"Every interaction has an actor, target, eligibility predicate, range or\"   - \"occupancy rule, setup/channel/recovery lifecycle, interruption causes, result,\"   - \"and player-facing failure reason. Validation occurs when the command is\"   - \"accepted and again when the effect resolves. Invalid or stale interactions are\"   - \"deterministic no-ops.\"   - \"The target remains authoritative for ownership, health, status, production,\"   - \"and capability. An interaction does not grant hidden information or bypass\"   - \"targetability. A target can accept at most the number of simultaneous channels\"   - \"declared by its object; otherwise the new actor receives `target-busy`.\" capture:    - \"Capture is an ownership transition, not damage. The target declares whether it\"   - \"is capturable, by which actor capabilities, from which domains, and what state\"   - \"it enters while captured. The actor must occupy the declared interaction area,\"   - \"remain alive and eligible, and maintain the channel. Movement, interruption,\"   - \"loss of eligibility, target destruction, or target leaving range cancels the\"   - \"channel without applying ownership.\"   - \"Objectives use the state machine in [objectives](../objectives/README.md).\"   - \"Buildings, neutral structures, and campaign objects may use a separate\"   - \"object-owned capture policy; none is inferred from the word “capture.”\"   - \"Capture does not automatically reveal the map, refund the former owner, or\"   - \"restore destroyed capabilities. Ownership change emits one ordered event and\"   - \"re-evaluates production, sensing, garrison, and victory eligibility on the next\"   - \"simulation phase.\" garrison_evacuate:    - \"A garrisonable building declares entry domain, capacity, accepted platforms,\"   - \"boarding range, setup time, fire permissions, sensing permissions, damage\"   - \"sharing, and exit cells. A unit is removed from world collision while inside\"   - \"but remains alive, selectable through the building, and subject to building\"   - \"destruction rules. The building does not silently inherit the unit's armor or\"   - \"weapons.\"   - \"Entry is rejected when the building is full, hostile, disabled, destroyed,\"   - \"outside its interaction range, or has no legal exit/entry cell. Evacuation is\"   - \"an explicit order or object-owned reaction. If the building is destroyed, its\"   - \"contents use the building's declared emergency outcome: forced evacuation,\"   - \"casualties, or destruction. No universal free survival rule exists.\" repair_heal:    - \"Repair restores a declared condition track; healing restores a declared health\"   - \"track. A provider declares target domains, maximum channels, range, rate, setup,\"   - \"and interruption. Repair cannot revive a destroyed entity or remove EMP,\"   - \"freeze, suppression, or other statuses unless the provider or status explicitly\"   - \"allows it. Hostile damage may interrupt a channel according to the provider's\"   - \"definition. A repair target retains ownership and queued orders.\" reclaim_salvage:    - \"A wreck, disabled unit, abandoned building, or resource object declares whether\"   - \"it is reclaimable, by whom, at what channel duration, and what result occurs.\"   - \"Reclaim may return resource, remove a blocker, restore a unit, or grant\"   - \"information, but it never creates an unspecified universal reward. The object\"   - \"is locked against competing reclaim channels, and interruption leaves it in its\"   - \"prior state unless its object definition says partial progress persists.\" neutral_objects:    - \"Neutral entities have an owner state of `neutral`, are visible only through the\"   - \"normal sensing rules, and cannot be commanded as allies. Their behavior,\"   - \"capture eligibility, attack permissions, and destruction result are declared by\"   - \"the neutral object or map scenario. Neutral does not mean invulnerable,\"   - \"free-to-capture, or automatically hostile.\" ordering:    - \"The authoritative order is: validate command → reserve actor/target → advance\"   - \"setup/channel → resolve result → apply ownership/health/capability changes →\"   - \"release reservation → emit event. Destruction and victory resolution retain the\"   - \"system order in [architecture](../architecture/README.md). A target destroyed\"   - \"before resolution causes cancellation unless its interaction explicitly resolves\"   - \"on destruction.\" cross_system_player_facing:    - \"Interactions never bypass construction, sensing, targetability, or command\"   - \"ownership. A channel is exposed only when its actor and target are in the\"   - \"permitted observation; otherwise rejection must not leak that a hidden target\"   - \"exists. Stable command order decides competing reservations. The UI\"   - \"distinguishes `target-busy`, `out-of-range`, `ineligible`,\"   - \"`destination-blocked`, `interrupted`, and `completed`.\"   - \"V1 uses the objective capture interaction only. Near-term adds one explicit\"   - \"garrison or repair interaction before broad neutral simulation. Far-vision\"   - \"features such as prisoners, towing, salvage crafting, and neutral AI remain\"   - \"object-owned extensions.\" deferred:    - \"Nested garrisons, shared team capture, prisoners, repair queues, towing chains,\"   - \"salvage crafting, neutral AI factions, and partial building capture are\"   - \"deferred until an object definition needs them.\""
