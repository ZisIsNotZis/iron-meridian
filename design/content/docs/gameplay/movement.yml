ownership: 
  - "kind: \"movement_contract\" document_id: \"gameplay.movement\" title: \"Movement and Group Control\" source_document: \"design/movement/README.md\" ownership:    - \"# Movement and Group Control\"   - \"This document owns shared movement-system behavior: path requests, formations,\"   - \"facing, separation, order propagation, and movement failure. Concrete speeds,\"   - \"turn rates, footprints, locomotors, and attack-movement policies belong to the\"   - \"referenced unit and locomotor objects. The system never invents a value when an\"   - \"object omits one; omission is a schema error for a required field.\" movement_pipeline:    flow: \"\\\"```text,command → group order → goal slots → path request → reservation/separation,         → locomotor advance → facing/state update → result event,```,Pathfinding is authoritative and deterministic. A request uses the unit's,current locomotor domain, footprint, clearance, terrain permissions, blockers,,and destination validity. The path result is a corridor of map cells, not a,promise that the unit will reach the destination. Dynamic blockers are handled,by local reservation and bounded replanning; a unit reports `blocked` after its,replan budget is exhausted rather than teleporting, phasing, or silently,changing locomotor.,The path tie-break order is total and stable: path cost, turn cost, cell,coordinate, then entity ID. Terrain cost, diagonal policy, map edge policy, and,replan budget are map or locomotor-owned data. The generic system defines only,the ordering and failure states.\\\"\"   rules:      - \"```text\"     - \"command → group order → goal slots → path request → reservation/separation\"     - \"         → locomotor advance → facing/state update → result event\"     - \"```\"     - \"Pathfinding is authoritative and deterministic. A request uses the unit's\"     - \"current locomotor domain, footprint, clearance, terrain permissions, blockers,\"     - \"and destination validity. The path result is a corridor of map cells, not a\"     - \"promise that the unit will reach the destination. Dynamic blockers are handled\"     - \"by local reservation and bounded replanning; a unit reports `blocked` after its\"     - \"replan budget is exhausted rather than teleporting, phasing, or silently\"     - \"changing locomotor.\"     - \"The path tie-break order is total and stable: path cost, turn cost, cell\"     - \"coordinate, then entity ID. Terrain cost, diagonal policy, map edge policy, and\"     - \"replan budget are map or locomotor-owned data. The generic system defines only\"     - \"the ordering and failure states.\"   tie_break: \"\\\"```text,command → group order → goal slots → path request → reservation/separation,         → locomotor advance → facing/state update → result event,```,Pathfinding is authoritative and deterministic. A request uses the unit's,current locomotor domain, footprint, clearance, terrain permissions, blockers,,and destination validity. The path result is a corridor of map cells, not a,promise that the unit will reach the destination. Dynamic blockers are handled,by local reservation and bounded replanning; a unit reports `blocked` after its,replan budget is exhausted rather than teleporting, phasing, or silently,changing locomotor.,The path tie-break order is total and stable: path cost, turn cost, cell,coordinate, then entity ID. Terrain cost, diagonal policy, map edge policy, and,replan budget are map or locomotor-owned data. The generic system defines only,the ordering and failure states.\\\"\"   ownership: \"\\\"# Movement and Group Control,This document owns shared movement-system behavior: path requests, formations,,facing, separation, order propagation, and movement failure. Concrete speeds,,turn rates, footprints, locomotors, and attack-movement policies belong to the,referenced unit and locomotor objects. The system never invents a value when an,object omits one; omission is a schema error for a required field.\\\"\" pathfinding:    - \"V1 uses deterministic grid A* over logical map cells. A candidate cell is legal\"   - \"only when every cell covered by the unit's footprint is legal for its current\"   - \"locomotor. Units may move in eight directions, but diagonal movement may not\"   - \"cut a corner: both orthogonal neighboring cells must be legal first. Cardinal\"   - \"and diagonal steps cost `1,000` and `1,414` distance units. The heuristic is\"   - \"the matching octile distance. Equal paths resolve by total step cost, then turn\"   - \"cost, then `(y, x)`, then entity ID.\"   - \"Clear ground costs `1,000` per cardinal step; traversable cover costs `1,200`\"   - \"for V1 ground locomotors. A locomotor may replace these costs through its\"   - \"declared terrain profile. Route, border, and `no-build` flags do not themselves\"   - \"block movement; only the map's movement layer and locomotor permissions do.\"   - \"Occupied footprints are dynamic blockers.\"   - \"The search expands at most `2,048` nodes per unit request. If the budget is\"   - \"exhausted, the best reachable partial corridor is retained and the unit enters\"   - \"`replanning`; after `3` consecutive failed replans it becomes `blocked`.\"   - \"Replanning starts after `15` ticks without progress or when the next reserved\"   - \"footprint becomes invalid. V1 has no path smoothing: the simulation follows\"   - \"the cell corridor and the renderer may only interpolate authoritative states.\" formations:    - \"A multi-unit move creates a transient formation with a leader, ordered members,\"   - \"and goal slots. The leader follows the group path; each member follows its slot\"   - \"using its own legal path and locomotor. Formation membership never changes a\"   - \"unit's speed, armor, targetability, or collision footprint.\"   - \"Slot assignment minimizes total reassignment cost, then uses stable entity ID as\"   - \"the tie-breaker. A slow or blocked member may fall behind; it does not slow the\"   - \"whole group indefinitely. The group completes when every member reaches its\"   - \"arrival tolerance or is explicitly reported blocked/dead. A new move order\"   - \"recomputes slots; attack, stop, embark, deploy, and transform orders dissolve or\"   - \"replace the formation according to their owning system.\"   - \"V1 needs only loose line formation for move orders. Wedge, column, facing-aware\"   - \"formations, formation presets, and persistent group identities are extensions,\"   - \"not hidden behavior.\"   - \"The V1 loose line is perpendicular to the group path, centered on the clicked\"   - \"destination, with slots spaced by `1.25` cells. Members use command selection\"   - \"order; the first member is the leader. If the line does not fit, slots are\"   - \"filled from the center outward and packed toward the nearest legal cells.\"   - \"Arrival tolerance is `0.5` cell per member. A group order completes when every\"   - \"surviving member arrives or reports `blocked`; it never waits for a dead or\"   - \"unreachable member.\" facing_attack_movement:    - \"Facing is simulation state when a weapon, arc, locomotor, or visibility rule\"   - \"needs it. Movement turns according to the unit's locomotor; a unit cannot fire\"   - \"through an unavailable arc merely because its sprite has visually rotated.\"   - \"Turning, acceleration, and stopping consume simulation time and can interrupt\"   - \"an attack only when the weapon or attack-movement object declares that rule.\"   - \"Attack movement is a policy selected by the unit/weapon: direct, standoff,\"   - \"orbit, strafe, attack-run, charge, ram, or stationary deploy. The policy owns\"   - \"its preferred distance, commitment, breakoff, and recovery values. This system\"   - \"owns only the lifecycle: acquire policy, reserve route, execute, break off, and\"   - \"return to ordinary movement.\" separation_contact:    - \"Movable entities reserve their next footprint before advancing. If reservations\"   - \"conflict, priority is: stationary buildings/terrain, explicit player order,\"   - \"older accepted order, then lower entity ID. The loser yields, replans, or waits;\"   - \"it never overlaps a solid footprint. Soft separation prevents visual stacking\"   - \"between movable units but does not change damage or targetability.\"   - \"V1 collision resolution is discrete and conservative. Each tick, entities\"   - \"propose their next position; proposals are sorted by the priority above, and a\"   - \"rejected proposal remains at its current position. A unit may not move through\"   - \"a solid footprint in one tick. A movable unit denied for `15` consecutive ticks\"   - \"requests a new route. There is no physics impulse, overlap damage, or collision\"   - \"teleport.\"   - \"Contact resolution is owned by [collisions](../collisions/README.md). Crush,\"   - \"ram, boarding, and transport attachment are explicit interactions, not generic\"   - \"results of overlap. A unit entering an invalid terrain or domain state stops at\"   - \"the last legal position and emits a visible failure reason.\" required_fields_failure_states:    - \"Every unit or locomotor used by movement declares domain, footprint, speed,\"   - \"acceleration, turn behavior, terrain permissions, stopping behavior, and\"   - \"transition rules. Group-capable commands additionally declare formation policy.\"   - \"The canonical outcomes are `moving`, `arrived`, `turning`, `waiting`,\"   - \"`replanning`, `blocked`, `invalid-destination`, `transitioning`, and `stopped`.\"   - \"No generic pathfinding rule grants amphibious movement, reverse firing,\"   - \"formation bonuses, collision damage, or attack-move behavior.\"   - \"V1 integrates acceleration, turning, and stopping with integer fixed-point\"   - \"state, clamped to the owning locomotor's speed limit. A stop order applies at\"   - \"the next tick boundary and decelerates to zero at the last legal position; it\"   - \"does not snap the unit. A destination inside another entity is a valid command\"   - \"point, but the unit resolves to the nearest legal arrival cell using the map's\"   - \"deterministic neighbor order and reports that result.\" player_facing_rules:    - \"Move previews distinguish reachable, potentially blocked, and illegal terrain,\"   - \"but remain advisory. The authoritative result replaces the preview with\"   - \"`arrived`, `blocked`, or `invalid-destination`; a blocked order shows the last\"   - \"reachable point. If a group cannot fit its requested loose line, it degrades to\"   - \"the nearest legal slot arrangement and reports that state rather than phasing\"   - \"through blockers or silently abandoning members.\"   - \"Attack-move, patrol, guard, retreat, and formation presets appear only when the\"   - \"mode and referenced objects explicitly support them. Ordinary move does not\"   - \"imply them. A stop order cancels movement and attack pursuit but does not cancel\"   - \"a non-movement skill unless that skill owns stop as an interruption.\" deferred:    - \"Persistent formations, transport-aware slot packing, bridges, dynamic terrain\"   - \"destruction, traffic lanes, retreat corridors, and formation combat bonuses are\"   - \"deferred until a real map or unit creates a demonstrated need.\""
