commands: 
  - command: "produce"
    required_payload: "recipe and facility"
    accepted_when: "facility, region, queue, and recipe are valid"
  - command: "move"
    required_payload: "vessel ID and water point/path"
    accepted_when: "locomotor and full footprint stay legal"
  - command: "attack"
    required_payload: "vessel ID and target/point"
    accepted_when: "weapon domain, detection, and geometry pass"
  - command: "hold"
    required_payload: "vessel ID"
    accepted_when: "vessel has a stable anchored/hold state"
  - command: "dive"
    required_payload: "vessel ID"
    accepted_when: "card allows diving from current stable state"
  - command: "surface"
    required_payload: "vessel ID"
    accepted_when: "card allows surfacing and depth is legal"
  - command: "board"
    required_payload: "carrier and passenger IDs"
    accepted_when: "transport interaction passes"
  - command: "unload"
    required_payload: "carrier and destination/shore ID"
    accepted_when: "exit footprint and passenger platform are legal"
  - command: "beach"
    required_payload: "vessel ID and shore interaction ID"
    accepted_when: "card and map allow beaching"
  - command: "repair"
    required_payload: "source and target ID"
    accepted_when: "repair source and target domain are valid"
  - command: "skill"
    required_payload: "vessel ID and skill payload"
    accepted_when: "card skill is legal in current state"
sensing_targetability: 
  - "not_applicable"
combat_interactions: 
  - "not_applicable"
