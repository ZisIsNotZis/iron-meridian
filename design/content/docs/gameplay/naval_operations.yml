"   - \"  cargo recovery once through transport rules.\"   - \"- Capture, destruction, and same-tick damage use shared combat/objective order.\" presentation_events:    - \"The UI shows water depth/access, route and launch legality, footprint,\"   - \"surface/submerged state, dive progress, sonar radius/contact age, stale markers,\"   - \"shore points, boarding/unloading progress, and rejection reasons. Events include\"   - \"naval-queued, hull-built, launch-start, launch-complete, naval-route-blocked,\"   - \"dive-start, surface-start, contact-created, contact-refreshed, contact-stale,\"   - \"contact-expired, beaching-start, shore-blocked, and naval-destroyed, with IDs\"   - \"and tick. Presentation never advances state.\"   - \"Directorate Naval Yard and Coalition Littoral Dock implement this contract.\"   - \"Existing maps (Meridian Crossing, Relay Yard, Three Arches, and Salt Line) have\"   - \"no water, docks, or naval recipes; their land rules are unchanged. Future maps\"   - \"must own water cells, regions, shore points, and naval balance. V1 excludes\"   - \"naval units, water, naval AI, and naval UI. Currents, weather, mines, nets,\"   - \"carriers, repair ships, and special ramming are explicit future objects, not\"   - \"implicit mechanics.\" scope:    - \"# Naval Operations\"   - \"This document owns the shared water layer, naval facility lifecycle, surface\"   - \"and submerged operation, naval movement and collision, sonar contacts, and\"   - \"naval command legality. Naval unit cards own water access, speed, footprint,\"   - \"targetability, weapons, depth, turning, and skills. Map cards own water\"   - \"topology, shore geometry, docks, channels, resources, and hazards. Combat,\"   - \"sensing, targetability, locomotor, construction, and transport documents remain\"   - \"authoritative for their shared meanings.\"   - \"V1 has no water layer or naval units. A land-only map cannot become naval by\"   - \"moving a ship onto a decorative blue tile. A future map must declare water\"   - \"topology and legal facilities before naval recipes are available.\""
