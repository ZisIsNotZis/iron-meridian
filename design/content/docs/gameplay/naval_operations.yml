ownership: 
  - "kind: \"naval_operations_contract\" document_id: \"gameplay.naval_operations\" title: \"Naval Operations\" source_document: \"design/naval-operations.md\" ownership:    - \"# Naval Operations\"   - \"This document owns the shared water layer, naval facility lifecycle, surface\"   - \"and submerged operation, naval movement and collision, sonar contacts, and\"   - \"naval command legality. Naval unit cards own water access, speed, footprint,\"   - \"targetability, weapons, depth, turning, and skills. Map cards own water\"   - \"topology, shore geometry, docks, channels, resources, and hazards. Combat,\"   - \"sensing, targetability, locomotor, construction, and transport documents remain\"   - \"authoritative for their shared meanings.\"   - \"V1 has no water layer or naval units. A land-only map cannot become naval by\"   - \"moving a ship onto a decorative blue tile. A future map must declare water\"   - \"topology and legal facilities before naval recipes are available.\" water_boundary:    - \"A water map declares a water-cell layer containing land, shallow, deep, shore,\"   - \"dock, and no-naval values; connected regions with allowed profiles; shore\"   - \"interactions with water cell, land cells, facing, and allowed actions; and\"   - \"naval no-build rules. Shore is an interaction band, not a traversable vessel\"   - \"cell. Dock is a land-owned facility interaction cell adjacent to water. A\"   - \"region is connected only through cells accepted by the vessel locomotor. Map\"   - \"cards own coordinates and geometry; this document owns interpretation and\"   - \"validation order.\"   - \"A naval facility card declares one shoreline footprint, one launch lane, one\"   - \"FIFO queue, legal connected water regions, service and boarding cells, and\"   - \"recipes. Its building card owns ID, footprint, cost, prerequisites, health,\"   - \"weapons, repair behavior, and presentation. Naval Yard and Littoral Dock are\"   - \"faction labels, not alternate systems.\"   - \"A naval unit card declares a naval, swimming-infantry, or card-owned platform;\"   - \"surface-naval, submerged, amphibious, or card-owned locomotor; targetability\"   - \"profiles; facility ID; water access; and surface/depth state. It must state\"   - \"footprint, speed and turning, shore interactions, collision, sensing, weapons,\"   - \"and transition durations. Platform labels imply none of these properties.\" facility_schema:    - \"A water map declares a water-cell layer containing land, shallow, deep, shore,\"   - \"dock, and no-naval values; connected regions with allowed profiles; shore\"   - \"interactions with water cell, land cells, facing, and allowed actions; and\"   - \"naval no-build rules. Shore is an interaction band, not a traversable vessel\"   - \"cell. Dock is a land-owned facility interaction cell adjacent to water. A\"   - \"region is connected only through cells accepted by the vessel locomotor. Map\"   - \"cards own coordinates and geometry; this document owns interpretation and\"   - \"validation order.\"   - \"A naval facility card declares one shoreline footprint, one launch lane, one\"   - \"FIFO queue, legal connected water regions, service and boarding cells, and\"   - \"recipes. Its building card owns ID, footprint, cost, prerequisites, health,\"   - \"weapons, repair behavior, and presentation. Naval Yard and Littoral Dock are\"   - \"faction labels, not alternate systems.\"   - \"A naval unit card declares a naval, swimming-infantry, or card-owned platform;\"   - \"surface-naval, submerged, amphibious, or card-owned locomotor; targetability\"   - \"profiles; facility ID; water access; and surface/depth state. It must state\"   - \"footprint, speed and turning, shore interactions, collision, sensing, weapons,\"   - \"and transition durations. Platform labels imply none of these properties.\" unit_schema:    - \"A water map declares a water-cell layer containing land, shallow, deep, shore,\"   - \"dock, and no-naval values; connected regions with allowed profiles; shore\"   - \"interactions with water cell, land cells, facing, and allowed actions; and\"   - \"naval no-build rules. Shore is an interaction band, not a traversable vessel\"   - \"cell. Dock is a land-owned facility interaction cell adjacent to water. A\"   - \"region is connected only through cells accepted by the vessel locomotor. Map\"   - \"cards own coordinates and geometry; this document owns interpretation and\"   - \"validation order.\"   - \"A naval facility card declares one shoreline footprint, one launch lane, one\"   - \"FIFO queue, legal connected water regions, service and boarding cells, and\"   - \"recipes. Its building card owns ID, footprint, cost, prerequisites, health,\"   - \"weapons, repair behavior, and presentation. Naval Yard and Littoral Dock are\"   - \"faction labels, not alternate systems.\"   - \"A naval unit card declares a naval, swimming-infantry, or card-owned platform;\"   - \"surface-naval, submerged, amphibious, or card-owned locomotor; targetability\"   - \"profiles; facility ID; water access; and surface/depth state. It must state\"   - \"footprint, speed and turning, shore interactions, collision, sensing, weapons,\"   - \"and transition durations. Platform labels imply none of these properties.\" movement_collision:    - \"Surface vessels occupy solid water footprints. Their full footprint, route\"   - \"clearance, and destination must be legal at every movement step; a preview is\"   - \"not a reservation. Surface vessels cannot enter land, shore-only, no-naval,\"   - \"disconnected, or too-shallow cells. Shallow access is a card value.\"   - \"Submerged vessels occupy the submerged depth layer of legal deep-water cells.\"   - \"Surface and submerged footprints do not collide merely because horizontal cells\"   - \"overlap. A card may declare proximity blocking or ramming through an explicit\"   - \"collision profile. Vessels in the same layer obey shared separation and\"   - \"footprint rules. Collision deals no damage unless a card owns ram damage. A\"   - \"blocked route stops at the last legal position and emits naval-route-blocked.\"   - \"Movement uses the map water graph, vessel locomotor, and card turning and\"   - \"acceleration. Shared diagonal, clearance, reservation, and tie-break rules\"   - \"apply; naval operations has no second pathfinder. Shore approach is a\"   - \"transition, not a teleport. Currents, waves, weather, and destructible water\"   - \"obstacles are explicit map objects and absent by default.\" states:    - \"The lifecycle is queued -> built-waiting -> launching -> surface-stable, with\"   - \"moving, anchored, beaching, and surface-transition states; surface-transition\"   - \"leads to submerged-stable or aborts to the previous stable state. Authoritative\"   - \"states are queued, built-waiting, launching, surface-stable, moving, anchored,\"   - \"surface-transition, submerged-stable, submerged-moving, beaching, boarding,\"   - \"unloading, disabled, and destroyed. Amphibious cards may add land-stable and a\"   - \"declared land/water transition; they never silently switch locomotors.\"   - \"The shared dive/surface default is 30 ticks. Cards may declare another duration\"   - \"and its player-facing reason. During transition, weapons, capture, boarding,\"   - \"and unloading are disabled unless the card explicitly permits them.\"   - \"Targetability exposes transition domains only when referenced by the unit. A\"   - \"15-tick abort returns to the last stable state; it grants no immunity and\"   - \"creates no new HP pool.\" production_launch_repair_capture:    - \"An operational facility accepts a recipe only when its region, shoreline,\"   - \"queue, prerequisites, and active cap are valid. Resources are reserved at\"   - \"acceptance. On build completion the hull waits for a clear lane and legal first\"   - \"water cell; it never overlaps a building or vessel. Shared launch default is\"   - \"30 ticks: 15 lane-occupancy ticks and 15 exit ticks. The hull cannot fire or\"   - \"accept movement during launch.\"   - \"The queue is FIFO by accepted command order. Service, repair, reload, and\"   - \"recovery do not jump production unless the facility card declares a separate\"   - \"channel. Facility destruction stops new production and launch, discards\"   - \"uncompleted queue work under building lifecycle rules, and does not destroy\"   - \"launched vessels. Repair restores health only when an explicit repair source\"   - \"owns the target domain; it does not surface, reload, or clear status by\"   - \"implication.\"   - \"Naval entities use shared capture and construction rules. A ship cannot capture\"   - \"a land objective or building from open water unless its card declares legal\"   - \"shore interaction and the target accepts naval interaction. Capture changes\"   - \"ownership only through the shared capture phase; it does not instantly convert\"   - \"queued products, crew, or presentation.\" commands:    - command: \"produce\"     required_payload: \"recipe and facility\"     accepted_when: \"facility, region, queue, and recipe are valid\"   - command: \"move\"     required_payload: \"vessel ID and water point/path\"     accepted_when: \"locomotor and full footprint stay legal\"   - command: \"attack\"     required_payload: \"vessel ID and target/point\"     accepted_when: \"weapon domain, detection, and geometry pass\"   - command: \"hold\"     required_payload: \"vessel ID\"     accepted_when: \"vessel has a stable anchored/hold state\"   - command: \"dive\"     required_payload: \"vessel ID\"     accepted_when: \"card allows diving from current stable state\"   - command: \"surface\"     required_payload: \"vessel ID\"     accepted_when: \"card allows surfacing and depth is legal\"   - command: \"board\"     required_payload: \"carrier and passenger IDs\"     accepted_when: \"transport interaction passes\"   - command: \"unload\"     required_payload: \"carrier and destination/shore ID\"     accepted_when: \"exit footprint and passenger platform are legal\"   - command: \"beach\"     required_payload: \"vessel ID and shore interaction ID\"     accepted_when: \"card and map allow beaching\"   - command: \"repair\"     required_payload: \"source and target ID\"     accepted_when: \"repair source and target domain are valid\"   - command: \"skill\"     required_payload: \"vessel ID and skill payload\"     accepted_when: \"card skill is legal in current state\" sensing_targetability:    - \"Surface vessels use ordinary visual sensing from their cards. A submerged\"   - \"entity requires a declared detection channel: active sonar, passive\"   - \"disturbance, proximity, or card-specific reveal. The sensor owns radius, cone,\"   - \"pulse interval, strength, jamming behavior, and information level; this\"   - \"document owns contact lifecycle and naval state interaction.\"   - \"The full-game baseline uses an active sonar pulse interval of 30 ticks and an\"   - \"8.0-cell radius. Contacts are detailed for legal visible information at ages\"   - \"0-14, stale/last-known at ages 15-29, and expired at age 30 without refresh.\"   - \"Moving submerged vessels may emit a card-declared passive disturbance;\"   - \"stationary vessels emit none by default. Diving, surfacing, firing, and\"   - \"explicit skills may emit disturbance. Jamming may prevent relay sharing but\"   - \"does not erase a contact created earlier in the same tick.\"   - \"Targetability is naval-surface for surface states, submerged for submerged\"   - \"states, and explicit transition profiles while diving, surfacing, or beaching.\"   - \"A weapon must accept both domain and required detection. A stale contact\"   - \"supports only acquisition policies allowing a last-known point; a point shot\"   - \"does not track a moving submerged target. Anti-air, ordinary vision, and naval\"   - \"membership do not reveal depth targets.\" combat_interactions:    - \"Fire-time and impact-time resolution follows combat. Torpedoes, depth charges,\"   - \"mines, nets, shore guns, aircraft weapons, and area effects each declare\"   - \"accepted domains and delivery. Surface weapons do not damage submerged targets\"   - \"by sharing sonar. A projectile arriving after a target dives is consumed or\"   - \"follows its own declared transition-hit rule; it does not inherit a new domain.\"   - \"Naval weapons may target shore units or buildings only when the weapon declares\"   - \"shore interaction, the target is in legal shoreline geometry, and line of fire\"   - \"or lock rules pass. Naval membership grants no cross-domain targeting. Freeze,\"   - \"EMP, incendiary, suppression, armor, destruction, and repair remain shared\"   - \"effects. Submergence changes visibility and legal actions, not HP, armor ratio,\"   - \"or damage multiplier.\" transport_shore:    - \"Transport ships use the transport contract. They must be stable, stationary,\"   - \"and at a declared dock, shore interaction, or water deployment point. A\"   - \"submerged carrier must surface completely first. A landing craft beaching\"   - \"transition reserves declared water and shore footprints; it cannot unload onto\"   - \"land, buildings, blueprints, objective exclusions, or occupied exits. The\"   - \"carrier remains vulnerable during beaching and unloading under its targetability\"   - \"profiles.\" edge_cases:    - \"- EMP disables only named capabilities and does not force surfacing by default.\"   - \"- A destroyed facility cannot receive a hull or complete a service action.\"   - \"- A lost water route stops a vessel at its last legal cell; no automatic beaching.\"   - \"- An interrupted transition completes neither side effect and aborts to its last\"   - \"  stable state.\"   - \"- Simultaneous launch, shore, depth, and collision claims use shared command\"   - \"  order.\"   - \"- A vessel destroyed while carrying passengers resolves carrier destruction and\"   - \"  cargo recovery once through transport rules.\"   - \"- Capture, destruction, and same-tick damage use shared combat/objective order.\" presentation_events:    - \"The UI shows water depth/access, route and launch legality, footprint,\"   - \"surface/submerged state, dive progress, sonar radius/contact age, stale markers,\"   - \"shore points, boarding/unloading progress, and rejection reasons. Events include\"   - \"naval-queued, hull-built, launch-start, launch-complete, naval-route-blocked,\"   - \"dive-start, surface-start, contact-created, contact-refreshed, contact-stale,\"   - \"contact-expired, beaching-start, shore-blocked, and naval-destroyed, with IDs\"   - \"and tick. Presentation never advances state.\"   - \"Directorate Naval Yard and Coalition Littoral Dock implement this contract.\"   - \"Existing maps (Meridian Crossing, Relay Yard, Three Arches, and Salt Line) have\"   - \"no water, docks, or naval recipes; their land rules are unchanged. Future maps\"   - \"must own water cells, regions, shore points, and naval balance. V1 excludes\"   - \"naval units, water, naval AI, and naval UI. Currents, weather, mines, nets,\"   - \"carriers, repair ships, and special ramming are explicit future objects, not\"   - \"implicit mechanics.\" scope:    - \"# Naval Operations\"   - \"This document owns the shared water layer, naval facility lifecycle, surface\"   - \"and submerged operation, naval movement and collision, sonar contacts, and\"   - \"naval command legality. Naval unit cards own water access, speed, footprint,\"   - \"targetability, weapons, depth, turning, and skills. Map cards own water\"   - \"topology, shore geometry, docks, channels, resources, and hazards. Combat,\"   - \"sensing, targetability, locomotor, construction, and transport documents remain\"   - \"authoritative for their shared meanings.\"   - \"V1 has no water layer or naval units. A land-only map cannot become naval by\"   - \"moving a ship onto a decorative blue tile. A future map must declare water\"   - \"topology and legal facilities before naval recipes are available.\""
