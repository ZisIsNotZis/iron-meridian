ownership: 
  - "kind: \"numerics_contract\""
  - "document_id: \"gameplay.numerics\""
  - "title: \"Numeric Principles\""
  - "source_document: \"design/numerics.md\""
  - "ownership: "
  - "  - \"# Numeric Principles\""
  - "  - \"This document defines numeric representation and ownership, not balance\""
  - "  - \"defaults. Concrete values belong to the first-class object, unit, building,\""
  - "  - \"weapon, skill, status, map, or scenario that owns them.\""
  - "representation: "
  - "  - \"- Use integers or fixed-point integers in simulation; floating-point authoring\""
  - "  - \"  values are converted at data-load time.\""
  - "  - \"- Every quantity declares its unit. Percentages are integer percentages and\""
  - "  - \"  use `floor(a × b / 100)`; ties round down.\""
  - "  - \"- Health, damage, status points, resources, durations, and IDs are\""
  - "  - \"  non-negative integers unless their schema explicitly permits otherwise.\""
  - "  - \"- Positions and radii use the declared world-distance unit; squared-distance\""
  - "  - \"  tests use 64-bit intermediates.\""
  - "time_determinism: "
  - "  - \"Durations are simulation ticks; the owning system or object defines the tick\""
  - "  - \"rate. State changes resolve at tick boundaries in documented deterministic\""
  - "  - \"order, independent of wall-clock time, iteration order, locale, or platform\""
  - "  - \"floating-point behavior. Derived values are formulas, not duplicate literals.\""
  - "ownership_inheritance: "
  - "  - \"- A concrete number has exactly one canonical owner.\""
  - "  - \"- References inherit by ID; omission never silently means zero, unlimited, or\""
  - "  - \"  an unspecified default.\""
  - "  - \"- An override names the inherited field, replacement value, and reason in the\""
  - "  - \"  owning object.\""
  - "  - \"- Schemas use explicit `N/A` for inapplicable fields and `TBD` only for a\""
  - "  - \"  consciously unresolved decision.\""
  - "  - \"- Collection READMEs define fields and validation; object files own values.\""
  - "  - \"### Ownership map\""
  - "  - \"Use this routing before adding a number:\""
  - "  - \"| Value | Canonical owner |\""
  - "  - \"|---|---|\""
  - "  - \"| Entity health, footprint, movement, sensing, weapon/skill parameters, cost, build time, and capacity | The unit or building card; a genuinely shared complete definition may own it instead. |\""
  - "  - \"| Damage/armor ratios and reusable timing or geometry defaults | The referenced first-class damage, armor, weapon, status, locomotor, sensing, or production object. |\""
  - "  - \"| Resource-node coordinates, reserves, exclusions, and map-local objective geometry | The specific map. |\""
  - "  - \"| Starting bank, starting roster, scenario-only availability, and mission setup | The specific scenario or mission. |\""
  - "  - \"| Capture/reward thresholds and objective state-machine values | The objective definition; a scenario may override them explicitly. |\""
  - "  - \"| Lifecycle ordering, rejection rules, reservation semantics, and deterministic tie-breaks | The owning system document. A system may own a default only when it applies across objects and is not a hidden entity balance stat. |\""
  - "  - \"System overviews must not repeat a card's concrete value as an example or\""
  - "  - \"implicit fallback. A derived display, such as seconds derived from ticks, is\""
  - "  - \"not a second owner.\""
  - "ownership_map: "
  - "  - value: \"Entity health, footprint, movement, sensing, weapon/skill parameters, cost, build time, and capacity\""
  - "    canonical_owner: \"The unit or building card; a genuinely shared complete definition may own it instead.\""
  - "  - value: \"Damage/armor ratios and reusable timing or geometry defaults\""
  - "    canonical_owner: \"The referenced first-class damage, armor, weapon, status, locomotor, sensing, or production object.\""
  - "  - value: \"Resource-node coordinates, reserves, exclusions, and map-local objective geometry\""
  - "    canonical_owner: \"The specific map.\""
  - "  - value: \"Starting bank, starting roster, scenario-only availability, and mission setup\""
  - "    canonical_owner: \"The specific scenario or mission.\""
  - "  - value: \"Capture/reward thresholds and objective state-machine values\""
  - "    canonical_owner: \"The objective definition; a scenario may override them explicitly.\""
  - "  - value: \"Lifecycle ordering, rejection rules, reservation semantics, and deterministic tie-breaks\""
  - "    canonical_owner: \"The owning system document.\""
  - "validation: "
  - "  - \"Validators should reject unknown units, duplicate IDs, unresolved references,\""
  - "  - \"missing fields, illegal negatives, ambiguous inheritance, and derived values\""
  - "  - \"that disagree with their formulas. Markdown is the human source of truth;\""
  - "  - \"validation tooling only checks it.\""
representation: 
  - "not_applicable"
time_determinism: 
