carrier_schema: 
  - "not_applicable"
transfer_record: 
  - "not_applicable"
eligibility_reservation: 
  - "not_applicable"
boarding: 
  - "not_applicable"
embarked: 
  - "not_applicable"
unloading: 
  - "not_applicable"
commands: 
  - command: "board"
    required_payload: "carrier ID and ordered passenger IDs"
    accepted_when: "eligibility and capacity pass"
  - command: "unload"
    required_payload: "carrier ID and destination/interaction ID"
    accepted_when: "exit validation can begin"
  - command: "unload-one"
    required_payload: "carrier ID, passenger ID, destination"
    accepted_when: "named passenger is embarked"
  - command: "hold-unload"
    required_payload: "carrier ID"
    accepted_when: "active channel may stop before next passenger"
  - command: "cancel-transfer"
    required_payload: "carrier and passenger IDs"
    accepted_when: "channel is cancellable"
  - command: "move"
    required_payload: "carrier ID and route"
    accepted_when: "carrier state and route allow movement"
  - command: "return"
    required_payload: "carrier ID and facility/shore ID"
    accepted_when: "carrier operation owns return"
  - command: "skill"
    required_payload: "carrier ID and skill payload"
    accepted_when: "card skill permits cargo state"
platform_rules: 
  - "not_applicable"
destruction: 
  - "not_applicable"
edge_cases: 
  - "not_applicable"
presentation_events: 
  - "not_applicable"
