kind: "transport_contract"
document_id: "gameplay.transport"
title: "Transport Operations"
source_document: "design/transport.md"
ownership: 
  - "kind: \"transport_contract\" document_id: \"gameplay.transport\" title: \"Transport Operations\" source_document: \"design/transport.md\" ownership:    - \"# Transport Operations\"   - \"This document owns transfer of living units into and out of a carrier. It covers\"   - \"ground, amphibious, naval, and air carriers without adding a second movement or\"   - \"combat system. Carrier cards own capacity, passenger filters, interaction\"   - \"states, timing overrides, and rescue skills. Passenger cards own ordinary\"   - \"locomotion, health, weapons, skills, and post-unload order. Shared movement,\"   - \"collision, sensing, combat, air operations, and naval operations remain\"   - \"authoritative outside transfer semantics.\"   - \"V1 has no transport commands. The contract is complete for the full game;\"   - \"implementation may enable existing ground carriers first, then one air or\"   - \"naval carrier. A unit with no explicit carrier contract cannot carry anything.\" scope:    - \"# Transport Operations\"   - \"This document owns transfer of living units into and out of a carrier. It covers\"   - \"ground, amphibious, naval, and air carriers without adding a second movement or\"   - \"combat system. Carrier cards own capacity, passenger filters, interaction\"   - \"states, timing overrides, and rescue skills. Passenger cards own ordinary\"   - \"locomotion, health, weapons, skills, and post-unload order. Shared movement,\"   - \"collision, sensing, combat, air operations, and naval operations remain\"   - \"authoritative outside transfer semantics.\"   - \"V1 has no transport commands. The contract is complete for the full game;\"   - \"implementation may enable existing ground carriers first, then one air or\"   - \"naval carrier. A unit with no explicit carrier contract cannot carry anything.\" carrier_schema:    - \"A carrier card declares a transport object with capacity profile, capacity or\"   - \"slot map, accepted platform filters, stable loading and unloading states,\"   - \"interaction range and cells, load and unload ticks, parallel policy,\"   - \"unload pattern, and destruction policy. The carrier card is authoritative for\"   - \"every value. Capacity profile is an authoring key, not a hidden slot\"   - \"conversion: the card states whether each passenger uses personnel, light\"   - \"vehicle, mixed, or another explicit slot. Nested cargo is forbidden by default.\"   - \"The simulation stores one transfer record per passenger with carrier ID,\"   - \"passenger ID, available/reserved/boarding/embarked/unloading/unloaded/lost\"   - \"state, reserved slot, origin, destination, and start tick. The record is the\"   - \"source of truth; a render icon or child scene node never moves a passenger.\" transfer_record:    - \"An embarked passenger has no independent collision, sensing, targetability,\"   - \"weapon, capture, harvest, construction, or movement order. It remains\"   - \"selectable through the carrier and retains owner, health, statuses, experience,\"   - \"and suspended order. It does not grant the carrier vision, weapons, armor,\"   - \"speed, or targetability; it is not damaged by attacks that legally hit only the\"   - \"carrier. Embarking grants no stealth, invulnerability, speed bonus, or healing.\"   - \"The carrier's current targetability and locomotor state determine whether it\"   - \"may move, fight, dive, take off, land, or use skills while carrying cargo. A\"   - \"card may permit firing while loaded, but that is a carrier weapon decision.\"   - \"The passenger's suspended order is discarded on unload unless its card supplies\"   - \"a post-unload order.\" eligibility_reservation:    - \"At command acceptance and again when a channel starts, the simulation checks:\"   - \"1. Carrier and passenger are alive, allied, and owned by the commander.\"   - \"2. Neither is embarked, reserved by another transfer, captured, destroyed, or\"   - \"   in an incompatible transition.\"   - \"3. The carrier is in a card-declared stable state, stationary, and in range.\"   - \"4. The passenger matches the carrier filter, has no nested cargo, and fits a\"   - \"   free slot.\"   - \"5. Carrier interaction and passenger approach footprints are legal under the\"   - \"   map and collision rules.\"   - \"Enemies, buildings, blueprints, objectives, harvest cargo, projectiles, wrecks,\"   - \"and resource nodes are never passengers. A carrier cannot load through fog or\"   - \"from a remembered contact.\"   - \"An accepted load reserves exactly one slot and both participants. Reservation\"   - \"order is apply tick, player ID, client sequence, carrier ID, passenger ID.\"   - \"A losing concurrent request is rejected without consuming capacity. Reservation\"   - \"does not make a unit invulnerable, hidden, or movable by the carrier before\"   - \"boarding completes.\" boarding:    - \"The lifecycle is available -> reserved -> boarding -> embarked, with\"   - \"cancellation returning to available. Approach to a carrier or interaction point\"   - \"uses ordinary movement. The carrier must stop before boarding starts.\"   - \"Passengers load sequentially in player selection order, then stable entity ID;\"   - \"parallel loading is permitted only by card declaration. The card's load ticks\"   - \"are the whole channel and are not multiplied by an unstated global duration.\"   - \"Boarding cancels before completion when either entity dies, changes owner,\"   - \"leaves range, moves, enters a forbidden transition, loses eligibility, or is\"   - \"disabled by a named control effect. Reservation is released, no cooldown or\"   - \"resource is spent, and the passenger remains outside. Completion emits boarded\"   - \"and changes the passenger to embarked in the same authoritative tick.\" embarked:    - \"An embarked passenger has no independent collision, sensing, targetability,\"   - \"weapon, capture, harvest, construction, or movement order. It remains\"   - \"selectable through the carrier and retains owner, health, statuses, experience,\"   - \"and suspended order. It does not grant the carrier vision, weapons, armor,\"   - \"speed, or targetability; it is not damaged by attacks that legally hit only the\"   - \"carrier. Embarking grants no stealth, invulnerability, speed bonus, or healing.\"   - \"The carrier's current targetability and locomotor state determine whether it\"   - \"may move, fight, dive, take off, land, or use skills while carrying cargo. A\"   - \"card may permit firing while loaded, but that is a carrier weapon decision.\"   - \"The passenger's suspended order is discarded on unload unless its card supplies\"   - \"a post-unload order.\" unloading:    - \"The lifecycle is embarked -> unload-requested -> unloading -> available, with\"   - \"blocked exits held aboard. The unload command names an interaction point,\"   - \"landing zone, shore point, or card destination; it never names a teleport.\"   - \"At channel start, the simulation validates that the exit is inside the map,\"   - \"legal for the passenger platform and locomotor, clear of units, buildings,\"   - \"blueprints, impassable terrain, objective and no-build exclusions, and\"   - \"compatible with the carrier's full exit footprint. The carrier is stationary\"   - \"during unloading unless its card owns a moving deployment channel. The exit\"   - \"cell is reserved only for the active passenger and released when it appears.\"   - \"Sequential unloading is the default. A blocked next exit pauses unloading and\"   - \"does not push, crush, or teleport passengers.\"   - \"On completion, the passenger appears with current health and statuses, becomes\"   - \"independently targetable after the movement phase, and receives only a declared\"   - \"post-unload effect. There is no partial passenger entity. Earlier completed\"   - \"transfers remain in the world if a later transfer is interrupted.\" commands:    - command: \"board\"     required_payload: \"carrier ID and ordered passenger IDs\"     accepted_when: \"eligibility and capacity pass\"   - command: \"unload\"     required_payload: \"carrier ID and destination/interaction ID\"     accepted_when: \"exit validation can begin\"   - command: \"unload-one\"     required_payload: \"carrier ID, passenger ID, destination\"     accepted_when: \"named passenger is embarked\"   - command: \"hold-unload\"     required_payload: \"carrier ID\"     accepted_when: \"active channel may stop before next passenger\"   - command: \"cancel-transfer\"     required_payload: \"carrier and passenger IDs\"     accepted_when: \"channel is cancellable\"   - command: \"move\"     required_payload: \"carrier ID and route\"     accepted_when: \"carrier state and route allow movement\"   - command: \"return\"     required_payload: \"carrier ID and facility/shore ID\"     accepted_when: \"carrier operation owns return\"   - command: \"skill\"     required_payload: \"carrier ID and skill payload\"     accepted_when: \"card skill permits cargo state\" platform_rules:    - \"- Ground carriers use adjacent interaction cells and ordinary ground collision.\"   - \"- Amphibious carriers transfer only in their declared stable land or water\"   - \"  state; a transition cannot start a transfer.\"   - \"- Naval carriers use naval operations, a friendly dock, legal shore\"   - \"  interaction, or card-owned water deployment. A submerged carrier or\"   - \"  passenger must surface completely first.\"   - \"- Air carriers use air operations and must be stable in their declared hover or\"   - \"  landing state. Takeoff, landing, and attack-run transitions are never\"   - \"  boarding channels. The landing zone must be visible and legal for every\"   - \"  passenger exit footprint.\"   - \"Coalition Kodiak IFV, Mastiff Amphibious Carrier, Heron VTOL Transport, and\"   - \"Tideway Landing Craft are consumers when their cards declare transport. The\"   - \"Directorate Landing Barge and Recovery Carrier are consumers only when their\"   - \"cards declare it. Their cards, not this document, decide capacity and timing.\" destruction:    - \"An embarked passenger is absent from enemy sensing and cannot be targeted\"   - \"independently. The carrier remains targetable by its own state profile. A\"   - \"carrier does not reveal cargo identity, health, or status unless the observation\"   - \"contract grants it; the owner sees cargo through the carrier.\"   - \"Carrier and cargo destruction resolves in the shared combat destruction phase.\"   - \"The default is cargo-loss: every embarked passenger changes to lost, is\"   - \"destroyed once, and emits one cargo-lost event after the carrier destruction\"   - \"event. A rescue or ejection exception must be owned by the carrier card and\"   - \"declare timing, exit validation, passenger damage, counterplay, and EMP/capture\"   - \"availability. There is no nearest-shore teleport, random cargo roll, or\"   - \"automatic parachute.\"   - \"Capture changes carrier ownership through shared interaction/objective rules.\"   - \"It does not silently transfer passengers to the captor: passengers remain\"   - \"embarked only if the carrier card permits captured cargo; otherwise the capture\"   - \"transition applies its declared unload or loss consequence. A passenger\"   - \"removed or rescued is removed from its slot once in the same transfer phase.\" edge_cases:    - \"- EMP interrupts a channel only when shared status or card rules name it; it\"   - \"  does not eject cargo by default.\"   - \"- Movement, destruction, capture, and invalid destination interrupt the active\"   - \"  channel at their authoritative tick; earlier transfers remain complete.\"   - \"- If all exits are blocked, the carrier remains loaded and reports\"   - \"  unloading-paused.\"   - \"- A carrier with no legal route may hold or return; it never crosses a domain.\"   - \"- Passenger owner, health, status, and experience remain in the transfer record\"   - \"  for save and replay systems when enabled; the carrier never flattens them.\"   - \"- Simultaneous boarding, unloading, capture, and destruction use shared tick\"   - \"  and command order. Presentation animation cannot win a race.\" presentation_events:    - \"The UI shows occupied/total, slot type, owner-visible passenger identities,\"   - \"active channel and progress, approach and exit footprint, destination legality,\"   - \"carrier state, and rejection reason. Events include boarding-start, boarded,\"   - \"boarding-cancelled, unloading-start, unloading-paused, unloaded,\"   - \"transfer-cancelled, and cargo-lost, with carrier ID, passenger ID when\"   - \"applicable, and tick. Passenger icons derive from transfer records and never\"   - \"drive simulation state.\"   - \"V1 excludes transport commands and passenger entities. The full-game contract\"   - \"does not add nested transports, automatic convoys, passenger hit points as a\"   - \"second pool, or a second cargo economy. Any such feature must first become an\"   - \"explicit card or system object with a schema, ownership, counterplay, and\"   - \"deterministic lifecycle.\""
