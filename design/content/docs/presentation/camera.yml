kind: camera_contract
source_document: design/presentation/camera.md
default: "top-down with modest tilt, bounded zoom, and no automatic unit-follow during ordinary play"
authority: "Camera state never changes simulation coordinates or orders."
controls:
  pan: [edge_scroll, middle_button_drag]
  recenter: [explicit_alert, selected_group, hq, objective_command]
  zoom: cursor_centered_with_bounds
  limits: map_owned_and_fog_respecting
  jump_follow: explicit_interruptible
  alerts: "May offer a recenter action but must not steal control."
  modes: "Pause, briefing, replay, and screenshot modes retain inspectable state and do not issue simulation orders."
v1_values:
  viewport_css_px: [1280, 720]
  aspect_ratio: 16_to_9
  narrow_window: letterbox_playfield_and_keep_hud_readable
  zoom_min: 0.75
  zoom_max: 1.50
  zoom_default: 1.00
  wheel_step: 0.10
  cursor_map_point: stable_where_possible
  edge_scroll_width_css_px: 24
  edge_scroll_speed_css_px_per_second: 600
  middle_drag_response: 1_to_1_map_pan
  map_margin_cells: 0.5
interpolation: "Visual only; may smooth position over one simulation tick and is disabled while stepping or inspecting a paused tick."
alert_jump: {duration_ms: 180, easing: ease_out, max_distance: map_bounds}
screen_shake: {accessibility_safe_default: off, otherwise_max_css_px: 4, duration_ms: 120, changes_authoritative_position: false}
