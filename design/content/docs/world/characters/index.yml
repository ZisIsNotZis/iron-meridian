  - {name: Ilya Orsik, record: world.characters.ilya_orsik, faction: Coalition, role: operations_commander, campaign_use: "player voice for Isolation and Decision"}
  - {name: Sera Vale, record: world.characters.sera_vale, organization: "Rail and Works Authority", role: rail_and_civilian_liaison, campaign_use: "frames the cost of holding the crossing"}
  - {name: Tomas Rusk, record: world.characters.tomas_rusk, faction: Coalition, role: intelligence_officer, campaign_use: "reports turn uncertainty into actionable reconnaissance"}
constraints:
  cast_size: "The cast is intentionally small."
  authority: "No character has authority to redefine a faction, reveal hidden information without a mission trigger, or replace the HUD’s objective and failure feedback."
