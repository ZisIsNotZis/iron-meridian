kind: character_index
source_document: design/world/characters/README.md
purpose: "Characters provide a human voice for the four-mission campaign without creating a second simulation system."
ownership: "A character owns role, allegiance, visual/audio identity, and dialogue boundaries. Mission files own the exact line, trigger, and presentation context."
campaign_cast:
