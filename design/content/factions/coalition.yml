  narrative_identity: "# Coalition Background\n\n## Origin\n\nThe Coalition began as an emergency treaty among regional defense commands, elected governments, port authorities, reformist officers, and technical consortiums. They retained local command because those commanders controlled the roads, shipyards, factories, and communities that the central government could no longer reliably supply.\n\nThe treaty is practical rather than romantic. Members agree to prevent the Directorate from taking the treasury and strategic arsenals, share warnings, and preserve the possibility of a renewed federation. They disagree about how much authority the postwar center should receive and who will repay wartime requisitions.\n\n## Public claim\n\nThe Coalition claims legitimacy through consent and transparency. Its broadcasts describe the Directorate as an emergency committee that converted temporary security powers into a permanent state. The Coalition promises a negotiated federation, but its promise is difficult to keep while every region is arming itself.\n\n## Internal conflict\n\nThe central political question is **consent or speed**. Regional vetoes protect autonomy and slow unified action. Port authorities may share a radar picture but refuse to surrender their fleet; a reform officer may demand an attack before the next council meeting. Campaign missions should make coordination feel earned rather than effortless.\n\n## V1 and near-term use\n\nV1 does not require asymmetric Coalition mechanics. Near-term campaign missions can reveal its identity through distributed briefings, local objectives, and choices about which infrastructure to protect. The faction becomes playable when its information-and-mobility doctrine can be expressed without a mandatory network dependency.\n\n## Far-vision boundary\n\nThe treaty’s politics are authored context, not a diplomacy simulator. More regional factions, elections, and coalition votes remain possible campaign material only after the core solo game proves its value.\n\n# Coalition Identity\n\n## Symbol and logo direction\n\nThe Coalition mark is a **three-part open ring joined by a small bridge**. The separated arcs represent regional members; the bridge represents treaty and shared infrastructure without erasing local identity. It must remain legible as a small stencil, map marker, and interface badge. Avoid real-world national symbols, alliance marks, or borrowed faction iconography.\n\nThe wordmark uses a clean humanist grotesk with one deliberately open letterform. Regional units may carry local abbreviations, but the shared mark should remain visually dominant in official Coalition material.\n\n## Presentation ownership\n\nFaction palette, materials, silhouettes, spaces, voice, audio, effects, and\nanimation direction live in [Coalition assets](assets.md). This document\ndefines identity principles; it does not specify individual asset mappings.\n\n## Scope\n\nThis document owns Coalition identity. Individual gameplay designs belong in\nthe [unit index](units/README.md); global presentation rules belong in\n[presentation](../../presentation/README.md)."
  scope: "near_term"
