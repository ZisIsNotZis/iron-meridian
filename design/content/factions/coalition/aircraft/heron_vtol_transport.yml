design:
  tactical_identity: "Infantry airlift and rapid redeployment primary; extraction secondary. Does not deliver armor or act as a gunship."
  offense_behavior: "Door guns for self-defense only; air protection, moderate transport durability, no meaningful anti-armor output."
  locomotion_behavior: "VTOL aircraft; transitions between high flight and hovering/landing at marked points. Landing is a vulnerable, interruptible state."
  targetability_behavior: "High air in transit; low air/ground transition while landing. Vulnerable to both anti-air and selected ground weapons during the transition."
  acquisition_behavior: "Door guns require a currently observed legal ground-personnel or low-air target; auto-attack may choose only inside the 9.0-cell alert radius."
  lock_behavior: "No lock. Door-gun projectiles are point impacts with no post-launch tracking. Airlift requires a visible, legal landing point rather than an enemy target lock."
  production_behavior: "Cost: `750 resource`; build time: `240 ticks`; facility: `Air Operations`; prerequisites: `Mobility Workshop operational`; queue/category: `aircraft / advanced transport`; replacement/capacity: `maximum 2 active Herons per Air Operations building; rearm uses that building's single FIFO aircraft queue`."
  player_decision: "Turn distance into a flank or emergency extraction while deciding whether the landing zone is safe enough. Counter with AA, patrols, mines, area denial, and attacking the vulnerable transition."
  visual_identity: "Tilt-rotor transport with modular side doors; rotor wash, landing lights, and a projected zone make the insertion readable."
  design_rationale: "# Heron VTOL Transport\n\n## Gameplay identity\n\n- **Roles:** Infantry airlift and rapid redeployment primary; extraction secondary. Does not deliver armor or act as a gunship.\n- **Locomotion:** VTOL aircraft; transitions between high flight and hovering/landing at marked points. Landing is a vulnerable, interruptible state.\n- **Targetability:** High air in transit; low air/ground transition while landing. Vulnerable to both anti-air and selected ground weapons during the transition.\n- **Offense/defense:** Door guns for self-defense only; air protection, moderate transport durability, no meaningful anti-armor output.\n- **Skill:** **Airlift** — carries an infantry group to a visible landing zone, with approach warning and unload delay; aborting preserves the passengers but loses tempo.\n- **Production:** Cost: `750 resource`; build time: `240 ticks`; facility: `Air Operations`; prerequisites: `Mobility Workshop operational`; queue/category: `aircraft / advanced transport`; replacement/capacity: `maximum 2 active Herons per Air Operations building; rearm uses that building's single FIFO aircraft queue`.\n- **Player experience:** Turn distance into a flank or emergency extraction while deciding whether the landing zone is safe enough. Counter with AA, patrols, mines, area denial, and attacking the vulnerable transition.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional transport override: moderate durability and negligible damage in exchange for infantry mobility.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 360 | Light | 7.0 cells/s | 0.50 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Door guns | Machine gun/autocannon / ground-personnel, low-air | 3.0 | 12; 24 ticks (0/3/21) | Projectile 14 cells/s; point; direct, no homing |\n\n**Airlift:** 30-tick landing setup at a visible point within 12 cells; unloads up to 6 infantry over 60 ticks. 300-tick cooldown; landing exposes low-air/ground transition, and abort preserves passengers but loses the approach.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells, inherited from the transport's explicit entity row; alerting does not extend weapon range.\n- **Acquisition:** Door guns require a currently observed legal ground-personnel or low-air target; auto-attack may choose only inside the 9.0-cell alert radius.\n- **Lock / tracking:** No lock. Door-gun projectiles are point impacts with no post-launch tracking. Airlift requires a visible, legal landing point rather than an enemy target lock.\n\n\n### Counterplay\n\nAnti-air, low-air-capable ground fire, patrols, mines, and area denial punish the approach or landing transition. Kill or displace the Heron before unloading; the door guns are not a fighting role."
