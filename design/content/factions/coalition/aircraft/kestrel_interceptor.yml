  design_rationale: "# Kestrel Interceptor\n\n## Gameplay identity\n\n- **Roles:** Air superiority and escort primary; limited high-value interception secondary. Targets aircraft and exposed drones.\n- **Locomotion:** Fixed-wing; attack-run movement with turning commitment and limited loiter. Must return to an airfield or carrier-equivalent for rearm.\n- **Targetability:** High air; visible while attacking, vulnerable to anti-air and enemy fighters.\n- **Offense/defense:** Air-to-air missiles and cannon; air protection with high speed, but poor ground attack and low staying power under AA.\n- **Skill:** **Escort screen** — briefly prioritizes and protects a nearby strike group, improving interception response while reducing the Kestrel's independent pursuit range.\n- **Production:** Cost: `500 resource`; build time: `150 ticks`; facility: `Air Operations`; prerequisites: `Coalition HQ operational`; queue/category: `aircraft / established air denial`; replacement/capacity: `maximum 4 active Kestrels per Air Operations building; rearm uses that building's single FIFO aircraft queue`.\n- **Player experience:** Guard the strike package or chase an enemy fighter and leave another lane open. Counter with layered AA, baiting its pass, superior positioning, or attacking the airfield.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional air-superiority override: high speed, low ground value, and air-only weapons.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 260 | Light | 10.0 cells/s | 0.36 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Air-to-air missile | Anti-armor penetrator / high-air | 8.0 | 90; 45 ticks (9/3/33) | Projectile 18 cells/s; point; lock, 35°/s homing |\n| Fighter cannon | Machine gun/autocannon / high-air, low-air | 3.5 | 14; 12 ticks (0/2/10) | Projectile 20 cells/s; point; direct, no homing |\n\n**Escort screen:** 15-tick activation around a friendly aircraft within 3.0 cells; for 120 ticks the Kestrel gains +20% alert radius and prioritizes hostile aircraft entering the escort zone. 240-tick cooldown; leaving the zone ends the effect.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; the alert radius selects candidates but does not permit firing beyond weapon range.\n- **Acquisition:** Fighter cannon fires at a currently observed legal high-air or low-air target. The missile uses the referenced lock lifecycle and requires a visible legal high-air target at fire time.\n- **Lock / tracking:** Air-to-air missile lock is broken by lost legality, EMP, or lost observation; after launch it homes at 35°/s within its declared tracking behavior. Cannon has no lock or post-launch tracking.\n\n\n### Counterplay\n\nLayered anti-air, fighters, baiting the missile lock, and attacking the airfield answer the Kestrel. Force it to choose between escort coverage and independent pursuit."
