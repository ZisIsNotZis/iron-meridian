  production_behavior: "Cost: `500 resource`; build time: `150 ticks`; facility: `Air Operations`; prerequisites: `Coalition HQ operational`; queue/category: `aircraft / established air denial`; replacement/capacity: `maximum 4 active Kestrels per Air Operations building; rearm uses that building's single FIFO aircraft queue`."
