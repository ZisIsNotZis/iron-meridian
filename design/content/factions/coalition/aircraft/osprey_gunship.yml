  design_rationale: "# Osprey Gunship\n\n## Gameplay identity\n\n- **Roles:** Sustained close air support primary; anti-infantry and light vehicle secondary. Targets exposed ground units.\n- **Locomotion:** Helicopter; hovering and orbit attack movement, with slow acceleration and clear retreat behavior.\n- **Targetability:** High air; selectable by anti-air and fighters, with no immunity from ground effects.\n- **Offense/defense:** Suppression rockets and autocannon; air protection, moderate endurance, poor against heavy armor and concentrated AA.\n- **Skill:** **Attack orbit** — commits to a visible circle around a designated ground target for sustained fire; breaking orbit costs time and exposes its turn.\n- **Production:** Cost: `650 resource`; build time: `180 ticks`; facility: `Air Operations`; prerequisites: `Coalition HQ operational`; queue/category: `aircraft / established close support`; replacement/capacity: `maximum 3 active Ospreys per Air Operations building; rearm uses that building's single FIFO aircraft queue`.\n- **Player experience:** Keep the gunship on a vulnerable orbit for damage or break away before AA converges. Counter with mobile AA, fighters, cover, and forcing it away from its orbit target.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional close-support override: moderate air durability, short range, and poor heavy-armor conversion.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 420 | Light | 6.0 cells/s | 0.48 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Rocket pod | Explosive/area + suppression / ground-personnel, light | 5.0 | 42; 36 ticks (3/3/30), 15 suppression | Projectile 12 cells/s; area 0.55-cell radius; orbit, no homing |\n| Autocannon | Machine gun/autocannon / ground-personnel, light | 4.0 | 20; 15 ticks (0/3/12) | Projectile 18 cells/s; point; orbit, no homing |\n\n**Attack orbit:** 15-tick commitment around a visible ground target at 3.5-cell radius for up to 150 ticks; +20% fire rate while orbiting. 240-tick cooldown; movement order or EMP breaks orbit.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; orbit weapons cannot acquire beyond their listed ranges.\n- **Acquisition:** Both weapons require a currently observed legal ground-personnel or light target. Attack orbit follows the designated target but does not grant fog-of-war vision.\n- **Lock / tracking:** No target lock and no homing. Rocket and autocannon impacts are evaluated from the orbiting source at fire time; movement order or EMP cancels the orbit.\n\n\n### Counterplay\n\nMobile or static anti-air, fighters, cover, and forcing the Osprey away from its orbit reduce its short-range uptime. Focus fire during the visible commitment."
