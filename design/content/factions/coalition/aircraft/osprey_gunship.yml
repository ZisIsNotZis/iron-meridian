  production_behavior: "Cost: `650 resource`; build time: `180 ticks`; facility: `Air Operations`; prerequisites: `Coalition HQ operational`; queue/category: `aircraft / established close support`; replacement/capacity: `maximum 3 active Ospreys per Air Operations building; rearm uses that building's single FIFO aircraft queue`."
