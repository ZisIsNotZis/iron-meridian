design:
  tactical_identity: "Single-target strategic strike primary; structure pressure secondary. Targets a declared high-value structure or massed force."
  offense_behavior: "One heavy guided payload with structural and health damage in a narrow area; air protection but no repeat pressure during reload."
  locomotion_behavior: "Fixed-wing; committed attack run with long turn-around and conspicuous approach."
  targetability_behavior: "High air; vulnerable throughout approach to layered anti-air and fighters."
  acquisition_behavior: "The bomber needs a visible legal ground-vehicle or structure target, or a valid designated point, before the attack run begins. Auto-attack does not select a target outside the alert radius."
  lock_behavior: "45-tick designation plus 60-tick approach warning; the released payload is a stored point impact with no post-release tracking. Leaving the marked point halves damage."
  production_behavior: "Cost: `1,200 resource`; build time: `360 ticks`; facility: `Air Operations`; prerequisites: `Signals Laboratory operational`; queue/category: `aircraft / strategic bomber`; replacement/capacity: `maximum 1 active Stormlance per player; rearm uses one Air Operations building's single FIFO aircraft queue`."
