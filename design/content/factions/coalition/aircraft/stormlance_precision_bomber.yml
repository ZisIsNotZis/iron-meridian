  visual_identity: "Large angular bomber with a visible sensor spine; approach siren, projected target bracket, and a tight high-contrast impact distinguish it from ordinary aircraft."
  design_rationale: "# Stormlance Precision Bomber\n\n## Gameplay identity\n\n- **Roles:** Single-target strategic strike primary; structure pressure secondary. Targets a declared high-value structure or massed force.\n- **Locomotion:** Fixed-wing; committed attack run with long turn-around and conspicuous approach.\n- **Targetability:** High air; vulnerable throughout approach to layered anti-air and fighters.\n- **Offense/defense:** One heavy guided payload with structural and health damage in a narrow area; air protection but no repeat pressure during reload.\n- **Skill:** **Precision payload** — designates one target and begins a warning sequence; destroying, moving, hiding, or jamming the target can reduce the result, and the bomber can be intercepted.\n- **Production:** Cost: `1,200 resource`; build time: `360 ticks`; facility: `Air Operations`; prerequisites: `Signals Laboratory operational`; queue/category: `aircraft / strategic bomber`; replacement/capacity: `maximum 1 active Stormlance per player; rearm uses one Air Operations building's single FIFO aircraft queue`.\n- **Player experience:** Force an opponent to reposition or spend the payload on a decisive structure. Counter with warning response, AA, fighters, decoys, repairs, and dispersal.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional strategic override: large payload and warning window, with low sortie frequency and conspicuous approach.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---|\n| 520 | Light | 8.0 cells/s | 0.62 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Precision payload | Siege/structural + air-to-ground strike / ground-vehicle, structure | 10.0 | 260; 300 ticks (60/6/234) | Attack run; area 0.75-cell radius; designated point, no tracking after release |\n\n**Precision payload:** 45-tick target designation and 60-tick approach warning; impact damage is reduced by 50% if the target leaves the marked point before release. 600-tick cooldown; destroying, jamming, or losing the bomber cancels the run.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; the declared precision range is separate from both sensing radii.\n- **Acquisition:** The bomber needs a visible legal ground-vehicle or structure target, or a valid designated point, before the attack run begins. Auto-attack does not select a target outside the alert radius.\n- **Lock / tracking:** 45-tick designation plus 60-tick approach warning; the released payload is a stored point impact with no post-release tracking. Leaving the marked point halves damage.\n\n\n### Counterplay\n\nLayered anti-air, fighters, warning response, movement, dispersal, decoys, repairs, or jamming interrupt or reduce the strike. The approach is intentionally conspicuous."
