design:
  tactical_identity: "Precision strike primary; anti-armor and anti-structure secondary. Targets designated high-value ground assets."
  offense_behavior: "Precision guided bombs or missiles with health and structural channels; air protection and speed, but limited payload and sortie downtime."
  locomotion_behavior: "Fixed-wing; strafe/attack-run movement, short engagement window, mandatory return path after ordnance."
  targetability_behavior: "High air; vulnerable to AA during approach and departure, with no hovering state."
  acquisition_behavior: "The strike requires a visible legal ground-vehicle or structure target. A designation may be supplied by an allied observer, but it never bypasses target-domain legality."
  lock_behavior: "30-tick designation lock; movement, smoke, jamming, or lost line of sight cancels before release. The attack-run payload stores its point and has no post-release tracking."
  production_behavior: "Cost: `800 resource`; build time: `240 ticks`; facility: `Air Operations`; prerequisites: `Signals Laboratory operational`; queue/category: `aircraft / advanced precision strike`; replacement/capacity: `maximum 2 active Swiftwings per Air Operations building; rearm uses that building's single FIFO aircraft queue`."
  player_decision: "Commit a scarce sortie to a key target or preserve it while searching for a cleaner opening. Counter with AA overlap, decoys, smoke, movement, and attacking the airfield."
  visual_identity: "Thin delta-wing jet and bright sensor pod; a narrow approach line and warning tone precede the strike, followed by restrained impact bloom."
  design_rationale: "# Swiftwing Strike Jet\n\n## Gameplay identity\n\n- **Roles:** Precision strike primary; anti-armor and anti-structure secondary. Targets designated high-value ground assets.\n- **Locomotion:** Fixed-wing; strafe/attack-run movement, short engagement window, mandatory return path after ordnance.\n- **Targetability:** High air; vulnerable to AA during approach and departure, with no hovering state.\n- **Offense/defense:** Precision guided bombs or missiles with health and structural channels; air protection and speed, but limited payload and sortie downtime.\n- **Skill:** **Designated strike** — accepts a visible lock to improve accuracy and choose a narrow target profile; smoke, jamming, or movement can spoil the run.\n- **Production:** Cost: `800 resource`; build time: `240 ticks`; facility: `Air Operations`; prerequisites: `Signals Laboratory operational`; queue/category: `aircraft / advanced precision strike`; replacement/capacity: `maximum 2 active Swiftwings per Air Operations building; rearm uses that building's single FIFO aircraft queue`.\n- **Player experience:** Commit a scarce sortie to a key target or preserve it while searching for a cleaner opening. Counter with AA overlap, decoys, smoke, movement, and attacking the airfield.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional sortie override: high air speed and burst damage with a long return interval.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 300 | Light | 11.0 cells/s | 0.34 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Precision strike payload | Air-to-ground strike + structural / ground-vehicle, structure | 9.0 | 150; 180 ticks (45/6/129) | Attack run; area 0.50-cell radius; designated point, no tracking after release |\n\n**Designated strike:** 30-tick lock on a visible target; payload gains +20% damage and shows a 45-tick approach warning. 300-tick cooldown; smoke, jamming, movement, or lost line of sight cancels the run.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; alerting cannot fire the payload beyond its 9.0-cell range.\n- **Acquisition:** The strike requires a visible legal ground-vehicle or structure target. A designation may be supplied by an allied observer, but it never bypasses target-domain legality.\n- **Lock / tracking:** 30-tick designation lock; movement, smoke, jamming, or lost line of sight cancels before release. The attack-run payload stores its point and has no post-release tracking.\n\n\n### Counterplay\n\nOverlap anti-air, use fighters, move the marked target, deploy decoys or smoke, jam the designation, or attack the airfield. The jet has only a short firing window and must return after ordnance."
