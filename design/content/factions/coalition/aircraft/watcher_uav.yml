  design_rationale: "# Watcher UAV\n\n## Gameplay identity\n\n- **Roles:** Persistent reconnaissance primary; target designation secondary. It does not deal meaningful damage.\n- **Locomotion:** Drone; hovering/orbit movement with limited endurance and a visible return or expiration behavior.\n- **Targetability:** High air; fragile and detectable by ordinary anti-air once revealed. Its sensor signature grows while scanning.\n- **Offense/defense:** No weapon; air protection and low health. Its value is information.\n- **Skill:** **Survey sweep** — scans a moving wedge and shares a temporary track; the sweep broadcasts the UAV and can be interrupted by jamming or destruction.\n- **Production:** Cost: `450 resource`; build time: `120 ticks`; facility: `Air Operations`; prerequisites: `Signals Laboratory operational`; queue/category: `aircraft / advanced reconnaissance`; replacement/capacity: `maximum 2 active Watchers per Air Operations building; rearm and replacement use that building's single FIFO aircraft queue`.\n- **Player experience:** Pay for reliable vision or use cheaper scouts and accept gaps. Counter with fighters, AA, jamming, decoys, or attacking its launch facility.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional information override: no weapon, low HP, and strong temporary sensing.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 140 | Light | 5.0 cells/s | 0.28 cell | 10.0 cells | 12.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| None | — | — | — | No attack; designation platform only |\n\n**Survey sweep:** 30-tick scan of a 120° cone to 16 cells; reveals contacts and shares tracks for 120 ticks. 300-tick cooldown; the UAV is broadcast while scanning and EMP interrupts it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 10.0 / 12.0 cells; the scan extends observation to its declared 16-cell cone but does not create a weapon attack.\n- **Acquisition:** The UAV observes contacts and shares temporary tracks; it does not auto-acquire an attack target and has no damage weapon.\n- **Lock / tracking:** No weapon lock. Survey tracks last 120 ticks and are information, not guaranteed target positions for another unit's projectile.\n\n\n### Counterplay\n\nFighters, anti-air, jamming, decoys, or attacking the launch facility deny the UAV. It is fragile and becomes especially conspicuous while scanning."
