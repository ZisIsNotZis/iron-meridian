  design_rationale: "# Coalition HQ\n\n## Gameplay identity\n\n- **Footprint:** `4 × 4` cells; four cardinal facings; one construction-vehicle exit on the exposed service side.\n- **Health / protection:** 1,200 HP; `reinforcedStructure`; no special resistance override.\n- **Targetability:** Structure; always visible when discovered; no stealth or hidden global targeting.\n- **Production:** Role: starting base anchor and loss condition; cost: `0 resource`; build time: `0 ticks`; facility: `scenario start`; prerequisites: `none`; queue/category: `none / base anchor`; replacement/capacity: `one starting HQ per player; not producible or rebuildable in V1`.\n- **Skill / passive:** **Command anchor** — provides the shared `12`-cell construction anchor; no combat aura and no production queue.\n- **Placement:** Starting completed asset or within the shared HQ/construction placement rules; cannot overlap routes, objective exclusion, resources, units, or buildings.\n- **Player decision:** Preserve a safe anchor or expose it near a contested resource/objective to shorten response time.\n- **Counterplay:** Scout the construction vehicle and attack the HQ through an opened lane; base defenses and relocation do not remove the destruction victory condition.\n- **Asset design:** See [entity asset manifest](assets.md)."
