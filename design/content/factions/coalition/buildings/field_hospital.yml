  visual_identity: "Low clinic module, red-white-blue markings, ambulance bay, restrained healing pulse, and clear service-link icon."
  design_rationale: "# Field Hospital\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; two infantry service cells.\n- **Health / protection:** 450 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible support target; no stealth or global healing.\n- **Production:** Role: local infantry sustainment; cost: `450 resource`; build time: `240 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ and Infantry Center operational`; queue/category: `construction / repair`; replacement/capacity: `maximum 2 operational hospitals; one active service target per hospital; one builder assignment`.\n- **Skill / passive:** **Triage station** — one nearby allied infantry group is restored at `8 HP/second` and loses `10 suppression points/second`; service radius `3` cells, one target, interrupted by EMP or destruction.\n- **Placement:** Buildable terrain inside shared anchors; service cells must remain clear and cannot touch route/objective exclusions.\n- **Player decision:** Put sustainment behind the line or forward for faster recovery while making the site a raid target.\n- **Counterplay:** Focus the hospital, EMP it, or force infantry away; vehicles, aircraft, and structures receive no service.\n- **Asset design:** See [entity asset manifest](assets.md)."
