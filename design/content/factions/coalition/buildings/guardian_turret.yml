  design_rationale: "# Guardian Turret\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; directional turret arc shown during placement and selection.\n- **Health / protection:** 550 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible; turret is disabled by EMP while its weapon is electronic.\n- **Production:** Role: local anti-vehicle defense; cost: `550 resource`; build time: `300 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / defense`; replacement/capacity: `maximum 4 operational turrets; one weapon per turret; one builder assignment`.\n- **Skill / passive:** **Precision missile** — anti-armor penetrator projectile against ground-vehicle within `7.0` cells; 70 damage/event, 45-tick period, projectile `15` cells/s, 15-tick lock, 60° firing arc, 20°/s tracking, point hit. Always active while operational; no power grid.\n- **Placement:** Buildable terrain inside shared anchors; facing is meaningful and its arc cannot be hidden by a footprint or route marker.\n- **Player decision:** Cover the expected armor lane or rotate coverage toward a new threat, accepting a blind side.\n- **Counterplay:** Flank outside the arc, use infantry/indirect fire, outrange it, EMP it, or force it to waste lock time on cheaper targets.\n- **Asset design:** See [entity asset manifest](assets.md)."
