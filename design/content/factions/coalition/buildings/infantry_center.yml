  design_rationale: "# Infantry Center\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; two infantry exits on the front edge.\n- **Health / protection:** 500 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; ordinary discovered target; exits are blocked by the shared footprint validator.\n- **Production:** Role: infantry production; cost: `400 resource`; build time: `240 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / infantry production`; replacement/capacity: `maximum 2 operational centers; one FIFO infantry queue per center; one builder assignment`.\n- **Skill / passive:** **Drill cycle** — passive queue production; no global training aura.\n- **Placement:** Buildable terrain inside a construction anchor; front exits must have valid cells and cannot occupy a route or objective exclusion.\n- **Player decision:** Put it safely behind the HQ or forward for shorter reinforcement paths and greater raid risk.\n- **Counterplay:** Destroying it stops new infantry orders and loses queued work; attack its exposed exits or use area fire against reinforcements.\n- **Asset design:** See [entity asset manifest](assets.md)."
