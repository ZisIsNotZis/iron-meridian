  visual_identity: "Modular pier and drydock, blue waterline markers, crane lights, wake on launch, and a low harbor horn on completion."
  design_rationale: "# Littoral Dock\n\n## Gameplay identity\n\n- **Footprint:** `4 × 3` cells; shoreline-facing construction only; one water launch channel and one service cell.\n- **Health / protection:** 650 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; surface target from land, naval weapons from water; channel is not a hidden escape.\n- **Production:** Role: naval production; cost: `650 resource`; build time: `360 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational and legal shoreline`; queue/category: `construction / naval production`; replacement/capacity: `maximum 2 operational docks on legal shorelines; one FIFO naval queue per dock; one builder assignment`.\n- **Skill / passive:** **Launch control** — passive launch and repair handling; does not provide a global naval network.\n- **Placement:** Must touch legal shoreline with the full footprint on buildable cells and a valid water channel; irrelevant on land-only maps.\n- **Player decision:** Establish sea denial from a protected inlet or accept a forward dock's shorter route and raid risk.\n- **Counterplay:** Shore fire, aircraft, submarines, or a direct dock raid stop production; attack the launch channel to delay completed vessels.\n- **Asset design:** See [entity asset manifest](assets.md)."
