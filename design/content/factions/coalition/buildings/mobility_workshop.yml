  design_rationale: "# Mobility Workshop\n\n## Gameplay identity\n\n- **Footprint:** `3 × 3` cells; four facings; one vehicle service edge.\n- **Health / protection:** 600 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible support target; EMP disables its active logistics skill.\n- **Production:** Role: advanced mobility and sustainment unlock; cost: `750 resource`; build time: `390 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ and Vehicle Assembly operational`; queue/category: `construction / technology`; replacement/capacity: `maximum 1 operational workshop; no production queue; one builder assignment`.\n- **Skill / passive:** **Route staging** — marks one allied ground or amphibious vehicle within `6` cells for +25% movement for 60 ticks; 240-tick cooldown and no stacking.\n- **Placement:** Buildable terrain inside shared anchors; route staging requires a clear service cell and does not bypass impassable terrain.\n- **Player decision:** Buy map access and tempo or keep the advanced investment for combat production.\n- **Counterplay:** Attack or EMP the workshop; force the staged unit into terrain or wait out the visible burst.\n- **Asset design:** See [entity asset manifest](assets.md)."
