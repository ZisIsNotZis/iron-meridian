  design_rationale: "# Precision Battery\n\n## Gameplay identity\n\n- **Footprint:** `3 × 3` cells; four facings; firing direction and crew side are visible.\n- **Health / protection:** 650 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible firing position; weapon and guidance are disabled by EMP.\n- **Production:** Role: strategic indirect support; cost: `900 resource`; build time: `450 ticks`; facility: `Construction Vehicle`; prerequisites: `Signals Laboratory operational`; queue/category: `construction / strategic defense`; replacement/capacity: `maximum 2 operational batteries; one weapon per battery; one builder assignment`.\n- **Skill / passive:** **Precision bombardment** — 30-tick setup, designated point within `12` cells, 120 damage/event, 90-tick period, projectile 7 cells/s, area hit with `0.8`-cell radius and 50% edge damage, indirect point designation, no tracking; 240-tick cooldown.\n- **Placement:** Requires shared builder anchor, legal line-of-fire and clear service cells; cannot occupy primary routes or objective exclusion.\n- **Player decision:** Invest in long-range area denial against a static position or choose more mobile forces and preserve flexibility.\n- **Counterplay:** Attack during setup/reload, move out of the warning, flank the battery, use aircraft, or EMP its guidance.\n- **Asset design:** See [entity asset manifest](assets.md)."
