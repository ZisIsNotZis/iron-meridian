  design_rationale: "# Relay Station\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; one service cell.\n- **Health / protection:** 350 HP; `reinforcedStructure`; fragile temporary-site override.\n- **Targetability:** Structure; visible after discovery; EMP disables its relay effect.\n- **Production:** Role: temporary forward relay; cost: `400 resource`; build time: `180 ticks`; facility: `Construction Vehicle`; prerequisites: `Signals Laboratory operational`; queue/category: `construction / temporary support`; replacement/capacity: `maximum 3 operational stations; one active relay bubble per station; one builder assignment`.\n- **Skill / passive:** **Forward relay** — 20-tick deployment, 5-cell bubble for 180 ticks, +15% warning radius and -5 lock ticks for allied units inside; 300-tick cooldown, one bubble, no stacking.\n- **Placement:** Builder anchor required; may be placed on legal forward buildable cells but not routes or objective exclusion zones.\n- **Player decision:** Buy a forward timing window at the cost of a fragile, exposed structure or keep the army independent.\n- **Counterplay:** Scout and destroy/EMP the station, force units outside its bubble, or wait for the bounded duration.\n- **Asset design:** See [entity asset manifest](assets.md)."
