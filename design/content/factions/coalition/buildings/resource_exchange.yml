  design_rationale: "# Resource Exchange\n\n## Gameplay identity\n\n- **Footprint:** `3 × 3` cells; four facings; one harvester docking edge and one service interaction cell.\n- **Health / protection:** 650 HP; `reinforcedStructure`; no armor override.\n- **Targetability:** Structure; visible while operational; unloading bay is not a separate target.\n- **Production:** Role: resource processor; cost: `500 resource`; build time: `300 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / economy`; replacement/capacity: `maximum 1 operational processor per player; replacement allowed while HQ survives; one builder assignment`.\n- **Skill / passive:** **Process and repair** — unloads a docked cargo load at\n  `40 resource/tick`, repairs a docked harvester at `5 condition/second`, and\n  cannot create resource.\n- **Placement:** Buildable terrain within the shared HQ/builder anchor rules; keep the docking edge clear and off authored routes.\n- **Player decision:** Place near a rich route for throughput or behind the base for safety, accepting longer travel.\n- **Counterplay:** Raid the processor or cut the approach route; destruction stops unloading and repair but does not remove banked resource.\n- **Asset design:** See [entity asset manifest](assets.md)."
