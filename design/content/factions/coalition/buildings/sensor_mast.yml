  design_rationale: "# Sensor Mast\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; mast occupies a visual center but not extra collision space.\n- **Health / protection:** 400 HP; `reinforcedStructure`; intentionally fragile support-site override.\n- **Targetability:** Structure; visible when discovered; its sensor can be disabled by EMP.\n- **Production:** Role: local detection; cost: `350 resource`; build time: `180 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / detection`; replacement/capacity: `maximum 3 operational masts; no production queue; one builder assignment`.\n- **Skill / passive:** **Active scan** — 15-tick setup, reveals a 120° cone to `12` cells for 90 ticks, 240-tick cooldown; scan broadcasts the mast.\n- **Placement:** Buildable terrain within shared anchors; prefers a clear sightline but cannot override fog, blockers, or map restrictions.\n- **Player decision:** Expose a valuable mast for information or rely on mobile scouts and accept uncertainty.\n- **Counterplay:** Attack, EMP, jam, or approach through blockers; the mast does not grant global firing permission.\n- **Asset design:** See [entity asset manifest](assets.md)."
