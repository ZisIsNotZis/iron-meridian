  design_rationale: "# Signals Laboratory\n\n## Gameplay identity\n\n- **Footprint:** `3 × 3` cells; four facings; one service cell.\n- **Health / protection:** 600 HP; `reinforcedStructure`; no global protection effect.\n- **Targetability:** Structure; visible; electronic functions can be disabled by EMP under shared rules.\n- **Production:** Role: advanced communications and targeting unlock; cost: `800 resource`; build time: `420 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ and Infantry Center operational`; queue/category: `construction / technology`; replacement/capacity: `maximum 1 operational laboratory; no production queue; one builder assignment`.\n- **Skill / passive:** **Target analysis** — one visible target designation within `10` cells, 30-tick setup, 120-tick duration, 240-tick cooldown; EMP interrupts it.\n- **Placement:** Buildable within shared anchors; cannot overlap objective exclusion or routes; benefits from sightline but does not create one by itself.\n- **Player decision:** Invest in precision and information or spend the same resource on immediate force.\n- **Counterplay:** Scout and disable/destroy the lab, break its line of sight, or force designation cooldowns; disconnected units retain baseline function.\n- **Asset design:** See [entity asset manifest](assets.md)."
