  design_rationale: "# Skyguard Node\n\n## Gameplay identity\n\n- **Footprint:** `2 × 2` cells; four facings; local air-sector arc shown during placement and selection.\n- **Health / protection:** 500 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible; electronic anti-air is disabled by EMP.\n- **Production:** Role: local anti-air defense; cost: `600 resource`; build time: `330 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / defense`; replacement/capacity: `maximum 4 operational nodes; one weapon per node; one builder assignment`.\n- **Skill / passive:** **Air intercept** — anti-air missile against high-air/low-air within `8.0` cells; 60 damage/event, 36-tick period, 6-tick lock, 90° arc, 30°/s homing, projectile 15 cells/s, point hit.\n- **Placement:** Buildable terrain inside shared anchors; arc and local zone must remain readable and cannot create a global umbrella.\n- **Player decision:** Protect the base, production apron, or forward route; relocating emphasis requires a new placement or deliberate facing.\n- **Counterplay:** Attack from outside its zone, use ground assault/indirect fire, overwhelm with multiple attack runs, or EMP the node.\n- **Asset design:** See [entity asset manifest](assets.md)."
