  design_rationale: "# Vehicle Assembly\n\n## Gameplay identity\n\n- **Footprint:** `3 × 3` cells; four facings; one broad vehicle exit.\n- **Health / protection:** 750 HP; `reinforcedStructure`; no override.\n- **Targetability:** Structure; visible high-value production target; exit blockage pauses completed production.\n- **Production:** Role: ground-vehicle production; cost: `700 resource`; build time: `360 ticks`; facility: `Construction Vehicle`; prerequisites: `Coalition HQ operational`; queue/category: `construction / vehicle production`; replacement/capacity: `maximum 2 operational assemblies; one FIFO vehicle queue per assembly; one builder assignment`.\n- **Skill / passive:** **Rapid sortie** — passive queue production; no acceleration button or parallel queue.\n- **Placement:** Buildable terrain inside shared anchor rules; exit must open onto legal ground and cannot block a primary route.\n- **Player decision:** Protect throughput centrally or move production toward the threatened lane for faster response.\n- **Counterplay:** Raid the building, block its exit, or force a queue choice between army and economic replacement; destroyed queued work is lost.\n- **Asset design:** See [entity asset manifest](assets.md)."
