design:
  tactical_identity: "Anti-structure and close assault primary; garrison clearing secondary. Targets buildings, emplacements, and clustered infantry."
  offense_behavior: "Satchel charges and compact shotguns; personnel armor, low sustained damage, high burst against structures. Charges are limited by cooldown and placement time."
  locomotion_behavior: "Foot; ordinary ground movement, can enter structures but is vulnerable during approach."
  targetability_behavior: "Ground/personnel; normal sight, no stealth. Short range creates the main vulnerability."
  acquisition_behavior: "The shotgun uses Direct acquisition against observed legal ground-personnel or light targets. The breach charge uses Point/designated acquisition against an observed adjacent structure."
  lock_behavior: "Neither weapon has a post-launch lock or tracking. The charge's 45-tick attachment is a stationary setup; movement, EMP, damage, or loss of adjacency cancels it."
  production_behavior: "Cost: `180 resource`; build time: `75 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / established`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`."
  player_decision: "Find a safe approach and choose between base damage and clearing a key emplacement. Counter with screening infantry, detection, focus fire, walls, or moving the threatened asset."
  visual_identity: "Breaching packs and bright warning tape; charge projects a readable pulsing blue timer and a sharp directional breach flash."
  design_rationale: "# Breach Team\n\n## Gameplay identity\n\n- **Roles:** Anti-structure and close assault primary; garrison clearing secondary. Targets buildings, emplacements, and clustered infantry.\n- **Locomotion:** Foot; ordinary ground movement, can enter structures but is vulnerable during approach.\n- **Targetability:** Ground/personnel; normal sight, no stealth. Short range creates the main vulnerability.\n- **Offense/defense:** Satchel charges and compact shotguns; personnel armor, low sustained damage, high burst against structures. Charges are limited by cooldown and placement time.\n- **Skill:** **Plant charge** — attaches a delayed structural charge or forces a garrison to evacuate; interruption, distance, or destroying the team counters it.\n- **Production:** Cost: `180 resource`; build time: `75 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / established`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Find a safe approach and choose between base damage and clearing a key emplacement. Counter with screening infantry, detection, focus fire, walls, or moving the threatened asset.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional close-assault override: lower speed and higher burst than the entity-owned infantry role values.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 180 | Personnel | 2.8 cells/s | 0.24 cell | 6.0 cells | 7.5 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Compact shotgun | Explosive / ground-personnel, light | 2.2 | 34; 36 ticks (6/3/27) | Projectile 10 cells/s; area, 0.45-cell radius; direct, no homing |\n| Breach charge | Structural / structure | 1.0 | 120; 150 ticks (45/0/105) | Point attachment; point; no tracking; requires adjacent target |\n\n**Plant charge:** 45-tick setup at range 1.0, charge detonates after 90 ticks, 240-tick cooldown; interruption or team death cancels it. The target displays a warning and may move if not a fixed structure.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 6.0 / 7.5 cells; alerting selects candidates but does not extend either weapon's range.\n- **Acquisition:** The shotgun uses Direct acquisition against observed legal ground-personnel or light targets. The breach charge uses Point/designated acquisition against an observed adjacent structure.\n- **Lock / tracking:** Neither weapon has a post-launch lock or tracking. The charge's 45-tick attachment is a stationary setup; movement, EMP, damage, or loss of adjacency cancels it.\n\n\n### Counterplay\n\nScreen the approach, use detection and focus fire, interrupt the setup, or move a threatened non-fixed target before detonation. Area fire and crush pressure punish the squad before it reaches attachment range."
