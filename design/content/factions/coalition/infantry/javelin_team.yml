  visual_identity: "Two-person launcher with a projected lock bracket; missile trails are thin and directional, with a clear broken-lock chirp."
  design_rationale: "# Javelin Team\n\n## Gameplay identity\n\n- **Roles:** Anti-armor and limited anti-air primary; area denial secondary. Targets heavy vehicles and low/high air within lock rules.\n- **Locomotion:** Foot; can move between shots, but launcher lock requires a short stationary windup.\n- **Targetability:** Ground/personnel; ordinary vision, vulnerable to small arms, vehicles, and artillery while locking.\n- **Offense/defense:** Lock-on tandem missiles with anti-armor and limited anti-air profiles; personnel armor and modest range. Inefficient against swarms and buildings.\n- **Skill:** **Designate target** — hold a visible lock to improve the next volley and share aim data; moving, jamming, smoke, or line-of-sight loss breaks it.\n- **Production:** Cost: `240 resource`; build time: `90 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / established`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Fire a quick weaker shot to survive or risk a full lock for decisive damage. Counter with infantry screens, smoke, jamming, fast flanks, or forcing target swaps.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the entity-owned anti-tank role values; the anti-air domain is an intentional targetability extension.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 230 | Light | 2.7 cells/s | 0.32 cell | 7.0 cells | 8.5 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Javelin missile | Anti-armor penetrator / ground-vehicle, low-air, high-air | 7.5 | 105; 90 ticks (15/6/69) | Projectile 9 cells/s; point; lock, 20°/s homing after launch |\n\n**Designate target:** 15-tick lock at 7.5 cells; the next missile gains +20% damage and a 30° homing cone; 180-tick cooldown. Movement, smoke, EMP, or lost line of sight breaks the lock.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 8.5 cells; alerting cannot fire beyond the missile's 7.5-cell range.\n- **Acquisition:** The missile uses Lock acquisition against an observed legal ground-vehicle, low-air, or high-air target. The team must retain line of sight and a legal target through its 15-tick windup.\n- **Lock / tracking:** The referenced lock lifecycle applies. Movement, smoke, EMP, lost line of sight, or leaving the legal domain breaks the lock; after launch the projectile homes only within its 20°/s behavior and declared cone.\n\n\n### Counterplay\n\nUse infantry screens, smoke, jamming, fast flanks, or target swaps to break the lock. Force the team to choose between a quick weaker engagement and a vulnerable full windup; do not offer it heavy-armor protection."
