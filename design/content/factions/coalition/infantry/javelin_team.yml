design:
  tactical_identity: "Anti-armor and limited anti-air primary; area denial secondary. Targets heavy vehicles and low/high air within lock rules."
  offense_behavior: "Lock-on tandem missiles with anti-armor and limited anti-air profiles; personnel armor and modest range. Inefficient against swarms and buildings."
  locomotion_behavior: "Foot; can move between shots, but launcher lock requires a short stationary windup."
  targetability_behavior: "Ground/personnel; ordinary vision, vulnerable to small arms, vehicles, and artillery while locking."
  acquisition_behavior: "The missile uses Lock acquisition against an observed legal ground-vehicle, low-air, or high-air target. The team must retain line of sight and a legal target through its 15-tick windup."
  lock_behavior: "The referenced lock lifecycle applies. Movement, smoke, EMP, lost line of sight, or leaving the legal domain breaks the lock; after launch the projectile homes only within its 20°/s behavior and declared cone."
  production_behavior: "Cost: `240 resource`; build time: `90 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / established`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`."
