  design_rationale: "# Line Rifle\n\n## Gameplay identity\n\n- **Roles:** Line infantry primary; screening and capture secondary. Targets personnel and light exposed units.\n- **Locomotion:** Foot; ordinary ground movement, can garrison suitable structures. Infantry collision and crush vulnerability apply.\n- **Targetability:** Ground/personnel; visible at ordinary sight range and vulnerable to explosives and suppression.\n- **Offense/defense:** Reliable rifle volley, personnel armor, moderate squad health. Poor against heavy armor and structures.\n- **Skill:** **Brace** — squad anchors briefly, improving accuracy and suppression resistance while reducing movement; canceling early gives no benefit.\n- **Production:** Cost: `100 resource`; build time: `45 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / field`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Hold a firing line at the right moment or keep moving to avoid artillery and vehicles. Counter with armor, area damage, flanking, or crush pressure.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the referenced global profiles and the explicit values below.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 180 | Personnel | 3.0 cells/s | 0.22 cell | 6.5 cells | 8.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Service rifle volley | Rifle / ground-personnel, light | 4.5 | 22; 30 ticks (3/3/24) | Projectile 14 cells/s; point; direct, no homing |\n\n**Brace:** 30-tick setup; lasts 120 ticks, grants +20% suppression resistance and +10% effective range, and prevents movement. 180-tick cooldown; movement or EMP cancels it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 6.5 / 8.0 cells; alerting selects observed candidates but cannot extend the rifle's range.\n- **Acquisition:** The service rifle uses Direct acquisition against observed legal ground-personnel or light targets. Garrisoning preserves ordinary target legality but does not create extra range.\n- **Lock / tracking:** No lock or post-launch tracking; each point projectile resolves from its firing position. Brace is not an attack lock and does not retain a target.\n\n\n### Counterplay\n\nUse area damage, artillery, armor, flanking, or crush pressure while the squad is anchored. Force it to move and it loses the brace benefit; heavy armor remains a poor rifle target under the shared matrix."
