  tactical_identity: "Line infantry primary; screening and capture secondary. Targets personnel and light exposed units."
  offense_behavior: "Reliable rifle volley, personnel armor, moderate squad health. Poor against heavy armor and structures."
  locomotion_behavior: "Foot; ordinary ground movement, can garrison suitable structures. Infantry collision and crush vulnerability apply."
  targetability_behavior: "Ground/personnel; visible at ordinary sight range and vulnerable to explosives and suppression."
  acquisition_behavior: "The service rifle uses Direct acquisition against observed legal ground-personnel or light targets. Garrisoning preserves ordinary target legality but does not create extra range."
  lock_behavior: "No lock or post-launch tracking; each point projectile resolves from its firing position. Brace is not an attack lock and does not retain a target."
  production_behavior: "Cost: `100 resource`; build time: `45 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / field`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`."
