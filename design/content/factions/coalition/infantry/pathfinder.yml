design:
  tactical_identity: "Recon primary; infiltration and capture support secondary. Targets exposed infantry, scouts, and objectives rather than armor."
  offense_behavior: "Compact rifle and a weak close-defense burst; personnel armor and low health. It wins through information, not duels."
  locomotion_behavior: "Foot; fast ground movement, can enter cover and civilian structures. Cannot crush or survive open fights."
  targetability_behavior: "Ground/personnel; ordinary vision when moving, reduced signature while stationary in cover. Detection or damage reveals it."
  acquisition_behavior: "The compact rifle uses Direct acquisition against observed legal ground-personnel or light targets. Mark route selects its first observed contact in the 90° cone; it does not fire and cannot designate through fog of war."
  lock_behavior: "The rifle has no lock or post-launch tracking. The shared contact designation lasts 90 ticks as information/aim assistance, not as a homing track; it expires or breaks if the Pathfinder is destroyed or the skill is interrupted."
  production_behavior: "Cost: `150 resource`; build time: `60 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / field`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`."
  player_decision: "Decide whether to preserve a scout's vision or spend it to secure a firing advantage. Counter with dogs/fast scouts, detection, area fire, or simply denying routes."
  visual_identity: "Light jacket, folded sensor mast, blue-green map pulse on designation; no permanent glowing stealth effect."
  design_rationale: "# Pathfinder\n\n## Gameplay identity\n\n- **Roles:** Recon primary; infiltration and capture support secondary. Targets exposed infantry, scouts, and objectives rather than armor.\n- **Locomotion:** Foot; fast ground movement, can enter cover and civilian structures. Cannot crush or survive open fights.\n- **Targetability:** Ground/personnel; ordinary vision when moving, reduced signature while stationary in cover. Detection or damage reveals it.\n- **Offense/defense:** Compact rifle and a weak close-defense burst; personnel armor and low health. It wins through information, not duels.\n- **Skill:** **Mark route** — briefly reveals a path-sized area and designates the first enemy contact for allied aim assistance; breaks stealth and has a conspicuous flare.\n- **Production:** Cost: `150 resource`; build time: `60 ticks`; facility: `Infantry Center`; prerequisites: `Coalition HQ operational`; queue/category: `infantry / field`; replacement/capacity: `no per-unit cap; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Decide whether to preserve a scout's vision or spend it to secure a firing advantage. Counter with dogs/fast scouts, detection, area fire, or simply denying routes.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the entity-owned scout role values unless noted.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 120 | Light | 5.5 cells/s | 0.28 cell | 9.0 cells | 11.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Compact rifle | Rifle / ground-personnel, light | 5.5 | 16; 24 ticks (0/3/21) | Projectile 12 cells/s; point; direct, no homing |\n\n**Mark route:** self-centered, 15-tick setup; reveals a 90° cone to 12 cells and designates its first contact for 90 ticks; 240-tick cooldown. The flare breaks cover and the Pathfinder cannot move during setup.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 9.0 / 11.0 cells; the scan cone is a skill-specific 12-cell observation effect, not rifle range.\n- **Acquisition:** The compact rifle uses Direct acquisition against observed legal ground-personnel or light targets. Mark route selects its first observed contact in the 90° cone; it does not fire and cannot designate through fog of war.\n- **Lock / tracking:** The rifle has no lock or post-launch tracking. The shared contact designation lasts 90 ticks as information/aim assistance, not as a homing track; it expires or breaks if the Pathfinder is destroyed or the skill is interrupted.\n\n\n### Counterplay\n\nUse detection, dogs or fast scouts, area fire, route denial, and cover discipline. Attack during the stationary setup or force the Pathfinder to reveal itself before it can provide the designation."
