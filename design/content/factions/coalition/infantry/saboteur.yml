  design_rationale: "# Saboteur\n\n## Gameplay identity\n\n- **Roles:** Infiltration and timed disruption primary; reconnaissance secondary. Targets production, power, or logistics structures, not combat units.\n- **Locomotion:** Foot; slow while carrying a sabotage kit, can use cover and structures. Cannot disguise as enemy units.\n- **Targetability:** Ground/personnel; reduced detection distance while stationary in cover, but dedicated detection and damage reveal it.\n- **Offense/defense:** Concealed charge and pistol; personnel armor, low health. It is not an assassin.\n- **Skill:** **Sabotage** — begins a visible-to-owner, detectable timed disruption on an eligible structure; interruption, detection, or structure relocation cancels it.\n- **Production:** Cost: `350 resource`; build time: `120 ticks`; facility: `Infantry Center`; prerequisites: `Signals Laboratory operational`; queue/category: `infantry / advanced infiltration`; replacement/capacity: `maximum 2 active Saboteurs per player; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Trade an infantry slot for a precise temporary opening, choosing a structure whose disruption changes the battle. Counter with detection, patrols, walls, structure spacing, or immediate focus fire.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional infiltration override: low HP and speed for a structure-only disruption.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 110 | Personnel | 2.6 cells/s | 0.22 cell | 6.5 cells | 7.5 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Concealed pistol | Rifle / ground-personnel | 2.5 | 6; 36 ticks (3/3/30) | Projectile 12 cells/s; point; direct, no homing |\n\n**Sabotage:** 30-tick setup adjacent to an eligible structure, then disables its production, sensing, or defense for 120 ticks; 300-tick cooldown. Detection, damage, EMP, or movement interrupts it. No health damage and no effect on HQ loss rules.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 6.5 / 7.5 cells; cover may reduce the Saboteur's detectable signature, but alerting does not extend weapon or sabotage range.\n- **Acquisition:** The pistol uses Direct acquisition against observed legal ground-personnel. Sabotage uses Point/designated acquisition on an eligible structure only and requires adjacency at setup.\n- **Lock / tracking:** The pistol has no lock or post-launch tracking. Sabotage is a 30-tick command-linked setup; detection, damage, EMP, movement, or loss of adjacency cancels it, with no effect applied after cancellation.\n\n\n### Counterplay\n\nUse detection, patrols, walls, structure spacing, and immediate focus fire. Interrupt the adjacent setup or move/secure the affected asset where the structure rules allow it; the Saboteur cannot disguise as an enemy unit."
