  production_behavior: "Cost: `350 resource`; build time: `120 ticks`; facility: `Infantry Center`; prerequisites: `Signals Laboratory operational`; queue/category: `infantry / advanced infiltration`; replacement/capacity: `maximum 2 active Saboteurs per player; one FIFO infantry queue; replacement competes with new units`."
