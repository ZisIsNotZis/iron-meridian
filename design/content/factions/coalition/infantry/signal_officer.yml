  design_rationale: "# Signal Officer\n\n## Gameplay identity\n\n- **Roles:** Local command support primary; target designation and communications recovery secondary. It multiplies nearby forces rather than replacing them.\n- **Locomotion:** Foot; ordinary ground movement, can garrison but loses its best range there.\n- **Targetability:** Ground/personnel; ordinary vision, low health, and a visible communications signature while active.\n- **Offense/defense:** Pistol and smoke grenade; personnel armor. Baseline damage is intentionally negligible.\n- **Skill:** **Forward net** — deploys a temporary local relay bubble that improves allied lock time, warning, and order responsiveness; units outside it retain baseline function, and the officer is interruptible.\n- **Production:** Cost: `300 resource`; build time: `105 ticks`; facility: `Infantry Center`; prerequisites: `Signals Laboratory operational`; queue/category: `infantry / advanced support`; replacement/capacity: `maximum 2 active Signal Officers per player; one FIFO infantry queue; replacement competes with new units`.\n- **Player experience:** Place a fragile force multiplier where a push will happen, or keep it safe for a later window. Counter by flanking, jamming, forcing movement, or killing the officer; no faction-wide shutdown occurs.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional command-support override: fragile personnel with no meaningful combat output.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 140 | Personnel | 3.0 cells/s | 0.22 cell | 7.0 cells | 8.5 cells |\n\nThe mounted weapon is [Service Pistol](../../../../../weapons/service-pistol/service-pistol.md).\nIts concrete damage, range, delivery, and timing are defined only by that\nfirst-class weapon object.\n\n**Forward net:** 30-tick deployment; projects a 4.0-cell bubble for 180 ticks, granting allied units inside +15% warning radius and -5 lock ticks, without changing weapon range or baseline control. 300-tick cooldown; movement, damage, or EMP interrupts deployment.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 8.5 cells; the relay bubble changes warning and lock timing only after deployment and never silently increases weapon range.\n- **Acquisition:** The service pistol uses Direct acquisition against observed legal ground-personnel. Forward net targets the Officer's own position and has no hostile target lock.\n- **Lock / tracking:** The pistol has no lock or post-launch tracking. Allied units retain their normal acquisition rules; the net supplies a local -5 lock-tick modifier only inside its 4.0-cell bubble and does not make baseline operation network-dependent.\n\n\n### Counterplay\n\nFlank or focus the fragile Officer, jam it, or force it to move during deployment. Fight outside the 4.0-cell bubble when practical; disconnected Coalition units remain fully functional."
