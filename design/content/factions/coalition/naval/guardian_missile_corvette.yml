  visual_identity: "Compact missile corvette with a faceted sensor mast; deployed umbrella is a subtle dome of tracking ticks and interception flashes."
  design_rationale: "# Guardian Missile Corvette\n\n## Gameplay identity\n\n- **Roles:** Fleet screen and anti-air/anti-naval denial primary; route control secondary. Targets aircraft and surface vessels.\n- **Locomotion:** Surface naval; moderate speed and turning, direct/standoff attack movement.\n- **Targetability:** Naval surface; visible medium naval protection, vulnerable to submarines, torpedoes, aircraft, and shore guns.\n- **Offense/defense:** Vertical missiles with anti-air and anti-naval profiles; medium naval protection, poor against submerged targets and close infantry.\n- **Skill:** **Intercept umbrella** — anchors briefly to expand a local anti-air warning and interception zone; movement or EMP collapses it.\n- **Production:** Cost: `700 resource`; build time: `210 ticks`; facility: `Littoral Dock`; prerequisites: `Coalition HQ operational and legal shoreline`; queue/category: `naval / established fleet screen`; replacement/capacity: `maximum 3 active Guardian Corvettes per Littoral Dock; one FIFO naval queue`.\n- **Player experience:** Hold a safe denial bubble or move with the fleet and lose coverage. Counter with submarines, torpedo boats, artillery, aircraft, and forcing the corvette to reposition.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional fleet-screen override: moderate protection and dual-domain missiles, with no submerged attack.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 520 | Heavy | 4.0 water cells/s | 0.52 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Surface missile | Anti-armor penetrator / naval surface, high-air | 7.0 | 70; 45 ticks (6/3/36) | Projectile 15 cells/s; point; lock, 25°/s homing |\n\n**Intercept umbrella:** 30-tick stationary deployment; for 150 ticks, allied aircraft within 5.0 cells receive a 20% warning-radius increase and hostile attack runs are revealed 15 ticks earlier. 300-tick cooldown; movement or EMP collapses it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; alerting cannot extend the missile's 7.0-cell range.\n- **Acquisition:** The surface missile uses Lock acquisition against an observed legal naval-surface or high-air target. It cannot acquire submerged targets. Intercept umbrella designates the Corvette's local support area and does not acquire a damage target.\n- **Lock / tracking:** The missile uses the referenced lock lifecycle; lost legality, observation, or EMP breaks the lock. A launched missile homes at its declared 25°/s behavior; the umbrella has no projectile tracking of its own.\n\n\n### Counterplay\n\nUse submarines, torpedo boats, shore fire, aircraft, or force the Corvette to move. Attack outside the 5.0-cell umbrella, break missile locks with cover or jamming, and exploit its inability to engage submerged targets."
