design:
  tactical_identity: "Fleet screen and anti-air/anti-naval denial primary; route control secondary. Targets aircraft and surface vessels."
  offense_behavior: "Vertical missiles with anti-air and anti-naval profiles; medium naval protection, poor against submerged targets and close infantry."
  locomotion_behavior: "Surface naval; moderate speed and turning, direct/standoff attack movement."
