  acquisition_behavior: "The surface missile uses Lock acquisition against an observed legal naval-surface or high-air target. It cannot acquire submerged targets. Intercept umbrella designates the Corvette's local support area and does not acquire a damage target."
  lock_behavior: "The missile uses the referenced lock lifecycle; lost legality, observation, or EMP breaks the lock. A launched missile homes at its declared 25°/s behavior; the umbrella has no projectile tracking of its own."
  production_behavior: "Cost: `700 resource`; build time: `210 ticks`; facility: `Littoral Dock`; prerequisites: `Coalition HQ operational and legal shoreline`; queue/category: `naval / established fleet screen`; replacement/capacity: `maximum 3 active Guardian Corvettes per Littoral Dock; one FIFO naval queue`."
