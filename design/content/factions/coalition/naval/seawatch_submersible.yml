design:
  tactical_identity: "Concealed sea denial and reconnaissance primary; ambush secondary. Targets surface vessels and selected structures near water."
  offense_behavior: "Torpedoes while submerged, light cannon when surfaced; naval protection, poor against depth attacks and direct pursuit."
  locomotion_behavior: "Submerged/surfacing transition; slow submerged movement, vulnerable while surfacing and firing."
  targetability_behavior: "Submerged while hidden from ordinary surface targeting; sonar, depth weapons, aircraft sensors, or surfacing expose it. Surface state is naval surface."
  acquisition_behavior: "The submerged torpedo uses Direct acquisition against an observed/detected naval-surface or structure target. The surfaced deck cannon uses Direct acquisition against observed naval-surface or eligible near-shore ground-personnel. Silent running disables both weapons and active scan."
  lock_behavior: "Neither weapon locks or tracks after launch. Torpedo and cannon impacts use their stored point; surfacing, submerging, EMP, or an illegal state prevents a weapon from firing."
  production_behavior: "Cost: `900 resource`; build time: `300 ticks`; facility: `Littoral Dock`; prerequisites: `Signals Laboratory operational and legal shoreline`; queue/category: `naval / advanced concealed denial`; replacement/capacity: `maximum 2 active Seawatches per Littoral Dock; one FIFO naval queue`."
  player_decision: "Hold a patient ambush or move quickly and become detectable. Counter with sonar, depth charges, patrol patterns, aircraft, mines, and attacking during surfacing."
  visual_identity: "Low dark hull and retractable mast; wake disappears under silent running, while surfacing has a loud, readable bubble trail."
  design_rationale: "# Seawatch Submersible\n\n## Gameplay identity\n\n- **Roles:** Concealed sea denial and reconnaissance primary; ambush secondary. Targets surface vessels and selected structures near water.\n- **Locomotion:** Submerged/surfacing transition; slow submerged movement, vulnerable while surfacing and firing.\n- **Targetability:** Submerged while hidden from ordinary surface targeting; sonar, depth weapons, aircraft sensors, or surfacing expose it. Surface state is naval surface.\n- **Offense/defense:** Torpedoes while submerged, light cannon when surfaced; naval protection, poor against depth attacks and direct pursuit.\n- **Skill:** **Silent running** — reduces signature and speed for a bounded period, disables active scan, and prevents firing until it exits the state.\n- **Production:** Cost: `900 resource`; build time: `300 ticks`; facility: `Littoral Dock`; prerequisites: `Signals Laboratory operational and legal shoreline`; queue/category: `naval / advanced concealed denial`; replacement/capacity: `maximum 2 active Seawatches per Littoral Dock; one FIFO naval queue`.\n- **Player experience:** Hold a patient ambush or move quickly and become detectable. Counter with sonar, depth charges, patrol patterns, aircraft, mines, and attacking during surfacing.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional submerged-state override: concealed movement and strong torpedoes, traded for slow speed and surfacing vulnerability.\n\n| State | HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---|---:|---|---:|---:|---:|---:|\n| Submerged | 420 | Heavy | 2.8 water cells/s | 0.48 cell | 6.0 cells | 8.0 cells |\n| Surfaced | 420 | Heavy | 3.5 water cells/s | 0.48 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Heavy torpedo | Naval torpedo / naval surface, structure | 7.0 submerged | 150; 90 ticks (15/6/69) | Projectile 6 cells/s; point; direct, no homing |\n| Deck cannon | Explosive / naval surface, ground-personnel near shore | 4.0 surfaced | 35; 45 ticks (6/3/36) | Projectile 10 cells/s; point; direct, no homing |\n\n**Silent running:** 15-tick transition; 120 ticks of -50% detection signature and -35% move speed, with active scan and weapons disabled. 240-tick cooldown; surfacing takes 30 ticks and exposes the vessel.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** Submerged 6.0 / 8.0 cells; surfaced 7.0 / 9.0 cells. Ordinary surface vision does not reveal the submerged state; sonar, depth detection, aircraft sensors, or surfacing are required as declared by the shared targetability rules.\n- **Acquisition:** The submerged torpedo uses Direct acquisition against an observed/detected naval-surface or structure target. The surfaced deck cannon uses Direct acquisition against observed naval-surface or eligible near-shore ground-personnel. Silent running disables both weapons and active scan.\n- **Lock / tracking:** Neither weapon locks or tracks after launch. Torpedo and cannon impacts use their stored point; surfacing, submerging, EMP, or an illegal state prevents a weapon from firing.\n\n\n### Counterplay\n\nUse sonar, depth weapons, aircraft sensors, mines, patrol patterns, and shore fire. Attack during surfacing or silent-running recovery, and force the slow submerged vessel to choose between concealment and weapon access."
