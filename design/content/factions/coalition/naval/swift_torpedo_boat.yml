  production_behavior: "Cost: `350 resource`; build time: `120 ticks`; facility: `Littoral Dock`; prerequisites: `Coalition HQ operational and legal shoreline`; queue/category: `naval / field sea denial`; replacement/capacity: `maximum 4 active Swift Boats per Littoral Dock; one FIFO naval queue`."
