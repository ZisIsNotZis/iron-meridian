  locomotion_behavior: "Surface naval; fast acceleration, direct attack movement, vulnerable in open water to heavier fire."
  targetability_behavior: "Naval surface; visible except in ordinary visual occlusion, vulnerable to aircraft, shore fire, and other naval weapons."
  acquisition_behavior: "The torpedo pair uses Direct acquisition against an observed legal naval-surface or special-asset target. It has no submerged attack and does not acquire aircraft."
