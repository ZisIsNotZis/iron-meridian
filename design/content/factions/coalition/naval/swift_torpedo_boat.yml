  visual_identity: "Low fast hull and twin wake; torpedo run narrows the wake into a bright directional line and gives defenders a warning ripple."
  design_rationale: "# Swift Torpedo Boat\n\n## Gameplay identity\n\n- **Roles:** Fast sea denial and harassment primary; convoy escort secondary. Targets surface vessels and exposed economic craft.\n- **Locomotion:** Surface naval; fast acceleration, direct attack movement, vulnerable in open water to heavier fire.\n- **Targetability:** Naval surface; visible except in ordinary visual occlusion, vulnerable to aircraft, shore fire, and other naval weapons.\n- **Offense/defense:** Short-range torpedoes with strong anti-naval health damage; light naval protection, poor against aircraft and swarms.\n- **Skill:** **Torpedo run** — commits to a straight high-speed approach that increases salvo reliability but telegraphs the boat and limits turning.\n- **Production:** Cost: `350 resource`; build time: `120 ticks`; facility: `Littoral Dock`; prerequisites: `Coalition HQ operational and legal shoreline`; queue/category: `naval / field sea denial`; replacement/capacity: `maximum 4 active Swift Boats per Littoral Dock; one FIFO naval queue`.\n- **Player experience:** Take a high-value shot or retreat before the screen closes. Counter with escorts, mines, aircraft, shore batteries, and forcing a bad approach angle.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional fast-attack override: high water speed, light protection, and short torpedo range.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 300 | Light | 6.5 water cells/s | 0.40 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Torpedo pair | Naval torpedo / naval surface, special asset | 5.0 | 120 each; 60 ticks (6/3/51) | Projectile 7 cells/s; point; direct, no homing |\n\n**Torpedo run:** 15-tick approach commitment in a straight line; the pair fires together with +15% damage and the boat cannot turn more than 15° during the run. 180-tick cooldown; movement or EMP cancels before launch.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; alerting cannot extend the torpedoes' 5.0-cell range.\n- **Acquisition:** The torpedo pair uses Direct acquisition against an observed legal naval-surface or special-asset target. It has no submerged attack and does not acquire aircraft.\n- **Lock / tracking:** No lock or post-launch tracking; both torpedoes resolve from their launch points. The torpedo-run skill is a pre-fire movement commitment, not homing; movement or EMP before launch cancels it.\n\n\n### Counterplay\n\nUse escorts, mines, aircraft, shore batteries, and heavier naval fire. Force a bad approach angle or turn away during the telegraphed run; the boat is fast but lightly protected and cannot correct torpedoes after launch."
