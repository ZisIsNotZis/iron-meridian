design:
  tactical_identity: "Coastal infantry transport and objective access primary; emergency evacuation secondary. It is not a combat ship."
  offense_behavior: "Light defensive gun only; light naval/vehicle protection, transport capacity, low health."
  locomotion_behavior: "Surface naval with beaching transition; can move from water onto a shallow shore and unload during a vulnerable pause."
  targetability_behavior: "Naval surface in water; ground/vehicle while beached. Vulnerable to naval fire, aircraft, mines, and shore weapons."
  acquisition_behavior: "In water, the defensive gun uses Direct acquisition against observed naval-surface or ground-personnel targets. While beached, the gun remains legal only for its declared ground-personnel domain; it cannot attack structures or aircraft. Beachhead unload targets a valid shore point, not an enemy lock."
  lock_behavior: "The defensive gun has no lock or post-launch tracking. Beaching and unloading are command-linked state transitions; movement and weapon use are disabled while beached/unloading, and no shot is created from an invalid state."
  production_behavior: "Cost: `650 resource`; build time: `210 ticks`; facility: `Littoral Dock`; prerequisites: `Mobility Workshop operational and legal shoreline`; queue/category: `naval / advanced transport`; replacement/capacity: `maximum 2 active Tideways per Littoral Dock; one FIFO naval queue`."
  player_decision: "Convert coastline into a new attack angle or accept that the craft may be a one-way investment. Counter with shore patrols, mines, aircraft, naval escorts, and attacking the unload window."
  visual_identity: "Flat ramped hull with blue cargo panels; wake, ramp lights, and a projected beaching arrow communicate the operation."
  design_rationale: "# Tideway Landing Craft\n\n## Gameplay identity\n\n- **Roles:** Coastal infantry transport and objective access primary; emergency evacuation secondary. It is not a combat ship.\n- **Locomotion:** Surface naval with beaching transition; can move from water onto a shallow shore and unload during a vulnerable pause.\n- **Targetability:** Naval surface in water; ground/vehicle while beached. Vulnerable to naval fire, aircraft, mines, and shore weapons.\n- **Offense/defense:** Light defensive gun only; light naval/vehicle protection, transport capacity, low health.\n- **Skill:** **Beachhead unload** — deploys infantry onto a marked shore zone with a short setup and clear landing signal; canceling leaves the force aboard.\n- **Production:** Cost: `650 resource`; build time: `210 ticks`; facility: `Littoral Dock`; prerequisites: `Mobility Workshop operational and legal shoreline`; queue/category: `naval / advanced transport`; replacement/capacity: `maximum 2 active Tideways per Littoral Dock; one FIFO naval queue`.\n- **Player experience:** Convert coastline into a new attack angle or accept that the craft may be a one-way investment. Counter with shore patrols, mines, aircraft, naval escorts, and attacking the unload window.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional transport override: low combat value and light protection for coastal access.\n\n| State | HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---|---:|---|---:|---:|---:|---:|\n| Water | 280 | Light | 4.0 water cells/s | 0.56 cell | 6.0 cells | 8.0 cells |\n| Beached | 280 | Light | 0 | 0.56 cell | 6.0 cells | 8.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Defensive gun | Machine gun/autocannon / ground-personnel, naval surface | 3.5 | 14; 30 ticks (3/3/24) | Projectile 12 cells/s; point; direct, no homing |\n\n**Beachhead unload:** 30-tick beaching setup and 60-tick unload; deploys up to 6 infantry in a 1.5-cell rear arc. 240-tick cooldown; movement and weapons are disabled while beached.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** Water and beached states both use 6.0 / 8.0 cells; alerting cannot extend the defensive gun's 3.5-cell range.\n- **Acquisition:** In water, the defensive gun uses Direct acquisition against observed naval-surface or ground-personnel targets. While beached, the gun remains legal only for its declared ground-personnel domain; it cannot attack structures or aircraft. Beachhead unload targets a valid shore point, not an enemy lock.\n- **Lock / tracking:** The defensive gun has no lock or post-launch tracking. Beaching and unloading are command-linked state transitions; movement and weapon use are disabled while beached/unloading, and no shot is created from an invalid state.\n\n\n### Counterplay\n\nUse shore weapons, naval fire, aircraft, mines, or patrols to attack the approach and the stationary unload window. Deny the landing point or destroy the craft before the infantry can exit."
