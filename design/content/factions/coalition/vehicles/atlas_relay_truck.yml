  design_rationale: "# Atlas Relay Truck\n\n## Gameplay identity\n\n- **Roles:** Mobile command support primary; local information sharing secondary. Does not provide baseline production or orders.\n- **Locomotion:** Wheeled; fast enough to follow an army, but deploying the mast requires a stationary transition.\n- **Targetability:** Ground/vehicle; light armor and an obvious communications signature when deployed.\n- **Offense/defense:** No meaningful weapon; light armor, low health, self-defense flare only.\n- **Skill:** **Deploy relay** — creates a temporary local bubble improving allied designation, warning, and communication range; units outside retain normal function. Pack-up has recovery time.\n- **Production:** Cost: `600 resource`; build time: `180 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced communications`; replacement/capacity: `maximum 2 active Atlas trucks per player; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Bring the relay into danger for a stronger timing window or keep the army independent and safer. Counter by flanking, jamming, forcing pack-up, or destroying the truck.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional support override: no combat weapon and low protection for a mobile information tool.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 280 | Light | 5.0 cells/s | 0.46 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| None | — | — | — | No attack; self-defense is visual flare only |\n\n**Deploy relay:** 30-tick stationary deployment; creates a 5.0-cell bubble for 180 ticks, granting allied units inside +15% warning radius and -5 lock ticks. 300-tick cooldown; movement, damage, or EMP packs it up.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 8.0 / 10.0 cells; the relay bubble modifies warning and lock timing only after deployment and never extends weapon range.\n- **Acquisition:** Atlas has no combat acquisition and no damage weapon. Deploy relay targets its own position; allied units inside retain their ordinary acquisition, target-domain, and line-of-sight rules.\n- **Lock / tracking:** No weapon lock or projectile tracking. The relay supplies only +15% warning radius and -5 lock ticks inside 5.0 cells; it does not grant shared omniscience or make disconnected units inoperable.\n\n\n### Counterplay\n\nFlank or destroy the lightly protected truck, jam it, or force it to pack up. Fight outside the 5.0-cell bubble and exploit the fact that its visual flare is not an attack."
