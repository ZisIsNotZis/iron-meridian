  acquisition_behavior: "Atlas has no combat acquisition and no damage weapon. Deploy relay targets its own position; allied units inside retain their ordinary acquisition, target-domain, and line-of-sight rules."
  lock_behavior: "No weapon lock or projectile tracking. The relay supplies only +15% warning radius and -5 lock ticks inside 5.0 cells; it does not grant shared omniscience or make disconnected units inoperable."
  production_behavior: "Cost: `600 resource`; build time: `180 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced communications`; replacement/capacity: `maximum 2 active Atlas trucks per player; one FIFO vehicle queue; replacement competes with new units`."
