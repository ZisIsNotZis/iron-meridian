  production_behavior: "Cost: `800 resource`; build time: `240 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established anti-armor`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`."
