  design_rationale: "# Halberd Tank Destroyer\n\n## Gameplay identity\n\n- **Roles:** Long-range anti-armor primary; area denial secondary. Targets heavy vehicles and slow structures, not infantry swarms.\n- **Locomotion:** Tracked; slower turning than the Valiant and vulnerable while repositioning. Standoff attack movement.\n- **Targetability:** Ground/vehicle; visible heavy target; weak to flankers, artillery, and air.\n- **Offense/defense:** High-precision kinetic penetrator with armor-condition damage; medium armor and low close-range efficiency.\n- **Skill:** **Anchor shot** — locks the chassis and charges a precise armor-breaking round; movement, jamming, or line-of-sight loss cancels the charge.\n- **Production:** Cost: `800 resource`; build time: `240 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established anti-armor`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Set a firing lane and protect it, or abandon the shot to escape a flank. Counter with speed, smoke, indirect fire, infantry screens, or multiple attack angles.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the entity-owned anti-tank role values with heavy-vehicle protection and standoff movement as intentional overrides.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 460 | Heavy | 2.0 cells/s | 0.52 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Kinetic penetrator | Anti-armor penetrator + protection condition / ground-vehicle, structure | 7.5 | 105 + 20 condition; 90 ticks (15/6/69) | Projectile 9 cells/s; point; lock, no post-launch tracking |\n\n**Anchor shot:** 15-tick setup; next shot gains +20% protection-condition damage and locks the hull in place. 180-tick cooldown; movement, smoke, EMP, or line-of-sight loss cancels it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; alerting cannot extend the penetrator's 7.5-cell range.\n- **Acquisition:** The penetrator uses Lock acquisition against an observed legal ground-vehicle or structure target. The 15-tick anchor setup requires a firing lane and stationary hull.\n- **Lock / tracking:** The referenced lock lifecycle applies; movement, smoke, EMP, lost line of sight, or invalid target domain breaks the setup. The launched point projectile has no post-launch tracking.\n\n\n### Counterplay\n\nUse smoke, speed, flanks, infantry screens, indirect fire, or air power. Attack during the stationary windup or from multiple angles; its armor is not a substitute for close-range mobility."
