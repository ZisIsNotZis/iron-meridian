design:
  tactical_identity: "Resource extraction and return primary; emergency body-blocking only. It is not a combat unit."
  offense_behavior: "No weapon; light armor, enough survivability to retreat but not duel."
  locomotion_behavior: "Tracked; ground movement with route-following and a visible return-to-refinery behavior."
  targetability_behavior: "Ground/vehicle; ordinary vision and special economic priority feedback make it an obvious target."
  acquisition_behavior: "The Harvester has no combat acquisition, attack command, or legal weapon target. Its authoritative interactions are resource-field collection, refinery return, and the shared economy rules."
  lock_behavior: "No weapon lock or tracking. Emergency unload targets the Harvester's current position and is not an enemy designation; harvesting and movement are disabled during its setup."
  production_behavior: "Cost: `700 resource`; build time: `180 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ and Resource Exchange operational`; queue/category: `vehicle / economy replacement`; replacement/capacity: `maximum 2 active Harvesters per Resource Exchange; one active Harvester per resource node; replacement competes with army production`."
