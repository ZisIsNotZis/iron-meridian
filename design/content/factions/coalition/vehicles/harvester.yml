  visual_identity: "Bright collection drums and blue route beacon; resource discharge is a crisp stream into a temporary, contestable cache."
  design_rationale: "# Harvester\n\n## Gameplay identity\n\n- **Roles:** Resource extraction and return primary; emergency body-blocking only. It is not a combat unit.\n- **Locomotion:** Tracked; ground movement with route-following and a visible return-to-refinery behavior.\n- **Targetability:** Ground/vehicle; ordinary vision and special economic priority feedback make it an obvious target.\n- **Offense/defense:** No weapon; light armor, enough survivability to retreat but not duel.\n- **Skill:** **Emergency unload** — drops a partial load at its current position to shorten a fatal return route; the dropped cache can be contested and the harvester remains exposed.\n- **Production:** Cost: `700 resource`; build time: `180 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ and Resource Exchange operational`; queue/category: `vehicle / economy replacement`; replacement/capacity: `maximum 2 active Harvesters per Resource Exchange; one active Harvester per resource node; replacement competes with army production`.\n- **Player experience:** Choose a rich route, escort, or early unload when threatened. Counter with raids, mines, air attacks, or cutting the return path.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the economy rules as its authoritative behavior; no combat weapon is intentionally provided.\n\n## Economy\n| Field | Value |\n|---|---|\n| Cargo capacity | `200 resource` |\n| Extraction | `20 resource` every `30 ticks` from the assigned node, or its remaining reserve |\n| Processor unload | Uses the linked Resource Exchange's declared unload rate |\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 300 | Light | 3.5 cells/s | 0.52 cell | 6.0 cells | 8.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| None | — | — | — | No attack command; economic platform only |\n\n**Emergency unload:** 15-tick setup; drops up to 50% of cargo as a contestable cache, preserving the remainder. 180-tick cooldown; cannot harvest or move during setup.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 6.0 / 8.0 cells; economic alerting does not create a combat target or extend any weapon range.\n- **Acquisition:** The Harvester has no combat acquisition, attack command, or legal weapon target. Its authoritative interactions are resource-field collection, refinery return, and the shared economy rules.\n- **Lock / tracking:** No weapon lock or tracking. Emergency unload targets the Harvester's current position and is not an enemy designation; harvesting and movement are disabled during its setup.\n\n\n### Counterplay\n\nRaid the route, cut off the refinery return, use mines or air attacks, or contest the dropped cache. The Harvester is an economic platform, not a combat unit, so escorts and route choice are its meaningful defenses."
