design:
  tactical_identity: "Infantry transport and flexible screen primary; light anti-personnel secondary. Carries infantry without making them dependent on it."
  offense_behavior: "Twin autocannons effective against personnel and light targets; light-to-medium armor, poor against heavy armor."
  locomotion_behavior: "Wheeled; fast ground vehicle, can load and unload infantry with a brief vulnerable pause."
  targetability_behavior: "Ground/vehicle; visible, light armor. Transported infantry are protected from ordinary fire but cannot fight until deployed."
  acquisition_behavior: "The autocannon uses Direct acquisition against observed legal ground-personnel or light targets. Transported infantry are not separate firing sources until unloaded and cannot be selected as ordinary attack targets through the carrier."
  lock_behavior: "No lock or post-launch tracking. Rapid dismount is a command-linked unload transition; the Kodiak cannot fire during the 15-tick maneuver, and movement or an invalid unload point cancels it before passengers leave."
  production_behavior: "Cost: `500 resource`; build time: `150 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established transport`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`."
  player_decision: "Decide whether the carrier is a gun platform, a safe delivery system, or an expendable screen. Counter with anti-armor, mines, area denial at the unload point, or isolating the infantry."
  visual_identity: "Sloped personnel carrier with visible rear ramp; dismount creates a brief dust-and-blue route marker rather than teleportation."
  design_rationale: "# Kodiak IFV\n\n## Gameplay identity\n\n- **Roles:** Infantry transport and flexible screen primary; light anti-personnel secondary. Carries infantry without making them dependent on it.\n- **Locomotion:** Wheeled; fast ground vehicle, can load and unload infantry with a brief vulnerable pause.\n- **Targetability:** Ground/vehicle; visible, light armor. Transported infantry are protected from ordinary fire but cannot fight until deployed.\n- **Offense/defense:** Twin autocannons effective against personnel and light targets; light-to-medium armor, poor against heavy armor.\n- **Skill:** **Rapid dismount** — unloads passengers at speed into a short movement burst, trading formation control for a safer exit; cannot fire during the maneuver.\n- **Production:** Cost: `500 resource`; build time: `150 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established transport`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Decide whether the carrier is a gun platform, a safe delivery system, or an expendable screen. Counter with anti-armor, mines, area denial at the unload point, or isolating the infantry.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional transport override: light armor and moderate weapon output compensate for passenger capacity.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 360 | Light | 5.5 cells/s | 0.48 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Twin autocannon | Machine gun/autocannon / ground-personnel, light | 5.0 | 32; 24 ticks (0/3/21) | Projectile 15 cells/s; point; direct, no homing |\n\n**Rapid dismount:** 15-tick unload setup; passengers exit to a 1.5-cell arc around the rear, gaining +25% move for 30 ticks. 150-tick cooldown; the Kodiak cannot fire during the maneuver.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; alerting cannot extend the autocannon's 5.0-cell range.\n- **Acquisition:** The autocannon uses Direct acquisition against observed legal ground-personnel or light targets. Transported infantry are not separate firing sources until unloaded and cannot be selected as ordinary attack targets through the carrier.\n- **Lock / tracking:** No lock or post-launch tracking. Rapid dismount is a command-linked unload transition; the Kodiak cannot fire during the 15-tick maneuver, and movement or an invalid unload point cancels it before passengers leave.\n\n\n### Counterplay\n\nUse anti-armor, mines, area denial, or focus fire at the unload point. Isolate the carrier from its passengers, force the rear arc into danger, or attack while the carrier is unable to fire."
