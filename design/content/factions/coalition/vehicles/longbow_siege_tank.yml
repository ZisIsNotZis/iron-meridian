  visual_identity: "Elevated folding barrel and stabilizer outriggers; deployment projects a pale artillery arc and impact dust gives defenders a warning rhythm."
  design_rationale: "# Longbow Siege Tank\n\n## Gameplay identity\n\n- **Roles:** Indirect fire and structure pressure primary; area denial secondary. Targets emplacements, structures, and clustered slow units.\n- **Locomotion:** Tracked; slow ground movement. Deploy-and-fire attack movement with a vulnerable setup and pack-up state.\n- **Targetability:** Ground/vehicle; visible medium armor, vulnerable to raids, aircraft, and direct assault while deployed.\n- **Offense/defense:** Indirect explosive shells with structural and suppression channels; light armor, poor close defense and line-of-sight fighting.\n- **Skill:** **Siege deployment** — anchors to extend range and reduce scatter; setup, firing arc, and counter-battery warning make the choice readable.\n- **Production:** Cost: `900 resource`; build time: `300 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced siege`; replacement/capacity: `maximum 2 active Longbows per player; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Invest time to break a position or pack up before the counterattack lands. Counter with mobility, counter-battery fire, air strikes, and direct flank attacks.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional siege override: slow, medium-protected, and unable to use direct fire while deployed.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 420 | Light | 1.8 cells/s | 0.52 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Siege shell | Siege/structural + suppression / ground-personnel, vehicle, structure | 10.0 deployed / 6.0 packed | 110; 90 ticks (15/6/69) | Projectile 7 cells/s; area 0.8-cell radius; indirect point designation, no tracking |\n\n**Siege deployment:** 45-tick setup; deployed mode prevents movement, increases range to 10 cells, and enables firing. 180-tick cooldown; pack-up takes 30 ticks and cancels windup.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; the deployed 10.0-cell range still requires a known or designated impact point and does not extend ordinary vision.\n- **Acquisition:** The siege shell uses Indirect Point/designated acquisition. It may fire at a valid known/designated point within 10.0 cells while deployed, against its declared ground-personnel, vehicle, or structure domains; packed mode has 6.0-cell range and cannot fire.\n- **Lock / tracking:** No target lock or post-launch tracking. The shell resolves at its stored point after its 7 cells/s flight and does not follow a moving target; pack-up, EMP, or invalid designation cancels windup.\n\n\n### Counterplay\n\nUse mobility, counter-battery fire, air strikes, direct flanks, or attack before deployment completes. Spread units and leave the designated impact point; the shell has area damage but no tracking."
