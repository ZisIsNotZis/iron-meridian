design:
  tactical_identity: "Indirect fire and structure pressure primary; area denial secondary. Targets emplacements, structures, and clustered slow units."
  offense_behavior: "Indirect explosive shells with structural and suppression channels; light armor, poor close defense and line-of-sight fighting."
  locomotion_behavior: "Tracked; slow ground movement. Deploy-and-fire attack movement with a vulnerable setup and pack-up state."
  targetability_behavior: "Ground/vehicle; visible medium armor, vulnerable to raids, aircraft, and direct assault while deployed."
  acquisition_behavior: "The siege shell uses Indirect Point/designated acquisition. It may fire at a valid known/designated point within 10.0 cells while deployed, against its declared ground-personnel, vehicle, or structure domains; packed mode has 6.0-cell range and cannot fire."
  lock_behavior: "No target lock or post-launch tracking. The shell resolves at its stored point after its 7 cells/s flight and does not follow a moving target; pack-up, EMP, or invalid designation cancels windup."
  production_behavior: "Cost: `900 resource`; build time: `300 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced siege`; replacement/capacity: `maximum 2 active Longbows per player; one FIFO vehicle queue; replacement competes with new units`."
