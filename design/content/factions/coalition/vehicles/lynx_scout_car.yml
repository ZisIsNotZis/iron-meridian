  production_behavior: "Cost: `300 resource`; build time: `90 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / field recon`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`."
