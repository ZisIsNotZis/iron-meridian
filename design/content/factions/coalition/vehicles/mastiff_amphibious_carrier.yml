design:
  tactical_identity: "Water-route transport and beachhead screen primary; light anti-personnel secondary. Enables a flank rather than becoming a naval tank."
  offense_behavior: "Light autocannon; medium-light armor, transport capacity, weak against heavy armor and naval guns."
  locomotion_behavior: "Amphibious tracked/swimming transition; slower and less armed in water, with a visible embark/disembark transition."
  targetability_behavior: "Ground/vehicle on land; naval surface in water. Vulnerable during transition and to dedicated naval or anti-armor fire."
  acquisition_behavior: "On land, the autocannon uses Direct acquisition against observed ground-personnel or light targets. In water, it uses Direct acquisition against observed naval-surface targets and ground-personnel as declared by its weapon domain; it cannot attack submerged units. The ramp targets a shore point, not an enemy lock."
  lock_behavior: "No lock or post-launch tracking. Amphibious transition and ramp deployment are command-linked; movement or EMP cancels setup, and weapons are disabled during the 30-tick shore deployment."
  production_behavior: "Cost: `700 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Mobility Workshop operational`; queue/category: `vehicle / advanced amphibious`; replacement/capacity: `maximum 2 active Mastiffs per player; one FIFO vehicle queue; replacement competes with new units`."
  player_decision: "Create a second front or avoid paying for a water tool on a land map. Counter with shore batteries, mines, aircraft, naval patrols, and attacking the landing transition."
  visual_identity: "Sealed hull, fold-out flotation skirts, and blue wake; transition uses a mechanical ballast animation and clear waterline marker."
  design_rationale: "# Mastiff Amphibious Carrier\n\n## Gameplay identity\n\n- **Roles:** Water-route transport and beachhead screen primary; light anti-personnel secondary. Enables a flank rather than becoming a naval tank.\n- **Locomotion:** Amphibious tracked/swimming transition; slower and less armed in water, with a visible embark/disembark transition.\n- **Targetability:** Ground/vehicle on land; naval surface in water. Vulnerable during transition and to dedicated naval or anti-armor fire.\n- **Offense/defense:** Light autocannon; medium-light armor, transport capacity, weak against heavy armor and naval guns.\n- **Skill:** **Amphibious ramp** — deploys passengers rapidly at a shore point, briefly immobilizing the carrier and marking the landing zone.\n- **Production:** Cost: `700 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Mobility Workshop operational`; queue/category: `vehicle / advanced amphibious`; replacement/capacity: `maximum 2 active Mastiffs per player; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Create a second front or avoid paying for a water tool on a land map. Counter with shore batteries, mines, aircraft, naval patrols, and attacking the landing transition.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional amphibious override: medium-light durability and reduced water speed preserve the transport decision.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 400 | Light | 4.5 land / 3.0 water cells/s | 0.52 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Light autocannon | Machine gun/autocannon / ground-personnel, naval surface | 4.5 land / 3.5 water | 24; 24 ticks (0/3/21) | Projectile 15 cells/s; point; direct, no homing |\n\n**Amphibious ramp:** 30-tick stationary shore deployment; unloads up to 6 passengers to a 1.5-cell rear arc and marks it for 60 ticks. 240-tick cooldown; transition disables weapons and exposes both domains.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** Land and water both use 7.0 / 9.0 cells; alerting cannot extend the autocannon beyond its state-specific range.\n- **Acquisition:** On land, the autocannon uses Direct acquisition against observed ground-personnel or light targets. In water, it uses Direct acquisition against observed naval-surface targets and ground-personnel as declared by its weapon domain; it cannot attack submerged units. The ramp targets a shore point, not an enemy lock.\n- **Lock / tracking:** No lock or post-launch tracking. Amphibious transition and ramp deployment are command-linked; movement or EMP cancels setup, and weapons are disabled during the 30-tick shore deployment.\n\n\n### Counterplay\n\nUse shore batteries, mines, aircraft, naval patrols, or anti-armor fire. Attack during the visible transition, deny the landing point, or punish the carrier's reduced water speed and light armor."
