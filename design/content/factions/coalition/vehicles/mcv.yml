design:
  tactical_identity: "Mobile base deployment and construction primary; no combat role. Produces the Coalition's positional advantage."
  offense_behavior: "No weapon; heavy vehicle protection while mobile, reinforced structure protection while deployed. Vulnerable to dedicated anti-armor or base assault."
  locomotion_behavior: "Tracked vehicle; transitions to deployed structure. Deployment is stationary and interruptible before completion; vehicle cannot pass through occupied space."
  targetability_behavior: "Ground/vehicle while mobile; structure/special asset while deployed. Visible and high-value in both states."
  acquisition_behavior: "No combat acquisition, attack command, or legal weapon target in either state. Construction placement and deployment use the construction rules, not a combat target lock."
  lock_behavior: "No weapon lock or projectile tracking. Deploy and undeploy are stationary, interruptible state transitions; both disable construction during transition, and no transition bypasses targetability or collision rules."
  production_behavior: "Cost: `1,200 resource`; build time: `420 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / strategic construction`; replacement/capacity: `maximum 1 active MCV per player; mobile and deployed states share the slot; replacement is allowed only while the HQ survives`."
  player_decision: "Relocate for resources or map pressure while risking the economy and production backbone. Counter by scouting routes, attacking during transit, or denying the landing site."
  visual_identity: "Modular blue-white engineering carrier; hydraulic unfolding and a clean projected foundation grid communicate the transition."
  design_rationale: "# Mobile Construction Vehicle (MCV)\n\n## Gameplay identity\n\n- **Roles:** Mobile base deployment and construction primary; no combat role. Produces the Coalition's positional advantage.\n- **Locomotion:** Tracked vehicle; transitions to deployed structure. Deployment is stationary and interruptible before completion; vehicle cannot pass through occupied space.\n- **Targetability:** Ground/vehicle while mobile; structure/special asset while deployed. Visible and high-value in both states.\n- **Offense/defense:** No weapon; heavy vehicle protection while mobile, reinforced structure protection while deployed. Vulnerable to dedicated anti-armor or base assault.\n- **Skill:** **Deploy** — converts into a construction yard; undeploy requires a safe transition and temporarily suspends construction.\n- **Production:** Cost: `1,200 resource`; build time: `420 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / strategic construction`; replacement/capacity: `maximum 1 active MCV per player; mobile and deployed states share the slot; replacement is allowed only while the HQ survives`.\n- **Player experience:** Relocate for resources or map pressure while risking the economy and production backbone. Counter by scouting routes, attacking during transit, or denying the landing site.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nStrategic transition override: heavy while mobile, reinforced structure while deployed, and weaponless in both states.\n\nThe active construction vehicle uses a `10`-cell placement anchor radius;\ndeployment creates the Coalition HQ anchor declared by that building.\n\n| State | HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---|---:|---|---:|---:|---:|---:|\n| Mobile | 700 | Heavy | 2.0 cells/s | 0.65 cell | 7.0 cells | 9.0 cells |\n| Deployed | 900 | Reinforced structure | 0 | 0.80 cell | 8.0 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| None | — | — | — | No attack command; construction asset only |\n\n**Deploy:** 60-tick transition while stationary; creates the Coalition HQ/construction anchor. 180-tick undeploy transition; both transitions disable construction and expose the state change.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** Mobile 7.0 / 9.0 cells; Deployed 8.0 / 10.0 cells. The state row is authoritative; alerting does not create a weapon because the MCV is weaponless.\n- **Acquisition:** No combat acquisition, attack command, or legal weapon target in either state. Construction placement and deployment use the construction rules, not a combat target lock.\n- **Lock / tracking:** No weapon lock or projectile tracking. Deploy and undeploy are stationary, interruptible state transitions; both disable construction during transition, and no transition bypasses targetability or collision rules.\n\n\n### Counterplay\n\nScout routes, attack the MCV in transit or during a transition, deny the landing site, and pressure the deployed construction anchor. It has no weapon, so its defense is timing, escort, terrain, and placement."
