design:
  tactical_identity: "Vehicle sustainment primary; emergency recovery secondary. Repairs vehicles only and does not replace a second command-support platform."
  offense_behavior: "Weak defensive machine gun; light armor, low health. Repair restores health slowly and cannot instantly undo every status."
  locomotion_behavior: "Tracked; moderate speed, direct movement, cannot repair while moving."
  targetability_behavior: "Ground/vehicle; medium-light armor and high priority. The repair tether exposes both units to interruption."
  acquisition_behavior: "The defensive gun uses Direct acquisition against observed legal ground-personnel. Field repair selects one allied ground-vehicle within 2.5 cells; it is not a hostile lock and cannot target aircraft, naval units, or structures."
  lock_behavior: "The gun has no lock or post-launch tracking. Repair is a command-linked 90-tick channel; movement, hostile hit, EMP, death, or range loss breaks it, and V1 permits only one active repair source per target."
  production_behavior: "Cost: `650 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Mobility Workshop operational`; queue/category: `vehicle / advanced sustainment`; replacement/capacity: `maximum 2 active Menders per player; one FIFO vehicle queue; only one repair source affects a target in V1`."
  player_decision: "Sustain a damaged spearhead under pressure or retreat before the repair asset is lost. Counter with focus fire, artillery, EMP, flanks, or forcing the target away."
  visual_identity: "Articulated repair arm and bright tool bays; tether is a segmented amber cable with small sparks at the repaired hull."
  design_rationale: "# Mender Repair Vehicle\n\n## Gameplay identity\n\n- **Roles:** Vehicle sustainment primary; emergency recovery secondary. Repairs vehicles only and does not replace a second command-support platform.\n- **Locomotion:** Tracked; moderate speed, direct movement, cannot repair while moving.\n- **Targetability:** Ground/vehicle; medium-light armor and high priority. The repair tether exposes both units to interruption.\n- **Offense/defense:** Weak defensive machine gun; light armor, low health. Repair restores health slowly and cannot instantly undo every status.\n- **Skill:** **Field repair** — channels a tether to one allied vehicle, restoring health and clearing a limited mobility condition; breaks on range, movement, or damage.\n- **Production:** Cost: `650 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Mobility Workshop operational`; queue/category: `vehicle / advanced sustainment`; replacement/capacity: `maximum 2 active Menders per player; one FIFO vehicle queue; only one repair source affects a target in V1`.\n- **Player experience:** Sustain a damaged spearhead under pressure or retreat before the repair asset is lost. Counter with focus fire, artillery, EMP, flanks, or forcing the target away.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional support override: low damage and low armor for sustainment value.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 320 | Light | 4.0 cells/s | 0.48 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Defensive machine gun | Machine gun/autocannon / ground-personnel | 4.0 | 18; 30 ticks (3/3/24) | Projectile 14 cells/s; point; direct, no homing |\n\n**Field repair:** 15-tick channel to one allied ground-vehicle within 2.5 cells; restores 5 HP/s for 90 ticks and clears one mobility condition. 240-tick cooldown; movement, hostile hit, EMP, or range loss interrupts it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; alerting cannot extend the defensive gun's 4.0-cell range or the repair tether's 2.5-cell range.\n- **Acquisition:** The defensive gun uses Direct acquisition against observed legal ground-personnel. Field repair selects one allied ground-vehicle within 2.5 cells; it is not a hostile lock and cannot target aircraft, naval units, or structures.\n- **Lock / tracking:** The gun has no lock or post-launch tracking. Repair is a command-linked 90-tick channel; movement, hostile hit, EMP, death, or range loss breaks it, and V1 permits only one active repair source per target.\n\n\n### Counterplay\n\nFocus the Mender, use artillery or EMP, flank the repair tether, or force the damaged vehicle away. The repair is slow, range-limited, and cannot revive destroyed units or replace a second support platform."
