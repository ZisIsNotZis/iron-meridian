  visual_identity: "Folding missile rack and blue target lattice; each lock stage adds a visible bracket segment before a loud volley."
  design_rationale: "# Peregrine Missile Carrier\n\n## Gameplay identity\n\n- **Roles:** Precision strike and limited anti-air primary; target finishing secondary. Targets designated vehicles, aircraft, and exposed structures.\n- **Locomotion:** Wheeled; fast repositioning but poor firing stability. Standoff attack movement; vulnerable while volleying.\n- **Targetability:** Ground/vehicle; light armor and high priority. Requires sight, designation, or a valid shared track to fire accurately.\n- **Offense/defense:** Guided multi-missile volley with health and light structure damage; weak direct defense, poor against close infantry.\n- **Skill:** **Salvo lock** — spends a long windup to fire a concentrated volley at one designated target; smoke, jamming, movement, or killing the carrier cancels it.\n- **Production:** Cost: `850 resource`; build time: `270 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced precision`; replacement/capacity: `maximum 2 active Peregrines per player; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Hold fire for a decisive target or reveal the carrier early for immediate pressure. Counter with scouts, anti-missile/AA, jamming, fast rushes, and breaking line of sight.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional precision override: fragile light armor, long lock, and high single-target payoff.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 300 | Light | 4.0 cells/s | 0.46 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Guided missile salvo | Air-to-ground strike / ground-vehicle, high-air, structure | 10.0 | 140; 120 ticks (30/6/84) | Projectile 8 cells/s; area 0.45-cell radius; lock, 20°/s homing |\n\n**Salvo lock:** 30-tick designation setup at 10 cells; the volley fires only on a legal designated target and has a 360-tick cooldown. Movement, jamming, EMP, or lost designation cancels setup.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; the 10.0-cell weapon range requires valid designation/observation and is not granted by alerting alone.\n- **Acquisition:** The guided salvo uses Lock acquisition against an observed or validly allied-designated ground-vehicle, high-air, or structure target. Domain legality, line of sight/designation, and range are checked before fire.\n- **Lock / tracking:** The 30-tick salvo designation is longer than the referenced lifecycle and is broken by movement, jamming, EMP, lost line of sight, or invalid designation. After launch, missiles home at 20°/s within their declared behavior; the area impact resolves once and does not retarget outside legal domains.\n\n\n### Counterplay\n\nUse scouts, smoke or jamming, fast rushes, anti-missile/AA, and line-of-sight breaks. Force the carrier to move before release or spread valuable units; its light armor and weak close defense are intentional."
