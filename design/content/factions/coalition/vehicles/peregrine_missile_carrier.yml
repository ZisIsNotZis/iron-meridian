  acquisition_behavior: "The guided salvo uses Lock acquisition against an observed or validly allied-designated ground-vehicle, high-air, or structure target. Domain legality, line of sight/designation, and range are checked before fire."
  lock_behavior: "The 30-tick salvo designation is longer than the referenced lifecycle and is broken by movement, jamming, EMP, lost line of sight, or invalid designation. After launch, missiles home at 20°/s within their declared behavior; the area impact resolves once and does not retarget outside legal domains."
  production_behavior: "Cost: `850 resource`; build time: `270 ticks`; facility: `Vehicle Assembly`; prerequisites: `Signals Laboratory operational`; queue/category: `vehicle / advanced precision`; replacement/capacity: `maximum 2 active Peregrines per player; one FIFO vehicle queue; replacement competes with new units`."
