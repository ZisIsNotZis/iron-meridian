design:
  tactical_identity: "Precision strike and limited anti-air primary; target finishing secondary. Targets designated vehicles, aircraft, and exposed structures."
  offense_behavior: "Guided multi-missile volley with health and light structure damage; weak direct defense, poor against close infantry."
