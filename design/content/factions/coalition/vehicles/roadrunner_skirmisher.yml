  design_rationale: "# Roadrunner Skirmisher\n\n## Gameplay identity\n\n- **Roles:** Mobile harassment primary; anti-infantry and anti-support secondary. Targets exposed infantry, artillery, repair assets, and harvesters.\n- **Locomotion:** Wheeled; very fast on roads and firm ground, poor off-road. Orbit or strafe attack movement.\n- **Targetability:** Ground/vehicle; light armor and high visibility while firing.\n- **Offense/defense:** Dual rapid-fire cannons with suppression; light armor, low health, weak against heavy armor.\n- **Skill:** **Break contact** — emits smoke and performs a short retreat burst, but cannot attack during the burst and leaves a readable smoke trail.\n- **Production:** Cost: `350 resource`; build time: `105 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established skirmisher`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Harass the enemy's edges and escape, or commit to a support kill while risking a trap. Counter with terrain, mines, area fire, fast interceptors, and disciplined screens.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nIntentional harassment override: very high speed and low durability.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 240 | Light | 7.5 cells/s | 0.40 cell | 7.5 cells | 10.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Twin rapid-fire cannons | Machine gun/autocannon + suppression / ground-personnel, light | 4.5 | 18; 18 ticks (0/3/15), 10 suppression | Projectile 16 cells/s; point; direct, no homing |\n\n**Break contact:** 15-tick activation; +50% move for 60 ticks, leaves smoke, and disables weapons during the burst. 180-tick cooldown; damage or EMP cancels activation.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.5 / 10.0 cells; alerting cannot extend the cannons' 4.5-cell range.\n- **Acquisition:** The twin cannons use Direct acquisition against observed legal ground-personnel or light targets. Break contact targets the Roadrunner itself and does not preserve an attack target.\n- **Lock / tracking:** No lock or post-launch tracking; point impacts resolve from the firing position. The 15-tick escape activation is command-linked, and damage or EMP cancels it before the burst.\n\n\n### Counterplay\n\nUse terrain, mines, area fire, mobile interceptors, disciplined screens, or heavy armor. Deny roads and force the Roadrunner into a committed approach; it cannot shoot during its escape burst."
