  production_behavior: "Cost: `350 resource`; build time: `105 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established skirmisher`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`."
