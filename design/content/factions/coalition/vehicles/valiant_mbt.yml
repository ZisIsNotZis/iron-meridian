  design_rationale: "# Valiant Main Battle Tank\n\n## Gameplay identity\n\n- **Roles:** Mobile line anchor primary; general anti-vehicle secondary. Targets armored ground units and structures only incidentally.\n- **Locomotion:** Tracked; broad terrain access, direct attack movement, strong collision presence.\n- **Targetability:** Ground/vehicle; visible heavy target, vulnerable to air, dedicated anti-armor, flanks, and immobilization.\n- **Offense/defense:** Stabilized cannon with reliable anti-armor health damage; heavy armor and moderate speed. Poor at chasing scouts or fighting aircraft.\n- **Skill:** **Hunter-killer brace** — anchors briefly to improve turret traverse and the next shot's accuracy, but reduces movement and exposes a predictable firing position.\n- **Production:** Cost: `750 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established armor`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`.\n- **Player experience:** Hold a lane for a precision push or preserve movement to avoid being surrounded. Counter with tank destroyers, mines, air power, flanks, and forcing it to turn.\n- **Asset design:** See [entity asset manifest](assets.md).\n\n## Entity specification\n\nUses the entity-owned tank role values; its brace is a deliberate Coalition accuracy/positioning tradeoff.\n\n| HP | Armor | Move | Footprint radius | Vision | Alert radius |\n|---:|---|---:|---:|---:|---:|\n| 520 | Heavy | 2.4 cells/s | 0.55 cell | 7.0 cells | 9.0 cells |\n\n| Weapon | Damage family / domains | Range | Damage/event; period | Delivery / hit / tracking |\n|---|---|---:|---:|---|\n| Stabilized cannon | Explosive / ground-vehicle, structure | 6.0 | 82; 72 ticks (9/6/57) | Projectile 10 cells/s; point; direct, no homing |\n\n**Hunter-killer brace:** 30-tick setup; lasts 120 ticks, grants +15% range and +10% firing-arc tolerance, and prevents movement. 240-tick cooldown; movement, EMP, or suppression at 100 points cancels it.\n\n### Acquisition and lock semantics\n\n- **Vision / alert radius:** 7.0 / 9.0 cells; alerting cannot extend the cannon's 6.0-cell range except for the skill's declared +15% range while active.\n- **Acquisition:** The stabilized cannon uses Direct acquisition against observed legal ground-vehicle or structure targets. It cannot acquire air targets under its declared domains.\n- **Lock / tracking:** No lock or post-launch tracking; each point projectile resolves from the firing position. Hunter-killer brace is a stationary firing-state skill, not a persistent target lock.\n\n\n### Counterplay\n\nUse tank destroyers, mines, air power, flanks, immobilization, or force the Valiant to turn and move. Attack during setup or from outside its firing arc; heavy armor does not protect it from positional counters."
