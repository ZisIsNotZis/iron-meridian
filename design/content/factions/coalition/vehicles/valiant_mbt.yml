  production_behavior: "Cost: `750 resource`; build time: `210 ticks`; facility: `Vehicle Assembly`; prerequisites: `Coalition HQ operational`; queue/category: `vehicle / established armor`; replacement/capacity: `no per-unit cap; one FIFO vehicle queue; replacement competes with new units`."
