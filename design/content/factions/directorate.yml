  narrative_identity: "## Origin The Directorate formed when the Federal Security Directorate, central arsenals, and loyal rail commands declared continuity of Meridian Union authority after the Aster attack. Its emergency council includes security ministers, quartermasters, industrial planners, and officers who believe that a visible chain of command is the only barrier between constitutional collapse and warlord rule. It is not a monolith. Civil administrators want the emergency to end once transport and food distribution are secure; security chiefs want permanent exceptional powers; industrial boards want predictable contracts; field officers want enough autonomy to survive real operations. The state's strength is that these interests can still move a train, produce armor, and issue a common order. Its danger is that every success makes central control look indispensable. ## Public claim The Directorate claims to be the lawful caretaker of the Union, not a new country. Its broadcasts emphasize continuity, rationing, public order, and protection of strategic arsenals. It calls the Coalition a secessionist alliance whose regional vetoes would make defense impossible. ## Internal conflict The central political question is **restoration or control**. A Directorate commander may genuinely save a city from famine while suppressing its elected council. Campaign writing should let the player see both facts at once. Avoid cartoon villainy and avoid excusing coercion because the machinery works. ## V1 and near-term use V1 uses the Directorate only as an abstract mirror-match military grammar; its political identity is not required to understand the demo. Near-term campaign missions can reveal the Directorate through orders, supply decisions, and aftermaths before asking the player to judge its legitimacy. ## Far-vision boundary The Directorate does not receive a separate internal-politics simulation. Rival ministries, defections, and reforms are authored story pressures or campaign choices, not another resource layer."
  scope: "near_term"
