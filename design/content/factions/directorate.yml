display_name: "Directorate"
description: "Emergency government of security ministries, central industrial boards, and loyal garrisons; it prevents warlords from seizing strategic weapons while suppressing dissent and treating autonomy as a threat."
status: "core"
playable: true
presentation:
  visual_identity: "## Symbol and logo direction The Directorate mark is a **closed iron chevron enclosing a small vertical meridian bar**. The chevron reads as protection and command; the bar preserves the Union's geographic symbol while making it rigid and centralized. It must work as a one-color stencil on crates, a small HUD badge, and a formal seal. It must not resemble a real-world flag, extremist insignia, or borrowed RTS faction logo. The wordmark uses square, condensed capitals with measured spacing and a restrained serial-stencil detail. Formal labels favor function and numbering over ornament: Central Works, Route 6, Reserve Group. ## Presentation ownership Faction palette, materials, silhouettes, spaces, voice, audio, effects, and animation direction live in [Directorate assets](assets.md). This document defines identity principles; it does not specify individual asset mappings. ## Scope This document owns Directorate identity. Individual gameplay designs belong in the [unit index](units/README.md); global presentation rules belong in [presentation](../../presentation/README.md)."
  palette: "Use charcoal iron, deep desaturated red, warm bone, and small amber status lights. Hardware is thick plate, cast housing, standardized bolts, guarded optics, and numbered maintenance panels. Red is authority/warning, never the only ownership cue. Bases are compact, axial, and defended: reinforced concrete, straight service roads, floodlights, pipe racks, and deliberate sightlines. Vehicles use broad masses and recognizable modules; infantry use helmets, hard webbing, heavy coats, and unit tabs."
