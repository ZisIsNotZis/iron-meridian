audio:
  voice_language: "Orders are concise and procedural. Use low brass, snare, industrial percussion, diesel compression, hydraulic locks, relay clacks, and short acknowledgements. Effects emphasize pressure and preparation: smoke-backed muzzle flashes, heavy dust, hydraulic bracing, warning lamps, and synchronized salvos. Animation sells weight and deliberate transitions through reusable clips. All choices follow the global [asset contract](../../presentation/assets.md) and [presentation rules](../../presentation/README.md)."
