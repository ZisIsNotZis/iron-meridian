fx:
  identity: "Heavy coaxial pods, rotor wash, broad searchlights, tracer curtains, and a low mechanical thrum."
design:
  tactical_identity: "Persistent close air support against vehicles and infantry; secondary suppression of a prepared front."
  player_decision: "Keep the gunship on station for pressure or pull it before the orbit becomes a trap. It fails when committed over anti-air or caught without fighter cover."
  counterplay: "Anti-air, fighters, spreading units, moving out of the orbit, and attacking the airfield between sorties."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Air protection with moderate endurance; loses value under concentrated anti-air and cannot ignore fighters."
  support_behavior: "Applies local suppression over the push; it requires anti-air escort rather than providing one."
  locomotion_behavior: "Helicopter; high/low hover state with orbit attack movement, explicit landing and takeoff transitions."
  targetability_behavior: "High air while airborne; selected low-air weapons may engage during low hover. Vulnerable to anti-air throughout."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Atlas deliberately trades helicopter orbit persistence for anti-air vulnerability; low-hover targetability is state-dependent. Rotary cannon | Machine gun/autocannon; ground personnel, light, low air | 5.0 / 20 / 12 ticks | Beam/ray burst; point; tracking 120°/s within 90° cone Rocket pod | Explosive; ground personnel, light, heavy | 6.0 / 70 / 60 ticks | Projectile 10 cells/s; area 0.5 cells; tracking within 45° cone, 60°/s Suppressive Orbit | 30-tick setup; 120-tick active; 30-tick recovery; 210-tick cooldown; 4.0-cell orbit, cannon fire rate +25%, movement constrained to orbit; low hover exposes it to selected ground weapons | Anti-air/fighters, spread, leave orbit, cancel attack point"
