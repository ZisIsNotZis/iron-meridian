design:
  tactical_identity: "Area denial and formation disruption; secondary damage-over-time pressure against structures and clustered armor."
  player_decision: "Shape enemy movement with a dangerous lane or spend the bomber for direct damage. It fails when the enemy disperses, intercepts, or exploits the return route."
  counterplay: "Anti-air, fighters, dispersal, route prediction, and clearing/avoiding the fire zone."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Air protection; vulnerable during approach, release, and return."
  support_behavior: "Shapes enemy movement with a temporary hazard zone; the zone is a tactical effect, not a persistent map system."
  locomotion_behavior: "Fixed-wing; committed bombing run with a long turn and return path."
  targetability_behavior: "High air in flight; anti-air and fighters can engage. The attack lane is telegraphed."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Firestorm uses a fixed attack-run path and the shared incendiary hazard rules; the line pattern is a declared area delivery, not retargeting. Incendiary bombs | Incendiary + explosive; ground personnel, light, heavy, structure | 7.0 / 70 + 10/tick / 90 ticks | Attack-run projectile 8 cells/s; area 1.0 cells; no tracking Carpet Run | 30-tick setup; 120-tick run; 60-tick recovery; 240-tick cooldown; 8.0-cell line, five impacts at 0.75-cell spacing; 30-tick warning | Anti-air/fighters, disperse, leave line, avoid hazard"
