  targetability_behavior: "High air in flight; anti-air and enemy fighters. Ground weapons cannot target it unless a state explicitly lowers its flight profile."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "This card owns its air-domain values; attack and lock resolution follows the referenced first-class profiles. Interceptor cannon | Machine gun/autocannon; low air, high air | 5.5 / 28 / 18 ticks | Attack-run projectile 16 cells/s; point; tracking within 30° cone, 180°/s Air-to-air missile | Air-to-ground strike; low air, high air | 8.0 / 90 / 90 ticks | Projectile 12 cells/s; point; lock tracking within 25° cone, 90°/s Pursuit Lock | 15-tick lock; 90-tick active; 30-tick recovery; 180-tick cooldown; +20% missile damage and +30°/s turn, target must remain visible | Break LOS, retreat, counter-fighter, or bait into anti-air"
