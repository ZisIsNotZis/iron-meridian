  locomotion_behavior: "Fixed-wing; slow, high-momentum bomber with a committed attack run and long recovery."
  targetability_behavior: "High air in flight; visible to ordinary air detection and vulnerable to anti-air/fighters."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Skyhammer intentionally exceeds normal air durability and payload commitment; its strategic warning and counterplay remain shared. Guided siege payload | Air-to-ground strike + protection condition + structural; ground light, heavy, structure | 9.0 / 220 + 25 condition / 150 ticks | Projectile 7 cells/s; point; tracking within 20° cone, 45°/s after lock Siege Salvo | 30-tick lock; 30-tick windup; 60-tick recovery; 300-tick cooldown; 10.0-cell visible target lock; movement/jam cancels setup | Fighters, anti-air, jam/break LOS, decoys, attack airfield"
