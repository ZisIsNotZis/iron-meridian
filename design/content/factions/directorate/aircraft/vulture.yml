  tactical_identity: "Reconnaissance and target confirmation; secondary harassment of exposed light targets."
  player_decision: "Trade an aircraft's safety for knowledge before a ground push. It fails when sent blind into defended space or left loitering."
  counterplay: "Fighters, anti-air, concealment, decoys, and attacking its airfield during the return window."
