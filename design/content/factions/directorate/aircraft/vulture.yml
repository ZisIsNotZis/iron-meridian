  defense_behavior: "Air protection with low endurance; survives only through speed, route choice, and base coverage."
  support_behavior: "Supplies brief reconnaissance for a planned ground operation; it does not act as an always-on radar plane."
  locomotion_behavior: "Fixed-wing; high-air flight with committed attack/recon passes and explicit takeoff/landing transitions."
  targetability_behavior: "High air in flight; anti-air and fighters can engage it. It has no stealth state."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Vulture uses the explicit recon values with fixed-wing attack-run movement. Forward gun | Machine gun/autocannon; low air, high air, ground personnel/light | 4.5 / 16 / 24 ticks | Attack run projectile 12 cells/s; point; no tracking Recon Pass | 15-tick setup; 90-tick reveal; 30-tick recovery; 150-tick cooldown; 12.0-cell line, fixed return route | Anti-air/fighters, concealment, decoys, attack airfield"
