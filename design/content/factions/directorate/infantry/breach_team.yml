presentation:
  fallback_policy: "inherit"
  silhouette: "Armored demolition vests, numbered charge cases, red warning strobes, and a sharp concussive breach effect."
  readability: "Icon, selection, health/damage, construction or deployment, operational, disabled, and destruction states follow the global presentation contract."
audio:
  identity: "Armored demolition vests, numbered charge cases, red warning strobes, and a sharp concussive breach effect."
fx:
  identity: "Armored demolition vests, numbered charge cases, red warning strobes, and a sharp concussive breach effect."
design:
  tactical_identity: "Short-range assault against infantry, light vehicles, and structures; secondary anti-garrison pressure."
  player_decision: "Choose a dangerous approach for a decisive breach or use the squad as ordinary pressure. It fails when screened, kited, or exposed to area fire."
  counterplay: "Keep distance, use vehicles or area damage, kill the team before the charge completes, and avoid bunching structures."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Personnel protection with no special resistance; depends on smoke, cover, and an escort."
  support_behavior: "Opens access for the main force by threatening garrisons and structures; cannot replace a line squad."
  locomotion_behavior: "Foot; moves normally but must close distance to matter. Can enter transports and structures."
  targetability_behavior: "Ground personnel; ordinary vision and anti-personnel targeting. Vulnerable while crossing open ground."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Damage conversion and timing semantics come from [Combat](../../../../../combat/README.md) and the [numeric policy](../../../../../numerics.md). The close-range profile is an intentional unit override. Breach shotgun | Explosive; ground personnel, low air, light | 2.5 / 48 / 36 ticks | Projectile 11 cells/s; point; no tracking Satchel charge | Siege/structural; ground heavy, structure | 1.0 / 140 / 120 ticks | Point planted impact; point; no tracking Breach Charge | 15-tick plant; 45-tick fuse; 30-tick recovery; 240-tick cooldown; one visible target, 1.0-cell placement range; 180 structural/siege damage in 1.0-cell area | Kill or displace team, clear charge during fuse, leave area"
production:
  producer: "factions.directorate.buildings.barracks"
  queue: "default_queue"
  category: "infantry"
  prerequisites: ["factions.directorate.buildings.barracks", "factions.directorate.buildings.construction_yard"]
  cost:
    resource: 140
  buildtime: 60

