presentation:
  fallback_policy: "inherit"
  silhouette: "Utility harnesses, modular crates, welding sparks, and hard-edged temporary steelwork."
  readability: "Icon, selection, health/damage, construction or deployment, operational, disabled, and destruction states follow the global presentation contract."
audio:
  identity: "Utility harnesses, modular crates, welding sparks, and hard-edged temporary steelwork."
fx:
  identity: "Utility harnesses, modular crates, welding sparks, and hard-edged temporary steelwork."
design:
  tactical_identity: "Capture specialist and field sustainment; secondary temporary fortification. It is not a front-line damage unit."
  player_decision: "Spend a scarce specialist on capture, repair, or a defensive pause. It fails when sent alone or used as disposable rifle infantry."
  counterplay: "Kill or displace the engineer, interrupt the interaction, and attack the temporary work after its duration ends."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Personnel protection; low combat value makes escorting and timing essential."
  support_behavior: "Captures objectives and provides the only infantry-scale field works interaction; its help is local and channelled."
  locomotion_behavior: "Foot; enters transports and can interact with objectives, damaged friendly vehicles, and designated construction sites."
  targetability_behavior: "Ground personnel; ordinary sight and anti-personnel targeting. Interaction creates a readable vulnerable channel."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "This card uses the entity-owned infantry role values except where marked. Field Works is a support skill; it does not create a new damage or repair rule. Compact carbine | Rifle; ground personnel, low air | 4.0 / 10 / 30 ticks | Projectile 14 cells/s; point; no tracking Field Works | 30-tick setup; 150-tick channel; 30-tick recovery; 300-tick cooldown; 1.0-cell interaction range; choose vehicle repair at 3 condition/tick or a 30-tick temporary barricade | Kill, displace, or interrupt engineer; attack barricade after expiry"
