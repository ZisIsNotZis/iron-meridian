design:
  tactical_identity: "Formation command and attack coordination; secondary target designation. It is a force multiplier, not a high-DPS hero."
  player_decision: "Put command close enough to matter without handing the opponent a valuable kill. It fails when isolated, overstacked, or forced to chase."
  counterplay: "Raid the command unit, break line of sight, spread targets, or force the formation to move during its setup/recovery."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Reinforced personnel protection but high strategic value; vulnerable to snipers, artillery, and focused fire."
  support_behavior: "Coordinates nearby fire through one visible designation; it does not create a mandatory faction-wide command network."
  locomotion_behavior: "Foot; transportable and deliberately slower than Rifle Squads. Ground state, no special transition."
  targetability_behavior: "Ground personnel; visible to ordinary sight. Its command radius is shown to both players."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Marshal follows the shared personnel rules; the reinforced protection and designation skill are intentional Directorate overrides. Service pistol | Rifle; ground personnel, low air | 4.0 / 8 / 36 ticks | Projectile 14 cells/s; point; no tracking Coordinated Fire | 15-tick setup; 90-tick active; 30-tick recovery; 240-tick cooldown; visible target within 8.0 cells; allies within 5.0 cells gain +15% damage to that target | Break LOS, kill/force movement, spread targets; Marshal is revealed while active"
