  support_behavior: "Buys time for engineers and artillery at a choke point; it does not improve allies everywhere."
  locomotion_behavior: "Foot; shield formation slows movement and remains crushable. Transportable when not deployed."
  targetability_behavior: "Ground personnel; ordinary sight and anti-personnel targeting."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "This optional unit keeps personnel armor and shared status rules. Directional shield behavior is its only intentional protection override. Riot launcher | Suppression/control; ground personnel, low air | 3.5 / 18 + 20 suppression / 45 ticks | Projectile 10 cells/s; area 0.6 cells; no tracking Shield Wall | 30-tick setup; 120-tick active; 30-tick recovery; 210-tick cooldown; 120° frontal arc; -50% rifle/small-arms health damage, movement and main attack disabled | Flank, explosive/area fire, displacement, or bypass"
