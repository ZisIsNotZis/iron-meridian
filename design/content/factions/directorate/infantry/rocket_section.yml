design:
  tactical_identity: "Long-range anti-vehicle and anti-air infantry; secondary deterrent around structures."
  player_decision: "Pre-place a denial screen or keep the section mobile to avoid being bypassed. It fails when rushed, flanked, or forced to shoot cheap targets."
  counterplay: "Fast infantry/vehicles, line-of-sight denial, artillery, and air attacks from outside the lock window."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Personnel protection; fragile to fast assaults, artillery, and suppression."
  support_behavior: "Extends the army's anti-vehicle and anti-air threat from prepared ground; it does not provide radar or a network link."
  locomotion_behavior: "Foot with cumbersome movement; may enter transports. Cannot fire the main launcher during setup or relocation."
  targetability_behavior: "Ground personnel; ordinary sight. Its launcher does not change its own target domain."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The section uses the shared personnel armor and status rules. Its long-range launcher and deploy state are deliberate overrides of the Infantry role profile. Guided rocket | Anti-armor penetrator; ground light/heavy, low/high air | 7.5 / 105 / 90 ticks | Projectile 9 cells/s; point; tracking within 30° cone, 90°/s Launcher Emplacement | 30-tick setup; active until packed; 30-tick recovery; 180-tick cooldown; +1.0 range and +15% lock damage, movement disabled | Interrupt setup, flank, rush, or force pack"
