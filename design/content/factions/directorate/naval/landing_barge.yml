  defense_behavior: "Light naval protection; high value while carrying units."
  support_behavior: "Moves one ground force to a valid coast; it does not construct a permanent naval logistics network."
  locomotion_behavior: "Naval surface; slow and unable to fight effectively while loaded. It can unload only at valid shore locations."
  targetability_behavior: "Naval surface; ordinary sight, naval weapons, aircraft, and shore weapons."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Landing Barge is a transport first. It carries one ground group; loading is a short Defensive machine gun | Machine gun/autocannon; naval surface, ground personnel, low air | 4.0 / 12 / 30 ticks | Projectile 14 cells/s; point; no tracking Beachhead Deploy | 45-tick setup; 90-tick unload; 45-tick recovery; 240-tick cooldown; valid shore within 1.0 cell; 1 ground group; landing marker visible throughout | Block shore, kill barge/escort, interrupt unload, punish beachhead"
