design:
  tactical_identity: "Ground-force transport and beachhead delivery; secondary mobile construction/logistics ferry."
  player_decision: "Commit a valuable route to bypass a front or reinforce a coast, accepting escort and timing risk. It fails when discovered without naval cover."
  counterplay: "Scout routes, attack escorts, block shore access, focus the barge before unloading, or punish the exposed beachhead."
