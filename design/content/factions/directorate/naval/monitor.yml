design:
  tactical_identity: "Armored shore bombardment and naval line anchor; secondary defense against surface ships."
  player_decision: "Secure a coast before turning the ship into a siege gun, or stay mobile and lose the strongest bombardment. It fails when isolated in open water."
  counterplay: "Submarines, aircraft, fast attack craft, flanking, and forcing it to move before the barrage completes."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Naval protection with strong frontal profile; vulnerable to submarines, aircraft, and flanking surface fire."
  support_behavior: "Converts secured water into shore pressure for a land assault; it cannot protect a fleet from every domain."
  locomotion_behavior: "Naval surface; slow turn and deliberate attack approach, with no land transition."
  targetability_behavior: "Naval surface; visible to ordinary sight and naval weapons, with air attack also valid."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "Monitor uses surface-naval targetability and shared area/structure resolution; Anchor Barrage is a deliberate stationary override. Main gun | Siege/structural; naval surface, ground light/heavy, structure | 8.0 / 120 / 90 ticks | Projectile 7 cells/s; area 0.5 cells; no tracking Deck gun | Machine gun/autocannon; naval surface, low/high air | 5.0 / 18 / 30 ticks | Projectile 14 cells/s; point; no tracking Anchor Barrage | 30-tick setup; 120-tick active; 30-tick recovery; 240-tick cooldown; +3.0 range and +25% structural damage, movement disabled; 30-tick impact warning | Force movement, submarines, aircraft, flank, attack before setup"
