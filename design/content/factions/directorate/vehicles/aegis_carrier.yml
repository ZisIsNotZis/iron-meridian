design:
  tactical_identity: "Long-range formation air defense; secondary early warning. Unlike Warden, it protects a position rather than escorting a moving line."
  player_decision: "Decide where the Directorate's protected airspace begins, then defend the immobile node. It fails when bypassed, rushed, or forced to redeploy."
  counterplay: "Ground attack, low-altitude approach where permitted, baiting missiles, waiting out deployment, and striking outside the envelope."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Medium armor; vulnerable to ground raids and close-range aircraft that exploit its setup."
  support_behavior: "Establishes one defended airspace envelope for a prepared position; the envelope is not global and does not repair allies."
  locomotion_behavior: "Tracked; slow and deployable. It may not fire the primary missile system while relocating."
  targetability_behavior: "Ground vehicle; ordinary sight and anti-vehicle targeting. Its warning radar reveals its strategic area, not the whole map."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Aegis Carrier's deployed envelope is local detection and weapon control, never global vision. Surface-to-air missile | Air-to-ground strike; low air, high air | 10.0 / 120 / 90 ticks | Projectile 8 cells/s; point; tracking within 35° cone, 60°/s Deploy Radar | 45-tick setup; active until packed; 45-tick recovery; 240-tick cooldown; 12.0-cell local envelope, movement disabled, close-defense range 3.0 | Raid ground support, bypass envelope, bait missiles, force redeploy"
