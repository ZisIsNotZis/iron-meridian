design:
  tactical_identity: "Mobile indirect fire against formations and structures; secondary area denial."
  player_decision: "Prepare a firing position and protect it, or move before counter-battery arrives. It fails when rushed, revealed, or forced into direct combat."
  counterplay: "Scout and raid it, counter-battery, use aircraft, spread formations, and exploit its packing delay."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Light armor; requires a screen and recovery path."
  support_behavior: "Punishes concentrations and fortifications so the line can advance; it offers no direct repair or command utility."
  locomotion_behavior: "Tracked; moves slowly and must deploy to fire. Deployment is a visible transition."
  targetability_behavior: "Ground vehicle; ordinary sight and anti-vehicle targeting. It is especially vulnerable while firing or packing."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Ballista uses shared area falloff and indirect-fire validation. Its deployment is the unit's deliberate exception to the armored-line baseline. Siege shell | Siege/structural; ground personnel, light, heavy, structure | 10.0 / 100 / 105 ticks | Projectile 6 cells/s; area 1.0 cells; no tracking; 30-tick warning Deploy Battery | 45-tick setup; active until packed; 45-tick recovery; 180-tick cooldown; +3.0 range and +15% accuracy, movement disabled | Scout, rush, counter-battery, disperse, or force pack"
