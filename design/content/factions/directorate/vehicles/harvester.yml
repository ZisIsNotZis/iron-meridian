design:
  tactical_identity: "Resource extraction and return; emergency body-blocking only. It is not a combat unit."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Light protection; it survives through escort, route choice, and early return rather than dueling."
  support_behavior: "Extracts finite node resource and unloads it at the Directorate Ore Refinery; it does not create resource or passive income."
  locomotion_behavior: "Tracked ground vehicle using the shared Idle → TravelToNode → Harvesting → TravelToProcessor → Unloading → Idle loop."
  targetability_behavior: "Ground vehicle; ordinary sight and explicit economic priority feedback make it a valuable raid target."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  economy_behavior: "| Field | Value |"
  design_rationale: "The extraction, cargo, node reservation, unloading, and repair behavior is Return | Valid at any time; cancels harvesting after the current tick and preserves cargo | Cut off the route, attack before unloading, or force a longer return Stop | Immediate movement stop; releases node reservation; cargo remains intact | Attack the stationary vehicle or deny its next route"
