  targetability_behavior: "Ground vehicle; ordinary sight and anti-vehicle targeting."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Lancer uses the entity-owned anti-tank timing values; its stabilize state is a deliberate range/immobility tradeoff. Long penetrator | Anti-armor penetrator + protection condition; ground light, heavy | 7.5 / 105 + 15 condition / 90 ticks | Projectile 9 cells/s; point; no tracking after lock Stabilize | 30-tick setup; active until packed; 30-tick recovery; 180-tick cooldown; +1.5 range, +20% condition damage; movement disabled | Break LOS, flank, rush, or force pack"
