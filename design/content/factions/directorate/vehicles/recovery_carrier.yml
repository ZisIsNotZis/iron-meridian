design:
  tactical_identity: "Front-line repair and disabled-vehicle recovery; secondary emergency extraction."
  player_decision: "Save an expensive asset under fire or retreat the carrier before it becomes a second casualty. It fails when exposed, overextended, or forced to repair cheap units."
  counterplay: "Focus the carrier, interrupt its channel, burst damaged targets before recovery, or force it to choose between two casualties."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Medium armor; protected enough to reach the line but valuable enough to demand escort."
  support_behavior: "Owns Directorate vehicle repair and recovery; one active channel at a time prevents effortless sustainment."
  locomotion_behavior: "Tracked; slow support vehicle with a deployable winch. It cannot recover while moving."
  targetability_behavior: "Ground vehicle; ordinary sight and anti-vehicle targeting. The active repair beam makes its position obvious."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The carrier follows the shared one-repair-source rule; its winch is a channelled skill, not a second health system. Service gun | Machine gun/autocannon; ground personnel, light | 4.5 / 12 / 30 ticks | Projectile 14 cells/s; point; no tracking Recovery Winch | 15-tick setup; 150-tick repair/recovery channel; 30-tick recovery; 180-tick cooldown; 3.0-cell range; restores 4 condition/tick or pulls target 1.0 cell over channel; one target | Interrupt channel, focus carrier, burst target, or force choice"
