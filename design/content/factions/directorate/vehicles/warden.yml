design:
  tactical_identity: "Mobile close anti-air escort; secondary defense against low-flight units."
  player_decision: "Keep it with the force, detach it to cover a vulnerable flank, or accept an air gap. It fails when isolated or used as a ground tank."
  counterplay: "Ground assault, artillery, standoff attack, baiting the screen, and attacking from outside its coverage."
  offense_behavior: "See **Combat and abilities** for authoritative weapon definitions."
  defense_behavior: "Medium armor; survives incidental raids but cannot protect itself from ground specialists."
  support_behavior: "Escorts the moving ground force with local anti-air coverage; it does not replace the positional Aegis Carrier."
  locomotion_behavior: "Tracked; ordinary ground movement and turning, able to keep pace with the armored line."
  targetability_behavior: "Ground vehicle; ordinary sight and anti-vehicle targeting. Its radar does not grant universal vision."
  production_behavior: "See **Production** for authoritative cost, timing, facility, and capacity data."
  design_rationale: "The Warden is the mobile anti-air baseline with a modest ground suppression sidearm. Twin flak cannons | Explosive; low air, high air, ground personnel | 6.5 / 34 / 36 ticks | Projectile 13 cells/s; area 0.35 cells; tracking within 45° cone, 90°/s Defensive machine gun | Machine gun/autocannon; ground personnel, light | 4.5 / 10 / 30 ticks | Projectile 14 cells/s; point; no tracking Airburst Screen | 15-tick setup; 90-tick active; 30-tick recovery; 180-tick cooldown; 4.0-cell radius, +25% anti-air fire rate; ground weapon access reduced 50% | Wait out, attack carrier, use ground assault, or approach outside zone"
