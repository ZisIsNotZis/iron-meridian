display_name: Irregular Network
description: "Hidden minor faction formed from village defense groups, rail mechanics, smugglers, defecting soldiers, dissident engineers, journalists, and intelligence cells left between Union jurisdictions after Aster. It has no capital, uniform, universally accepted leader, or single official logo; cells cooperate through favors, proof, and trusted routes to prevent either major faction rebuilding the centralized emergency machine before the truth of Aster is established. Members disagree between liberation, fragmentation, restored federation, regional autonomy, negotiated amnesty, and permanent local self-defense. The Network wins by choosing where a fight becomes expensive, creating a false or temporary problem, isolating a capability, denying infrastructure or attention, converting one local information or positioning advantage into a decisive exchange, and withdrawing before a conventional response. It loses prolonged frontal fights, sustained resource races, and fights where fixed sites are systematically scouted and removed. It is local not global: concealment, jamming, designation, repair, and relay effects have a source, radius, duration, and visible counterplay. Salvage returns only a stated payout, health, or temporary battlefield use. Standard throughput is one infantry queue and one vehicle queue; optional coastal production is a third queue only on suitable water. There is no power grid, free global production bonus, universal disguise, permanent invisibility, hidden resource, open-ended captured-unit factory, tunnel network, giant drone swarm, chain sabotage, or conventional age-up. Standard content is a small land roster; coastal content is map-gated; Kite Drone, Razorwing, Dustwing, and Moth Balloon are authored campaign assets with no replacement queue. In the near-term campaign the Network appears as missing freight, false reports, repaired enemy vehicles, local guides, and contradictory evidence before a late bounded third-actor mission; its full playable campaign follows the four-mission Directorate/Coalition spine and uses ordinary scenario setup. Against Directorate it attacks supply, repair, routes, and isolated heavy assets; against Coalition it disrupts relays, forward support, flexible flanks, distributed trust, and false reports. Both opponents retain credible detection and area denial."
status: designed
playable: true
presentation:
  visual_identity: "No uniform paint scheme: faded Union leftovers, civilian colors, tar black, canvas, oxidized metal, chalk, repair numbers, occasional local tape, temporary workshops, caches, false walls, removable panels, civilian conversions, mismatched parts, and locally meaningful markings. The recognition mark is a short broken line forming an incomplete knot or three offset bars; cells vary it slightly. Campaign treatment is stamped text, overwritten labels, clipped photographs, and route marks, never a polished secret corporation."
  palette: "Faded Union leftovers, civilian colors, tar black, canvas, oxidized metal, chalk, repair numbers, and local tape."
  materials: "Temporary and opportunistic materials: workshops, caches, false walls, removable panels, civilian conversions, mismatched parts, and locally meaningful markings."
  silhouette_language: "Silhouettes communicate role before camouflage; concealment is a readable state and never erased identification."
  placeholder_asset: slate-frame
audio:
  voice_language: "Personal, coded, and situational dialogue; campaign guidance appears through local voices rather than a polished faction command."
  identity: "Muted engines, cloth and tools, hand taps, whistles, degraded radio, found percussion, and quiet melodic fragments."
  order_style: "Hand signals, taps, whistles, and degraded short radio acknowledgements."
  event_language: "Critical cues remain paired with visual feedback; disappearance, cut power, dropped markers, and extraction use restrained audio."
fx:
  identity: "Effects emphasize surprise and disappearance: brief cover flashes, settling dust, cut power, dropped markers, improvised smoke, quick extraction, and readable setup, concealment failure, salvage, and withdrawal."
  material_language: "Faded, improvised, mismatched materials with local accents rather than a uniform faction effect."
  event_language: "Every trick exposes setup, firing, deployment, extraction, or a temporary-site signature; no spectacle grants damage, detection, cover, or collision."
design:
  strategic_idea: "Asymmetry, concealment, improvisation, denial, bounded salvage, and choosing when not to fight."
  battlefield_habits: ["Scout patiently and attack exposed logistics rather than the strongest formation.", "Use concealment to create a decision window, not permanent immunity.", "Make temporary sites and false signatures legible to careful opponents.", "Recover or repurpose a limited battlefield asset, then accept the cost of supporting it.", "Disengage when the opponent has assembled a conventional answer."]
  production_philosophy: "Hidden caches, improvised workshops, local fabrication, and bounded salvage assemble an operation from available opportunities rather than copying either major faction's industrial tree. Temporary sites have setup windows, limited lifetimes, visible counterplay, and attention as a maintenance cost."
  economy_identity: "Normal processing is inefficient and fragile; salvage turns a contested wreck into a brief timing gain but never creates a second resource or permanent recipe."
  matchup_expression: "Attack Directorate supply, repair, routes, and isolated heavy assets; exploit Coalition distributed trust, false reports, and over-forward specialist support; never make normal scouting meaningless."
  player_decision: "Choose whether a local advantage is worth revealing the cell, spending the escape route, exposing a site, or accepting a conventional fight."
  counterplay: "Scouts, sensors, direct vision, area search, counter-jamming, protected production, route control, guarded exits, channel interruption, and forcing open fights are the intended major-faction answers."
  narrative_identity: "The political question is liberation or fragmentation. The Network may protect civilians, expose a crime, keep a bridge open, or prevent both governments taking its workshop; a Network victory is not automatic government succession."
  scope: far_vision
