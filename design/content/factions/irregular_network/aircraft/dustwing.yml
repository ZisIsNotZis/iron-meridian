display_name: Dustwing
description: "Optional Advanced authored helicopter transport. Low-air flight with hover/landing transition; can land briefly but is vulnerable during landing/takeoff. Low/high air in flight and ground target while landed; anti-air and selected ground weapons engage low flight. Door guns use machine gun/autocannon against ground personnel/light armor, range 4.0, 16 damage/event, 24 ticks, projectile speed 14, point hit, no tracking, unavailable landed or transporting. Airlift picks up allied infantry within 1.0 cell after 45-tick hover channel, cooldown 240. Dust drop unloads within 6.0 cells after 30-tick recovery, smoke radius 1.2 for 60 ticks; both expose aircraft and are interruptible. Body 360 HP, light armor, speed 6.0, radius .50, footprint 2x2, vision 8.0, alert/acquisition 10.0; landing/takeoff transition 30 ticks. Not producible; authored campaign asset with no queue/replacement."
