display_name: Kite Drone
description: "Core Established authored expendable recon aircraft/deployable. Low-altitude orbit around a commanded point with limited endurance; high-air while loitering and low-air during observation passes. Anti-air always engages; selected ground weapons engage only low pass. No weapon or damage, no swarm resurrection. Loiter mark commands a point within 10.0 cells, orbit radius 1.5, active 120 ticks, cooldown 180; reveals/designates a 2.0-cell area, consumes endurance, exposes the drone. Dive and recover retreats 30 ticks to a friendly site, cooldown 90, and stops observation. Not producible: N/A resource/ticks, no queue or replacement; campaign/map may provide one authored drone. Body 70 HP, light armor, orbit 7.0, radius 0.20, footprint 1x1, vision 10.0, alert/acquisition 12.0."
