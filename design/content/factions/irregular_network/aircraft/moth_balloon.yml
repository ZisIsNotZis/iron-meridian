display_name: Moth Balloon
description: "Optional Strategic authored persistent sensor/decoy aircraft/deployable. Slow high-altitude drift with poor turning, can anchor but cannot attack. High-air while drifting/anchored; special asset while anchored, always attackable by anti-air/fighters; visible unless map occlusion. No weapon. Anchor lantern setup 45, active 240, cooldown 360, reveals 7.0-cell area, creates one false signature within 3.0 cells, stops movement and warns. Cut tether recovery 30 ends effects and restores drift. Body 500 HP, light armor, drift 1.8, radius .65, footprint 2x2, vision 12.0, alert/acquisition 14.0. Not producible; at most one authored campaign asset, no queue/replacement."
