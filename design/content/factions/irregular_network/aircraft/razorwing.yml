design: {tactical_identity: "Fragile high-speed strike aircraft for one narrow attack window.", player_decision: "Strike when anti-air is displaced, then commit to an escape route.", counterplay: "Layer anti-air, fighters, and force repeat runs.", offense_behavior: "Rockets efficiently hit light vehicles/structures; autocannon harasses personnel/light vehicles; poor heavy-armor and spread-infantry performance.", defense_behavior: "Fragile light air protection; survival depends on timing and approach concealment.", support_behavior: "No repair, transport, detection, or control support; flare is self-defense only.", locomotion_behavior: "Fixed-wing high-air attack-run with turning commitment and return cycle.", targetability_behavior: "High-air only; cannot hover or capture; anti-air/fighter detection required.", acquisition_behavior: "Rocket area range 5.5/55/30/speed 12/radius .6; autocannon range 3.5/18/12; attack-run only.", lock_behavior: "Breakaway flare withdrawal-only, active 45, cooldown 180, missile turn rate halved but direct fire valid.", lifecycle_behavior: "Authored asset; no queue or replacement.", production_behavior: "Scenario-provided; N/A resource and ticks.", visual_identity: "Patched wings, stolen pods, staggered trails, dull violet flare.", audio_identity: "Stolen engine and attack-run cues.", fx_identity: "Irregular rocket trails and withdrawal flare.", design_rationale: "Attack-run access and speed are paid for by fragile light armor and poor heavy-armor efficiency."}
