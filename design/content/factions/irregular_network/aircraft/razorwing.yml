display_name: Razorwing
description: "Core Advanced authored strike aircraft. Fixed-wing high-air attack-run with turning commitment and return-to-base cycle; exposed to anti-air and fighters, cannot hover or capture. Light rockets use explosive/area against ground light vehicles and structures, range 5.5, 55 damage/event, salvo period 30, attack-run projectile speed 12, area radius 0.6, no tracking. Autocannon uses machine gun/autocannon against ground personnel and light vehicles, range 3.5, 18 damage/event, period 12, attack-run tracer, point hit, no tracking, only during run. Breakaway flare is withdrawal-only, active 45, cooldown 180; missile tracking turn rate -50 percent while exiting, direct anti-air remains valid, visible flare. Not producible: N/A resource/ticks, no queue/replacement; authored campaign strike asset. Body 300 HP, light armor, speed 9.0, radius 0.42, footprint 2x1, vision 8.0, alert/acquisition 10.0."
