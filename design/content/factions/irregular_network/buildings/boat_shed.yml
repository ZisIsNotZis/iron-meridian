display_name: Boat Shed
description: "Optional Advanced coastal production and extraction site. 3x2 shoreline-facing footprint with one water launch and one land interaction cell; every footprint cell buildable and launch connects to navigable shallow water. Construction 500 resource / 300 ticks, operational Safehouse, Field Workshop, and builder required on suitable shoreline. Body 480 HP with deliberate light naval/structure protection, vulnerable to shore fire and naval attacks. Structure targetability and ordinary vision; launch activity reveals site and route. One FIFO queue for Skiff Cell, Cutwater, and Diver Team coastal package; no deep-water navy or air production; queued work lost on destruction. Emergency haul repairs one docked Network coastal asset at 3 HP/s within one launch cell, no cooldown while docked, interrupted by separation/destruction; no static weapon or area defense. Persistent shared lifecycle."
