display_name: Cell House
description: "Core Field infantry-production site. One infantry FIFO queue for replaceable cells and specialists; 2x2 footprint, four cardinal facings, two infantry exit/interaction cells; buildable ground within shared construction anchors and pathable exits. Construction 350 resource / 240 ticks, operational Safehouse and Network builder required. Body 420 HP, light armor, ordinary structure targetability, no passive concealment. Queue capacity 1, Field/Established entries require Cell House, Advanced entries additionally require operational Hideout or Relay Cache; no roster cap; queued work lost on destruction. No repair or defense weapon. Rally cells is a passive 3.0-cell rally interaction radius and does not buff damage, share vision, or replace command relay. Persistent shared blueprint, constructing, operational, damaged, destroyed lifecycle."
