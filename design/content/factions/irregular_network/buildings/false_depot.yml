display_name: False Depot
description: "Optional Advanced temporary decoy site. 2x2 footprint, four cardinal facings, no production exit; buildable ground within shared anchors outside objective exclusions, with intentionally visible setup. Construction 250 resource / 150 ticks, operational Safehouse and builder required. Body 220 HP light armor; no wreck or destruction refund. Real structure is targetable; false contact is information presentation, not a second untargetable entity. Direct investigation, attack, detection, or expiry identifies it. No production, repair, weapon, dependency, or base function. Broadcast false signature starts on completion and projects one plausible local contact within 3.0 cells for 150 ticks, gives 30-tick expiry warning, is suppressed by direct vision, cannot chain another depot in same radius, and has 270-tick cooldown after removal. Temporary expiry removes it without wreck/refund."
