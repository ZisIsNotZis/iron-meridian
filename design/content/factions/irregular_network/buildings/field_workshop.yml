display_name: Field Workshop
description: "Core Established improvised vehicle/deployable production site. 3x3 footprint, four cardinal facings, two exit cells on facing edge; buildable ground at shared builder anchor with pathable exits. Construction 600 resource / 300 ticks, operational Safehouse and builder required. Body 600 HP, light armor, no power dependency or global aura; structure targetability and ordinary vision/attack; production activity reveals local concealment. One vehicle FIFO queue, capacity 1, no roster cap, queued work lost on destruction, requires operational Safehouse, no air or naval queue. Patch line repairs one nearby Network vehicle within 1.0 cell at 2 HP/s while docked, does not stack with Wrecker or repair destroyed entities. No weapon. Persistent shared blueprint/constructing/operational/damaged/destroyed lifecycle."
