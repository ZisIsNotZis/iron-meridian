display_name: Hideout
description: "Core Established temporary recovery and concealment site. 2x2 fixed-facing footprint with one infantry interaction cell; place near Network builder or active Safehouse, never on routes, resources, or objectives. Construction 300 resource / 180 ticks, operational Safehouse and builder required. Body 350 HP light armor, no wreck/refund; structure targetability is detailed only after detection/proximity while concealed, and setup, recovery, attack, or area damage reveal it. No production, repair, or weapon. One nearby infantry group recovers 4 HP/s while stationary and out of combat; no revival, vehicle repair, or global healing. Lie low after 60 quiet ticks, concealment within 1.5 cells for 180 ticks, visible 30-tick expiry countdown, sensor or attack reveals; temporary lifecycle expires and is removed without wreck/refund."
