display_name: Jammer Post
description: "Core Established local information-denial and false-signature site. 2x2 footprint, four cardinal facings, one antenna service cell; buildable ground within shared anchors outside route/objective exclusions. Construction 400 resource / 240 ticks, operational Safehouse and builder required. Body 380 HP, light armor, ordinary structure targetability; counter-jamming, direct vision, and attack reveal it, jamming never reduces damage. No production, repair, or weapon. Supports one local Jammer Van field. Blackout pulse setup 30, radius 4.0, active 120, cooldown 240; suppresses shared vision and selected remote targeting, while direct vision, local attacks, and dedicated counter-jamming remain valid; destruction ends it. Persistent shared construction lifecycle, no expiry."
