display_name: Relay Cache
description: "Optional Advanced temporary local designation and command relay. 2x2 footprint, four cardinal facings, one mast interaction cell; buildable ground within shared builder anchors away from routes/objectives. Construction 450 resource / 270 ticks, operational Safehouse and builder required. Body 320 HP light armor, expires rather than leaving recoverable wreck; visible while setup/relaying and ordinary attack, EMP, jamming, or sabotage can interrupt. No production, repair, or weapon. Raise cache setup 45, active 180, radius 5.0, cooldown 300; shares nearby designated vision and reduces selected local support response by 15 ticks; 30-tick expiry warning, destruction ends effect. Temporary lifecycle removes without wreck."
