display_name: Safehouse
description: "Core Established persistent Network construction origin and standard match-loss anchor. Base anchor with 3x3 footprint, four cardinal facings, one interaction cell on each side, and one builder exit. Place near scenario start or active Network builder on buildable ground away from routes and objectives. Scenario-started in standard match and not a normal replacement order; construction is 700 resource / 360 ticks when constructed. Body 900 HP, reinforcedStructure armor, ordinary structure collision. Structure targetability; close vision, sensors, and attacks reveal it; local concealment never changes armor or prevents area damage. Owns Network construction origin and one limited construction permission, produces no combat units or replacements, no queue/prerequisite/replacement. Destruction removes standard base anchor and ends a normal match. Keep low passively conceals locally after 90 ticks without hostile detection/activity, breaks on construction, production, attack, or direct detection, and has 60-tick re-entry delay. No repair or defense weapon. Lifecycle is persistent shared blueprint, constructing, operational, damaged, destroyed."
