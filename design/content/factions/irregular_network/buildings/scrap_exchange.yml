display_name: Scrap Exchange
description: "Core Field economy and bounded salvage site. 3x2 footprint with four cardinal facings, two unload interaction cells on long side, one service approach; place within construction anchor radius outside resource/objective exclusions. Construction 450 resource / 270 ticks, operational Safehouse and builder required. Body 500 HP, light armor, ordinary structure targetability and vision; no concealment while processing or recovering salvage; damaged remains operational unless explicit disabled effect. Receives harvester unloading at 75 percent normal throughput and creates no second resource. Repairs docked Network harvesters at 3 HP/s; no general combat repair or revival. Sort salvage channels one eligible wreck within 1.0 cell for 90 ticks, cooldown 300, returns one bounded payout and visibly occupies exchange; hostile damage interrupts. No weapon. Shared blueprint, constructing, operational, damaged, destroyed; no expiry."
