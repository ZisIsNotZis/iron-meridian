display_name: Blocker Team
description: "Irregular Network infantry, Core, Field. Primary anti-infantry screen and secondary route denial; targets personnel and light exposed units. Foot movement and cover interaction; crushable by heavy vehicles while moving or exposed. Scatter charges and short-range automatic weapons provide suppression and small-area control, weak against armor and structures. Personnel armor survives by spacing and cover, not durability. Trip line places one visible-but-low-profile temporary snare across a short segment, slows the first enemy group crossing, expires, cannot chain, and cannot permanently block a route; setup is visible and interruptible. No repair, transport, or detection support. Production 140 resource / 90 ticks in Cell House infantry FIFO, Field tier, no hard roster cap, replaceable while Cell House operates. Body 150 HP, personnel armor, foot speed 2.8 cells/s, radius 0.24, footprint 1x1. Vision 6.0, alert/acquisition 7.5 cells, ground domain, ordinary vision, crushable by heavy vehicles. Scatter charges use explosive/area, ground personnel and light armor, range 3.2, 18 damage/event, period 36 ticks, thrown projectile at 8 cells/s, area hit radius 0.7, no tracking, direct acquisition. Trip line range 1.5, setup 30 ticks, duration 180 ticks, cooldown 240 ticks, one trigger, 45 percent move-speed reduction for 90 ticks."
