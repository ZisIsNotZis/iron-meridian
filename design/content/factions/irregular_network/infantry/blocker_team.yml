design: {tactical_identity: "Cheap screen that makes one approach awkward while remaining mobile.", player_decision: "Spend setup time to deny an approach or keep the team mobile as a screen.", counterplay: "Scouting, ranged fire, vehicles, and clearing the line.", offense_behavior: "Scatter charges give suppression and small-area control but are weak against armor and structures.", defense_behavior: "Personnel armor; spacing and cover matter more than durability; heavy vehicles crush it while exposed.", support_behavior: "Trip line only; no repair, transport, or detection support.", locomotion_behavior: "Foot and ordinary ground movement with cover interaction.", targetability_behavior: "Ground infantry; crushable while moving or exposed.", acquisition_behavior: "Scatter charges range 3.2, 18 damage, 36 ticks, projectile speed 8, radius 0.7, direct point acquisition.", lock_behavior: "Trip line range 1.5, setup 30, duration 180, cooldown 240; one visible trigger and 45 percent slow for 90 ticks; setup interruptible.", lifecycle_behavior: "No special lifecycle beyond shared unit states.", production_behavior: "Cell House infantry FIFO; 140 resource, 90 ticks, no hard roster cap, replaceable.", visual_identity: "Rolled cable and hand-painted warning tabs.", audio_identity: "Faction fallback for standard infantry cues.", fx_identity: "Dust snap at trip-line trigger.", design_rationale: "Area radius and suppression application are card-owned; damage conversion and status resolution use shared rules."}
