display_name: Breacher Cell
description: "Irregular Network infantry, Core, Established. Primary close assault and secondary structural damage and vehicle disable; targets buildings, emplacements, and light vehicles. Foot movement is slower while carrying charges; it enters buildings only where scenario/building rules permit and is vulnerable during charge placement and crushable by vehicles. Shaped charges and compact shotguns provide a strong close structural channel but poor sustained open-field damage. Plant charge channels on a structure or stationary vehicle with visible warning and delayed detonation; destroying or forcing the cell away cancels it. No repair, transport, detection, or command support. Production 220 resource / 120 ticks in Cell House with operational Field Workshop, infantry FIFO, Established tier, no hard roster cap; specialist replacement occupies the shared queue. Body 170 HP, personnel armor, foot speed 2.7 cells/s, radius 0.24, footprint 1x1. Vision 6.0, alert/acquisition 7.0 cells, ground domain, ordinary vision, crushable exposed. Breach shotgun uses machine gun/autocannon, ground personnel and light armor, range 2.8, 24 damage/event, period 30 ticks, projectile speed 16, point hit, no tracking. Shaped charge uses siege/structural, ground vehicles and structures, range 1.2, 90 damage/event, period 90 ticks, placed point charge, fuse travel 6, point hit, no tracking, adjacent only. Plant charge targets structure or stationary light vehicle at 1.2, channel 45, detonation after 30, cooldown 180, 120 structural plus 40 health damage in 0.8 area; adjacency and visible warning are required."
