display_name: Field Mechanic
description: "Core Established field-repair infantry and limited wreck recovery. Foot movement is slow while repairing and cannot keep pace with a retreating vehicle unless transported; exposed during repair and recovery. Tool pistol gives negligible anti-personnel damage. Patch channels a nearby allied vehicle, restores health over time, and stops when damaged or out of range. Recover wreck channels one eligible wreck for a bounded salvage payout or temporary battlefield-use charge, never a permanent production unlock. Production 200 resource / 120 ticks; Cell House plus operational Field Workshop; infantry FIFO; no hard roster cap, one mechanic per target under the shared repair limit. Body 130 HP, personnel armor, speed 2.4 cells/s, radius 0.23, footprint 1x1; vision 5.8, alert/acquisition 7.0. Tool pistol uses rifle/small arms, range 3.0, 4 damage/event, 45 ticks, projectile speed 12, point hit, no tracking. Patch targets an allied ground vehicle at range 1.0, channel 30 ticks, restores 8 HP/tick, interrupted by hostile hit or separation, cooldown 30 after release. Recover wreck targets an eligible allied wreck at range 1.0, channel 90 ticks, cooldown 300, visible cable and interruptible."
