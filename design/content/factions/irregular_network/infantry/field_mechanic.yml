design: {tactical_identity: "Exposed support that turns selected wrecks and vehicles into bounded recovery value.", player_decision: "Keep an expensive vehicle alive or risk a recovery channel under fire.", counterplay: "Focus fire, displacement, and denying wrecks.", offense_behavior: "Tool pistol is negligible anti-personnel self-defense: range 3, 4 damage, 45 ticks.", defense_behavior: "Personnel armor; requires screening and is exposed during repair and recovery.", support_behavior: "Patch restores 8 HP/tick for 30 ticks; Recover wreck returns only bounded salvage or one temporary charge; no command or transport.", locomotion_behavior: "Foot, 2.4 cells/s; slow while repairing and cannot keep pace unless transported.", targetability_behavior: "Ground infantry, ordinary vision; repair channel exposes the unit.", acquisition_behavior: "Tool pistol uses direct point acquisition with no tracking.", lock_behavior: "Patch range 1, hostile hit/separation interrupts and starts 30-tick post-release cooldown; Recover wreck range 1, 90 ticks, cooldown 300.", lifecycle_behavior: "No special lifecycle beyond shared unit states.", production_behavior: "Cell House plus operational Field Workshop; 200 resource, 120 ticks, shared repair limit.", visual_identity: "Welding mask, blue arc, stamped salvage crate.", audio_identity: "Tool and repair cues with faction fallback.", fx_identity: "Visible blue repair arc and taut recovery cable.", design_rationale: "Repair values are per-entity support values and obey shared one-source and repair-grace rules."}
