design: {tactical_identity: "High-value anti-armor ambush with a mobility-versus-commitment trade.", player_decision: "Pre-position for one decisive shot, then survive the reveal and displacement.", counterplay: "Scouts, artillery, infantry screens, and forcing an early shot.", offense_behavior: "Recoilless rifle targets ground light and heavy vehicles; high single-target damage and poor infantry/air performance.", defense_behavior: "Personnel armor and local concealment; concealment changes information, not armor, and area damage remains valid.", support_behavior: "Anchor shot improves its own anti-armor shot; no repair, transport, or command support.", locomotion_behavior: "Foot, ordinary cover interaction, slow while carrying launcher; concealed only in a valid prepared hide after bracing.", targetability_behavior: "Ground infantry; concealed while inactive in a valid hide, revealed by firing, close detection, or area damage; crushable when revealed.", acquisition_behavior: "Range 7.5, 105 damage, 90 ticks, projectile speed 9, point hit; 15-tick lock cancelled by movement, EMP, or lost legal target.", lock_behavior: "Anchor shot immobilizes during 30-tick setup, reveals the team, and gives the next shot +20 percent damage and +1 range; cooldown 150.", lifecycle_behavior: "No special lifecycle beyond shared unit states.", production_behavior: "Cell House plus operational Field Workshop; 240 resource, 150 ticks, one queue slot per order, no hard roster cap.", visual_identity: "Folded tripod, optical sight, dust ring, visible brace cable.", audio_identity: "Faction fallback and restrained ambush weapon cues.", fx_identity: "Sharp dust ring and net-tearing muzzle reveal.", design_rationale: "Ambush bonus is a deliberate skill modifier; anti-armor uses shared damage ratios."}
