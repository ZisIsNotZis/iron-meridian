display_name: Hunter Team
description: "Core Established anti-armor ambush infantry. Slow foot movement while carrying the launcher; local temporary concealment and cover, crushable when revealed. Recoilless anti-armor weapon delivers high single-target health damage against medium and heavy ground vehicles and is poor against infantry and aircraft. Personnel armor makes one exposed team easy to punish. Anchor shot braces for a stronger armor strike and immobilization chance; setup reveals the team. Production 240 resource / 150 ticks; Cell House plus operational Field Workshop; infantry FIFO; no hard roster cap, one queue slot per order. Body 190 HP, personnel armor, speed 2.5 cells/s, radius 0.24, footprint 1x1; vision 6.5, alert/acquisition 8.0. Recoilless rifle uses anti-armor penetrator, range 7.5, 105 damage/event, 90 ticks, projectile speed 9, point hit, no tracking after launch, lock acquisition 15 ticks cancelled by movement, EMP, or lost legal target. Anchor shot setup 30 ticks, cooldown 150, next shot +20 percent damage and +1.0 range; team cannot move and is revealed during setup."
