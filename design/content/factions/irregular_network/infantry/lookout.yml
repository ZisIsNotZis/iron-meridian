display_name: Lookout
description: "Irregular Network infantry, Core, Field. Primary recon and secondary target designation and ambush setup; information rather than damage targets exposed infantry, vehicles, and structures. Foot movement with concealment near cover or in a prepared hide, no burrowing; firing, capturing, or prolonged designation breaks concealment. Ground infantry targetability requires detection or proximity while concealed, and ordinary vision reveals the disturbance after a short readable cue. Personnel armor makes it fragile in open ground; concealment is not armor and does not stop area damage. Mark target is a visible single-target channel interrupted by damage, with a bounded duration and local link; Hide enters local concealment after setup and breaks on attack or displacement. Production is 125 resource / 75 ticks in the Cell House, infantry FIFO, no hard roster cap, fully replaceable while the Cell House operates. Body 110 HP, personnel armor, foot speed 3.0 cells/s, radius 0.22, footprint 1x1. Vision 9.5, alert/acquisition 11.0 cells, ground domain, ordinary vision. Carbine uses rifle/small arms, ground personnel and light armor, range 4.5, 10 damage/event, period 30 ticks, projectile speed 14 cells/s, point hit, no tracking, direct acquisition. Mark target range 9.5, channel 15 ticks, mark duration 120 ticks, cooldown 180 ticks; one target and only local allied use. Hide setup 30 ticks, cooldown 90 ticks, stationary while concealed."
