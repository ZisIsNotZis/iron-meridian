design:
  tactical_identity: "Concealed recon that trades its information advantage for a valuable visible mark."
  player_decision: "Reveal the scout for a valuable mark or preserve information."
  counterplay: "Use detection, patrols, area fire, and force the Lookout out of cover."
  offense_behavior: "Carbine is low direct damage; designation marks one visible target for allied ambush weapons without global sharing."
  defense_behavior: "Personnel armor; fragile in open ground; concealment changes information only."
  support_behavior: "Mark target and Hide provide local designation and concealment; no repair, transport, or global vision."
  locomotion_behavior: "Foot; ordinary ground movement and cover interaction; no burrowing."
  targetability_behavior: "Ground infantry; concealment requires local cover or hide and detection/proximity, and acting reveals a readable disturbance."
  acquisition_behavior: "Mark target is a single visible target at 9.5 cells, channel 15, duration 120, cooldown 180, interrupted by damage; local link only."
  lock_behavior: "Hide setup 30, cooldown 90; stationary while hidden; attack, capture, displacement, or prolonged designation reveals it."
  lifecycle_behavior: "No special lifecycle beyond shared unit states."
  production_behavior: "Cell House infantry FIFO; 125 resource, 75 ticks, no hard roster cap, fully replaceable while operational."
  visual_identity: "Patched optics, cloth map tabs, dim amber lens glint."
  audio_identity: "Faction fallback for selection, acknowledgement, attack/skill, damage, and destruction."
  fx_identity: "Narrow amber designation thread and readable concealment disturbance."
  design_rationale: "Vision and designation range exceed the scout profile because information is the primary role; concealment never changes armor or blocks area damage."
