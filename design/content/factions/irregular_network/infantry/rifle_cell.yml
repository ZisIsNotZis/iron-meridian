display_name: Rifle Cell
description: "Irregular Network infantry, Core, Field. Primary line infantry and secondary cheap ambush body; targets personnel and unarmored support. Foot movement, cover, and capture interaction; crushable in the open. Rifles deliver modest anti-personnel health damage and gain a short first-volley advantage from concealment, then fight normally. Personnel armor is replaceable and vulnerable to explosives, vehicles, and suppression. Break contact throws smoke and retreats a short distance; smoke blocks clear targeting but does not erase detection or damage. Production 100 resource / 60 ticks in Cell House infantry FIFO, Field tier, no hard roster cap, fully replaceable while Cell House operates. Body 180 HP, personnel armor, foot speed 3.0 cells/s, radius 0.22, footprint 1x1. Vision 6.5, alert/acquisition 8.0 cells, ground domain, ordinary vision. Cell rifles use rifle/small arms, ground personnel and light armor, range 4.5, 22 damage/event, period 30 ticks, projectile speed 14 cells/s, point hit, no tracking, direct acquisition. Break contact is self-centered smoke radius 1.2, setup 6 ticks, duration 90 ticks, cooldown 180 ticks, grants a retreat move order and blocks clear targeting through smoke. First concealed volley gains 25 percent damage for one event."
