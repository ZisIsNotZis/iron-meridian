display_name: Saboteur
description: "Core Advanced infiltration infantry. Foot movement; concealment while outside detection, but no conventional attack. Capture interaction is replaced by sabotage on valid targets. Ground infantry is hidden only while undetected and inactive; detection, area damage, and structure security reveal it. No meaningful direct weapon. Personnel armor makes it a timing and information piece. Infiltrate channels at a valid structure or special asset and applies one announced bounded disruption: production pause, sensor blackout, or temporary weapon lock; the Saboteur is consumed or forced out after completion. No chain effects or permanent lockout. Production 300 resource / 210 ticks; Cell House plus operational Hideout or Relay Cache; infantry FIFO; no hard roster cap, each completed infiltration consumes the specialist. Body 95 HP, personnel armor, speed 2.8, radius 0.22, footprint 1x1; vision 6.0, alert/acquisition 7.0. No direct weapon, range 0, damage 0, no acquisition. Infiltrate range 1.0, channel 60 ticks, cooldown 300, consumed on completion, effect duration 120, structure warning at start, interruptible."
