display_name: Signal Runner
description: "Optional Advanced local command relay infantry. Foot movement and ordinary ground movement; vulnerable while maintaining a relay. Ground infantry is visible when active because the relay mast and signal pulse expose its location. Compact carbine gives weak anti-personnel fire. Raise relay deploys a finite obvious local link that shares designated vision and improves selected support response; units remain functional outside it and receive no global aura. The link can be jammed or destroyed by killing the Runner. Production 260 resource / 180 ticks; Cell House plus operational Hideout or Relay Cache; infantry FIFO; one active Raise relay per player, additional Runners reserved as replacements. Body 120 HP, personnel armor, speed 2.8, radius 0.23, footprint 1x1; vision 7.0, alert/acquisition 8.5. Compact carbine uses rifle/small arms, ground personnel, range 3.5, 8 damage/event, period 36, projectile speed 13, point hit, no tracking. Raise relay radius 5.0, setup 30, active 180, cooldown 300; interrupted by movement, EMP, or death."
