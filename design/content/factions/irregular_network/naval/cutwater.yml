  - {weapon: weapons.default_resolution, mount_name: rocket_rack, damage: damages.explosive_area, targetability: [targetabilities.ground], attackrange: 4.0, attackdamage: 30, attackperiod: 60, projectile_speed: 10, area_radius_cells: 0.5, delivery: projectile, hit_model: area, tracking: none, acquisition: direct}
