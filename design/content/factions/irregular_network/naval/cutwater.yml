display_name: Cutwater
description: "Core Established amphibious raider. Amphibious land/water movement at 4.5/5.0 cells/s with explicit 30-tick transition reducing speed and weapon access; not submerged or hidden. Ground vehicle on land and naval surface in water; light armor on land and light naval protection afloat. Light cannon uses machine gun/autocannon against ground personnel, light armor, and naval surface, range 5.0, 40 damage/event, 45 ticks, projectile speed 12, point hit, no tracking. Rocket rack uses explosive/area against ground personnel and light armor, range 4.0, 30 damage/event, 60 ticks, projectile speed 10, area radius .5, no tracking. Beach dash +50 percent speed for 45 ticks, cooldown 150, firing disabled during transition. Raid load carries one infantry group, load/unload channel 30, cooldown 90, vehicle slows 50 percent. Production 360 resource / 150 ticks from Boat Shed plus Field Workshop; coastal FIFO. Body 340 HP, radius .45, footprint 2x2, vision 7, alert 9."
