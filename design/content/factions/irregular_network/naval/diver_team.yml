display_name: Diver Team
description: "Core Established submerged infiltration and naval sabotage infantry. Swimming 2.2 cells/s and submerged 1.8; cannot fire while submerged and must surface to capture or attack; shore/target transitions are vulnerable. Submerged targetability requires sonar, depth-capable weapons, or proximity; surfaced state is ground infantry and fully targetable. Personnel armor; depth concealment is not invulnerability. Limpet charge uses siege/structural against naval surface and coastal structures, range 1.0, 100 damage/event, period 90, attached point charge, delayed detonation after 60 ticks, no tracking, warning to target; team must surface/escape. Dive transition 30, submerged endurance 180, cooldown 240; cannot fire, capture, or plant submerged; surfacing recovery 30 and vulnerable. Production 280 resource / 180 ticks from Boat Shed plus Hideout, coastal FIFO, no hard roster cap, one active submerged state and one limpet charge. Body 120 HP, radius .22, footprint 1x1, surfaced vision 4.5, submerged sonar awareness 5.0, alert 6.0."
