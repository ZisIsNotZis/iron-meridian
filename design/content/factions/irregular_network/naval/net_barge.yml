display_name: Net Barge
description: "Optional Advanced temporary coastal-denial barge. Surface naval, slow at 2.0 cells/s, anchors into a temporary site and cannot fight while moving at full speed. Naval surface mobile/anchored, structure-like support profile deployed, visible and attackable. Weak deck gun uses machine gun/autocannon against naval surface and ground low-air at shoreline, range 3.5, 12 damage/event, 45 ticks, projectile speed 12, point hit, no tracking. Cast net anchor setup 30, active 150, cooldown 270, radius 4.0; exposes submerged units and applies 30-tick snare without alone damaging them; buoy line visible, barge stationary, aircraft/naval fire can destroy it. Body 380/450 HP mobile/anchored, light/naval protection mobile and reinforcedStructure anchored, radius .55/.60, footprint 2x2, vision 7, alert 9. Production 480 resource / 210 ticks from Boat Shed plus Hideout; coastal FIFO, maximum one active per Boat Shed, navigable water required."
