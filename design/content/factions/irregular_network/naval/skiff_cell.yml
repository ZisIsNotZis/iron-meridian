display_name: Skiff Cell
description: "Core Field cheap coastal ambush boat and infantry ferry. Surface naval, fast in shallow coastal water at 5.5 cells/s, cannot enter deep-water routes or land. Naval-surface targetability, light naval protection, visible to ordinary coastal vision. Shore rockets use explosive/area against naval surface and ground personnel, range 4.5, 35 damage/event, period 45, projectile speed 10, area radius 0.5, no tracking, direct point/designated fire. Shore drop unloads one allied infantry group at range 1.0, channel 30 ticks, cooldown 90; beach approach is visible and boat cannot fire while unloading. Production 180 resource / 75 ticks from Boat Shed, coastal FIFO, no hard roster cap, only on navigable shallow water. Body 220 HP, radius 0.40, footprint 2x1, vision 7.0, alert/acquisition 9.0."
