design: {tactical_identity: "One decisive concealed anti-vehicle shot followed by a vulnerable reveal.", player_decision: "Pre-position for a shot, then survive reveal and displacement.", counterplay: "Scouts, artillery, infantry screens, flanking, and forcing an early shot.", offense_behavior: "High single-shot anti-armor damage; weak against infantry and air.", defense_behavior: "Heavy armor while mobile; concealment changes information only and deployed chassis is flankable.", support_behavior: "Set ambush and Displace support concealment/displacement only; no repair, transport, or command.", locomotion_behavior: "Tracked, slow, deploy-and-fire; hidden state cannot move.", targetability_behavior: "Ground vehicle; valid hide concealment broken by firing, close detection, or area damage.", acquisition_behavior: "Cannon range 8, 150 damage, 105 ticks, projectile speed 8, point hit, 15-tick lock.", lock_behavior: "Set ambush setup 45, first shot +25 percent, cooldown 180; Displace recovery 30 then 1.4 cells/s; setup movement/damage interrupt.", lifecycle_behavior: "No hard roster cap; high-commitment replacement.", production_behavior: "Field Workshop plus Hideout; 600 resource, 270 ticks.", visual_identity: "Buried gun shield and camouflage net.", audio_identity: "Heavy cannon and net-tear reveal.", fx_identity: "Sharp muzzle reveal and dust displacement.", design_rationale: "Reduced mobility and high single-shot damage define the ambush trade; hidden state changes information only."}
