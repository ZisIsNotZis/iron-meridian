display_name: Ambush Gun
description: "Core Advanced concealed anti-vehicle strike deployable and retreat area denial. Tracked speed 1.8 cells/s; deploy-and-fire and hidden only after deploying in a valid hide, immobile while hidden; firing, close detection, and area damage reveal it. Medium/heavy anti-armor cannon is weak against infantry and air. Body 360 HP, heavy armor, radius 0.50, footprint 2x2; vision 7.0, alert/acquisition 9.0. Ambush cannon uses anti-armor penetrator against ground light and heavy vehicles, range 8.0, 150 damage/event, 105 ticks, projectile speed 8, point hit, no tracking, lock acquisition 15. Set ambush setup 45, +25 percent first-shot damage, cooldown 180; movement and damage interrupt setup. Displace recovery 30 then moves 1.4 cells/s; firing ends concealment. Production 600 resource / 270 ticks from Field Workshop plus operational Hideout; high-commitment replacements."
