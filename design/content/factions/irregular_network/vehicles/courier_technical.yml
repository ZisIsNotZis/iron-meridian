display_name: Courier Technical
description: "Core Field fast transport and extraction vehicle, with secondary fast objective running and no combat specialty. Wheeled: 6.5 cells/s on firm ground, 4.0 off-road; loading and unloading infantry has a brief exposure window. Ground vehicle with light armor and ordinary detection; no concealment while extracting. Ring gun is light machine gun/autocannon self-defense against ground personnel and light armor, range 4.0, 14 damage/event, 24 ticks, projectile speed 16, point hit, no tracking. Hot pickup loads a nearby Network infantry group within 1.0 cell, channel 15 ticks, cooldown 45, and reduces speed 50 percent. Scatter unloads at current position with visible predictable landing area, smoke radius 1.0, recovery 15 ticks, cooldown 30. Production 220 resource / 90 ticks from Field Workshop, vehicle FIFO, no hard roster cap, replaceable while Workshop operates. Body 260 HP, light armor, radius 0.42, footprint 2x1."
