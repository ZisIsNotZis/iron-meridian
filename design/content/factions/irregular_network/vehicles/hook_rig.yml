display_name: Hook Rig
description: "Core Established vehicle/deployable for battlefield recovery and repositioning, with secondary anti-vehicle mobility disruption. Wheeled, slow and clumsy; hook attack uses stationary setup and short direct pull. Targets disabled vehicles, wrecks, and selected light vehicles, not heavy units or structures. Light armor requires protection. Hook and haul channels a wreck or eligible light vehicle, drags it 2.0 cells over 30 ticks or prepares it for Wrecker/Mechanic recovery; channel lasts 45 ticks, cooldown 150, movement disabled and interruption breaks the cable. Hook launcher is control, ground light vehicles and wrecks, range 4.0, zero health damage, period 90 ticks, direct cable at 10 cells/s, point attachment, no tracking after latch. Production 360 resource / 165 ticks from Field Workshop, vehicle FIFO, no hard roster cap, one active channel. Body 300 HP, light armor, speed 2.8, radius 0.45, footprint 2x2."
