display_name: Improvised Mortar
description: "Core Advanced indirect area and structural-fire vehicle/deployable. Wheeled speed 2.2 cells/s, slow off-road; deploy-and-fire and stationary during windup and firing. Mobile ground vehicle; deployed firing state is structure-like for sensing, visible to detection and counter-battery. Light armor and fragile when discovered. Improvised mortar uses explosive/area against personnel, light/heavy vehicles, and structures, range 10.0, 75 damage/event, 120 ticks, arced projectile speed 6, area radius 1.0, no tracking, indirect point/designated acquisition. Fire mission setup 45, three-shot salvo at 30-tick intervals, cooldown 240, deterministic +/-0.8 scatter, movement/damage/EMP interrupt setup, red impact warning 30 ticks. Production 500 resource / 240 ticks from Field Workshop plus Hideout; one active mission per Mortar. Body 280 HP, light armor, radius 0.45, footprint 2x2; vision 6.5, alert/acquisition 8.0."
