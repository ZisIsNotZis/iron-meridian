display_name: Jammer Van
description: "Core Established local information-denial vehicle. Wheeled, 3.8 cells/s and 2.0 while jamming; ordinary road preference. Ground vehicle with light armor; local false-signature field does not prevent close vision, attack, or counter-jamming. Defensive carbine uses rifle/small arms against personnel, range 3.0, 6 damage/event, 45 ticks, projectile speed 12, point hit, no tracking. Blackout is radius 5.0, setup 30, active 120, cooldown 240; suppresses shared vision and selected remote targeting, not direct vision or ordinary weapon damage; van stationary, visible through pulsing interference ring, EMP or destruction ends it. Production 420 resource / 210 ticks from Field Workshop plus operational Jammer Post; vehicle FIFO; no hard roster cap; one field per van and one supported field per post. Body 240 HP, radius 0.42, footprint 2x1."
