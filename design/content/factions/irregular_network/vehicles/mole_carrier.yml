display_name: Mole Carrier
description: "Core Established concealed infantry-delivery vehicle/deployable. Tracked ground travel at 2.6 cells/s, then one brief straight limited subsurface route; no persistent tunnels or attacks while submerged. Ground vehicle while surfaced; during subsurface transit detectable but not directly targetable by ordinary weapons, with dust/ground disturbance, area effects, and exit interception as counterplay. Light armor, vulnerable during loading, surfacing, and recovery. Nose gun uses machine gun/autocannon against ground personnel, range 3.5, 10 damage/event, 36 ticks, projectile speed 14, point hit, no tracking, unavailable subsurface. Dive route is a visible destination within 8.0 cells, setup 30, subsurface travel 60, cooldown 240, fixed route and no attacks. Eject surface recovery 30, unload channel 30, cooldown 60; carrier and passengers vulnerable. Production 450 resource / 210 ticks from Field Workshop plus operational Hideout; one infantry group capacity and one active route. Body 320 HP, radius 0.48, footprint 2x2; vision 6.5, alert/acquisition 8.0."
