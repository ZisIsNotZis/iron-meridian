display_name: Needle Technical
description: "Core Field hit-and-run anti-infantry vehicle. Wheeled, 6.0 cells/s on roads and 3.8 off-road, with direct attack movement and short breakoff preference. Ground vehicle, light armor, ordinary vision, no special concealment. Twin machine guns use machine gun/autocannon against personnel and light armor, range 4.5, 26 damage/event, 24 ticks, projectile speed 16, point hit, no tracking. Dust dash gives +40 percent speed for 60 ticks, cooldown 150, accuracy -25 percent; firing ends the dash and reveals the route through dust. Production 280 resource / 105 ticks from Field Workshop, vehicle FIFO, no hard roster cap, replaceable. Body 230 HP, radius 0.40, footprint 2x1."
