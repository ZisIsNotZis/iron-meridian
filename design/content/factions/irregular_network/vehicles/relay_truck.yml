display_name: Relay Truck
description: "Optional Advanced vehicle/deployable temporary command site. Wheeled speed 3.0 cells/s, slow while carrying mast; deploys with setup. Mobile ground vehicle, structure-like obvious deployed site; light armor mobile and reinforcedStructure deployed, finite health and duration. No direct weapon beyond token defensive none; support is local. Raise mast setup 45, active 180, cooldown 300, local radius 5.0; shares nearby designated vision and improves selected support timing. Fold mast recovery 30, ends site and restores mobility. Both interrupted by EMP or destruction. Production 550 resource / 240 ticks from Field Workshop plus Hideout; one active field per truck. Body 260/420 HP mobile/deployed, radius 0.44/0.50, footprint 2x1/2x2; vision 7.0, alert/acquisition 8.5."
