display_name: Scrap Truck
description: "Core Field temporary-site logistics vehicle for salvage collection and cover placement. Wheeled, 3.0 cells/s and 2.0 loaded; deploys into a visible temporary scrap cache or barricade with setup. Ground vehicle mobile and structure-like temporary site deployed; light armor mobile and reinforcedStructure deployed; both visible and attackable. Scrap pistol uses rifle/small arms against personnel, range 3.0, 5 damage/event, 45 ticks, projectile speed 12, point hit, no tracking. Sort salvage channels one eligible wreck/drop at 1.0 cell for 60 ticks, cooldown 240, one bounded recovery payout. Drop barricade setup 30 ticks creates one 2x1 temporary cover piece for 240 ticks, no damage or chaining; both interruptible. Production 250 resource / 120 ticks from Field Workshop, vehicle FIFO, no hard roster cap, one salvage load and one barricade deployment. Body 250/300 HP mobile/deployed, radius 0.44/0.50, footprint 2x1/2x2."
