display_name: Wrecker
description: "Core Established mobile repair and wreck-denial vehicle. Tracked speed 2.4 cells/s, stationary during repair; ground vehicle, light armor, ordinary detection, valuable support target. Defensive machine gun uses machine gun/autocannon against ground personnel, range 3.5, 12 damage/event, 36 ticks, projectile speed 14, point hit, no tracking. Tow and patch targets one nearby allied vehicle or eligible wreck at range 1.0, channels 30 ticks, restores 6 HP/tick or tows 2.0 cells over 30 ticks, cooldown 30, stationary while active, visible cable, hostile hit interrupts under shared repair grace. Production 400 resource / 180 ticks from Field Workshop, vehicle FIFO, no hard roster cap, one active channel. Body 340 HP, radius 0.48, footprint 2x2, vision 6.5, alert/acquisition 8.0."
