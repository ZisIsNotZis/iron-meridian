display_name: Three Arches
description: Near-term route-commitment map with one objective, three traversable approach bands, and six cover arches.
status: near-term
design:
  tactical_identity: Hold the exposed center, rotate through a flank, or delay for the contested resource.
  player_decision: Commit to center pressure or preserve a retreat through a north or south arch.
  visual_identity: Six mirrored 4x2 cover arches on three approach bands.
  rationale: Arches are authored cover shapes, not special structures; shared land rules remain unchanged. A retreat path exists from every cover block toward both base pockets, and the objective never grants vision.
  scope: near_term
dimensions:
  width: 64
  height: 40
  cell_units: cell
  distance_units_per_cell: 1000
coordinate_contract:
  cell_index_bounds: x=0..63,y=0..39
  bounds_order: [min_x, max_x, min_y, max_y]
  world_point_center: [32, 20]
  cell_center: '[x+0.5,y+0.5]'
  reflection: {world_point: 'R(x,y)=(64-x,y)', cell_index: 'R(x,y)=(63-x,y)'}
layers:
  authoritative: Shared cell flags; arches are traversable cover and never special structures.
  border: {x_cells: [0, 63], y_cells: [0, 39], terrain: edge, walkable: true, buildable: false}
  layer_precedence: [playable, border, cover, no_build, primary_route, base_pocket, decorative]
  base_rules: [Three approach bands are each 3 cells wide., Cover changes line of sight only., No new locomotor, damage, construction, or victory rule is authored., No water, elevation, hazard, or random resource layer is authored.]
  cover_rectangles:
    - {id: north_west_outer, center: [18, 9], size_cells: [4, 2], function: North route cover arch., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none, reflection_of: north_east_outer}
    - {id: north_center, center: [32, 9], size_cells: [4, 2], function: North route cover arch on the centerline., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none}
    - {id: north_east_outer, center: [46, 9], size_cells: [4, 2], function: North route cover arch., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none, reflection_of: north_west_outer}
    - {id: south_west_outer, center: [18, 30], size_cells: [4, 2], function: South route cover arch., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none, reflection_of: south_east_outer}
    - {id: south_center_offset, center: [27, 30], size_cells: [4, 2], function: Offset south-center cover; cannot seal the contested resource or objective approach., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none}
    - {id: south_east_outer, center: [46, 30], size_cells: [4, 2], function: South route cover arch., cover: true, traversable: true, line_of_sight_blocking: true, damage_modifier: none, reflection_of: south_west_outer}
  route_bands:
    - {id: north, bounds: [12, 51, 8, 10], intended_use: Flank approach and sight-break route., flags: [no_build, primary_route]}
    - {id: center, bounds: [12, 51, 18, 20], intended_use: Shortest and most exposed objective approach., flags: [no_build, primary_route]}
    - {id: south, bounds: [12, 51, 29, 31], intended_use: Flank approach and delayed contested-resource commitment., flags: [no_build, primary_route]}
  base_pockets:
    - {side: west, bounds: [4, 11, 17, 23], buildable: true}
    - {side: east, bounds: [52, 59, 17, 23], buildable: true}
  exclusions: {rule: 'Shared objective and resource exclusion rules apply.', objective: 'Primary objective at (32,20) has capture radius 4 and no-build radius 8.', resource_nodes: 'Home nodes at (10,12) and (54,12) have 24000 reserve; contested node at (32,30) has 12000 reserve and 2-cell exclusion.'}
  deferred: [air topology, naval topology, elevation, hazards, random resources]
anchors:
  player:
    - {id: base_pocket, west: {bounds: [4, 11, 17, 23]}, east: {bounds: [52, 59, 17, 23]}, anchor_role: Mirrored home buildable pockets.}
    - {id: hq_footprint, west: {bounds: [4, 7, 18, 21]}, east: {bounds: [56, 59, 18, 21]}, anchor_role: Mirrored HQ footprints.}
    - {id: home_resource_node, west: {point: [10, 12]}, east: {point: [54, 12]}, reserve: 24000, interaction_point_rule: nearest_clear_cell, anchor_role: Mirrored home resource nodes.}
  central:
    - {id: objective, point: [32, 20], capture_radius_cells: 4, no_build_radius_cells: 8, rule: One primary objective; it never grants vision.}
    - {id: contested_resource_node, point: [32, 30], exclusion_radius_cells: 2, reserve: 12000, rule: Delayed economic commitment; no respawn.}
  resource_interaction_point_rule: Nearest clear cell under the shared deterministic neighbor rule.
routes:
  tactical_intent: Center is shortest and exposed; north and south are equal-length flanks connecting at x=24 and x=40.
  waypoints:
    - {id: north, points: [[12.5, 9.5], [32, 9.5], [51.5, 9.5]]}
    - {id: center, points: [[12.5, 19.5], [32, 19.5], [51.5, 19.5]]}
    - {id: south, points: [[12.5, 30.5], [32, 30.5], [51.5, 30.5]]}
  connectivity: [North and south approaches connect to the central field at x=24 and x=40., A retreat path exists from every cover block toward both base pockets., Route flags remain traversable and no cover block seals a route.]
vision:
  rules: [Shared basic fog and sensing rules apply., Objective never grants vision., Cover changes line of sight only., Cover blocks are traversable and do not change damage or armor.]
validation:
  invariants: [The six cover blocks are mirrored in pairs around x=32 and remain traversable., Starting footprints, resource exclusions, and objective exclusions are disjoint., Every cover block has a retreat path toward both base pockets., No new locomotor, damage, construction, or victory rule exists.]
  acceptance_target: Near-term route-commitment map with equal-length flank choices and a readable exposed center.
