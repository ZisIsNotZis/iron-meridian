rules:
  fog: Basic fog; ownership does not grant objective-wide vision.
  progression: Disabled; no experience or promotion.
  pause: Local-only pause against AI; no simulation tick advances while paused.
  victory: Enemy HQ destruction or canonical cumulative objective hold threshold; same-tick HQ destruction has priority.
  defeat: Own HQ destruction or voluntary surrender.
  ai: East uses regular scripted finite-state opponent; human east is development-only.
  surrender: Available from pause menu and counts as voluntary defeat.
  draw: No draw state; future tie-producing rules require explicit priority.
  objective_hold_seconds: 75
  same_tick_priority: HQ destruction before objective completion.
  human_harness: Human-controlled east is an out-of-scenario development harness, not a V1 mode.
acceptance:
  duration: 8-12 minutes
  duration_min_seconds: 480
