$schema: https://json-schema.org/draft/2020-12/schema
$id: building
title: Faction or neutral building
type: object
additionalProperties: false
required: [display_name, description, platform, tier, hpmax, armor, targetability, sensing, collision, footprint]
properties:
  display_name: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  status: {type: string, enum: [core, designed, optional, near-term, deferred, deprecated]}
  scope: {type: string, enum: [core, v1, near_term, far_vision, deferred]}
  faction: {type: string, pattern: '^factions\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'}
  asset_manifest: {type: string, minLength: 1}
  references:
    type: array
    items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
  inherits:
    type: array
    items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
  platform: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  tier: {type: string, enum: [field, established, advanced, strategic]}
  building_roles:
    type: array
    minItems: 1
    items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  hpmax: {type: number, minimum: 1}
  armor: {type: string, pattern: '^([a-z][a-z0-9_]*\.)+[a-z][a-z0-9_]*$'}
  locomotor: {type: string, enum: [none, not_applicable]}
  targetability:
    type: array
    minItems: 1
    items: {type: string, pattern: '^targetabilities\.[a-z][a-z0-9_]*$'}
  sensing: {type: string, pattern: '^sensing\.[a-z][a-z0-9_]*$'}
  collision: {type: string, pattern: '^collisions\.[a-z][a-z0-9_]*$'}
  visionrange: {type: number, minimum: 0}
  alertrange: {type: number, minimum: 0}
  footprint:
    type: object
    additionalProperties: false
    required: [width_cells, height_cells]
    properties:
      width_cells: {type: number, minimum: 0}
      height_cells: {type: number, minimum: 0}
      radius_cells: {type: number, minimum: 0}
      facings: {type: string, enum: [fixed, cardinal, eight_way]}
      interaction_cells: {type: integer, minimum: 0}
      service_cells: {type: integer, minimum: 0}
  placement:
    type: object
    additionalProperties: false
    properties:
      terrain: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      anchor: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      builder_range: {type: number, minimum: 0}
      route_exclusion: {type: boolean}
      resource_exclusion: {type: boolean}
      objective_exclusion: {type: boolean}
      water_access: {type: boolean}
      exit_clearance_cells: {type: number, minimum: 0}
      facing: {type: string, enum: [fixed, cardinal, eight_way]}
  construction:
    type: object
    additionalProperties: false
    required: [cost, buildtime]
    properties:
      cost:
        type: object
        additionalProperties: false
        required: [resource]
        properties:
          resource: {type: number, minimum: 0}
      buildtime: {type: integer, minimum: 0}
      builder: {type: string, pattern: '^([a-z][a-z0-9_]*\.)+[a-z][a-z0-9_]*$'}
      prerequisites:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [object]
          properties:
            object: {type: string, pattern: '^([a-z][a-z0-9_]*\.)+[a-z][a-z0-9_]*$'}
            state: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      refund_percent: {type: number, minimum: 0, maximum: 100}
      interruptible: {type: boolean}
  exits:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [exit_name, direction]
      properties:
        exit_name: {type: string, minLength: 1}
        direction: {type: string, enum: [north, east, south, west, any]}
        exit_type: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        capacity: {type: integer, minimum: 0}
        blocked_behavior: {type: string, enum: [pause, reroute, reject, destroy]}
  production:
    type: object
    additionalProperties: false
    properties:
      queues:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [queue_name, category, capacity]
          properties:
            queue_name: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            category: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            capacity: {type: integer, minimum: 0}
            recipes:
              type: array
              items: {type: string, pattern: '^recipes\.[a-z][a-z0-9_]*$'}
            exit_name: {type: string, minLength: 1}
            blocked_behavior: {type: string, enum: [pause, reroute, reject, destroy]}
      max_operational: {type: integer, minimum: 0}
      replacement_allowed: {type: boolean}
      replacement_requires: {type: string, pattern: '^([a-z][a-z0-9_]*\.)+[a-z][a-z0-9_]*$'}
      replacement_scope: {type: string, enum: [per_player, per_building, per_queue, none]}
      replacement_competes_with_new: {type: boolean}
      rearm_queue: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  economy:
    type: object
    additionalProperties: false
    properties:
      resource_type: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      unload_amount: {type: number, minimum: 0}
      unload_period_ticks: {type: integer, minimum: 0}
      condition_rate_per_tick: {type: number, minimum: 0}
  weapon_mounts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [weapon, mount_name]
      properties:
        weapon: {type: string, pattern: '^([a-z][a-z0-9_]*\.)+[a-z][a-z0-9_]*$'}
        mount_name: {type: string, minLength: 1}
        count: {type: integer, minimum: 1}
        damage: {type: string, pattern: '^damages\.[a-z][a-z0-9_]*$'}
        targetability: {type: array, items: {type: string, pattern: '^targetabilities\.[a-z][a-z0-9_]*$'}}
        attackrange: {type: number, minimum: 0}
        attackdamage: {type: number, minimum: 0}
        attackperiod: {type: integer, minimum: 0}
        projectile_speed: {type: number, minimum: 0}
        area_radius_cells: {type: number, minimum: 0}
        firing_arc_degrees: {type: number, minimum: 0, maximum: 360}
        delivery: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        hit_model: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        tracking: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        acquisition: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        ammo_capacity: {type: integer, minimum: 0}
        reload_ticks: {type: integer, minimum: 0}
        rearm_ticks: {type: integer, minimum: 0}
        warning_ticks: {type: integer, minimum: 0}
        requires_observation: {type: boolean}
        requires_lock: {type: boolean}
        disabled_in_states:
          type: array
          items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  skill_bindings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [skill, skill_name]
      properties:
        skill: {type: string, pattern: '^skills\.[a-z][a-z0-9_]*$'}
        skill_name: {type: string, minLength: 1}
        hotkey: {type: string, minLength: 1}
        activation: {type: string, enum: [active, passive, automatic, toggle]}
        setup_ticks: {type: integer, minimum: 0}
        active_ticks: {type: integer, minimum: 0}
        recovery_ticks: {type: integer, minimum: 0}
        cooldown_ticks: {type: integer, minimum: 0}
        targetrange: {type: number, minimum: 0}
        targetradius: {type: number, minimum: 0}
        channel_ticks: {type: integer, minimum: 0}
        duration_ticks: {type: integer, minimum: 0}
        warning_ticks: {type: integer, minimum: 0}
        target: {type: string, minLength: 1}
        target_classes:
          type: array
          items: {type: string, minLength: 1}
        visible_warning: {type: boolean}
        movement_allowed: {type: boolean}
        requires_observation: {type: boolean}
        requires_current_observation: {type: boolean}
        requires_lock: {type: boolean}
        interruption_conditions: {type: array, items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}}
        targetability: {type: array, items: {type: string, pattern: '^targetabilities\.[a-z][a-z0-9_]*$'}}
        state_transition:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            to: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        design:
          type: object
          additionalProperties: false
          properties:
            player_decision: {type: string, minLength: 1}
            counterplay: {type: string, minLength: 1}
            interruption_readability: {type: string, minLength: 1}
  capture:
    type: object
    additionalProperties: false
    properties:
      capturable: {type: boolean}
      capturetime_ticks: {type: integer, minimum: 0}
      captured_behavior: {type: string, enum: [change_owner, disable, destroy, reject]}
      captured_production: {type: boolean}
  repair:
    type: object
    additionalProperties: false
    properties:
      available: {type: boolean}
      target: {type: string, enum: [self, allied_units, allied_buildings, none]}
      rate_per_tick: {type: number, minimum: 0}
      range_cells: {type: number, minimum: 0}
      channel_capacity: {type: integer, minimum: 0}
      interrupted_by_damage: {type: boolean}
  lifecycle:
    type: object
    additionalProperties: false
    properties:
      states: {type: array, items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}}
      destruction_behavior: {type: string, enum: [wreck, remove, expire, transform]}
      wreck_asset: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      expiry_ticks: {type: integer, minimum: 0}
      expiry_warning_ticks: {type: integer, minimum: 0}
  presentation:
    type: object
    additionalProperties: false
    properties:
      icon: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      model: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      shadow: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      selection: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      construction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      operational: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      damaged: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      disabled: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      destruction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      state_variants:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [state, asset]
          properties:
            state: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            asset: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      fallback_policy: {type: string, enum: [inherit, placeholder, unavailable, required_before_release]}
      silhouette: {type: string, minLength: 1}
      material_language: {type: string, minLength: 1}
      readability: {type: string, minLength: 1}
  audio:
    type: object
    additionalProperties: false
    properties:
      construction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      selection: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      damage: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      repair: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      production: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      destruction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      ambient: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      identity: {type: string, minLength: 1}
  fx:
    type: object
    additionalProperties: false
    properties:
      construction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      production: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      weapon: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      skill: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      status: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      transition: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      destruction: {type: string, pattern: '^assets\.[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
      identity: {type: string, minLength: 1}
  design:
    type: object
    additionalProperties: false
    properties:
      tactical_identity: {type: string, minLength: 1}
      player_decision: {type: string, minLength: 1}
      counterplay: {type: string, minLength: 1}
      construction_behavior: {type: string, minLength: 1}
      production_behavior: {type: string, minLength: 1}
      defense_behavior: {type: string, minLength: 1}
      targetability_behavior: {type: string, minLength: 1}
      capture_behavior: {type: string, minLength: 1}
      repair_behavior: {type: string, minLength: 1}
      lifecycle_behavior: {type: string, minLength: 1}
      visual_identity: {type: string, minLength: 1}
      audio_identity: {type: string, minLength: 1}
      fx_identity: {type: string, minLength: 1}
      design_rationale: {type: string, minLength: 1}
