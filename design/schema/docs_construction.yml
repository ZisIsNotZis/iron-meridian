$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_construction
type: object
additionalProperties: false
required: [kind, document_id, title, source_document, ownership, v1_building_set, build_lifecycle, placement_validation, production_interaction, recovery_counterplay, acceptance_cases, deferred]
properties:
  kind: {const: construction_contract}
  document_id: {type: string}
  title: {type: string}
  source_document: {type: string}
  ownership: {type: array, items: {type: string}}
  v1_building_set: {type: array, items: {type: string}}
  build_lifecycle: {type: object, additionalProperties: false, required: [builder, flow, steps, channel_rules, blueprint_rules, hq_rule], properties: {builder: {type: string}, flow: {type: string}, steps: {type: array, items: {type: string}}, channel_rules: {type: array, items: {type: string}}, blueprint_rules: {type: array, items: {type: string}}, hq_rule: {type: string}}}
  placement_validation: {type: object, additionalProperties: false, required: [predicates, anchors, radius_measurement, conflict_order, geometry], properties: {predicates: {type: array, items: {type: string}}, anchors: {type: array, items: {type: string}}, radius_measurement: {type: array, items: {type: string}}, conflict_order: {type: array, items: {type: string}}, geometry: {type: array, items: {type: string}}}}
  production_interaction: {type: array, items: {type: string}}
  recovery_counterplay: {type: array, items: {type: string}}
  acceptance_cases: {type: array, items: {type: string}}
  deferred: {type: array, items: {type: string}}
