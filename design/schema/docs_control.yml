  information_hierarchy: {type: object, additionalProperties: false, required: [questions, question_meanings, battlefield_priority, top_bar, panels, minimap, placement, modal_policy], properties: {questions: {type: array, items: {type: string}}, question_meanings: {type: array, items: {type: object, additionalProperties: false, required: [question, answer], properties: {question: {type: string}, answer: {type: string}}}}, battlefield_priority: {type: string}, top_bar: {type: string}, panels: {type: string}, minimap: {type: object, additionalProperties: false, required: [logical_size, map_aspect, shows, markers, hides, click], properties: {logical_size: {type: array, items: {type: integer}}, map_aspect: {type: array, items: {type: integer}}, shows: {type: array, items: {type: string}}, markers: {type: string}, hides: {type: array, items: {type: string}}, click: {type: string}}}, placement: {type: string}, modal_policy: {type: string}}}
