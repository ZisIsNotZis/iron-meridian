$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_domain
type: object
additionalProperties: false
required: [kind, document_id, title, ownership, principles, schema_fields, constraints, presentation]
properties:
  kind: {type: string, enum: [unit_contract, building_contract, scenario_contract, map_contract, production_contract, recipe_contract, tech_contract, progression_contract, objective_contract]}
  document_id: {type: string}
  title: {type: string}
  ownership: {type: array, items: {type: string}}
  principles: {type: array, items: {type: string}}
  schema_fields: {type: array, items: {type: string}}
  constraints: {type: array, items: {type: string}}
  presentation: {type: array, items: {type: string}}
  stages: {type: array, items: {type: string}}
  roles: {type: array, items: {type: string}}
  lifecycle: {type: array, items: {type: string}}
  rules: {type: array, items: {type: string}}
  index: {type: array, items: {type: string}}
  deferred: {type: array, items: {type: string}}
  acceptance: {type: array, items: {type: string}}
  roster_target: {type: array, items: {type: string}}
  examples: {type: array, items: {type: string}}
