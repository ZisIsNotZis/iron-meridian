  title: {type: string}
  source_document: {type: string}
  ownership: {type: array, items: {type: string}}
  resource_lifecycle: {type: object, additionalProperties: false, required: [currency, flow, rules, scenario_start], properties: {currency: {type: string}, flow: {type: string}, rules: {type: array, items: {type: string}}, scenario_start: {type: string}}}
  income_spending: {type: array, items: {type: string}}
  harvester_behavior: {type: object, additionalProperties: false, required: [flow, rules, authority], properties: {flow: {type: string}, rules: {type: array, items: {type: string}}, authority: {type: string}}}
  edge_cases_ordering: {type: array, items: {type: string}}
  acceptance_cases: {type: array, items: {type: string}}
  recovery_counterplay: {type: array, items: {type: string}}
  deferred: {type: array, items: {type: string}}
