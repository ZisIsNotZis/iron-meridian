$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_economy
type: object
additionalProperties: false
required: [kind, document_id, title, source_document, ownership, resource_lifecycle, income_spending, harvester_behavior, edge_cases_ordering, acceptance_cases, recovery_counterplay, deferred]
properties:
