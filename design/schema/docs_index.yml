$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_index
type: object
additionalProperties: false
required: [kind, document_id, title, purpose, naming_rules, domains]
properties:
  kind: {const: design_index}
  document_id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  purpose: {type: string, minLength: 1}
  naming_rules: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  domains: {type: array, minItems: 1, items: {type: object, additionalProperties: false, required: [name, target, purpose], properties: {name: {type: string}, target: {type: string}, purpose: {type: string}}}}
  collection_rules: {type: array, items: {type: string}}
  ownership_rules: {type: array, items: {type: string}}
  deferred_navigation: {type: string}
