$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_schema
type: object
additionalProperties: false
required: [kind, document_id, title, vocabulary, family_rules, ownership_rules, stop_conditions]
properties:
  kind: {const: schema_registry}
  document_id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  vocabulary: {type: array, minItems: 1, items: {type: string}}
  family_rules: {type: array, minItems: 1, items: {type: object, additionalProperties: false, required: [family, purpose], properties: {family: {type: string}, purpose: {type: string}, fields: {type: array, items: {type: string}}}}}
  ownership_rules: {type: array, minItems: 1, items: {type: string}}
  stop_conditions: {type: array, items: {type: string}}
  id_rules: {type: array, items: {type: string}}
  unit_building_ownership: {type: array, items: {type: object, additionalProperties: false, required: [information, unit, building], properties: {information: {type: string}, unit: {type: string}, building: {type: string}}}}
  special_rules: {type: array, items: {type: string}}
  world_character_ownership: {type: array, items: {type: string}}
