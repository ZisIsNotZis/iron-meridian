$schema: https://json-schema.org/draft/2020-12/schema
$id: docs_todo
type: object
additionalProperties: false
required: [kind, document_id, title, purpose, tracks, promotion_rule]
properties:
  kind: {const: todo_index}
  document_id: {type: string, minLength: 1}
  title: {type: string, minLength: 1}
  purpose: {type: string, minLength: 1}
  tracks: {type: array, minItems: 1, items: {type: object, additionalProperties: false, required: [key, contract, status], properties: {key: {type: string}, contract: {type: string}, status: {type: string, enum: [deferred, ready, in_progress, done, rejected]}}}}
  promotion_rule: {type: string, minLength: 1}
