$schema: https://json-schema.org/draft/2020-12/schema
$id: faction
type: object
additionalProperties: false
required: [display_name, description]
properties:
  display_name: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  status: {type: string, enum: [core, designed, optional, near-term, deferred, deprecated]}
  playable: {type: boolean}
  references:
    type: array
    items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
  presentation:
    type: object
    additionalProperties: false
    properties:
      visual_identity: {type: string, minLength: 1}
      palette: {type: string, minLength: 1}
      materials: {type: string, minLength: 1}
      silhouette_language: {type: string, minLength: 1}
      placeholder_asset: {type: string, minLength: 1}
  audio:
    type: object
    additionalProperties: false
    properties:
      voice_language: {type: string, minLength: 1}
      identity: {type: string, minLength: 1}
      order_style: {type: string, minLength: 1}
      event_language: {type: string, minLength: 1}
  fx:
    type: object
    additionalProperties: false
    properties:
      identity: {type: string, minLength: 1}
      material_language: {type: string, minLength: 1}
      event_language: {type: string, minLength: 1}
  design:
    type: object
    additionalProperties: false
    properties:
      strategic_idea: {type: string, minLength: 1}
      battlefield_habits:
        type: array
        items: {type: string, minLength: 1}
      production_philosophy: {type: string, minLength: 1}
      economy_identity: {type: string, minLength: 1}
      matchup_expression: {type: string, minLength: 1}
      player_decision: {type: string, minLength: 1}
      counterplay: {type: string, minLength: 1}
      narrative_identity: {type: string, minLength: 1}
      scope: {type: string, enum: [v1, near_term, far_vision, deferred]}
