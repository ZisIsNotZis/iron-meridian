$schema: https://json-schema.org/draft/2020-12/schema
$id: faction_docs
type: object
additionalProperties: false
required: [display_name, description, source_document]
properties:
  display_name: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  source_document: {type: string, minLength: 1}
  doctrine_summary: {type: string, minLength: 1}
  strengths: {type: array, items: {type: string, minLength: 1}}
  weaknesses: {type: array, items: {type: string, minLength: 1}}
  future_direction: {type: array, items: {type: string, minLength: 1}}
  canonical_context: {type: array, items: {type: string, minLength: 1}}
  roster_policy: {type: array, items: {type: string, minLength: 1}}
  balance_position: {type: array, items: {type: string, minLength: 1}}
  campaign_role: {type: array, items: {type: string, minLength: 1}}
  matchup_rules: {type: array, items: {type: string, minLength: 1}}
  canonical_content: {type: array, items: {type: string, minLength: 1}}
  symbols: {type: array, items: {type: string, minLength: 1}}
  wordmark: {type: string, minLength: 1}
  scope: {type: array, items: {type: string, minLength: 1}}
  origin: {type: string, minLength: 1}
  public_claim: {type: string, minLength: 1}
  internal_conflict: {type: string, minLength: 1}
  story_posture: {type: array, items: {type: string, minLength: 1}}
  scope_use: {type: array, items: {type: string, minLength: 1}}
  strategic_idea: {type: string, minLength: 1}
  battlefield_habits: {type: array, items: {type: string, minLength: 1}}
  production_philosophy: {type: string, minLength: 1}
  economy_identity: {type: string, minLength: 1}
  matchup_expression: {type: string, minLength: 1}
  exclusions: {type: array, items: {type: string, minLength: 1}}
  visual_language: {type: string, minLength: 1}
  audio_language: {type: string, minLength: 1}
  fx_language: {type: string, minLength: 1}
  animation_rules: {type: string, minLength: 1}
  near_term_rules: {type: string, minLength: 1}
