$schema: https://json-schema.org/draft/2020-12/schema
$id: faction_roster_index
type: object
additionalProperties: false
required: [display_name, description, source_document, entries]
properties:
  display_name: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  source_document: {type: string, minLength: 1}
  opening_rule: {type: string, minLength: 1}
  roster_policy: {type: array, items: {type: string, minLength: 1}}
  roster_target: {type: string, minLength: 1}
  entries:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [object, status, decision]
      properties:
        object: {type: string, minLength: 1}
        platform: {type: string, minLength: 1}
        status: {type: string, minLength: 1}
        decision: {type: string, minLength: 1}
        intent: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        producer: {type: string, minLength: 1}
  roster_coverage: {type: array, items: {type: string, minLength: 1}}
  shared_constraints: {type: array, items: {type: string, minLength: 1}}
  production_relationships: {type: array, items: {type: string, minLength: 1}}
  defense_rules: {type: array, items: {type: string, minLength: 1}}
  construction_identity: {type: array, items: {type: string, minLength: 1}}
  scope_decisions: {type: array, items: {type: string, minLength: 1}}
  rejected_candidates: {type: array, items: {type: string, minLength: 1}}
