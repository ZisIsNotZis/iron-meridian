$schema: https://json-schema.org/draft/2020-12/schema
$id: scenario
type: object
additionalProperties: false
required: [display_name, description, status, mode, version, seed, map, faction_slots, setup, availability, rules, acceptance]
properties:
  display_name: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  status: {type: string, enum: [core, designed, optional, near-term, deferred, deprecated]}
  mode: {type: string, enum: [skirmish, campaign]}
  version: {type: integer, minimum: 1}
  seed: {type: string, pattern: '^0x[0-9A-Fa-f]+$'}
  map: {type: string, pattern: '^maps\.[a-z][a-z0-9_]*$'}
  faction_slots:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [slot, faction, side, facing, controller]
      properties:
        slot: {type: string, minLength: 1}
        faction: {type: string, pattern: '^factions\.[a-z][a-z0-9_]*$'}
        side: {type: string, enum: [west, east]}
        facing: {type: string, enum: [north, east, south, west]}
        controller: {type: string, enum: [human, scripted_finite_state]}
        ai_difficulty: {type: string, enum: [recruit, regular, veteran]}
  ai_slot: {type: string, minLength: 1}
  ai_controller: {type: string, enum: [scripted_finite_state]}
  ai_difficulty: {type: string, enum: [recruit, regular, veteran]}
  setup:
    type: object
    additionalProperties: false
    required: [banked_resource_per_slot, reserved_resource_per_slot, spawns, spawn_order]
    properties:
      banked_resource_per_slot: {type: integer, minimum: 0}
      reserved_resource_per_slot: {type: integer, minimum: 0}
      coordinate_system: {type: string, minLength: 1}
      spawns:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [spawn_key, content, west_position, east_position, west_facing, east_facing, completed, creation_order, initial_order, cargo, anchor]
          properties:
            spawn_key: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
            content: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
            west_position: {type: array, minItems: 2, items: {type: number}}
            east_position: {type: array, minItems: 2, items: {type: number}}
            west_facing: {type: string, enum: [north, east, south, west]}
            east_facing: {type: string, enum: [north, east, south, west]}
            completed: {type: boolean}
            creation_order: {type: integer, minimum: 0}
            initial_order: {type: string, enum: [none]}
            cargo: {type: string, enum: [none]}
            anchor: {type: string, minLength: 1}
      spawn_order: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  availability:
    type: object
    additionalProperties: false
    required: [entities, recipes, player_exposed_recipes, disabled_features]
    properties:
      entities: {type: array, minItems: 1, items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}}
      recipes: {type: array, minItems: 1, items: {type: string, pattern: '^recipes\.[a-z][a-z0-9_]*$'}}
      player_exposed_recipes: {type: array, minItems: 1, items: {type: string, pattern: '^recipes\.[a-z][a-z0-9_]*$'}}
      disabled_features: {type: array, items: {type: string, minLength: 1}}
      unavailable_entities: {type: array, items: {type: string, minLength: 1}}
      closed_world: {type: boolean}
      recovery_policy: {type: string, minLength: 1}
      recovery_recipes: {type: array, items: {type: string, pattern: '^recipes\.[a-z][a-z0-9_]*$'}}
  rules:
    type: object
    additionalProperties: false
    required: [fog, progression, pause, victory, defeat, ai, surrender, draw]
    properties:
      fog: {type: string, minLength: 1}
      progression: {type: string, minLength: 1}
      pause: {type: string, minLength: 1}
      victory: {type: string, minLength: 1}
      defeat: {type: string, minLength: 1}
      ai: {type: string, minLength: 1}
      surrender: {type: string, minLength: 1}
      draw: {type: string, minLength: 1}
      objective_hold_seconds: {type: integer, minimum: 0}
      same_tick_priority: {type: string, minLength: 1}
      human_harness: {type: string, minLength: 1}
  acceptance:
    type: object
    additionalProperties: false
    required: [duration, active_entities, deterministic_fixture]
    properties:
      duration: {type: string, minLength: 1}
      duration_min_seconds: {type: integer, minimum: 0}
      duration_max_seconds: {type: integer, minimum: 0}
      active_entities: {type: string, minLength: 1}
      active_entities_min: {type: integer, minimum: 0}
      active_entities_max: {type: integer, minimum: 0}
      deterministic_fixture: {type: string, minLength: 1}
  design:
    type: object
    additionalProperties: false
    properties:
      tactical_identity: {type: string, minLength: 1}
      player_decision: {type: string, minLength: 1}
      player_experience: {type: string, minLength: 1}
      excluded_capabilities: {type: array, items: {type: string, minLength: 1}}
      rationale: {type: string, minLength: 1}
      scope: {type: string, enum: [v1, near_term, far_vision, deferred]}
  references:
    type: array
    items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
