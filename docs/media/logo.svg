  <rect width="128" height="128" rx="22" fill="#171A1D"/>
  <rect x="7.5" y="7.5" width="113" height="113" rx="16" fill="none" stroke="#E7E1D4" stroke-opacity=".16"/>
  <g fill="#E7E1D4" opacity=".38">
    <rect x="22" y="22" width="6" height="6"/>
    <rect x="100" y="22" width="6" height="6"/>
    <rect x="22" y="100" width="6" height="6"/>
    <rect x="100" y="100" width="6" height="6"/>
  </g>
  <g fill="#E7E1D4">
    <rect x="59" y="18" width="10" height="92"/>
    <rect x="32" y="59" width="20" height="10"/>
    <rect x="76" y="59" width="20" height="10"/>
  </g>
  <rect x="56" y="56" width="16" height="16" fill="#D59A32"/>
</svg>
