<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Coalition HQ — 4x4 low modular command block with mast and grid pulse</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6f9b"/>
      <stop offset="32%" stop-color="#4a5f8a"/>
      <stop offset="68%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="45%" stop-color="#3d507a"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3854"/>
      <stop offset="55%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="mast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cede"/>
      <stop offset="55%" stop-color="#aeb6c2"/>
      <stop offset="100%" stop-color="#7d90bb"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bff4e0" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#56d8b0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#56d8b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.42" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="54" rx="25" ry="21" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- front face -->
    <rect x="31" y="63" width="34" height="10" rx="2.5" fill="url(#front)" stroke="#0d1526" stroke-width="1.5"/>
    <g stroke="#1b2740" stroke-width="1.4" opacity="0.9">
      <line x1="36" y1="66.6" x2="60" y2="66.6"/>
      <line x1="36" y1="69.6" x2="60" y2="69.6"/>
    </g>
    <rect x="43.5" y="64.5" width="9" height="6.8" rx="1.2" fill="#131a2a" stroke="#0d1526" stroke-width="1"/>
    <rect x="46.6" y="64.3" width="2.8" height="1.6" rx="0.6" fill="#56d8b0"/>

    <!-- main roof -->
    <rect x="31" y="30" width="34" height="34" rx="4" fill="url(#roof)" stroke="#0d1526" stroke-width="1.5"/>
    <rect x="31" y="30" width="34" height="34" rx="4" fill="url(#spec)"/>

    <!-- grid lines (grid pulse) -->
    <g stroke="#c8cede" stroke-opacity="0.14" stroke-width="1">
      <line x1="42.5" y1="31" x2="42.5" y2="63"/>
      <line x1="54.5" y1="31" x2="54.5" y2="63"/>
      <line x1="32" y1="42.5" x2="64" y2="42.5"/>
      <line x1="32" y1="54.5" x2="64" y2="54.5"/>
    </g>

    <!-- raised command core -->
    <rect x="38.5" y="37.5" width="19" height="19" rx="3" fill="url(#core)" stroke="#0d1526" stroke-width="1.3"/>
    <rect x="38.5" y="37.5" width="19" height="19" rx="3" fill="url(#spec)"/>
    <circle cx="48" cy="47" r="11" fill="url(#pulse)"/>
    <!-- pulse ticks -->
    <g stroke="#bff4e0" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round">
      <line x1="48" y1="37.8" x2="48" y2="40.6"/>
      <line x1="48" y1="53.4" x2="48" y2="56.2"/>
      <line x1="37.8" y1="47" x2="40.6" y2="47"/>
      <line x1="55.4" y1="47" x2="58.2" y2="47"/>
    </g>
    <!-- cyan sensor -->
    <circle cx="48" cy="47" r="3" fill="#0c2530" stroke="#56d8b0" stroke-width="1.5"/>
    <circle cx="48" cy="47" r="1.3" fill="#bff4e0"/>

    <!-- safety-yellow chevron -->
    <path d="M42.5 61.5 L48 58.2 L53.5 61.5" fill="none" stroke="#eac56d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- blue-white mast -->
    <rect x="46.7" y="15" width="2.6" height="17" rx="1.3" fill="url(#mast)" stroke="#0d1526" stroke-width="0.8"/>
    <circle cx="48" cy="14.4" r="2.5" fill="#c8cede" stroke="#0d1526" stroke-width="0.8"/>
    <circle cx="48" cy="14.4" r="1" fill="#56d8b0"/>
    <!-- mast stays -->
    <line x1="41.5" y1="35" x2="39" y2="22" stroke="#aeb6c2" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="39" cy="21.4" r="1.4" fill="#aeb6c2"/>
    <!-- cyan antenna -->
    <line x1="63" y1="34" x2="66.5" y2="23" stroke="#56d8b0" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="66.6" cy="22" r="1.6" fill="#56d8b0"/>
  </g>
</svg>
