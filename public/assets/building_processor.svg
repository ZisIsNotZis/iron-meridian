<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Coalition Resource Processor — 3x3 hoppers, conveyor and storage bins</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6f9b"/>
      <stop offset="35%" stop-color="#4a5f8a"/>
      <stop offset="70%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3854"/>
      <stop offset="55%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <radialGradient id="hop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0c2530"/>
      <stop offset="70%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </radialGradient>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="50%" stop-color="#3d507a"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.42" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="56" rx="19" ry="16" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- front face -->
    <rect x="35.5" y="57.5" width="25" height="9.5" rx="2" fill="url(#front)" stroke="#0d1526" stroke-width="1.4"/>
    <rect x="44.5" y="59.2" width="7" height="6.2" rx="1" fill="#131a2a" stroke="#0d1526" stroke-width="1"/>
    <rect x="46.6" y="58.9" width="2.8" height="1.5" rx="0.6" fill="#56d8b0"/>
    <path d="M52.8 61.8 L55.6 60 L58.4 61.8" fill="none" stroke="#eac56d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- main roof -->
    <rect x="35.5" y="31.5" width="25" height="27" rx="3.5" fill="url(#roof)" stroke="#0d1526" stroke-width="1.4"/>
    <rect x="35.5" y="31.5" width="25" height="27" rx="3.5" fill="url(#spec)"/>

    <!-- hoppers -->
    <g>
      <circle cx="41.5" cy="38.2" r="3.6" fill="url(#hop)" stroke="#0d1526" stroke-width="1.1"/>
      <circle cx="41.5" cy="38.2" r="3.6" fill="none" stroke="#56d8b0" stroke-width="1" opacity="0.85"/>
      <circle cx="48" cy="38.2" r="3.6" fill="url(#hop)" stroke="#0d1526" stroke-width="1.1"/>
      <circle cx="48" cy="38.2" r="3.6" fill="none" stroke="#56d8b0" stroke-width="1" opacity="0.85"/>
      <circle cx="54.5" cy="38.2" r="3.6" fill="url(#hop)" stroke="#0d1526" stroke-width="1.1"/>
      <circle cx="54.5" cy="38.2" r="3.6" fill="none" stroke="#56d8b0" stroke-width="1" opacity="0.85"/>
    </g>

    <!-- conveyor -->
    <rect x="36.6" y="44.2" width="22.8" height="5.2" rx="1.2" fill="#131a2a" stroke="#0d1526" stroke-width="1.1"/>
    <g stroke="#34456b" stroke-opacity="0.8" stroke-width="1">
      <line x1="38.6" y1="45.2" x2="38.6" y2="48.4"/>
      <line x1="41.6" y1="45.2" x2="41.6" y2="48.4"/>
      <line x1="44.6" y1="45.2" x2="44.6" y2="48.4"/>
      <line x1="47.6" y1="45.2" x2="47.6" y2="48.4"/>
      <line x1="50.6" y1="45.2" x2="50.6" y2="48.4"/>
      <line x1="53.6" y1="45.2" x2="53.6" y2="48.4"/>
    </g>
    <circle cx="57.8" cy="46.8" r="3.2" fill="#56d8b0" opacity="0.35"/>
    <circle cx="57.8" cy="46.8" r="1.5" fill="#56d8b0"/>

    <!-- storage bins -->
    <g>
      <rect x="37.2" y="51.3" width="4.2" height="6" rx="1.1" fill="#4a5f8a" stroke="#0d1526" stroke-width="0.9"/>
      <rect x="42.3" y="51.3" width="4.2" height="6" rx="1.1" fill="url(#bin)" stroke="#0d1526" stroke-width="0.9"/>
      <rect x="47.4" y="51.3" width="4.2" height="6" rx="1.1" fill="#4a5f8a" stroke="#0d1526" stroke-width="0.9"/>
      <rect x="52.5" y="51.3" width="4.2" height="6" rx="1.1" fill="url(#bin)" stroke="#0d1526" stroke-width="0.9"/>
    </g>
  </g>
</svg>
