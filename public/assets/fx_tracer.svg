<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Tracer — bright directional projectile</title>
  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56d8b0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#56d8b0"/>
      <stop offset="80%" stop-color="#bff4e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#g)">
    <rect x="4" y="44" width="84" height="8" rx="4" fill="url(#streak)"/>
    <circle cx="90" cy="48" r="5" fill="#ffffff"/>
  </g>
</svg>
