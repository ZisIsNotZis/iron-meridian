<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Coalition cover terrain — grove, rubble and sandbag mound, darker and heavier</title>
  <defs>
    <radialGradient id="patch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0b1533" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0b1533" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0b1533" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="canopy" cx="0.4" cy="0.38" r="0.75">
      <stop offset="0%" stop-color="#24314d"/>
      <stop offset="60%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="55%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <!-- ground grime, low opacity -->
    <pattern id="grime" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.1" fill="#4a5f8a" opacity="0.35"/>
      <circle cx="13" cy="4" r="0.9" fill="#34456b" opacity="0.5"/>
      <circle cx="19" cy="12" r="1.2" fill="#0b1533" opacity="0.5"/>
      <circle cx="8" cy="17" r="0.8" fill="#aeb6c2" opacity="0.12"/>
      <circle cx="21" cy="20" r="1" fill="#4a5f8a" opacity="0.3"/>
      <line x1="10" y1="10" x2="12.5" y2="10.5" stroke="#4a5f8a" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
      <polygon points="6,12 8,11.5 8.5,13.5 6.5,14" fill="#34456b" opacity="0.6"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="96" height="96" fill="#24314d"/>
  <rect x="0" y="0" width="96" height="96" fill="#131a2a" opacity="0.5"/>
  <rect x="0" y="0" width="96" height="96" fill="url(#grime)"/>
  <circle cx="48" cy="48" r="42" fill="url(#patch)"/>

  <!-- rubble stones -->
  <g>
    <polygon points="20,18 24,16.5 26,20 22,22" fill="#34456b" opacity="0.75" stroke="#0d1526" stroke-width="0.8"/>
    <polygon points="74,24 78,23 79,26.5 75.5,27.5" fill="#34456b" opacity="0.7" stroke="#0d1526" stroke-width="0.8"/>
    <polygon points="14,66 17,64.5 18.5,67.5 15.5,69" fill="#4a5f8a" opacity="0.6" stroke="#0d1526" stroke-width="0.8"/>
    <polygon points="80,64 83.5,63 84.5,66 81,67.5" fill="#34456b" opacity="0.65" stroke="#0d1526" stroke-width="0.8"/>
  </g>

  <!-- grove canopies -->
  <g>
    <circle cx="40" cy="38" r="11" fill="url(#canopy)" stroke="#0d1526" stroke-width="1.2"/>
    <circle cx="36.5" cy="34" r="6.5" fill="#24314d" opacity="0.8"/>
    <circle cx="44" cy="31" r="2" fill="#34456b" opacity="0.5"/>
    <circle cx="33" cy="41" r="1.5" fill="#34456b" opacity="0.45"/>
    <g stroke="#0b1533" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round">
      <line x1="40" y1="38" x2="47" y2="33"/>
      <line x1="40" y1="38" x2="46" y2="43"/>
      <line x1="40" y1="38" x2="34" y2="31.5"/>
    </g>

    <circle cx="58" cy="44" r="9" fill="url(#canopy)" stroke="#0d1526" stroke-width="1.1"/>
    <circle cx="55" cy="40.5" r="5.2" fill="#24314d" opacity="0.8"/>
    <circle cx="61.5" cy="48" r="1.6" fill="#34456b" opacity="0.45"/>
    <g stroke="#0b1533" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round">
      <line x1="58" y1="44" x2="64" y2="40"/>
      <line x1="58" y1="44" x2="62" y2="50"/>
    </g>

    <circle cx="45" cy="60" r="10" fill="url(#canopy)" stroke="#0d1526" stroke-width="1.2"/>
    <circle cx="41.5" cy="56" r="6" fill="#24314d" opacity="0.8"/>
    <circle cx="49" cy="64.5" r="1.8" fill="#34456b" opacity="0.45"/>
    <g stroke="#0b1533" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round">
      <line x1="45" y1="60" x2="53" y2="57"/>
      <line x1="45" y1="60" x2="51" y2="67"/>
    </g>

    <circle cx="61" cy="61" r="6.5" fill="url(#canopy)" stroke="#0d1526" stroke-width="1"/>
    <circle cx="59" cy="58.5" r="3.8" fill="#24314d" opacity="0.8"/>

    <circle cx="33" cy="54" r="5" fill="url(#canopy)" stroke="#0d1526" stroke-width="1"/>
    <circle cx="31.5" cy="52" r="2.8" fill="#24314d" opacity="0.8"/>
  </g>

  <!-- sandbag mound arc -->
  <g>
    <rect x="36.5" y="70" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="42.5" y="70" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="48.5" y="70" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="54.5" y="70" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="38.5" y="73.6" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="45.5" y="73.6" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <rect x="52.5" y="73.6" width="5.5" height="3.6" rx="1.4" fill="url(#bag)" stroke="#0d1526" stroke-width="0.9"/>
    <g stroke="#1b2740" stroke-width="0.8" opacity="0.8">
      <line x1="36.5" y1="71.8" x2="42" y2="71.8"/>
      <line x1="42.5" y1="71.8" x2="48" y2="71.8"/>
      <line x1="48.5" y1="71.8" x2="54" y2="71.8"/>
      <line x1="54.5" y1="71.8" x2="60" y2="71.8"/>
    </g>
  </g>

  <!-- light grass tufts at edges for blending -->
  <g stroke="#4a5f8a" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round">
    <line x1="6" y1="6" x2="7.5" y2="8"/>
    <line x1="90" y1="8" x2="91.5" y2="10"/>
    <line x1="4" y1="42" x2="6" y2="43.5"/>
    <line x1="88" y1="52" x2="90" y2="53"/>
  </g>
</svg>
