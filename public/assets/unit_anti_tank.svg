<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Javelin Anti-Tank Team — Coalition, top-down facing up</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="30%" stop-color="#3d507a"/>
      <stop offset="65%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cede"/>
      <stop offset="45%" stop-color="#aeb6c2"/>
      <stop offset="100%" stop-color="#7d90bb"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3854"/>
      <stop offset="30%" stop-color="#3d507a"/>
      <stop offset="60%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="3" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.4" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="52" rx="22" ry="24" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- spotter -->
    <circle cx="37" cy="60" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="31" y="61.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="34.6" y="70" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <line x1="33" y1="57" x2="27" y2="48" stroke="#56d8b0" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="26.5" cy="47" r="1.6" fill="#56d8b0"/>
    <circle cx="37" cy="60" r="4.5" fill="url(#spec)"/>

    <!-- loader -->
    <rect x="62.5" y="54" width="5" height="5.5" rx="1" fill="#2a3854" stroke="#0d1526" stroke-width="1"/>
    <circle cx="59" cy="62" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="53" y="63.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="56.6" y="72" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <path d="M56.8 74.2 L59 72 L61.2 74.2" fill="none" stroke="#eac56d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="59" cy="62" r="4.5" fill="url(#spec)"/>

    <!-- gunner -->
    <circle cx="48" cy="36" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="42" y="37.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="45.6" y="46" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <circle cx="48" cy="36" r="4.5" fill="url(#spec)"/>

    <!-- shoulder launcher -->
    <rect x="51.5" y="14" width="5" height="28" rx="2.2" fill="url(#tube)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="50.7" y="10" width="6.6" height="7" rx="2.2" fill="#7d90bb" stroke="#0d1526" stroke-width="1"/>
    <rect x="56.5" y="24" width="2.6" height="3.5" rx="1" fill="#24314d" stroke="#0d1526" stroke-width="0.8"/>
    <circle cx="54" cy="19" r="1.1" fill="#bff4e0" stroke="#0c2530" stroke-width="0.7"/>
  </g>
</svg>
