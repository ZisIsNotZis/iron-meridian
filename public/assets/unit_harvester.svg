<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Coalition Harvester — boxy hauler with collector arm, top-down facing up</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="30%" stop-color="#4a5f8a"/>
      <stop offset="65%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="30%" stop-color="#4a5f8a"/>
      <stop offset="70%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="40%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="50%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aeb6c2"/>
      <stop offset="50%" stop-color="#7d90bb"/>
      <stop offset="100%" stop-color="#4a5f8a"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#131a2a"/>
      <stop offset="50%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.42" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="52" rx="32" ry="29" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- wheels -->
    <circle cx="21" cy="38" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="21" cy="54" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="21" cy="70" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="75" cy="38" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="75" cy="54" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="75" cy="70" r="5.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="21" cy="38" r="1.9" fill="#34456b"/>
    <circle cx="21" cy="54" r="1.9" fill="#34456b"/>
    <circle cx="21" cy="70" r="1.9" fill="#34456b"/>
    <circle cx="75" cy="38" r="1.9" fill="#34456b"/>
    <circle cx="75" cy="54" r="1.9" fill="#34456b"/>
    <circle cx="75" cy="70" r="1.9" fill="#34456b"/>

    <!-- boxy hull -->
    <rect x="28" y="24" width="40" height="54" rx="7" fill="url(#hull)" stroke="#0d1526" stroke-width="1.5"/>

    <!-- cargo pod -->
    <rect x="32" y="44" width="32" height="32" rx="4" fill="url(#pod)" stroke="#0d1526" stroke-width="1.4"/>
    <rect x="34" y="46" width="28" height="28" rx="3" fill="none" stroke="#7d90bb" opacity="0.5" stroke-width="1.2"/>
    <!-- ore crystals -->
    <polygon points="39,56 43,52 47,56 43,60" fill="#56d8b0" stroke="#0d1526" stroke-width="0.9" stroke-linejoin="round"/>
    <line x1="41" y1="54" x2="43" y2="56" stroke="#bff4e0" stroke-width="1" stroke-linecap="round"/>
    <polygon points="50,61 53.5,57.5 57,61 53.5,64.5" fill="#56d8b0" stroke="#0d1526" stroke-width="0.9" stroke-linejoin="round"/>
    <line x1="52" y1="59.5" x2="53.5" y2="61" stroke="#bff4e0" stroke-width="1" stroke-linecap="round"/>
    <polygon points="42,67 44.5,64.5 47,67 44.5,69.5" fill="#aeb6c2" stroke="#0d1526" stroke-width="0.9" stroke-linejoin="round"/>
    <line x1="43.5" y1="66" x2="44.5" y2="67" stroke="#c8cede" stroke-width="1" stroke-linecap="round"/>
    <!-- pod chevron -->
    <path d="M44 47.2 L48 44.4 L52 47.2" fill="none" stroke="#eac56d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- cab -->
    <rect x="33" y="25" width="30" height="16" rx="4" fill="url(#cab)" stroke="#0d1526" stroke-width="1.2"/>
    <rect x="35.5" y="27.5" width="25" height="4.5" rx="2" fill="#7d90bb" opacity="0.9"/>
    <circle cx="48" cy="34" r="2.4" fill="#0c2530" stroke="#56d8b0" stroke-width="1.4"/>
    <circle cx="48" cy="34" r="1.1" fill="#bff4e0"/>

    <!-- collector arm -->
    <circle cx="48" cy="25" r="3" fill="#2a3854" stroke="#0d1526" stroke-width="1"/>
    <rect x="45.9" y="13" width="4.2" height="13" rx="1.5" fill="url(#deck)" stroke="#0d1526" stroke-width="1.1"/>
    <ellipse cx="48" cy="10" rx="5.5" ry="4" fill="url(#blade)" stroke="#0d1526" stroke-width="1.2"/>
    <line x1="45.5" y1="12.5" x2="45.5" y2="15.5" stroke="#aeb6c2" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="50.5" y1="12.5" x2="50.5" y2="15.5" stroke="#aeb6c2" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="48" cy="10" r="1.3" fill="#bff4e0"/>

    <!-- specular over cab -->
    <ellipse cx="48" cy="36" rx="17" ry="15" fill="url(#spec)"/>
  </g>
</svg>
