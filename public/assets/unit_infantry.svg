<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Line Rifle Squad — Coalition infantry, top-down facing up</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="30%" stop-color="#3d507a"/>
      <stop offset="65%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cede"/>
      <stop offset="45%" stop-color="#aeb6c2"/>
      <stop offset="100%" stop-color="#7d90bb"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="3" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.4" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="52" rx="20" ry="22" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- lead rifleman -->
    <circle cx="48" cy="36" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="42" y="37.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="54.6" y="29.5" width="2" height="15.5" fill="#131a2a"/>
    <rect x="45.6" y="46" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <circle cx="48" cy="33" r="1.5" fill="#bff4e0" stroke="#0c2530" stroke-width="0.8"/>
    <circle cx="48" cy="36" r="4.5" fill="url(#spec)"/>

    <!-- left rifleman -->
    <circle cx="38" cy="58" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="32" y="59.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="29.6" y="51.5" width="2" height="15.5" fill="#131a2a"/>
    <rect x="35.6" y="68" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <circle cx="38" cy="58" r="4.5" fill="url(#spec)"/>

    <!-- right rifleman -->
    <circle cx="58" cy="58" r="4.5" fill="url(#helm)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="52" y="59.5" width="12" height="11" rx="4" fill="url(#body)" stroke="#0d1526" stroke-width="1.1"/>
    <rect x="64.6" y="51.5" width="2" height="15.5" fill="#131a2a"/>
    <rect x="55.6" y="68" width="4.8" height="3.4" rx="1" fill="#4a5f8a" stroke="#c8cede" stroke-width="0.8"/>
    <path d="M55.8 70.2 L58 68 L60.2 70.2" fill="none" stroke="#eac56d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="55" x2="66" y2="47" stroke="#56d8b0" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="66.5" cy="46" r="1.6" fill="#56d8b0"/>
    <circle cx="58" cy="58" r="4.5" fill="url(#spec)"/>
  </g>
</svg>
