<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Mobile Construction Vehicle — Coalition, top-down facing up</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="30%" stop-color="#4a5f8a"/>
      <stop offset="65%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="30%" stop-color="#4a5f8a"/>
      <stop offset="70%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    <linearGradient id="turret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="40%" stop-color="#3d507a"/>
      <stop offset="100%" stop-color="#2a3854"/>
    </linearGradient>
    <linearGradient id="boom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6f9b"/>
      <stop offset="35%" stop-color="#3d507a"/>
      <stop offset="70%" stop-color="#2a3854"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cede"/>
      <stop offset="40%" stop-color="#aeb6c2"/>
      <stop offset="100%" stop-color="#7d90bb"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#131a2a"/>
      <stop offset="50%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.42" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="50" rx="35" ry="31" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- tracks -->
    <rect x="8" y="20" width="16" height="56" rx="8" fill="url(#track)"/>
    <rect x="72" y="20" width="16" height="56" rx="8" fill="url(#track)"/>
    <g stroke="#1b2740" stroke-width="1.6" opacity="0.9">
      <line x1="12" y1="28" x2="12" y2="68"/>
      <line x1="16" y1="28" x2="16" y2="68"/>
      <line x1="80" y1="28" x2="80" y2="68"/>
      <line x1="84" y1="28" x2="84" y2="68"/>
    </g>

    <!-- hull -->
    <rect x="24" y="24" width="48" height="48" rx="8" fill="url(#hull)" stroke="#0d1526" stroke-width="1.5"/>
    <rect x="28" y="27" width="40" height="10" rx="4" fill="#7d90bb" opacity="0.5"/>

    <!-- cab -->
    <rect x="35" y="26" width="26" height="15" rx="3.5" fill="url(#cab)" stroke="#0d1526" stroke-width="1.2"/>
    <rect x="37" y="28" width="22" height="4" rx="2" fill="#7d90bb" opacity="0.9"/>
    <circle cx="56" cy="34" r="2.2" fill="#0c2530" stroke="#56d8b0" stroke-width="1.3"/>
    <circle cx="56" cy="34" r="1" fill="#bff4e0"/>

    <!-- dozer blade -->
    <line x1="38" y1="25.5" x2="34" y2="21.5" stroke="#2a3854" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="25.5" x2="62" y2="21.5" stroke="#2a3854" stroke-width="2" stroke-linecap="round"/>
    <rect x="31" y="18" width="34" height="7.5" rx="3.5" fill="url(#blade)" stroke="#0d1526" stroke-width="1.3"/>
    <path d="M34 22.5 L37.5 19 L41 22.5" fill="none" stroke="#eac56d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- crane base -->
    <circle cx="48" cy="64" r="8.5" fill="url(#turret)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="48" cy="64" r="5" fill="none" stroke="#2a3854" stroke-width="1.2"/>

    <!-- crane boom -->
    <rect x="45.9" y="17" width="4.2" height="47" rx="1.5" fill="url(#boom)" stroke="#0d1526" stroke-width="1.2"/>
    <g stroke="#1b2740" stroke-width="1.4">
      <line x1="46" y1="26" x2="50" y2="26"/>
      <line x1="46" y1="36" x2="50" y2="36"/>
      <line x1="46" y1="46" x2="50" y2="46"/>
      <line x1="46" y1="56" x2="50" y2="56"/>
    </g>
    <!-- hook block -->
    <rect x="46.6" y="12" width="2.8" height="6" rx="1" fill="#2a3854" stroke="#0d1526" stroke-width="1"/>
    <line x1="48" y1="12" x2="48" y2="9" stroke="#131a2a" stroke-width="1.6" stroke-linecap="round"/>

    <!-- specular -->
    <ellipse cx="48" cy="46" rx="19" ry="20" fill="url(#spec)"/>
  </g>
</svg>
