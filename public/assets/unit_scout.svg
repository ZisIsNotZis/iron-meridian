<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t" width="96" height="96" color-interpolation="linearRGB">
  <title id="t">Lynx Scout Car — Coalition, top-down facing up</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#647ba9"/>
      <stop offset="30%" stop-color="#4a5f8a"/>
      <stop offset="65%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5f8a"/>
      <stop offset="50%" stop-color="#34456b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#131a2a"/>
      <stop offset="50%" stop-color="#2b3a55"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="off"/>
      <feFlood flood-color="#0b1533" flood-opacity="0.42" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spec" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="48" cy="52" rx="30" ry="26" fill="#0b1533" opacity="0.30" filter="url(#drop)"/>

  <g filter="url(#drop)">
    <!-- wheels -->
    <circle cx="25" cy="38" r="6.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="25" cy="66" r="6.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="71" cy="38" r="6.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="71" cy="66" r="6.5" fill="url(#wheel)" stroke="#0d1526" stroke-width="1.3"/>
    <circle cx="25" cy="38" r="2.2" fill="#34456b"/>
    <circle cx="25" cy="66" r="2.2" fill="#34456b"/>
    <circle cx="71" cy="38" r="2.2" fill="#34456b"/>
    <circle cx="71" cy="66" r="2.2" fill="#34456b"/>

    <!-- hull: wedge nose -->
    <path d="M48 21 L59 29 L65 40 L65 63 L57 72 L39 72 L31 63 L31 40 L37 29 Z"
          fill="url(#hull)" stroke="#0d1526" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- glacis side highlights -->
    <path d="M33 42 L33 61 L36 66 L36 45 Z" fill="#7d90bb" opacity="0.5"/>
    <path d="M63 42 L63 61 L60 66 L60 45 Z" fill="#7d90bb" opacity="0.5"/>
    <!-- engine deck -->
    <rect x="37" y="63" width="22" height="7.5" rx="2.5" fill="url(#deck)" stroke="#0d1526" stroke-width="1.1"/>
    <!-- roof plate for lidar -->
    <path d="M41 34 L55 34 L58 48 L38 48 Z" fill="url(#deck)" stroke="#0d1526" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- roof lidar -->
    <circle cx="48" cy="41" r="6.5" fill="url(#deck)" stroke="#0d1526" stroke-width="1.2"/>
    <circle cx="48" cy="41" r="5" fill="none" stroke="#56d8b0" stroke-width="1.3"/>
    <line x1="48" y1="41" x2="48" y2="35.5" stroke="#bff4e0" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="48" cy="41" r="1.5" fill="#bff4e0"/>

    <!-- specular -->
    <ellipse cx="48" cy="45" rx="19" ry="22" fill="url(#spec)"/>

    <!-- nose chevron -->
    <path d="M45 27 L48 24 L51 27" fill="none" stroke="#eac56d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- antennae -->
    <line x1="36" y1="31" x2="32" y2="17" stroke="#56d8b0" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="32" cy="16" r="1.8" fill="#56d8b0"/>
    <line x1="60" y1="31" x2="64" y2="19" stroke="#aeb6c2" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="64" cy="18.5" r="1.4" fill="#aeb6c2"/>
  </g>
</svg>
